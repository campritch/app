        '<div><dt>Booked</dt><dd>' + kfmt(r.imps) + ' impressions at $' + r.cpm + ' CPM</dd></div>' +
        '<div><dt>Tracking pixel</dt><dd>' + (r.pixel ? 'Attached' : 'None') + '</dd></div>' +
        '<div><dt>Requires buyer approval</dt><dd>' + (ops ? '<button class="sw' + (r.pre ? ' on' : '') + '" aria-label="Toggle buyer approval" onclick="togglePre(' + q + ')"></button>' : (r.pre ? 'Yes' : 'No')) + '</dd></div>' +
        '<div><dt>Request created</dt><dd>' + (r.tl.length ? r.tl[r.tl.length - 1].at : '-') + '</dd></div>' +
        (thread ? '<div><button class="link" onclick="window.top.openInboxThread(\'show\',\'' + r.brand + ' ' + sh.name + '\');if(DRAWER)back()">View email thread</button></div>' : '') +
      '</dl></div>' +
    '</div>' + (acts ? '<div class="dw__foot">' + acts + '</div>' : '');
}

/* ───────── link to the show agent's threads ───────── */
const ME = 'production';
const keyOf = r => r.brand + '|' + SHOWS[r.show].name;
const THREADS = ['Quince|SmartLess', 'Monarch|The Joe Rogan Experience', 'Kalshi|The Joe Rogan Experience', 'Ritual|The Mel Robbins Podcast', 'Squarespace|Huberman Lab', 'Kalshi|Call Her Daddy'];
function reseed() { seed(); syncInventory(false); S.open = null; }
function handle(ev) {
  const r = REQS.find(x => keyOf(x) === ev.key && x.status !== 'complete'); if (!r) return;
  const sh = SHOWS[r.show], me = 'You (Ad Ops)';
  if (ev.ev === 'choice') {
    if (ev.kase === 'file') { if (r.status === 'qa') ev.opt === 'hold' ? approveFile(r.id) : askRevision(r.id); }
    else if (ev.kase === 'move') ev.opt === 'hold' ? shiftDate(r.id, '2026-06-29') : log(r, me, 'Show asked to move outside the booked week. Kept the date, from the Inbox');
    else if (ev.kase === 'silent') ev.opt === 'hold' ? remind(r.id) : log(r, me, 'No reply from the show. Lining up a make-good date, from the Inbox');
    else if (ev.kase === 'pushback') log(r, me, ev.opt === 'hold' ? 'Host pushed back on a read-verbatim line. Asked the buyer for an approved alternate' : 'Host pushed back on a read-verbatim line. Told them it stands');
  }
  else if (ev.ev === 'mode') { r.manual = ev.manual; log(r, me, ev.manual ? 'Took over the show thread in the Inbox. The agent only drafts now' : 'Handed the show thread back to the agent'); }
  else if (ev.ev === 'status') {
    if (ev.status === 'Acknowledged' && r.status === 'requested') { r.status = 'production'; r.ackDay = r.ackDay || dow(r.date); log(r, sh.contact, 'Acknowledged by email. Publishing ' + r.ackDay); }
    else if (ev.status.indexOf('File in') === 0 && r.delivery === 'dai' && !r.file && ['requested', 'production', 'revision'].includes(r.status)) hostUpload(r.id);
    else if (!/Accepted|Shifted|Revision|File in/.test(ev.status)) log(r, 'Agent', 'Show thread: ' + ev.status, true);
  }
  else if (ev.ev === 'log') log(r, me, ev.text);
}
function openSpot(key) { const r = REQS.find(x => keyOf(x) === key); if (!r) return; S.role = 'ops'; S.tab = 'production'; S.status = r.status === 'complete' ? 'all' : 'open'; openRequest(r.id); }
function checkNav() { if (ONLY || DRAWER) return; try { const v = JSON.parse(localStorage.getItem('acme_prodnav') || 'null'); if (v) { localStorage.removeItem('acme_prodnav'); openSpot(v.key); } } catch (e) {} }
window.addEventListener('storage', e => { if (e.key === 'acme_prodnav') checkNav(); });
if (/[?&]embed=1/.test(location.search)) document.body.classList.add('nested');
if (ONLY) document.body.classList.add('campaign');
if (DRAWER) document.body.classList.add('drawer-only');

/* ───────── shared spot events: Inbox threads <-> Production rows ─────────
   Both screens append to one log in localStorage and replay what the other wrote. */
const SPOT_LOG = 'acme_spot_events'; let applied = 0, applying = false;
if (window.self === window.top) { try { localStorage.removeItem(SPOT_LOG); } catch (e) {} }
function emit(ev) { if (applying) return; try { const l = JSON.parse(localStorage.getItem(SPOT_LOG) || '[]'); l.push(Object.assign({ from: ME }, ev)); localStorage.setItem(SPOT_LOG, JSON.stringify(l)); applied = l.length; } catch (e) {} }
function pull() {
  let l = []; try { l = JSON.parse(localStorage.getItem(SPOT_LOG) || '[]'); } catch (e) {}
  if (l.length < applied) { reseed(); applied = 0; }
  applying = true; let n = 0;
  for (; applied < l.length; applied++) { if (l[applied].from !== ME) { try { handle(l[applied]); n++; } catch (e) { console.error(e); } } }
  applying = false; if (n) render();
}
window.addEventListener('storage', e => { if (e.key === SPOT_LOG) pull(); });

/* ───────── bookings from Inventory ───────── */
const INV_SHOW = { rogan: 'rogan', armchair: 'armchair', callherdaddy: 'chd', huberman: 'huberman', melrobbins: 'mel', smartless: 'smartless', oprah: 'oprah' };
function syncInventory(announce) {
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { return []; } };
  const inv = read('acme_spot_bookings'), vet = read('acme_vet_bookings');
  let added = 0;
  REQS = REQS.filter(r => r.src !== 'inv' || r.status !== 'draft' || inv.find(b => b.id === r.invId));   // cleared in Inventory before it went out
  [[inv, 'inv'], [vet, 'vet']].forEach(([list, src]) => list.forEach(b => {
    if (REQS.find(r => r.invId === b.id)) return;
    let show = INV_SHOW[b.showId];
    if (!show) { if (!b.showName) return; show = 'x_' + b.showName.toLowerCase().replace(/[^a-z0-9]/g, ''); if (!SHOWS[show]) { SHOWS[show] = EXTRA.shows[show] = { name: b.showName, short: b.showName, net: 'orig', contact: b.contact || 'Producer', pub: 'Mon', host: 'Megaphone', ontime: 92 }; } }
    const a = b.ask || {};
    if (!BR[b.brand]) BR[b.brand] = EXTRA.brands[b.brand] = { col: b.col || '#334155', agency: a.agency || 'Direct', pts: b.pts || ['Talking points are in the copy link on the booking'], cta: b.cta || 'as written in the copy' };
    const dai = a.delivery === 'dai';
    const r = R(b.brand, show, dai ? 'dai' : 'baked', 0, 0, 'draft', { fresh: true, invId: b.id, src, date: b.date, due: dai ? addDays(b.date, -3) : b.date, len: a.len || 60, pos: { pre: 'Pre-roll', mid: 'Mid-roll', post: 'Post-roll' }[b.roll] || 'Mid-roll', pre: !!a.pre, verbatim: !!a.verbatim, personal: !!a.personal, imps: a.imps || 350000, cpm: b.cpm || 28, pixel: !!a.pixel, noScript: !a.copy });
    log(r, 'Sales', src === 'vet' ? 'IO signed on a vetted show. Request created from the vetting record, nothing re-typed' : 'Booked in Inventory. Request created automatically, nothing re-typed');
    if (r.noScript) log(r, 'Agent', 'No copy link on the booking. Held back from sending', true);
    added++;
  }));
  if (added && announce && !ONLY) toast(added + ' new booking' + (added === 1 ? '' : 's'));
  return added;
}
window.addEventListener('storage', e => { if (e.key === 'acme_spot_bookings' || e.key === 'acme_vet_bookings') { load(); syncInventory(true); render(); } });
window.addEventListener('focus', () => { if (syncInventory(true)) render(); });

document.addEventListener('keydown', e => { if (e.key === 'Escape' && ddCur) { ddClose(); return; } if (e.key === 'Escape' && S.open && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) back(); });
if (window.self === window.top) { try { localStorage.removeItem(STATE_KEY); } catch (e) {} }
if (!load()) seed();
function applyRole() {
  if (ONLY || !EMBED) return false; let v = null; try { v = JSON.parse(localStorage.getItem('acme_role') || 'null'); } catch (e) {}
  const role = (v && v.role) || 'ops', host = (v && v.host) || S.hostShow, pnet = (v && v.net) || ''; if (role === S.role && host === S.hostShow && pnet === (S.pnet || '')) return false;
  S.role = role; S.hostShow = host; S.pnet = pnet; S.sel.clear(); S.show = 'all'; S.status = 'open'; return true;
}
window.addEventListener('storage', e => { if (e.key === 'acme_role' && !DRAWER && applyRole()) { ddClose(); render(); } });
/* which network each show belongs to is set in Shows and Settings > Networks */
function applyAccess() { let A = null; try { A = JSON.parse(localStorage.getItem('acme_access') || 'null'); } catch (e) {} if (!A) return;
  (A.networks || []).forEach(n => { NETS[n.id] = n.name; });
  Object.keys(SHOWS).forEach(k => { const a = (A.shows || {})[SHOWS[k].name]; if (a) SHOWS[k].net = a.net || 'none'; }); }
window.addEventListener('storage', e => { if (e.key === 'acme_access') { applyAccess(); render(); } });
applyAccess();
applyRole();
if (DRAWER) { const u = new URLSearchParams(location.search); S.open = isNaN(+DRAWER) || !req(DRAWER) ? DRAWER : DRAWER; if (!req(S.open) && req(+DRAWER)) S.open = +DRAWER; S.role = u.get('role') || S.role; S.hostShow = u.get('host') || S.hostShow; S.anim = true; }
syncInventory(false); render(); pull(); checkNav();
if (DRAWER) { if (!S.open) back(); else window.focus(); }
</script>
</body>
</html>
