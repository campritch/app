<style>
  :root{
    --navy:#17212B;          /* background */
    --navy-2:#1c2731;        /* card */
    --navy-3:#222e3a;        /* card hover / inputs */
    --salmon:#F06060;        /* primary accent */
    --salmon-2:#f3756f;
    --mint:#E4F0E4;
    --line:rgba(255,255,255,.08);
    --line-2:rgba(255,255,255,.14);
    --text:#eef2f6;
    --mute:#9aa7b4;
    --mute-2:#6b7886;
    --todo:#f5a623;

    --maxw:1180px;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--body);
    background:var(--navy);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    line-height:1.5;
  }
  a{color:inherit;text-decoration:none}
  img,svg{display:block}

  /* ---------------- GATE ---------------- */
  #gate{
    position:fixed;inset:0;z-index:200;
    background:radial-gradient(1200px 700px at 50% -10%, #1f2d3a, var(--navy));
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .gate-card{
    width:100%;max-width:440px;
    background:var(--navy-2);border:1px solid var(--line);
    border-radius:var(--radius);padding:40px 36px;

    text-align:center;
  }
  .gate-card .logo{margin:0 auto 26px;height:30px;width:auto}
  .gate-pill{
    display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;
    color:var(--salmon);border:1px solid rgba(240,96,96,.4);
    border-radius:999px;padding:5px 12px;margin-bottom:18px;
  }
  .gate-card h1{font-size:20px;font-weight:800;margin-bottom:8px;letter-spacing:-.01em}
  .gate-card p{color:var(--mute);font-size:14px;margin-bottom:24px}
  .gate-form{display:flex;flex-direction:column;gap:12px}
  .gate-form input{
    width:100%;padding:14px 16px;border-radius:11px;
    background:var(--navy-3);border:1px solid var(--line-2);
    color:var(--text);font-size:15px;font-family:var(--body);outline:none;
    transition:border-color .15s;

  .gate-form input:focus{border-color:var(--salmon)}
  .gate-form input::placeholder{color:var(--mute-2)}
  .gate-form button{
    width:100%;padding:14px 16px;border:none;border-radius:11px;cursor:pointer;
    background:var(--salmon);color:#fff;font-size:15px;font-weight:700;font-family:var(--body);
    transition:background .15s,transform .05s;
  }
  .gate-form button:hover{background:var(--salmon-2)}
  .gate-form button:active{transform:translateY(1px)}
  .gate-form button:disabled{opacity:.6;cursor:default}
  .gate-err{color:var(--salmon);font-size:13px;min-height:18px;margin-top:4px}
  .gate-fine{color:var(--mute-2);font-size:12px;margin-top:18px;line-height:1.5}

  /* ---------------- HEADER ---------------- */
  header.site{
    position:sticky;top:0;z-index:50;
    background:rgba(23,33,43,.85);backdrop-filter:blur(10px);

  /* ---------------- LAYOUT ---------------- */

  .video.portrait{aspect-ratio:9/16;max-width:300px;margin:0 auto}

  .video-soon{

  .video-facade .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);

  /* metrics */

  .metric .num{font-size:30px;font-weight:800;color:var(--salmon);letter-spacing:-.02em;line-height:1.1}
  .metric .lbl{font-size:14px;font-weight:700;margin-top:8px}
  .metric .sub{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.4}

  /* deal terms */
  .terms{display:grid;grid-template-columns:1fr 1fr;gap:24px 28px}
  .term .k{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--mute-2)}
  .term .v{font-size:19px;font-weight:700;margin-top:5px}
  .closing{
    margin-top:28px;background:rgba(240,96,96,.1);border:1px solid rgba(240,96,96,.35);
    border-radius:13px;padding:20px 22px;display:flex;align-items:baseline;
    justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .closing .k{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--salmon)}
  .closing .v{font-size:24px;font-weight:800}

  /* todo flag */
  .todo{
    display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;
    color:#1a1205;background:var(--todo);border-radius:6px;padding:3px 9px;
  }

  /* exit */
  .exit{margin-top:22px}
  .exit .framing{color:var(--mute);font-size:15.5px;line-height:1.65;max-width:760px;margin-bottom:28px}
  .acq{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  .acq .chip{
    background:var(--navy-3);border:1px solid var(--line);border-radius:12px;
    padding:22px 12px;text-align:center;font-size:15px;font-weight:700;color:var(--text);
    transition:border-color .15s,transform .15s;

  .acq .chip:hover{border-color:var(--line-2);transform:translateY(-2px)}
  .comps{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px}
  .comp{background:transparent;border:1px solid var(--line-2);border-radius:999px;

  .comp b{color:var(--text);font-weight:700}

  .sectiontitle{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:64px 0 4px}
  .sectionsub{color:var(--mute-2);font-size:13px;margin-bottom:24px}

  /* footer */
  footer{border-top:1px solid var(--line);margin-top:70px;padding:30px 0}
  .foot-inner{max-width:var(--maxw);margin:0 auto;padding:0 24px;
    display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
    color:var(--mute-2);font-size:13px}

  footer a:hover{color:var(--text)}

  /* ---------------- RESPONSIVE ---------------- */
  @media (max-width:880px){
    .grid2{grid-template-columns:1fr}
    .acq{grid-template-columns:repeat(3,1fr)}

    .card{padding:24px}

    .acq{grid-template-columns:repeat(2,1fr)}
    .ov h2{font-size:25px}

</style>

<main id="portal">

<script>
/* ---------- SpotsNow logo: fetch + inline the SVG so CSS can recolor it white ---------- */
async function injectLogo(){
  let svg = "";
  try {
    const r = await fetch("/spotsnow-logo.svg");
    svg = await r.text();
  } catch(e){ svg = ""; }
  document.querySelectorAll("#gateLogo,#hdrLogo").forEach(el=>{ el.innerHTML = svg; });
}

/* ---------- helpers ---------- */
const $ = (id)=>document.getElementById(id);
const TODO_HTML = '<span class="todo">TODO</span>';
const isTodo = (v)=> v === "__TODO__" || v === TODO;
const cell = (v)=> isTodo(v) ? TODO_HTML : v;

const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

function ytId(url){
  const m = (url || "").match(/youtube(?:-nocookie)?\.com\/embed\/([A-Za-z0-9_-]+)/);
  return m ? m[1] : null;
}
function videoEl(cfg){
  if (cfg.url && cfg.url.trim()){
    const id = ytId(cfg.url);
    if (id){
      // Clean on-brand poster, no YouTube title / "Watch on YouTube" until played.
      return `<button class="video-facade" data-yt="${id}" aria-label="Play ${cfg.caption||'video'}">` +
        `<img src="https://img.youtube.com/vi/${id}/maxresdefault.jpg" ` +
        `onerror="this.src='https://img.youtube.com/vi/${id}/hqdefault.jpg'" alt="">` +
        `<span class="play">${PLAY}</span></button>`;
    }
    return `<iframe src="${cfg.url}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
  }
  return `<div class="video-soon"><div class="play">${PLAY}</div><span>${cfg.soonLabel}</span></div>`;
}
// Swap the facade for an autoplaying player on click.
document.addEventListener("click", (e)=>{
  const f = e.target.closest && e.target.closest(".video-facade");
  if (!f) return;
  const id = f.dataset.yt;
  f.parentElement.innerHTML =
    `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1" ` +
    `allow="autoplay; encrypted-media; picture-in-picture; web-share; fullscreen" allowfullscreen></iframe>`;
});
function vidCap(cfg){ return `<b>${cfg.caption}</b><small>${cfg.sub}</small>`; }

function docButton(d, primary){
  if (d.soon || !d.url){
    return `<span class="docbtn disabled">${d.label} <span class="soon">SOON</span></span>`;
  }
  const cls = primary ? "docbtn primary" : "docbtn ghost";
  return `<a class="${cls}" href="${d.url}" target="_blank" rel="noopener">${d.label}</a>`;
}

/* ---------- render portal from CONTENT ---------- */
function render(){
  const c = CONTENT;
  $("badge").textContent = c.badge;
  $("gatePill").textContent = c.badge;
  $("conf").textContent = c.confidential;
  $("company").textContent = c.company;
  $("tagline").textContent = c.tagline;
  $("overview").textContent = c.overview;
  if (c.partners && c.partners.trim()) {
    $("partners").textContent = c.partners;
  } else {
    $("partners").style.display = "none";
  }

  // doc buttons (deck primary, rest ghost)
  $("docbtns").innerHTML =
    docButton(c.docs.deck, true) +
    docButton(c.docs.letter, false);

  // videos
  $("founderVideo").innerHTML = videoEl(c.founderVideo);
  $("founderCap").innerHTML = vidCap(c.founderVideo);
  $("investorVideo").className = "video" + (c.investorVideo.portrait ? " portrait" : "");
  $("investorVideo").innerHTML = videoEl(c.investorVideo);
  $("investorCap").innerHTML = vidCap(c.investorVideo);

  // metrics
  $("metrics").innerHTML = c.metrics.map(m=>`
    <div class="metric">
      <div class="num">${cell(m.value)}</div>
      <div class="lbl">${m.label}</div>
      <div class="sub">${m.sub}</div>
    </div>`).join("");

  // terms
  $("terms").innerHTML = c.terms.map(t=>`
    <div class="term"><div class="k">${t.label}</div><div class="v">${cell(t.value)}</div></div>
  `).join("");

  // footer
  $("year").textContent = "2026";
  $("contact").textContent = c.contact;
  $("contact").href = "mailto:" + c.contact;
}

/* ---------- access gate ---------- */
const COOKIE = "sn_investor_seen";  // JS-readable flag for returning-visitor bypass.
const EMAIL_KEY = "sn_investor_email"; // their own email, kept locally to attribute repeat opens.
                                    // The recorded list itself stays server-side only.
function hasAccess(){
  return document.cookie.split(";").some(p=>p.trim().startsWith(COOKIE+"=")) ||
         localStorage.getItem(COOKIE) === "1";
}
function grantClient(email){
  localStorage.setItem(COOKIE, "1");
  if (email) localStorage.setItem(EMAIL_KEY, email);
  document.cookie = COOKIE + "=1; Path=/; Max-Age=7776000; SameSite=Lax";
}
function recordView(){
  const email = localStorage.getItem(EMAIL_KEY);
  if (!email) return;
  fetch("/api/investor-access", {
    method:"POST", keepalive:true,
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ email, event:"view" }),
  }).catch(()=>{});
}
function showPortal(){
  $("gate").style.display = "none";
  $("portal").classList.add("shown");
}

const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

$("gateForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const email = $("email").value.trim();
  const err = $("gateErr");
  const btn = $("gateBtn");
  err.textContent = "";
  if (!emailRe.test(email)){ err.textContent = "Please enter a valid email."; return; }
  btn.disabled = true; btn.textContent = "Entering...";
  try {
    await fetch("/api/investor-access", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ email }),
    });
  } catch(_){ /* never block the investor on a logging failure */ }
  grantClient(email);
  showPortal();
});

$("signout").addEventListener("click", ()=>{
  localStorage.removeItem(COOKIE);
  localStorage.removeItem(EMAIL_KEY);
  document.cookie = COOKIE + "=; Path=/; Max-Age=0; SameSite=Lax";
  fetch("/api/investor-access?signout=1").catch(()=>{});
  location.reload();
});

/* ---------- boot ---------- */
injectLogo();
render();
if (hasAccess()) { showPortal(); recordView(); }
</script>
</body>
</html>
