            </div>
          </div>
          <div className="msh-sources">
            <span className="msh-sources__lbl">Synced from</span>
            <span className="msh-source">{tickIcon}Ad server · CRM &amp; orders</span>
            <span className="msh-source">{tickIcon}Inventory tracker</span>
            <span className="msh-source">{tickIcon}rate-cards.csv</span>
            <span className="msh-source add" onClick={upload}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>Connect a source</span>
          </div>

          <div className="msh-card">
            <div className="msh-bar">
              <div className="msh-search2">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                <input placeholder="Search shows…" value={q} onChange={e=>setQ(e.target.value)} />
              </div>
              <div className="msh-tools">
                <button className="msh-icon" disabled={!past.length} onClick={undo} title="Undo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg></button>
                <button className="msh-icon" disabled={!future.length} onClick={redo} title="Redo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h1"/></svg></button>
                <button className="btn btn--outline btn--sm" onClick={upload} disabled={syncing}>{syncing? <React.Fragment><span className="spin" style={{width:13,height:13,borderWidth:2}}></span>Syncing…</React.Fragment> : <React.Fragment><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Upload CSV</React.Fragment>}</button>
                <button className="btn btn--primary btn--sm" onClick={addShow}>+ Add show</button>
              </div>
            </div>
            <div className="msh-scroll">
              <table className="msh">
                <thead>
                  <tr>
                    <th className="stick stick--sel"><div className={"msh-check"+(allSel?" on":"")} onClick={toggleAll}>{allSel && <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>}</div></th>
                    <th className="stick stick--show">Shows</th>
                    {MSH_COLS.map(c=><th key={c.key} style={{width:c.w,minWidth:c.w}}>{c.label}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {filtered.map(r=>(
                    <tr key={r.id}>
                      <td className="stick stick--sel"><div className={"msh-check"+(r.selected?" on":"")} onClick={()=>toggle(r.id)}>{r.selected && <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>}</div></td>
                      <td className="stick stick--show"><div className="msh-show"><div className="msh-thumb">{initials(r.name)}</div><div className="msh-showname">{r.name}</div></div></td>
                      {MSH_COLS.map(c=><td key={c.key} style={{width:c.w,minWidth:c.w}}><MCell col={c} row={r} update={update} /></td>)}

                  ))}

            </div>
            <div className="msh-foot">
              <span className="msh-foot__l">{filtered.length} show{filtered.length!==1?"s":""}{q.trim()?" matched":""} · synced from the ad server + inventory tracker</span>

                {nSel>0 && <button className="btn btn--outline btn--sm" onClick={delSel}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" style={{marginRight:5}}><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/></svg>Delete {nSel}</button>}
                <button className={"btn btn--primary btn--sm"+(saved?" btn--saved":"")} onClick={doSave}>{saved?"Saved ✓":"Save and update"}</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

            <div className="brand">
              <div style={{display:"flex",flexDirection:"column",gap:"2px"}}>
                <div style={{fontSize:"19px",fontWeight:700,letterSpacing:"-.03em",color:"var(--text-primary)"}}>Vetting Agent</div>
                <div style={{fontSize:"12.5px",fontWeight:500,color:"var(--text-tertiary)"}}>RFP intake → priced media plan</div>
              </div>
            </div>
            <div className="topbar__right">
              <div className="date-pill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>July 2026 cycle</div>
              <button className="sf-btn" title="Synced with your CRM"><span className="dot"></span>CRM connected</button>
              <div className="avatar">CP</div>
            </div>
          </div>

          <div className="tabs">
            <button className={"tab"+(tab==="operator"?" active":"")} onClick={()=>setTab("operator")}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
              Operator
            </button>
            <button className={"tab"+(tab==="exec"?" active":"")} onClick={()=>setTab("exec")}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
              Dashboard
            </button>
            <button className={"tab"+(tab==="shows"?" active":"")} onClick={()=>setTab("shows")}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>
              Shows <small>· source data</small>
            </button>
            <button className={"tab"+(tab==="templates"?" active":"")} onClick={()=>setTab("templates")}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
              Forms <small>· {templates.length}</small>
            </button>
          </div>

          {tab==="operator" && <OperatorView stages={stages} setStages={setStages} onExec={()=>setTab("exec")} />}
          {tab==="exec" && <ExecutiveView />}
          {tab==="shows" && <ManageShowsView />}
          {tab==="templates" && <TemplatesView templates={templates} onAddTemplate={addTemplate} />}

          <div className="footnote">Built for <b>Acme Network</b> · RFP + Vetting Agent demo · seeded mock data, in-memory · powered by <b>SpotsNow</b></div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    (function () {
      try {
        var src = document.getElementById("appsrc").textContent;
        var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
        (0, eval)(out);
      } catch (err) {
        document.getElementById("root").innerHTML =
          '<pre style="margin:40px;padding:20px;border-radius:12px;background:#FFEDED;color:#b00;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap">' +
          (err && err.message ? err.message : String(err)) + "</pre>";
      }
    })();
  </script>
</body>
</html>
