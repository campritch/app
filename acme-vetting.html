      --no-text: #3F3F46; --no-bg: #F3F4F6; --no-line: #E4E6ED;
      --flag-text: #707481; --flag-bg: #F3F4F6; --flag-line: #D4D4D8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; background: var(--page-bg); color: var(--text-primary); -webkit-font-smoothing: antialiased; line-height: 1.45; }
    button { font-family: inherit; cursor: pointer; }
    .wrap { max-width: 1320px; margin: 0 auto; padding: 20px 26px 90px; }

    /* TOP BAR */
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand__mark { width: 42px; height: 42px; border-radius: 11px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 17px; letter-spacing: -.03em; flex-shrink: 0; }
    .brand__divider { width: 1px; height: 34px; background: var(--border); margin: 0 4px; }
    .brand__sub2 { font-size: 12px; font-weight: 600; color: var(--text-tertiary); line-height: 1.18; }
    .topbar__right { display: flex; align-items: center; gap: 11px; }
    .date-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 8px 13px; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
    .date-pill svg { color: var(--text-tertiary); }
    .sf-btn { display: inline-flex; align-items: center; gap: 7px; background: var(--white); border: 1px solid var(--border); color: var(--text-tertiary); border-radius: 9px; padding: 8px 13px; font-size: 12.5px; font-weight: 600; cursor: default; }
    .sf-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: #3FB87C; }
    .avatar { width: 37px; height: 37px; border-radius: 50%; background: #27272A; color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 13px; }

    /* TABS */
    .tabs { display: flex; gap: 4px; background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 5px; margin-bottom: 22px; width: fit-content; }
    .tab { border: none; background: none; padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 8px; }
    .tab:hover { background: var(--secondary-lite); }
    .tab.active { background: var(--primary); color: #fff; }
    .tab small { font-weight: 500; opacity: .7; font-size: 11.5px; }

    .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: 0 1px 2px rgba(16,19,35,.04); }
    .section-title { font-size: 15px; font-weight: 700; letter-spacing: -.02em; margin: 28px 0 14px; }

    /* BUTTONS */
    .btn { border: none; border-radius: 10px; padding: 10px 16px; font-size: 13.5px; font-weight: 700; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; }
    .btn--primary { background: var(--primary); color: #fff; }
    .btn--primary:hover { background: #000; }
    .btn--accent { background: var(--accent); color: #fff; }
    .btn--ghost { background: var(--secondary-lite); color: var(--text-primary); }
    .btn--outline { background: var(--white); color: var(--text-primary); border: 1px solid var(--border); }
    .btn--outline:hover { background: var(--secondary-lite); }
    .btn--sm { padding: 8px 13px; font-size: 13px; }
    .btn--saved { background: #18794E; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    /* OPERATOR LAYOUT */
    .op { display: grid; grid-template-columns: 290px 1fr; gap: 18px; align-items: start; }
    .op > * { min-width: 0; }
    .queue { overflow: hidden; }
    .queue__head { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .queue__title { font-size: 13px; font-weight: 700; }
    .queue__count { font-size: 11px; font-weight: 700; color: var(--text-tertiary); background: var(--secondary-lite); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; }
    .qitem { width: 100%; text-align: left; border: none; background: none; padding: 13px 16px; border-bottom: 1px solid var(--border-light); cursor: pointer; display: block; }
    .qitem:last-child { border-bottom: none; }
    .qitem:hover { background: #FCFCFD; }
    .qitem.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
    .qitem__adv { font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; }
    .qitem__meta { font-size: 11.5px; color: var(--text-tertiary); font-weight: 600; margin-top: 2px; }
    .qitem__foot { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; }
    .qbadge { font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
    .qbadge--active { background: var(--primary); color: #fff; }
    .qbadge--wait { background: var(--cond-bg); color: var(--cond-text); border: 1px solid var(--cond-line); }
    .qbadge--done { background: var(--yes-bg); color: var(--yes-text); border: 1px solid var(--yes-line); }
    .qbadge--new { background: var(--secondary-lite); color: var(--text-secondary); border: 1px solid var(--border); }
    .qclock { font-size: 11px; font-weight: 700; color: var(--text-tertiary); }
    .qclock.warn { color: var(--no-text); }

    /* REQUEST HEADER */
    .reqhead { padding: 20px 22px; margin-bottom: 16px; }
    .reqhead__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .reqhead__eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-tertiary); }
    .reqhead__title { font-size: 22px; font-weight: 700; letter-spacing: -.03em; margin-top: 4px; }
    .reqhead__sub { font-size: 13px; color: var(--text-secondary); font-weight: 500; margin-top: 4px; }
    .clockbox { text-align: right; flex-shrink: 0; }
    .clockbox__label { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); }
    .clockbox__val { font-size: 24px; font-weight: 800; letter-spacing: -.03em; margin-top: 3px; }
    .clockbox__val.warn { color: var(--no-text); }
    .clockbox__sub { font-size: 11px; color: var(--text-tertiary); font-weight: 600; margin-top: 1px; }
    .asks { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 15px; }
    .ask { font-size: 11.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 6px; }
    .ask.on { background: var(--primary); color: #fff; border-color: var(--primary); }
    .ask.off { background: var(--white); color: var(--text-tertiary); }

    /* STEPPER */
    .stepper { display: flex; align-items: center; padding: 14px 18px; margin-bottom: 16px; overflow-x: auto; }
    .step { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
    .step__dot { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--text-tertiary); background: var(--white); flex-shrink: 0; }
    .step.done .step__dot { background: var(--primary); border-color: var(--primary); color: #fff; }
    .step.current .step__dot { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 0 3px rgba(24,24,27,.08); }
    .step__label { font-size: 12px; font-weight: 600; color: var(--text-tertiary); white-space: nowrap; }
    .step.done .step__label, .step.current .step__label { color: var(--text-primary); }
    .step__bar { width: 26px; height: 2px; background: var(--border); margin: 0 6px; flex-shrink: 0; }
    .step__bar.fill { background: var(--primary); }

    /* STAGE PANEL */
    .stage { padding: 22px 24px; }
    .stage__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .stage__h { font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
    .stage__desc { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; max-width: 560px; line-height: 1.5; }
    .ai-tag { font-size: 9.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); background: var(--secondary-lite); border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px; display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .ai-tag i { width: 6px; height: 6px; border-radius: 50%; background: #18794E; }
    .stage__foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border-light); }
    .stage__note { font-size: 12px; color: var(--text-tertiary); font-weight: 500; max-width: 540px; line-height: 1.5; }

    /* BOOSTER REQUEST CARD */
    .booster { border: 1px solid var(--border); border-radius: 11px; overflow: hidden; }
    .booster__bar { display: flex; align-items: center; gap: 9px; padding: 9px 13px; background: #F9FAFB; border-bottom: 1px solid var(--border); font-size: 11.5px; font-weight: 700; color: var(--text-secondary); }
    .booster__bar .src { margin-left: auto; font-weight: 600; color: var(--text-tertiary); font-size: 11px; }
    .kv { display: grid; grid-template-columns: 150px 1fr; gap: 0; }
    .kv > div { padding: 11px 14px; border-bottom: 1px solid var(--border-light); font-size: 13px; }
    .kv > div:nth-child(odd) { font-weight: 600; color: var(--text-tertiary); font-size: 12px; background: #FCFCFD; }
    .kv > div:nth-child(even) { font-weight: 600; }
    .kv > div:nth-last-child(-n+2) { border-bottom: none; }
    .chiplist { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: 11.5px; font-weight: 600; background: var(--secondary-lite); border: 1px solid var(--border); border-radius: 7px; padding: 3px 9px; }

    /* PRECHECK LIST */
    .pc-summary { display: grid; grid-template-columns: repeat(4,1fr); gap: 0; border: 1px solid var(--border); border-radius: 11px; overflow: hidden; margin-bottom: 16px; }
    .pc-summary > div { padding: 14px 16px; border-right: 1px solid var(--border-light); }
    .pc-summary > div:last-child { border-right: none; }
    .pc-summary__n { font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
    .pc-summary__l { font-size: 11.5px; font-weight: 600; color: var(--text-tertiary); margin-top: 2px; }
    .pc-row { display: flex; align-items: center; gap: 13px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 11px; margin-bottom: 8px; }
    .pc-row.conflict { background: var(--no-bg); border-color: var(--no-line); }
    .pc-row.sold { background: var(--flag-bg); border-color: var(--flag-line); }
    .pc-thumb { width: 36px; height: 36px; border-radius: 8px; background: #27272A; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0; letter-spacing: -.02em; }
    .pc-row__body { flex: 1; min-width: 0; }
    .pc-row__name { font-size: 13.5px; font-weight: 700; }
    .pc-row__meta { font-size: 11.5px; color: var(--text-tertiary); font-weight: 600; margin-top: 1px; }
    .pc-flag { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; flex-shrink: 0; }
    .pc-flag.clear { color: var(--yes-text); background: var(--yes-bg); border: 1px solid var(--yes-line); }
    .pc-flag.conflict { color: var(--no-text); background: #fff; border: 1px solid var(--no-line); }
    .pc-flag.sold { color: var(--text-secondary); background: #fff; border: 1px solid var(--border); }
    .pc-flag.soft { color: var(--cond-text); background: var(--cond-bg); border: 1px solid var(--cond-line); }
    .pc-note { font-size: 11px; color: var(--text-secondary); font-weight: 500; margin-top: 2px; }

    /* EMAIL DRAFTS */
    .drafts-bar { display: flex; align-items: center; gap: 12px; padding: 12px 15px; background: var(--accent-soft); border: 1px solid var(--border); border-radius: 11px; margin-bottom: 16px; font-size: 13px; font-weight: 600; }
    .drafts-bar b { font-weight: 800; }
    .email { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 11px; overflow: hidden; transition: box-shadow .12s; }
    .email.approved { border-color: var(--yes-line); background: var(--yes-bg); }
    .email__head { display: flex; align-items: center; gap: 12px; padding: 12px 15px; cursor: pointer; }
    .email__to { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1; }
    .email__body0 { min-width: 0; }
    .email__show { font-size: 13.5px; font-weight: 700; }
    .email__addr { font-size: 11.5px; color: var(--text-tertiary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .email__subj { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
    .email__state { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
    .email-pill { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--secondary-lite); color: var(--text-secondary); border: 1px solid var(--border); }
    .email-pill.ok { background: var(--yes-bg); color: var(--yes-text); border-color: var(--yes-line); }
    .email__expand { padding: 0 15px 15px; }
    .email__field { font-size: 11px; font-weight: 700; color: var(--text-tertiary); letter-spacing: .03em; text-transform: uppercase; margin: 10px 0 5px; }
    .email__subjbox { font-size: 13px; font-weight: 700; padding: 9px 12px; background: #F9FAFB; border: 1px solid var(--border); border-radius: 9px; }
    .email textarea { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 12px 13px; font-family: inherit; font-size: 12.5px; line-height: 1.6; color: var(--text-primary); resize: vertical; min-height: 200px; background: var(--white); }
    .email textarea:focus { outline: none; border-color: var(--accent); }
    .email__actions { display: flex; gap: 9px; margin-top: 12px; }
    .email__tone { font-size: 11px; color: var(--text-tertiary); font-weight: 600; margin-top: 9px; display: flex; align-items: center; gap: 6px; }

    /* SENT / REPLIES */
    .rep-table { width: 100%; border-collapse: collapse; }
    .rep-table th { text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-tertiary); background: #FCFCFD; padding: 11px 14px; border-bottom: 1px solid var(--border); }
    .rep-table td { padding: 12px 14px; border-bottom: 1px solid var(--border-light); font-size: 13px; vertical-align: top; }
    .rep-table tr:last-child td { border-bottom: none; }
    .rep-show { font-weight: 700; font-size: 13px; }
    .rep-show small { display: block; font-weight: 600; color: var(--text-tertiary); font-size: 11px; margin-top: 1px; }
    .verdict { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; display: inline-block; }
    .verdict.yes { color: var(--yes-text); background: var(--yes-bg); border: 1px solid var(--yes-line); }
    .verdict.no { color: var(--no-text); background: var(--no-bg); border: 1px solid var(--no-line); }
    .verdict.cond { color: var(--cond-text); background: var(--cond-bg); border: 1px solid var(--cond-line); }
    .verdict.incomplete { color: var(--text-secondary); background: var(--flag-bg); border: 1px solid var(--flag-line); }
    .verdict.sent { color: var(--text-tertiary); background: var(--white); border: 1px dashed var(--border); }
    .rep-answers { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
    .ans { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-secondary); }
    .ans.y { color: var(--yes-text); border-color: var(--yes-line); background: var(--yes-bg); }
    .ans.n { color: var(--no-text); border-color: var(--no-line); background: var(--no-bg); }
    .ans.miss { color: var(--cond-text); border-color: var(--cond-line); background: var(--cond-bg); border-style: dashed; }
    .rep-quote { font-size: 11.5px; color: var(--text-secondary); font-style: italic; line-height: 1.5; max-width: 320px; }
    .flagline { display: flex; align-items: flex-start; gap: 8px; background: var(--cond-bg); border: 1px solid var(--cond-line); border-radius: 9px; padding: 9px 11px; margin-top: 7px; font-size: 11.5px; font-weight: 600; color: var(--cond-text); line-height: 1.45; }
    .followpill { font-size: 10.5px; font-weight: 700; color: var(--text-secondary); background: var(--white); border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px; margin-top: 6px; display: inline-flex; align-items: center; gap: 6px; }

    /* SHEET BUILDER */
    .sheet-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .sheet-tag { font-size: 11.5px; font-weight: 600; padding: 5px 11px; border-radius: 8px; background: var(--secondary-lite); border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 7px; }
    .sheet-tag b { font-weight: 800; }
    .gsheet { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .gsheet__bar { display: flex; align-items: center; gap: 8px; padding: 9px 13px; background: #0F7A3D; color: #fff; font-size: 12px; font-weight: 700; }
    .gsheet__bar .sub { margin-left: auto; font-weight: 500; opacity: .85; font-size: 11px; }
    .gscroll { overflow-x: auto; }
    table.gs { border-collapse: collapse; width: 100%; min-width: max-content; font-size: 12px; }
    table.gs th { background: #F1F3F4; border: 1px solid #E0E2E5; padding: 8px 11px; text-align: left; font-weight: 700; color: #3C4043; white-space: nowrap; font-size: 11px; letter-spacing: .02em; }
    table.gs td { border: 1px solid #E8EAED; padding: 8px 11px; white-space: nowrap; }
    table.gs tr:nth-child(even) td { background: #FBFBFB; }
    .gs-show { font-weight: 700; }
    .gs-excl { color: var(--cond-text); font-weight: 600; font-size: 11px; }
    .gs-num { font-variant-numeric: tabular-nums; text-align: right; }
    .gs-edit { display: inline-flex; align-items: center; border: 1px solid var(--accent); border-radius: 7px; overflow: hidden; }
    .gs-edit span { background: var(--secondary-lite); padding: 3px 7px; font-weight: 700; }
    .gs-edit input { border: none; width: 64px; text-align: right; padding: 3px 7px; font-family: inherit; font-weight: 700; font-size: 12px; }
    .gs-edit input:focus { outline: none; }
    .gs-foot { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; border-top: 2px solid #E0E2E5; background: #F8F9FA; font-size: 13px; font-weight: 700; }
    .gs-group { background: #E2E6E9; border: 1px solid #D2D6DA; color: #2A2E33; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; text-align: center; padding: 7px 8px; font-weight: 800; white-space: nowrap; }
    .gs-meta { display: flex; flex-wrap: wrap; border: 1px solid #E0E2E5; border-bottom: none; background: #F8F9FA; }
    .gs-meta > div { padding: 8px 14px; border-right: 1px solid #E8EAED; font-size: 11.5px; font-weight: 700; color: #3C4043; }
    .gs-meta > div span { color: #80868B; font-weight: 600; margin-right: 7px; text-transform: uppercase; font-size: 10px; letter-spacing: .04em; }
    .fill-callout { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); border: 1px solid var(--border); border-radius: 11px; padding: 11px 13px; margin: 0 0 12px; font-size: 12px; font-weight: 500; color: var(--text-secondary); line-height: 1.5; }
    .fill-callout b { color: var(--text-primary); font-weight: 700; }

    /* DONE */
    .done { text-align: center; padding: 26px 24px 14px; }
    .done__check { width: 56px; height: 56px; border-radius: 50%; background: var(--yes-bg); border: 1px solid var(--yes-line); color: var(--yes-text); display: grid; place-items: center; margin: 0 auto 14px; }
    .done__h { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
    .done__p { font-size: 13px; color: var(--text-secondary); margin-top: 6px; max-width: 460px; margin-left: auto; margin-right: auto; line-height: 1.55; }
    .done__stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin: 22px auto 6px; max-width: 560px; }
    .done__stat { border: 1px solid var(--border); border-radius: 11px; padding: 16px; }
    .done__stat .n { font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
    .done__stat .l { font-size: 11px; font-weight: 600; color: var(--text-tertiary); margin-top: 3px; }

    /* EXEC DASHBOARD */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; overflow: hidden; margin-bottom: 16px; }
    .stat { padding: 20px; border-right: 1px solid var(--border-light); }
    .stat:last-child { border-right: none; }
    .stat__label { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-tertiary); }
    .stat__value { font-size: clamp(24px, 3vw, 36px); font-weight: 800; letter-spacing: -.035em; line-height: 1.04; margin-top: 9px; color: #3F4550; }
    .stat__delta { font-size: 12px; margin-top: 8px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
    .stat__delta.good { color: var(--yes-text); }
    .stat__delta.bad { color: var(--no-text); }
    .exec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .panel { padding: 20px 22px; }
    .panel__h { font-size: 14px; font-weight: 700; letter-spacing: -.02em; }
    .panel__sub { font-size: 12px; color: var(--text-tertiary); font-weight: 500; margin-top: 2px; margin-bottom: 14px; }
    .pl-table { width: 100%; border-collapse: collapse; }
    .pl-table th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-tertiary); padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .pl-table td { padding: 10px; border-bottom: 1px solid var(--border-light); font-size: 12.5px; }

    .pl-strike { color: var(--text-tertiary); text-decoration: line-through; font-weight: 500; font-size: 11.5px; }
    .lead-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border-light); }

    .lead-rank { width: 22px; height: 22px; border-radius: 6px; background: var(--secondary-lite); display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--text-secondary); flex-shrink: 0; }
    .lead-row.top .lead-rank { background: var(--primary); color: #fff; }
    .lead-name { font-size: 12.5px; font-weight: 700; flex: 1; }
    .lead-bar { flex: 1.4; height: 7px; border-radius: 5px; background: var(--secondary-lite); overflow: hidden; }
    .lead-bar i { display: block; height: 100%; background: var(--primary); }
    .lead-bar i.slow { background: #A1A1AA; }
    .lead-val { font-size: 12px; font-weight: 700; width: 56px; text-align: right; flex-shrink: 0; }
    .cat-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
    .cat-name { font-size: 12.5px; font-weight: 600; width: 130px; flex-shrink: 0; }
    .cat-bar { flex: 1; height: 9px; border-radius: 5px; background: var(--secondary-lite); overflow: hidden; }
    .cat-bar i { display: block; height: 100%; }
    .cat-val { font-size: 11.5px; font-weight: 700; width: 78px; text-align: right; flex-shrink: 0; color: var(--text-secondary); }

    /* TEMPLATES */
    .tpl-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .tpl-head h1 { font-size: 22px; font-weight: 700; letter-spacing: -.03em; }
    .tpl-head p { color: var(--text-secondary); font-size: 13.5px; margin-top: 3px; max-width: 640px; line-height: 1.5; }
    .tpl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .tpl-card { text-align: left; background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 16px 17px; cursor: pointer; transition: box-shadow .12s, border-color .12s; box-shadow: 0 1px 2px rgba(16,19,35,.04); }
    .tpl-card:hover { box-shadow: 0 5px 16px rgba(16,19,35,.09); border-color: var(--text-tertiary); }
    .tpl-card__top { display: flex; align-items: center; gap: 11px; margin-bottom: 13px; }
    .tpl-logo { width: 40px; height: 40px; border-radius: 9px; background: #27272A; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0; letter-spacing: -.02em; }
    .tpl-card__name { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
    .tpl-type { font-size: 9.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-secondary); background: var(--secondary-lite); display: inline-block; margin-top: 4px; }
    .tpl-type.prog { color: var(--cond-text); background: var(--cond-bg); border-color: var(--cond-line); }
    .tpl-type.form { color: var(--text-secondary); background: var(--white); }
    .tpl-card__meta { font-size: 11.5px; color: var(--text-tertiary); font-weight: 600; margin-bottom: 11px; }
    .match-toggle { margin-top: 16px; display: inline-flex; align-items: center; gap: 7px; background: none; border: none; font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--text-secondary); padding: 0; }
    .match-toggle:hover { color: var(--text-primary); }
    .match-toggle span { font-weight: 500; color: var(--text-tertiary); }
    .fd-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .fd-head h1 { font-size: 22px; font-weight: 700; letter-spacing: -.03em; }
    .fd-sub { font-size: 13px; color: var(--text-secondary); font-weight: 500; margin-top: 4px; }
    .fd-actions { display: flex; gap: 10px; flex-shrink: 0; }
    .tpl-dl { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--text-secondary); background: none; border: none; padding: 0; cursor: pointer; }
    .tpl-dl:hover { color: var(--text-primary); }
    .tpl-prog { height: 6px; border-radius: 4px; background: var(--secondary-lite); overflow: hidden; }
    .tpl-prog i { display: block; height: 100%; background: var(--yes-text); }
    .tpl-card__foot { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; font-size: 11px; font-weight: 600; color: var(--text-tertiary); }
    .tpl-add { border: 1.5px dashed var(--border); background: var(--white); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; padding: 16px; color: var(--text-secondary); min-height: 150px; cursor: pointer; font-weight: 700; font-size: 13px; }
    .tpl-add:hover { border-color: var(--primary); color: var(--primary); background: #FCFCFD; }
    .tpl-add__ic { width: 38px; height: 38px; border-radius: 50%; background: var(--secondary-lite); display: grid; place-items: center; }
    .form-upload { width: 100%; display: flex; align-items: center; gap: 16px; text-align: left; background: var(--white); border: 1.5px dashed var(--border); border-radius: 14px; padding: 18px 20px; cursor: pointer; margin-bottom: 24px; transition: border-color .12s, background .12s; }
    .form-upload:hover { border-color: var(--primary); background: #FCFCFD; }
    .form-upload__ic { width: 46px; height: 46px; border-radius: 12px; background: var(--secondary-lite); display: grid; place-items: center; color: var(--text-secondary); flex-shrink: 0; }
    .form-upload__body { flex: 1; min-width: 0; }
    .form-upload__h { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
    .form-upload__p { font-size: 12.5px; color: var(--text-secondary); font-weight: 500; margin-top: 3px; line-height: 1.5; }
    .form-upload .btn { flex-shrink: 0; }
    .forms-sub { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 12px; }
    /* forms list (table) — Superhuman-style backlog */
    .flist { background: var(--white); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(16,19,35,.04); }
    .flist__head, .flist__row { display: grid; grid-template-columns: 2.3fr 1.4fr 0.8fr 1.5fr 1fr auto; align-items: center; gap: 16px; padding: 0 20px; }
    .flist__head { height: 42px; border-bottom: 1px solid var(--border); }
    .flist__head > div { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-tertiary); }
    .flist__row { min-height: 66px; border-bottom: 1px solid var(--border-light); cursor: pointer; text-align: left; }
    .flist__row:last-child { border-bottom: none; }
    .flist__row:hover { background: #FCFCFD; }
    .flist__namecell { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .flist__thumb { width: 34px; height: 34px; border-radius: 8px; background: #27272A; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0; letter-spacing: -.02em; }
    .flist__name { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .flist__cell { font-size: 12.5px; color: var(--text-secondary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .flist__pill { font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 999px; background: var(--secondary-lite); border: 1px solid var(--border); color: var(--text-secondary); display: inline-block; white-space: nowrap; }
    .flist__act { display: flex; align-items: center; gap: 12px; justify-content: flex-end; }
    @media (max-width: 1040px) { .flist__head, .flist__row { grid-template-columns: 2fr 1.2fr 1fr auto; } .flist__hide { display: none; } }

    .tpl-back { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; color: var(--text-secondary); background: none; border: none; padding: 0; margin-bottom: 14px; }
    .tpl-back:hover { color: var(--text-primary); }
    .struct { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid var(--border); border-radius: 11px; overflow: hidden; margin-bottom: 16px; }
    .struct > div { padding: 14px 16px; border-right: 1px solid var(--border-light); }
    .struct > div:last-child { border-right: none; }
    .struct__n { font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
    .struct__l { font-size: 11px; font-weight: 600; color: var(--text-tertiary); margin-top: 3px; }
    .map-table { width: 100%; border-collapse: collapse; }
    .map-table th { text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-tertiary); background: #FCFCFD; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .map-table td { padding: 9px 14px; border-bottom: 1px solid var(--border-light); font-size: 12.5px; vertical-align: middle; }
    .map-table tr:last-child td { border-bottom: none; }
    .map-table tr.review td { background: #FEFBF3; }
    .map-col { font-weight: 600; }
    .map-arrow { color: var(--text-tertiary); text-align: center; width: 28px; }
    .map-select { border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--text-primary); background: var(--white); min-width: 210px; }
    .map-select:focus { outline: none; border-color: var(--accent); }
    .map-select.review { border-color: var(--cond-line); background: var(--cond-bg); color: var(--cond-text); }
    .map-stat { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .map-stat.ok { color: var(--yes-text); background: var(--yes-bg); border: 1px solid var(--yes-line); }
    .map-stat.review { color: var(--cond-text); background: var(--cond-bg); border: 1px solid var(--cond-line); }
    .map-stat.skip { color: var(--text-tertiary); background: var(--secondary-lite); border: 1px solid var(--border); }
    .dropzone { border: 1.5px dashed var(--border); border-radius: 12px; padding: 44px 20px; text-align: center; }
    .dropzone.busy { border-color: var(--accent); background: #FCFCFD; }
    .dz-ic { width: 56px; height: 56px; border-radius: 50%; background: var(--secondary-lite); display: grid; place-items: center; margin: 0 auto 14px; color: var(--text-secondary); }
    .dz-h { font-size: 15px; font-weight: 700; }
    .dz-p { font-size: 12.5px; color: var(--text-tertiary); font-weight: 500; margin: 5px auto 16px; max-width: 360px; line-height: 1.5; }
    .spin { width: 22px; height: 22px; border: 2.5px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── INBOX (concept B home) ─── */
    .inbox { max-width: 1000px; }
    .inbox__bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .inbox__h { font-size: 21px; font-weight: 700; letter-spacing: -.03em; }
    .inbox__sub { font-size: 13px; color: var(--text-secondary); font-weight: 500; margin-top: 2px; }
    .inbox__filter { display: inline-flex; background: var(--secondary-lite); border-radius: 10px; padding: 3px; gap: 2px; }
    .inbox__filter button { border: none; background: none; padding: 7px 13px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
    .inbox__filter button.on { background: var(--white); color: var(--text-primary); box-shadow: 0 1px 2px rgba(16,19,35,.12); }
    .ig { margin-bottom: 22px; }
    .ig__h { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 9px; display: flex; align-items: center; gap: 8px; }
    .ig__h .n { background: var(--secondary-lite); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; font-size: 10.5px; color: var(--text-secondary); }
    .ig__h .dot { width: 7px; height: 7px; border-radius: 50%; }
    .irow { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--white); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 9px; cursor: pointer; transition: box-shadow .12s, border-color .12s; box-shadow: 0 1px 2px rgba(16,19,35,.04); width: 100%; text-align: left; }
    .irow:hover { box-shadow: 0 5px 16px rgba(16,19,35,.09); border-color: var(--text-tertiary); }
    .irow__thumb { width: 42px; height: 42px; border-radius: 10px; background: #27272A; color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex-shrink: 0; letter-spacing: -.02em; }
    .irow__body { min-width: 0; flex: 1.3; }
    .irow__adv { font-size: 14.5px; font-weight: 700; letter-spacing: -.01em; }
    .irow__meta { font-size: 12px; color: var(--text-tertiary); font-weight: 600; margin-top: 2px; }
    .irow__mid { flex: 1; min-width: 0; }
    .istage { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; display: inline-block; border: 1px solid var(--border); color: var(--text-secondary); background: var(--secondary-lite); }
    .istage.live { color: var(--cond-text); background: var(--cond-bg); border-color: var(--cond-line); }
    .istage.done { color: var(--yes-text); background: var(--yes-bg); border-color: var(--yes-line); }
    .irow__prog { margin-top: 7px; }
    .irow__progbar { height: 5px; border-radius: 4px; background: var(--secondary-lite); overflow: hidden; max-width: 160px; }
    .irow__progbar i { display: block; height: 100%; background: var(--primary); }
    .irow__progtxt { font-size: 10.5px; font-weight: 600; color: var(--text-tertiary); margin-top: 4px; }
    .irow__right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .iclock { text-align: right; }
    .iclock__v { font-size: 13px; font-weight: 700; }
    .iclock__v.warn { color: var(--no-text); }
    .iclock__l { font-size: 10.5px; color: var(--text-tertiary); font-weight: 600; }
    .iact { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--primary); background: var(--primary); color: #fff; border-radius: 9px; padding: 8px 13px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
    .iact.ghost { background: var(--white); color: var(--text-secondary); border-color: var(--border); }

    /* ─── TWO-THIRDS DRAWER ─── */
    .rd-overlay { position: fixed; inset: 0; background: rgba(14,19,35,.34); opacity: 0; pointer-events: none; transition: opacity .22s; z-index: 50; }
    .rd-overlay.open { opacity: 1; pointer-events: auto; }
    .rdrawer { position: fixed; top: 0; right: 0; height: 100%; width: 66vw; max-width: 940px; min-width: 600px; background: var(--page-bg); border-left: 1px solid var(--border); box-shadow: -22px 0 60px rgba(14,19,35,.20); transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1); z-index: 51; display: flex; flex-direction: column; }
    .rdrawer.open { transform: translateX(0); }
    .rd-head { padding: 18px 26px 16px; border-bottom: 1px solid var(--border); background: var(--white); position: relative; }
    .rd-head__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-right: 40px; }
    .rd-eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); }
    .rd-title { font-size: 19px; font-weight: 700; letter-spacing: -.02em; margin-top: 3px; }
    .rd-subtitle { font-size: 12.5px; color: var(--text-secondary); font-weight: 500; margin-top: 3px; }
    .rd-clock { text-align: right; flex-shrink: 0; }
    .rd-clock__v { font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
    .rd-clock__v.warn { color: var(--no-text); }
    .rd-clock__l { font-size: 10px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .rd-close { position: absolute; top: 16px; right: 22px; width: 32px; height: 32px; border-radius: 9px; border: none; background: var(--secondary-lite); color: var(--text-secondary); font-size: 17px; display: grid; place-items: center; }
    .rd-close:hover { background: var(--border); color: var(--text-primary); }
    .rd-prog { display: flex; align-items: center; gap: 11px; margin-top: 14px; }
    .rd-prog__bar { flex: 1; height: 5px; border-radius: 4px; background: var(--secondary-lite); overflow: hidden; }
    .rd-prog__bar i { display: block; height: 100%; background: var(--primary); transition: width .3s; }
    .rd-prog__txt { font-size: 11.5px; font-weight: 700; color: var(--text-secondary); white-space: nowrap; }
    .rd-body { overflow-y: auto; padding: 22px 26px 30px; flex: 1; }
    .rd-body .stage, .rd-body .card { box-shadow: none; }

    /* ─── MULTI-MESSAGE (bulk + individual) ─── */
    .mm-section { margin-bottom: 18px; }
    .mm-label { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    .mm-label small { font-weight: 500; color: var(--text-tertiary); }
    .mm-msg { width: 100%; border: 1px solid var(--border); border-radius: 11px; padding: 13px 14px; font-family: inherit; font-size: 12.5px; line-height: 1.6; color: var(--text-primary); resize: vertical; min-height: 150px; background: var(--white); }
    .mm-msg:focus { outline: none; border-color: var(--accent); }
    .mm-merge { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 9px; }
    .mm-tag { font-size: 11.5px; font-weight: 700; font-family: ui-monospace, "SF Mono", Menlo, monospace; background: var(--secondary-lite); border: 1px solid var(--border); border-radius: 7px; padding: 3px 8px; color: var(--text-secondary); }
    .mm-merge__hint { font-size: 11.5px; color: var(--text-tertiary); font-weight: 500; }
    .mm-merge__hint b { color: var(--text-secondary); font-weight: 700; }
    .mm-pills { display: flex; flex-wrap: wrap; gap: 7px; }
    .mm-pill { border: 1px solid var(--border); background: var(--secondary-lite); color: var(--text-secondary); border-radius: 8px; padding: 6px 11px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    .mm-pill.on { background: var(--primary); color: #fff; border-color: var(--primary); }
    .mm-pill .x { opacity: .6; font-weight: 700; }
    .mm-pill.selall { border-style: dashed; }
    .mm-or { display: flex; align-items: center; gap: 0; margin: 20px 0; color: var(--text-tertiary); }
    .mm-or i { flex: 1; height: 1px; background: var(--border); }
    .mm-or span { font-size: 12px; font-weight: 700; padding: 0 14px; }
    .mm-box { border: 1px solid var(--border); border-radius: 12px; padding: 13px 15px; margin-bottom: 10px; background: var(--white); }
    .mm-box__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
    .mm-box__who { display: flex; align-items: center; gap: 10px; }
    .mm-box__name { font-size: 13px; font-weight: 700; }
    .mm-box__addr { font-size: 11px; color: var(--text-tertiary); font-weight: 600; }
    .mm-back { font-size: 11.5px; font-weight: 700; color: var(--text-secondary); background: none; border: none; display: inline-flex; align-items: center; gap: 5px; }
    .mm-back:hover { color: var(--text-primary); }
    .mm-box textarea { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; font-family: inherit; font-size: 12px; line-height: 1.6; resize: vertical; min-height: 130px; }
    .mm-box textarea:focus { outline: none; border-color: var(--accent); }
    .mm-empty { font-size: 12px; color: var(--text-tertiary); font-weight: 500; padding: 12px 14px; border: 1px dashed var(--border); border-radius: 10px; text-align: center; }

    /* ─── MANAGE SHOWS (source of truth) — ported from @spotsnow/ui listings grid ─── */
    .msh-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .msh-head h1 { font-size: 21px; font-weight: 700; letter-spacing: -.03em; }
    .msh-head p { color: var(--text-secondary); font-size: 13.5px; margin-top: 3px; max-width: 680px; line-height: 1.5; }
    .msh-sources { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
    .msh-sources__lbl { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-tertiary); margin-right: 2px; }
    .msh-source { display: inline-flex; align-items: center; gap: 7px; background: var(--white); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px 6px 8px; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .msh-source .tick { width: 16px; height: 16px; border-radius: 50%; background: var(--yes-bg); border: 1px solid var(--yes-line); color: var(--yes-text); display: grid; place-items: center; flex-shrink: 0; }
    .msh-source.add { border-style: dashed; color: var(--text-tertiary); cursor: pointer; padding: 6px 12px; }
    .msh-source.add:hover { color: var(--text-primary); border-color: var(--text-tertiary); }

    .msh-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; box-shadow: 0 1px 2px rgba(16,19,35,.04); }
    .msh-bar { display: flex; align-items: center; gap: 10px; padding: 13px 15px; border-bottom: 1px solid var(--border); }

        </div>
      );
    }

    /* ═══════════════ STAGE: PRECHECK ═══════════════ */
    function StagePrecheck({ onNext }){
      const clear = SHOWS.filter(s=>s.precheck==="clear");
      const conflict = SHOWS.filter(s=>s.precheck==="conflict");
      const sold = SHOWS.filter(s=>s.precheck==="sold");
      const soft = SHOWS.filter(s=>s.soft);
      const row = (s)=>{
        const cls = s.precheck==="conflict"?"conflict":s.precheck==="sold"?"sold":"";
        return (
          <div className={"pc-row "+cls} key={s.id}>
            <div className="pc-thumb">{initials(s.name)}</div>
            <div className="pc-row__body">
              <div className="pc-row__name">{s.name}</div>
              <div className="pc-row__meta">{s.cat} · {fmtK(s.dl)} dl/ep · {s.fem}% female</div>
              {s.pcNote && <div className="pc-note">{s.pcNote}</div>}
            </div>
            {s.precheck==="clear" && !s.soft && <span className="pc-flag clear">✓ Clear</span>}
            {s.precheck==="clear" && s.soft && <span className="pc-flag soft">⚑ Historically said no</span>}
            {s.precheck==="conflict" && <span className="pc-flag conflict">Category conflict</span>}
            {s.precheck==="sold" && <span className="pc-flag sold">Sold out · July</span>}
          </div>
        );
      };
      return (
        <div className="card stage">
          <div className="stage__head">
            <div>
              <div className="stage__h">Pre-check results — AE feedback</div>
              <div className="stage__desc">Checked all 15 against Airtable (category exclusivity), FlightPath (July avails), and the vetting knowledge base (host history). The AE sees this instantly, so the pipeline starts clean.</div>
            </div>
            <span className="ai-tag"><i></i>Airtable · FlightPath · KB</span>
          </div>
          <div className="pc-summary">
            <div><div className="pc-summary__n">11</div><div className="pc-summary__l">Clear to vet</div></div>
            <div><div className="pc-summary__n" style={{color:"var(--no-text)"}}>2</div><div className="pc-summary__l">Category conflict</div></div>
            <div><div className="pc-summary__n">2</div><div className="pc-summary__l">Sold out (July)</div></div>
            <div><div className="pc-summary__n" style={{color:"var(--cond-text)"}}>1</div><div className="pc-summary__l">Soft flag (re-ask)</div></div>
          </div>
          <div style={{fontSize:"11px",fontWeight:700,letterSpacing:".05em",textTransform:"uppercase",color:"var(--text-tertiary)",margin:"4px 0 9px"}}>Filtered out — flagged to AE before commit</div>
          {[...conflict,...sold].map(row)}
          <div style={{fontSize:"11px",fontWeight:700,letterSpacing:".05em",textTransform:"uppercase",color:"var(--text-tertiary)",margin:"16px 0 9px"}}>Clear to vet (11)</div>
          {clear.map(row)}
          <div className="stage__foot">
            <div className="stage__note"><b>Conflicts flag, they don't block.</b> {soft.length>0 && "The Wellness Hour historically declined color cosmetics — surfaced as a soft flag so you can still ask. "}The 4 filtered shows go back to the AE instantly so they're never pitched on a dead deal.</div>
            <button className="btn btn--primary" onClick={onNext}>Draft 11 vetting emails
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      );
    }

    /* ═══════════════ STAGE: VETTING (bulk + individual messaging) ═══════════════ */
    const BULK_TEMPLATE =
`Hi {{first_name}},

Hope you're well! We've got an advertiser, Thrive Cosmetics (clean beauty / cosmetics), looking at a July flight and I'd love to get {{show}} on the plan. Before I do, a few quick things:

- Open to reading for Thrive Cosmetics?
- Would the host do a personal endorsement (PE)?
- Open to a social add-on — one in-feed post tied to the read?

They also asked about usage rights on the read. A quick yes/no on each is all I need.

Quick note on what a yes means: vetting just confirms the host is open to the category and willing to read if booked — it's not a confirmed buy until there's an IO.

Reply all so the whole team's looped in. Thanks!
Acme Network`;

    function StageVetting({ onNext }){
      const clear = SHOWS.filter(s=>s.precheck==="clear");
      const ids = clear.map(s=>s.id);
      const byId = (id)=>clear.find(s=>s.id===id);
      const [bulk,setBulk] = useState(ids);          // shows on the shared message
      const [indiv,setIndiv] = useState([]);         // shows pulled into a custom message
      const [bulkMsg,setBulkMsg] = useState(BULK_TEMPLATE);
      const [indivMsg,setIndivMsg] = useState({});
      const pull = (id)=>{ setBulk(b=>b.filter(x=>x!==id)); setIndiv(i=>i.includes(id)?i:[...i,id]); setIndivMsg(m=>m[id]?m:{...m,[id]:draftEmail(byId(id)).body}); };
      const restore = (id)=>{ setIndiv(i=>i.filter(x=>x!==id)); setBulk(b=>b.includes(id)?b:[...b,id]); };
      const toggle = (id)=> bulk.includes(id)?pull(id):restore(id);
      const selectAll = ()=>{ setBulk(ids); setIndiv([]); };
      const total = bulk.length + indiv.length;
      return (
        <div className="card stage">
          <div className="stage__head">
            <div>
              <div className="stage__h">Draft &amp; approve vetting emails</div>
              <div className="stage__desc">One shared message goes to every show, personalized per host on send. Pull any show out to write it a custom note. Nothing sends until you approve — every email is one-to-one, never a blast.</div>
            </div>
            <span className="ai-tag"><i></i>Claude · your voice</span>
          </div>

          <div className="mm-section">
            <div className="mm-label">Shared message <small>· sent to {bulk.length} show{bulk.length!==1?"s":""}, merge fields fill per host on send</small></div>
            <textarea className="mm-msg" value={bulkMsg} onChange={e=>setBulkMsg(e.target.value)} disabled={bulk.length===0} style={bulk.length===0?{opacity:.5}:{}} />
            {(()=>{ const first = bulk.length ? byId(bulk[0]) : null; const fn = first ? first.contact.split(" ")[0] : "Dana"; const sn = first ? first.name : "Honestly Healthy";
              return (
                <div className="mm-merge">
                  <span className="mm-tag">{"{{first_name}}"}</span>
                  <span className="mm-tag">{"{{show}}"}</span>
                  <span className="mm-merge__hint">filled per host on send — e.g. <b>{fn}</b> · <b>{sn}</b></span>
                </div>
              );
            })()}
          </div>

          <div className="mm-section">
            <div className="mm-label">Shows on the shared message <small>· tap a show to pull it into its own custom email</small></div>
            <div className="mm-pills">
              <button className={"mm-pill selall"+(bulk.length===ids.length?" on":"")} onClick={selectAll}>Select all</button>
              {clear.map(s=>{ const on=bulk.includes(s.id); return (
                <button key={s.id} className={"mm-pill"+(on?" on":"")} onClick={()=>toggle(s.id)} title={on?"Pull into a custom email":"On the shared message"}>
                  {s.name}{!on && <span className="x">↡ custom</span>}
                </button>
              ); })}
            </div>
          </div>

          <div className="mm-or"><i></i><span>and / or</span><i></i></div>

          <div className="mm-section">
            <div className="mm-label">Individual messages <small>· {indiv.length} customized</small></div>
            {indiv.length===0
              ? <div className="mm-empty">No custom emails yet. Tap a show above to write it a tailored note — useful for the soft re-ask shows or complex asks.</div>
              : indiv.map(id=>{ const s=byId(id); return (
                  <div className="mm-box" key={id}>
                    <div className="mm-box__top">
                      <div className="mm-box__who">
                        <div className="pc-thumb" style={{width:30,height:30,fontSize:11}}>{initials(s.name)}</div>
                        <div><div className="mm-box__name">{s.name}{s.soft && <span style={{color:"var(--cond-text)",fontWeight:600,fontSize:11}}> · soft re-ask</span>}</div><div className="mm-box__addr">{s.email}</div></div>
                      </div>
                      <button className="mm-back" onClick={()=>restore(id)}><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>Back to shared</button>
                    </div>
                    <textarea value={indivMsg[id]} onChange={e=>setIndivMsg(m=>({...m,[id]:e.target.value}))} />
                  </div>
                ); })}
          </div>

          <div className="stage__foot">
            <div className="stage__note"><b>{bulk.length} shared · {indiv.length} individual.</b> All {total} go out one-to-one with the <b>AdApproval:</b> prefix so replies thread back clean, and each send logs to the vetting history.</div>
            <button className="btn btn--primary" onClick={onNext} disabled={total===0}>Approve &amp; send {total}
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      );
    }

    /* ═══════════════ STAGE: SENT ═══════════════ */
    function StageSent({ onNext }){
      const clear = SHOWS.filter(s=>s.precheck==="clear");
      return (
        <div className="card stage">
          <div className="stage__head">
            <div>
              <div className="stage__h">Sent — awaiting replies</div>
              <div className="stage__desc">11 emails out, one per show. The agent watches the threads. Reminder emails auto-draft at the 24-hour mark for any non-responders; incomplete answers get a follow-up.</div>
            </div>
            <span className="ai-tag"><i></i>Monitoring threads</span>
          </div>
          <table className="rep-table">
            <thead><tr><th>Show</th><th>Contact</th><th>Sent</th><th>Status</th></tr></thead>
            <tbody>
              {clear.map((s,i)=>(
                <tr key={s.id}>
                  <td><div className="rep-show">{s.name}<small>{s.cat}</small></div></td>
                  <td style={{color:"var(--text-secondary)",fontWeight:600}}>{s.contact}<div style={{fontSize:"11px",color:"var(--text-tertiary)",fontWeight:600}}>{s.email}</div></td>
                  <td style={{color:"var(--text-tertiary)",fontWeight:600,fontSize:"12px"}}>{i%2===0?"2 min ago":"3 min ago"}</td>
                  <td><span className="verdict sent">● Sent · awaiting</span></td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="stage__foot">
            <div className="stage__note">In the demo we fast-forward the clock. In production the agent parses replies as they land and only nudges you when something needs you.</div>
            <button className="btn btn--primary" onClick={onNext}>Fast-forward — replies coming in
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M13 19l9-7-9-7v14zM2 19l9-7-9-7v14z"/></svg>
            </button>
          </div>
        </div>
      );
    }

    /* ═══════════════ STAGE: REPLIES ═══════════════ */
    function StageReplies({ onNext }){
      const clear = SHOWS.filter(s=>s.precheck==="clear");
      const [resolved,setResolved]=useState({}); // incomplete show ids that got a follow-up sent
      const counts = { yes:0, conditional:0, no:0, incomplete:0 };
      clear.forEach(s=>counts[s.reply]++);
      const ansChip = (label,val)=> val===true ? <span className="ans y" key={label}>{label} ✓</span> : val===false ? <span className="ans n" key={label}>{label} ✕</span> : <span className="ans miss" key={label}>{label} ?</span>;
      const verdictEl = (s)=>{
        if(s.reply==="yes") return <span className="verdict yes">Yes — all 3</span>;
        if(s.reply==="conditional") return <span className="verdict cond">Conditional</span>;
        if(s.reply==="no") return <span className="verdict no">No</span>;
        return <span className="verdict incomplete">Incomplete</span>;
      };
      return (
        <div className="card stage">
          <div className="stage__head">
            <div>
              <div className="stage__h">Replies parsed — {counts.yes} yes · {counts.conditional} conditional · {counts.no} no · {counts.incomplete} incomplete</div>
              <div className="stage__desc">The agent reads each reply and logs structured answers per show. It catches when "yes" only answered one of three questions and auto-drafts the follow-up — the nuance a quick scan misses.</div>
            </div>
            <span className="ai-tag"><i></i>Claude · reply parser</span>
          </div>
          <table className="rep-table">
            <thead><tr><th>Show</th><th style={{width:"170px"}}>Answers logged</th><th style={{width:"170px"}}>Verdict</th><th>What the agent caught</th></tr></thead>
            <tbody>
              {clear.map(s=>(
                <tr key={s.id}>
                  <td><div className="rep-show">{s.name}<small>{s.host}</small></div></td>
                  <td><div className="rep-answers">{ansChip("Read",s.ans.read)}{ansChip("PE",s.ans.pe)}{ansChip("Social",s.ans.social)}</div></td>
                  <td>{verdictEl(s)}</td>
                  <td>
                    {s.reply==="yes" && <span style={{color:"var(--text-tertiary)",fontWeight:600,fontSize:"12px"}}>Clean yes — logged to vetting history.</span>}
                    {s.reply==="conditional" && <div className="rep-quote">"{s.cond}"<div className="flagline"><span>⚑</span><span>Exclusion logged — color line carved out on the sheet.</span></div></div>}
                    {s.reply==="no" && <span style={{color:"var(--text-secondary)",fontWeight:600,fontSize:"12px"}}>{s.noNote}</span>}
                    {s.reply==="incomplete" && <div>
                      <div className="rep-quote">{s.incompleteNote}</div>
                      {resolved[s.id]
                        ? <span className="followpill" style={{color:"var(--yes-text)",borderColor:"var(--yes-line)",background:"var(--yes-bg)"}}>✓ Follow-up sent</span>
                        : <button className="followpill" onClick={()=>setResolved(r=>({...r,[s.id]:true}))}><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M3 12h13M11 6l6 6-6 6"/></svg>Send auto-drafted follow-up</button>}
                    </div>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="stage__foot">
            <div className="stage__note">The 24hr clock is ticking, so you can build the sheet with what's confirmed now — <b>9 viable shows</b> (7 clean yes + 1 conditional + 1 recovered follow-up). The rest stay tracked.</div>
            <button className="btn btn--primary" onClick={onNext}>Build the RFP sheet
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      );
    }

    /* ═══════════════ STAGE: SHEET ═══════════════ */
    function StageSheet({ onNext }){
      // viable = yes + conditional + dailyedit (recovered follow-up → yes)
      const viableIds = ["honestly","mombrain","wellnesshour","realtalk","selfcare","hustle","unwind","afterhours","dailyedit"];
      const viable = viableIds.map(id=>SHOWS.find(s=>s.id===id));
      const [prices,setPrices]=useState(()=>{ const p={}; viable.forEach(s=>p[s.id]=s.cpm); return p; });
      const cost = (s)=> Math.round(prices[s.id]*s.dl*s.units/1000);
      const total = viable.reduce((a,s)=>a+cost(s),0);
      return (
        <div className="card stage">
          <div className="stage__head">
            <div>
              <div className="stage__h">RFP sheet — Oxford Road template, filled</div>
              <div className="stage__desc">The agent read Oxford Road's exact template, pulled each show's data, applied the right rate card, and carried over the exclusions from vetting. Review, tweak a price, and send back.</div>
            </div>
            <span className="ai-tag"><i></i>Sheets API · auto-fill</span>
          </div>
          <div className="sheet-meta">
            <span className="sheet-tag">Template: <b>Oxford Road — Q3 Host-Read</b></span>
            <span className="sheet-tag">Rate card: <b>Oxford Road (Tier 2)</b></span>
            <span className="sheet-tag">9 viable shows · {viable.length} rows</span>
          </div>
          <div className="gsheet">
            <div className="gsheet__bar">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h8l6 6v14H6z" opacity=".25"/><path d="M14 2l6 6h-6z"/></svg>
              Thrive_Cosmetics_July_RFP — Oxford Road
              <span className="sub">edit a price inline · auto-recalculates</span>
            </div>
            <div className="gscroll">
              <table className="gs">
                <thead><tr>
                  <th>Show</th><th>Format</th><th>Avg Downloads</th><th>Audience</th><th>Position</th><th>Units</th><th>Net CPM</th><th>Net Cost</th><th>Exclusions / Notes</th>
                </tr></thead>
                <tbody>
                  {viable.map(s=>(
                    <tr key={s.id}>
                      <td className="gs-show">{s.name}</td>
                      <td>Host-read</td>
                      <td className="gs-num">{s.dl.toLocaleString("en-US")}</td>
                      <td>{s.fem}% F · {s.age}</td>
                      <td>Mid-roll</td>
                      <td className="gs-num">{s.units}</td>
                      <td><span className="gs-edit"><span>$</span><input type="number" value={prices[s.id]} onChange={e=>setPrices(p=>({...p,[s.id]:Math.max(0,Number(e.target.value)||0)}))} /></span></td>
                      <td className="gs-num">{fmtUSD(cost(s))}</td>
                      <td className="gs-excl">{s.reply==="conditional" ? "Skincare line only — no color cosmetics" : s.id==="dailyedit" ? "Confirmed on follow-up" : "—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="gs-foot"><span>9 shows · {viable.reduce((a,s)=>a+s.units,0)} units · July flight</span><span>Total: {fmtUSD(total)}</span></div>
          </div>
          <div className="stage__foot">
            <div className="stage__note"><b>Pricing keeps a human touch.</b> Rate card pre-fills every row; you can override any cell (a new-show deal, a loyalty rate) before it goes out. The conditional exclusion is already noted on The Wellness Hour.</div>
            <button className="btn btn--primary" onClick={onNext}>Approve &amp; return to AE
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      );
    }

    /* ═══════════════ STAGE: RETURNED ═══════════════ */
    function StageReturned({ onReset, onExec }){
      return (
        <div className="card">
          <div className="done">
            <div className="done__check"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
            <div className="done__h">Filled sheet returned to the AE</div>
            <div className="done__p">Linked back into the ad server deal for history. The pipeline now reflects 9 vetted-and-priced shows — not 15 hopeful pitches. Clock stopped.</div>
            <div className="done__stats">
              <div className="done__stat"><div className="n">6h 12m</div><div className="l">Request → sheet returned</div></div>
              <div className="done__stat"><div className="n" style={{color:"var(--yes-text)"}}>−70%</div><div className="l">vs. ~20h manual baseline</div></div>
              <div className="done__stat"><div className="n">{fmtUSD(208000)}</div><div className="l">Vetted pipeline added</div></div>
            </div>
          </div>
          <div className="stage__foot" style={{padding:"18px 24px 22px",borderTop:"1px solid var(--border-light)"}}>
            <button className="btn btn--outline" onClick={onReset}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Replay this request</button>
            <button className="btn btn--primary" onClick={onExec}>See the pipeline view
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      );
    }

    /* ═══════════════ OPERATOR VIEW ═══════════════ */
    const REQ_META = {
      thrive: { adv:"Thrive Cosmetics", sub:"July 2026 flight · Oxford Road · 15 shows requested", meta:"15 shows · Oxford Road · July" },
      liquiddeath: { adv:"Liquid Death", sub:"July flight · AdResults · 22 shows requested", meta:"22 shows · AdResults · July" },
      rocket: { adv:"Rocket Money", sub:"Aug flight · Adopter · 12 shows requested", meta:"12 shows · Adopter · Aug" },
      hellofresh: { adv:"HelloFresh", sub:"Aug flight · Oxford Road · 18 shows requested", meta:"18 shows · Oxford Road · Aug" },
    };
    const REQ_ORDER = ["thrive","liquiddeath","rocket","hellofresh"];
    const REQ_TIME = { thrive:"6h", liquiddeath:"1d", rocket:"2h", hellofresh:"now" };
    const STAGE_SUMMARY = {
      received: "Request received from the ad server",
      precheck: "Conflict & avails pre-check",
      drafted:  "Vetting emails approved & sent",
      sent:     "Sent — awaiting replies",
      replies:  "Replies parsed",
      sheet:    "RFP sheet built",
      returned: "Sheet returned to the AE",
    };
    const STEP_SHORT = { received:"Received", precheck:"Pre-check", drafted:"Vetting", sent:"Sent", replies:"Replies", sheet:"Sheet", returned:"Returned" };
    const REQ_PREVIEW = {
      thrive: "Pre-check done — 11 clear, 4 filtered. 11 vetting emails are ready for your approval.",
      liquiddeath: "22 shows out for vetting, 13 replies in. 4 incomplete answers have follow-ups drafted, waiting on you.",
      rocket: "Returned to the AE 2h ago — 10 vetted shows priced on the Adopter template and linked into the ad server.",
      hellofresh: "Just landed from the ad server. Pre-check hasn't run yet — open to start the flow.",
    };
    const IcCheck = ({faint})=> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" style={faint?{opacity:.5}:{}}><path d="M20 6 9 17l-5-5"/></svg>;
    const IcClock = ()=> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>;

    /* ═══════════════ OPERATOR VIEW — clean Messages two-pane (no red) ═══════════════ */
    function OperatorView({ stages, setStages, onExec }){
      const [sel,setSel]=useState("thrive");
      const [q,setQ]=useState("");
      const advance = ()=> setStages(s=>({...s,[sel]:Math.min(s[sel]+1,6)}));
      const reset = ()=> setStages(s=>({...s,[sel]:0}));
      const list = REQ_ORDER.filter(id=> !q.trim() || REQ_META[id].adv.toLowerCase().includes(q.trim().toLowerCase()));
      return (
        <div className="msg">
          <div className="msg-pane">
            <div className="inbox2__head">
              <div className="inbox2__title">Inbox</div>
              <div className="inbox2__search">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                <input placeholder="Search…" value={q} onChange={e=>setQ(e.target.value)} />
              </div>
            </div>
            <div>
              {list.map(id=>{ const meta=REQ_META[id]; return (
                <button key={id} className={"conv"+(sel===id?" on":"")} onClick={()=>setSel(id)}>
                  <div className="conv__av">{initials(meta.adv)}</div>
                  <div className="conv__body">
                    <div className="conv__top"><div className="conv__name">{meta.adv}</div><div className="conv__time">{REQ_TIME[id]}</div></div>
                    <div className="conv__prev">{REQ_PREVIEW[id]}</div>
                  </div>
                </button>
              ); })}
            </div>

      if (has("net cpm","discounted cpm","media net cpm","2025 net cpm")||s==="cpm") return ["Net CPM","high"];

      if (has("total cost","net monthly spend","total spend","gross spot cost")||s==="cost") return ["Cost (computed)","med"];
      if (has("sov")) return ["SOV (computed)","med"];
      if (has("youtube","simulcast")&&has("url")) return ["Simulcast / YouTube URL","high"];
      if ((has("apple","itunes")&&has("url"))||has("code/url","show url")) return ["Apple URL","med"];
      if (has("show name","show title","podcast name","podcast title","adjusted show")||s==="show") return ["Show name","high"];
      if (has("publisher","network","station group")) return ["Network / Publisher","high"];
      if (has("host name")||s==="host"||has("host(s) name")) return ["Host name","high"];
      if (has("itunes genre","genre")) return ["Genre","high"];
      if (has("read type","read style","ad reader","voice")) return ["Read type","high"];
      if (has("ad format","ad type","media type","spot type","dai, true","baked-in","baked in")) return ["Ad format (DAI / baked / embedded)","med"];
      if (has("placement")||(has("position")&&!has("ad position")===false)) return ["Ad placement","high"];

      if (has("unit length","spot length","ad length","length","spot duration","duration spot")) return ["Ad length","high"];
      if (has("episodes per week","# of episodes","episode release","publication frequency","show frequency","frequency cap")) return ["Episodes / week","med"];

      if (has("impressions","imps","avail")) return ["Monthly impressions","high"];
      if (has("min spend","minimum spend","min buy","min spend requirement","minimum #")) return ["Min spend","med"];
      if (has("exclus")) return ["Exclusivity","high"];
      if (has("cancellation","cancel")) return ["Cancellation","high"];
      if (has("personal","endorse","own or use","currently own")) return ["Personal endorsement","high"];
      if (has("promo")) return ["Promo code","high"];

      return [REVIEW,"review"];

        case "Ad length": return ":60";
        case "Episodes / week": return "3";
        case "Downloads / episode": return s.dl.toLocaleString("en-US");
        case "Monthly impressions": return (s.dl*s.units).toLocaleString("en-US");
        case "Net CPM": return "$"+s.cpm;
        case "Rate card CPM": return "$"+(s.cpm+4);
        case "Discount %": return "12%";
        case "Min spend": return "$5,000";
        case "Cost (computed)": return "$"+Math.round(s.cpm*s.dl*s.units/1000).toLocaleString("en-US");
        case "SOV (computed)": return "18%";
        case "% Male": return (100-s.fem)+"%";
        case "% Female": return s.fem+"%";
        case "Age / range": return s.age;
        case "HHI": return "$95k";
        case "% US": return s.geo.replace("US ","");
        case "Exclusivity": return "Category";
        case "Cancellation": return "30-day";
        case "Personal endorsement": return "Yes";
        case "Promo code": return "THRIVE20";
        case "Attribution / pixel": return "Podscribe";
        case "Ad server": return "Megaphone";
        case "Rationale / notes": return "Strong F25-44 fit";
        case "Previous sponsors": return "Ritual, Olipop";
        default: return null; // review / skip / unmapped → human pass
      }
    }
    const NUM_FIELDS = new Set(["Net CPM","Rate card CPM","Cost (computed)","Downloads / episode","Monthly impressions","Min spend"]);

    // Real download — builds a CSV of the filled form and saves it.
    function downloadFilled(tpl){
      try {
        const fields = tpl.cols.map(c=>autoMap(c)[0]);
        const esc = (v)=> '"'+String(v==null?"":v).replace(/"/g,'""')+'"';
        const header = tpl.cols.map(esc).join(",");
        const rows = FILL_SAMPLE.map(s=> tpl.cols.map((c,i)=> esc(fillCell(fields[i],s))).join(","));
        const csv = [header, ...rows].join("\n");
        const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = tpl.abbr+"_RFP_filled.csv";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(url), 1000);
      } catch(e){}
    }

       sticky Shows col, search, CSV upload, undo/redo). The RFP filler pulls from here. */
    const MSH_CATEGORIES = ["Wellness","Beauty","Beauty / Skincare","Parenting","Lifestyle","Business","Comedy","News / Culture","Books / Culture"];
    const MSH_TYPES = ["Podcast","Radio","YouTube"];
    const MSH_COLS = [
      { key:"cpm", label:"CPM", w:80, type:"money" },
      { key:"impressions", label:"Impressions", w:108, type:"int" },
      { key:"delivery", label:"Delivery", w:118, type:"select", opts:["Audio Only","Simulcast","Video Only"] },
      { key:"videoPct", label:"Video %", w:82, type:"pct" },
      { key:"audioPct", label:"Audio %", w:82, type:"pct" },
      { key:"ageType", label:"Age Type", w:128, type:"select", opts:["Average Age","Distribution"] },
      { key:"age", label:"Age", w:80, type:"text" },
      { key:"gender", label:"Gender", w:104, type:"text" },
      { key:"hhiType", label:"HHI Type", w:130, type:"select", opts:["Average HHI","Distribution"] },
      { key:"hhi", label:"HHI", w:92, type:"text" },
      { key:"location", label:"Location", w:96, type:"text" },
      { key:"category", label:"Category", w:148, type:"cat" },
      { key:"type", label:"Type", w:100, type:"typ" },
      { key:"promoCodes", label:"Promo Code", w:124, type:"text", ph:"Enter Code" },
    ];
    let MSH_ID = 0;
    function buildMShows(){
      return SHOWS.map((s,i)=>{
        const parts = s.age.split("-").map(Number);
        const audioOnly = i%4===0;
        return { id:s.id, name:s.name, cpm:s.cpm, impressions:s.dl,
          delivery: audioOnly?"Audio Only":"Simulcast", videoPct: audioOnly?0:55, audioPct: audioOnly?100:45,
          ageType:"Average Age", age: Math.round(((parts[0]||25)+(parts[1]||44))/2),
          gender: s.fem+"% F", hhiType:"Average HHI", hhi: ["$110k","$95k","$88k","$102k","$120k"][i%5],
          location:"US", category:s.cat, type:"Podcast", promoCodes:"", selected:false };
      });
    }
    function newMShow(name){
      return { id:"new-"+(++MSH_ID), name: name||"New show", cpm:18, impressions:25000, delivery:"Simulcast", videoPct:50, audioPct:50,
        ageType:"Average Age", age:34, gender:"60% F", hhiType:"Average HHI", hhi:"$95k", location:"US", category:"Wellness", type:"Podcast", promoCodes:"", selected:false };
    }
    const onlyNum = (v)=>String(v).replace(/[^0-9.]/g,"");

    function MCell({ col, row, update }){
      const v = row[col.key];
      if (col.type==="select" || col.type==="cat" || col.type==="typ"){
        const opts = col.type==="cat"?MSH_CATEGORIES: col.type==="typ"?MSH_TYPES: col.opts;
        return <select className="msh-sel" value={v} onChange={e=>update(row.id,{[col.key]:e.target.value})}>{opts.map(o=><option key={o} value={o}>{o}</option>)}</select>;
      }
      if (col.type==="money") return <div className="msh-cell"><span className="maffix2">$</span><input className="msh-inp flush" value={v} onChange={e=>update(row.id,{cpm:onlyNum(e.target.value)})} /></div>;
      if (col.type==="pct") return <div className="msh-cell"><input className="msh-inp flush" value={v} onChange={e=>update(row.id,{[col.key]:onlyNum(e.target.value)})} /><span className="maffix2">%</span></div>;
      if (col.type==="int") return <input className="msh-inp" value={v} onChange={e=>update(row.id,{[col.key]:onlyNum(e.target.value)})} />;
      return <input className="msh-inp" value={v} placeholder={col.ph||""} onChange={e=>update(row.id,{[col.key]:e.target.value})} />;
    }

    function ManageShowsView(){
      const [rows,setRows]=useState(buildMShows);
      const [past,setPast]=useState([]); const [future,setFuture]=useState([]);
      const [q,setQ]=useState(""); const [saved,setSaved]=useState(false); const [syncing,setSyncing]=useState(false);
      const snap=()=>{ setPast(p=>[...p,rows].slice(-50)); setFuture([]); };
      const update=(id,patch)=>{ snap(); setRows(rs=>rs.map(r=>r.id===id?{...r,...patch}:r)); };
      const undo=()=>{ if(!past.length)return; setFuture(f=>[rows,...f].slice(0,50)); setRows(past[past.length-1]); setPast(p=>p.slice(0,-1)); };
      const redo=()=>{ if(!future.length)return; setPast(p=>[...p,rows].slice(-50)); setRows(future[0]); setFuture(f=>f.slice(1)); };
      const toggle=(id)=> setRows(rs=>rs.map(r=>r.id===id?{...r,selected:!r.selected}:r));
      const filtered = q.trim()? rows.filter(r=>r.name.toLowerCase().includes(q.trim().toLowerCase())) : rows;
      const allSel = filtered.length>0 && filtered.every(r=>r.selected);
      const toggleAll=()=> setRows(rs=>rs.map(r=> filtered.includes(r)?{...r,selected:!allSel}:r));
      const nSel = rows.filter(r=>r.selected).length;
      const addShow=()=>{ snap(); setRows(rs=>[...rs,newMShow()]); };
      const delSel=()=>{ snap(); setRows(rs=>rs.filter(r=>!r.selected)); };
      const upload=()=>{ setSyncing(true); setTimeout(()=>{ setPast(p=>[...p,rows].slice(-50)); setRows(rs=>[...rs, newMShow("Imported — The Overlap"), newMShow("Imported — Quiet Hours")]); setSyncing(false); }, 1200); };

        <div>
          <div className="msh-head">
            <div>
