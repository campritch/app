<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Dashboard — SpotsNow</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#17212B; --ink:#1D2027; --grey:#707481; --grey-2:#9CA3AF; --border:#E4E6ED; --bg:#F9FAFB; --white:#fff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; letter-spacing: -.01em; }
    .card { width: 100%; max-width: 460px; background: var(--white); border: 1px solid var(--border); border-radius: 20px; padding: 40px 34px; box-shadow: 0 4px 24px rgba(14,19,35,.04); text-align: center; }
    .mark { width: 46px; height: 46px; border-radius: 13px; background: var(--navy); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 22px; }
    h1 { font-size: 22px; font-weight: 800; letter-spacing: -.03em; margin-bottom: 10px; }
    p { font-size: 14px; color: var(--grey); line-height: 1.6; margin-bottom: 8px; }
    .back { display: inline-block; margin-top: 22px; font-size: 13.5px; font-weight: 700; color: var(--white); background: var(--navy); border-radius: 10px; padding: 11px 18px; text-decoration: none; }
    .back:hover { background: #0E1323; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg></div>
    <h1>Financial Dashboard</h1>
    <p>The financial dashboard demo is being wired into this hub.</p>
    <p>It'll show network billing, payouts, and margin at a glance.</p>
    <a class="back" href="/demos">← Back to demos</a>
  </main>
</body>
</html>
