    { id:'s4', dealId:'d4', brand:'Ritual', showId:'clinton', kind:'paid', published:'2026-08-04', guarantee:45000, views:28000, downloads:null, dlState:'requested', status:'verified', length:'60s', yt:'9bZkp7q19f0', ts:221, epLen:2940, copyStatus:'seen', copy:['Named the brand','Wellness disclaimer read'] },
    { id:'s8', dealId:'d8', brand:'DraftKings', showId:'action', kind:'paid', published:'2026-08-07', guarantee:70000, views:66000, downloads:0, dlState:'none', status:'verified', length:'45s', yt:'aqz-KE-bpKQ', ts:512, epLen:4100, copyStatus:'seen', copy:['Named the brand','Read promo code DK50'] },

    // ── live and pacing · day 1–9 · weekly check ──
    { id:'s5',  dealId:'d5',  brand:'Kalshi', showId:'sage', kind:'paid', published:'2026-08-12', guarantee:120000, views:62000, downloads:13000, dlState:'auto', status:'verified', length:'60s', yt:'M7lc1UVf-VE', ts:286, epLen:5100, copyStatus:'seen', copy:['Named the brand','Read promo code KALSHI','Free-trial CTA'] },
    { id:'s9',  dealId:'d9',  brand:'Ramp', showId:'nate', kind:'paid', published:'2026-08-14', guarantee:60000, views:34000, downloads:0, dlState:'none', status:'verified', length:'45s', yt:'9bZkp7q19f0', ts:194, epLen:3300, copyStatus:'seen', copy:['Named the brand','URL CTA read'] },
    { id:'s10', dealId:'d10', brand:'AG1', showId:'rubin', kind:'paid', published:'2026-08-15', guarantee:95000, views:24000, downloads:4000, dlState:'auto', status:'verified', length:'60s', yt:'dQw4w9WgXcQ', ts:388, epLen:5240, copyStatus:'seen', copy:['Named the brand','Value prop read'] },

    // ── airing today · the daily check the agent runs ──
    { id:'s11', dealId:'d1', brand:'Kalshi', showId:'rubin', kind:'paid', published:TODAY, guarantee:95000, views:null, downloads:null, dlState:'auto', status:'aired', length:'60s', yt:'', ts:null, copyStatus:'seen', copy:[] },
    { id:'s12', dealId:'d6', brand:'BetterHelp', showId:'warren', kind:'paid', published:TODAY, guarantee:85000, views:null, downloads:null, dlState:'none', status:'aired', length:'60s', yt:'', ts:null, copyStatus:'seen', copy:[] },
    { id:'s13', dealId:'d9', brand:'Ramp', showId:'nate', kind:'paid', published:TODAY, guarantee:60000, views:null, downloads:null, dlState:'none', status:'aired', length:'45s', yt:'', ts:null, copyStatus:'seen', copy:[] },

    // ── booked, not yet aired · copy pipeline ──
    { id:'s14', dealId:'d6', brand:'BetterHelp', showId:'sage', kind:'paid', published:'2026-08-19', guarantee:120000, views:null, downloads:null, dlState:'auto', status:'scheduled', length:'60s', yt:'', ts:null, copyStatus:'needs_copy', copy:[] },
    { id:'s15', dealId:'d8', brand:'Notion', showId:'action', kind:'paid', published:'2026-08-21', guarantee:70000, views:null, downloads:null, dlState:'none', status:'scheduled', length:'45s', yt:'', ts:null, copyStatus:'sent', copySent:'2026-08-14', copySeen:null, copy:[] },
    { id:'s16', dealId:'d3', brand:'Ramp', showId:'clinton', kind:'paid', published:'2026-08-25', guarantee:45000, views:null, downloads:null, dlState:'request', status:'scheduled', length:'60s', yt:'', ts:null, copyStatus:'needs_cta', copy:[] },
    { id:'s17', dealId:'d5', brand:'Kalshi', showId:'sage', kind:'paid', published:'2026-08-26', guarantee:120000, views:null, downloads:null, dlState:'auto', status:'scheduled', length:'60s', yt:'', ts:null, copyStatus:'seen', copySent:'2026-08-12', copySeen:'2026-08-12', copy:[] },
    // ── the make-good that already ran the full loop ──
    { id:'s18', dealId:'d3', brand:'Ramp', showId:'warren', kind:'makegood', published:'2026-08-20', guarantee:0, views:null, downloads:null, dlState:'none', status:'scheduled', length:'60s', yt:'', ts:null, copyStatus:'seen', copy:[] },
  ];
  const spot = id => SPOTS.find(s=>s.id===id);

  /* ═══ DELIVERY MATH ═══ */
  const delivered = s => s.views==null ? null : (s.views + (s.downloads||0));
  const liveDays  = s => s.status==='scheduled' ? -1 : daysBetween(s.published, TODAY);
  function projection(s){
    const d = liveDays(s), sh = show(s.showId), got = delivered(s);
    if(d < 0 || got == null) return null;
    const p = curveAt(sh.curve, Math.max(d,1));
    const proj = d >= FINAL_DAY ? got : Math.round(got / Math.max(p,.02));
    return { day:d, curvePct:p, got, proj, ratio: proj/Math.max(s.guarantee,1), rawRatio: got/Math.max(s.guarantee,1),
             final: d >= FINAL_DAY, confident: d >= DECIDE_FROM || p >= .80, samples: sh.samples };
  }
  // What phase of the 4 checks is this spot in?
  function phase(s){
    if(s.status==='scheduled') return 'booked';
    if(s.status==='aired' || s.status==='found') return 'daily';
    const d = liveDays(s);
    if(d >= FINAL_DAY) return 'final';
    if(d > DECIDE_TO) return 'settling';        // call already made, riding to the 30-day number
    if(d >= DECIDE_FROM) return 'decide';
    return 'weekly';
  }
  const PHASES=[{k:'daily',l:'Live'},{k:'weekly',l:'Weekly'},{k:'decide',l:'D10–14'},{k:'final',l:'D30'}];
  const PHASE_STEP={daily:0,weekly:1,decide:2,settling:3,final:3,booked:0};
  /* verdict — the projection is always reported, but only a *firm* one raises a
     make good. Firm means the day 10–14 window is open, or enough of the curve
     is already in that the number can't move much. Before that it's indicative:
     still useful as an early warning, not something you act on. */
  function verdict(s){
    const pr = projection(s); if(!pr) return { k:'pending', label:'Awaiting episode', tone:'grey' };
    if(s.dlState==='requested') return { k:'blocked', label:'Waiting on downloads', tone:'purple', pr };
    if(pr.curvePct < .45 && pr.day < DECIDE_FROM) return { k:'early', label:'Too early to call', tone:'grey', pr };
    if(!pr.confident){
      if(pr.ratio >= 1.0)     return { k:'trackOver',  label:'Tracking over',        tone:'green',  pr, soft:true };
      if(pr.ratio >= IAB_FULL) return { k:'trackFull', label:'Tracking to clear 90%', tone:'green',  pr, soft:true };
      return { k:'trackLight', label:'Tracking light', tone:'orange', pr, soft:true };
    }
    if(pr.ratio >= 1.0) return { k:'bonus', label:pr.final?'Delivered + bonus':'Tracking over', tone:'green', pr };
    if(pr.ratio >= IAB_FULL) return { k:'full', label:pr.final?'Delivered in full':'On track to 90%', tone:'green', pr };
    return { k:'short', label:pr.final?'Under-delivered':'Projected short', tone:'red', pr };
  }
  // what the advertiser paid for this read, at the show's rate
  const spotCost = s => Math.round(s.guarantee/1000 * show(s.showId).cpm);
  const shortfall = s => { const pr=projection(s); return pr?Math.max(0, Math.round(s.guarantee - pr.proj)):0; };

  /* ═══ AVAILS ═══ Airtable knows what's booked; Booster knows the cap per episode. ═══ */
  function nextEpisodes(showId, n=4, from){
    const sh=show(showId), out=[]; let d=from||addDays(TODAY,1);
    for(let i=0;i<45 && out.length<n;i++,d=addDays(d,1)){
      if(!sh.publishDays.includes(dayName(d))) continue;
      const booked = SPOTS.filter(x=>x.showId===showId && x.published===d).length;
      out.push({ date:d, booked, cap:sh.positionsPerEp, open:Math.max(0, sh.positionsPerEp-booked) });
    }
    return out;
  }

  /* ═══ MAKE GOODS ═══ the loop from the call: recommend → approve date → draft to
     show + brand → two sign-offs → write back to Airtable as a Make Good. ═══ */
  const MAKEGOODS = [
    { id:'mg1', spotId:'s3', date:'2026-08-20', status:'scheduled', showOk:true, brandOk:true,
      showVia:'gmail', brandVia:'gmail', note:'Written to Airtable as Make Good · Aug 20.' },
    { id:'mg3', spotId:'s7', date:'2026-08-19', status:'awaiting', showOk:true, brandOk:null,
      showVia:'auto', brandVia:null, sentBrand:'2026-08-16' },
  ];
  let MG_SEQ = 10;
  const mg = id => MAKEGOODS.find(m=>m.id===id);
  const mgForSpot = id => MAKEGOODS.find(m=>m.spotId===id);
  // Any spot projected short that hasn't got a make-good yet
  const needsMakegood = () => SPOTS.filter(s=>verdict(s).k==='short' && !mgForSpot(s.id));

  // Everything on the Delivery page that wants a human — kept in one place so the
  // sidebar badge and the tab counter can never drift apart.
  function deliveryAttention(){
    const aired   = SPOTS.filter(s=>s.status==='aired' && !s.missed);
    const noEp    = SPOTS.filter(s=>s.status==='aired' && s.missed);
    const blocked = SPOTS.filter(s=>s.dlState==='requested');
    const shortNow= needsMakegood();
    return { aired, noEp, blocked, shortNow, count: aired.length+noEp.length+blocked.length+shortNow.length };
  }

  /* ═══ WHAT THE AGENT LEARNED ═══ the guarantee-tuning + fill-rate read ═══ */
  function fillStats(){
    const ran = SPOTS.filter(s=>s.status==='verified' || s.kind==='makegood');
    const paid = ran.filter(s=>s.kind==='paid').length;
    const free = ran.filter(s=>s.kind!=='paid').length;
    return { paid, free, total:paid+free, rate: pctOf(paid, paid+free) };
  }
  function guaranteeAdvice(){
    const out=[];
    SHOWS.forEach(sh=>{
      const ran = SPOTS.filter(s=>s.showId===sh.id && s.kind==='paid' && projection(s));
      if(ran.length < 2) return;
      const shortCount = ran.filter(s=>['short'].includes(verdict(s).k)).length;
      if(!shortCount) return;
      const typical = Math.round(ran.reduce((a,s)=>a+(projection(s).proj||0),0)/ran.length);
      const suggest = Math.round(typical*0.95/1000)*1000;
      if(suggest >= sh.guarantee) return;
      out.push({ showId:sh.id, shortCount, flights:ran.length, current:sh.guarantee, suggest, typical });
    });
    return out.sort((a,b)=>b.shortCount-a.shortCount);
  }

  const brandColor = { 'Kalshi':'#00d09c','DraftKings':'#53d337','Ritual':'#f8b3c0','Ramp':'#f7b32b','Notion':'#111','BetterHelp':'#2f9e97','AG1':'#0b3d2e' };
  const BRAND_DOMAIN = { Kalshi:'kalshi.com', DraftKings:'draftkings.com', Ritual:'ritual.com', Ramp:'ramp.com', Notion:'notion.so', BetterHelp:'betterhelp.com', AG1:'drinkag1.com' };

  // Ad-read quality score — read completeness, delivery, placement, verification
  function qualityScore(s){
    const copyPts = Math.min((s.copy||[]).length,3)/3;
    const pr = projection(s);
    const deliv = Math.min((pr?pr.ratio:0),1.2)/1.2;
    const pos = (s.ts||0)/epLenOf(s);
    const placement = (pos>=0.08 && pos<=0.75) ? 1 : (pos<0.08 ? 0.7 : 0.55);
    const verified = s.status==='verified' ? 1 : 0.6;
    const score = Math.round((copyPts*0.30 + deliv*0.30 + placement*0.20 + verified*0.20)*100);
    const grade = score>=90?'A':score>=80?'B':score>=70?'C':'D';
    const tone = score>=90?'green':score>=80?'blue':score>=70?'orange':'red';
    return { score, grade, tone, factors:[
      {k:'Copy read complete', v:Math.round(copyPts*100)},
      {k:'Projected delivery', v:Math.round(deliv*100)},
      {k:'Mid-roll placement', v:Math.round(placement*100)},
      {k:'Air check verified', v:Math.round(verified*100)},
    ]};
  }

  /* ═══════════════════════════ CHART HELPERS (inline SVG) ═══════════════════════════ */
  const PAL = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)'];
  function barChart(data, {w=560,h=210,pad=30,fmt=money,color='var(--c1)'}={}){
    const max = Math.max(...data.map(d=>d.v),1);
    const bw = (w-pad*2)/data.length;
    let bars='';
    data.forEach((d,i)=>{
      const bh = (h-pad-24)*(d.v/max);
      const x = pad+i*bw+bw*0.16, y=h-24-bh, ww=bw*0.68;
      const cc = d.color || color;
      bars += `<rect x="${x}" y="${y}" width="${ww}" height="${bh}" rx="4" fill="${cc}"><title>${esc(d.k)}: ${fmt(d.v)}</title></rect>`;
      bars += `<text x="${x+ww/2}" y="${h-8}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--text-tertiary)">${esc(d.k)}</text>`;
      bars += `<text x="${x+ww/2}" y="${y-5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--text-secondary)">${d.lbl||fmt(d.v)}</text>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" width="100%">${bars}</svg>`;
  }
  function stackedBar(cats, series, {w=560,h=230,pad=32,fmt=money}={}){
    // cats: ['Jan',...]; series: [{name,color,vals:[..]}]
    const totals = cats.map((_,i)=>series.reduce((a,s)=>a+s.vals[i],0));
    const max = Math.max(...totals,1);
    const bw=(w-pad*2)/cats.length; let out='';
    cats.forEach((c,i)=>{
      let y=h-24; const x=pad+i*bw+bw*0.15, ww=bw*0.7;
      series.forEach(s=>{
        const seg=(h-pad-24)*(s.vals[i]/max); if(seg<=0)return;
        y-=seg; out+=`<rect x="${x}" y="${y}" width="${ww}" height="${seg}" fill="${s.color}"><title>${s.name} · ${esc(c)}: ${fmt(s.vals[i])}</title></rect>`;
      });
      out+=`<text x="${x+ww/2}" y="${h-8}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--text-tertiary)">${esc(c)}</text>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" width="100%">${out}</svg>`;
  }
  function donut(data, {size=150,thick=26}={}){
    const total=data.reduce((a,d)=>a+d.v,0)||1; const r=(size-thick)/2, cx=size/2, cy=size/2, C=2*Math.PI*r;
    let off=0, segs='';
    data.forEach((d,i)=>{
      const frac=d.v/total, len=frac*C;
      segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color||PAL[i%7]}" stroke-width="${thick}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"><title>${esc(d.k)}: ${d.v}</title></circle>`;
      off+=len;
    });
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${segs}<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="19" font-weight="800" fill="var(--text-primary)">${total}</text><text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--text-tertiary)">deals</text></svg>`;
  }
  function lineChart(pts, {w=560,h=200,pad=32,fmt=v=>v,color='var(--c2)'}={}){
    const max=Math.max(...pts.map(p=>p.v))*1.15||1, min=0;
    const X=i=>pad+(w-pad*2)*(i/(pts.length-1||1)); const Y=v=>h-26-(h-pad-26)*((v-min)/(max-min||1));
    let d='',dots='',area='';
    pts.forEach((p,i)=>{ const x=X(i),y=Y(p.v); d+=(i?'L':'M')+x+' '+y+' '; dots+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${color}"><title>${esc(p.k)}: ${fmt(p.v)}</title></circle>`; });
    area=`M${X(0)} ${h-26} `+pts.map((p,i)=>'L'+X(i)+' '+Y(p.v)).join(' ')+` L${X(pts.length-1)} ${h-26} Z`;
    const labels=pts.map((p,i)=>`<text x="${X(i)}" y="${h-8}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--text-tertiary)">${esc(p.k)}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%"><path d="${area}" fill="${color}" opacity="0.08"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}</svg>`;
  }
  function ring(pct, {size=64,thick=8,color='var(--green-text)'}={}){
    const r=(size-thick)/2,c=size/2,C=2*Math.PI*r,len=Math.min(pct,150)/100*C;
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--secondary-lite)" stroke-width="${thick}"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${thick}" stroke-linecap="round" stroke-dasharray="${len} ${C}" transform="rotate(-90 ${c} ${c})"/><text x="${c}" y="${c+4}" text-anchor="middle" font-size="14" font-weight="800" fill="var(--text-primary)">${pct}%</text></svg>`;
  }
  function legend(items){ return `<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:12px">`+items.map(i=>`<span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text-secondary)"><i style="width:9px;height:9px;border-radius:3px;background:${i.color}"></i>${esc(i.k)}</span>`).join('')+`</div>`; }

  /* ═══════════════════════════ NAV ═══════════════════════════ */
  const RENDER = {};
  let CURRENT='overview';
  function go(v){
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===v));
    document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
    document.getElementById('view-'+v).classList.add('active');
    document.getElementById('main').scrollTop=0;
    CURRENT=v;
    if(RENDER[v]) RENDER[v]();
  }
  function rerender(){ if(RENDER[CURRENT]) RENDER[CURRENT](); }
  function refreshBadges(){
    const set=(id,n)=>{ const el=document.getElementById(id); if(!el) return; el.textContent=n; el.style.display=n?'':'none'; };
    set('nav-del-badge', deliveryAttention().count);
    set('nav-mg-badge',  MAKEGOODS.filter(m=>m.status!=='scheduled').length);
    set('nav-copy-badge',SPOTS.filter(s=>['needs_copy','needs_cta'].includes(s.copyStatus)).length);
  }

  /* ═══════════════════════════ OVERLAYS ═══════════════════════════ */
  function openDrawer(html){ const d=document.getElementById('drawer'); d.innerHTML=html; d.classList.add('open'); document.getElementById('scrim').classList.add('open'); }
  function openModal(html){ const m=document.getElementById('modal'); m.innerHTML=html; m.classList.add('open'); document.getElementById('scrim').classList.add('open'); }
  function closeOverlays(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('modal').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); }

  /* ═══════════════════════════ ASK ACME (chat over the store) ═══════════════════════════ */
  let CHAT=[];
  const goChip=(label,view)=>`<button class="btn btn--ghost btn--sm" style="margin-top:11px;margin-right:6px" onclick="go('${view}')">${label}</button>`;
  function askAcme(qOverride){
    const el=document.getElementById('acAsk'); let q=qOverride||(el?el.value.trim():''); if(!q) return;
    CHAT.push({role:'user',text:q}); CHAT.push({role:'bot',html:answerQuery(q)});
    if(el&&!qOverride) el.value=''; renderChatMsgs();
  }
  function renderChatMsgs(){
    const box=document.getElementById('acChatMsgs'); if(!box) return;
    if(!CHAT.length){ box.style.display='none'; return; }
    box.style.display='flex';
    box.innerHTML=CHAT.map(m=>m.role==='user'
      ?`<div style="align-self:flex-end;max-width:80%;background:var(--primary);color:#fff;padding:9px 13px;border-radius:14px 14px 3px 14px;font-size:13px;font-weight:500">${esc(m.text)}</div>`
      :`<div style="align-self:flex-start;max-width:92%;background:var(--page-bg);border:1px solid var(--border-light);padding:11px 14px;border-radius:14px 14px 14px 3px;font-size:13px;line-height:1.55">${m.html}</div>`
    ).join('');
    box.scrollTop=box.scrollHeight;
  }
  function chatCard(){
    const sugg=["What needs a make good?","What's behind pace?","Will Kalshi on Sage Steele deliver?","What's waiting on copy?","Which guarantees are too high?"];
    return `<div class="card" style="margin-bottom:16px">
      <div class="card__pad">
        <div style="display:flex;align-items:center;gap:11px;margin-bottom:13px">
          <div style="width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800">✦</div>
          <div><b style="font-size:14px">Ask Acme Network</b><div class="muted" style="font-size:12px">Ask anything about delivery, pacing and make goods — answered off Airtable + Booster.</div></div>
        </div>
        <div id="acChatMsgs" style="display:none;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto;padding:4px 2px;margin-bottom:12px"></div>
        <div style="display:flex;gap:8px">
          <input id="acAsk" placeholder="Ask anything about Acme Network…" onkeydown="if(event.key==='Enter')askAcme()" style="flex:1;min-width:0;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font-size:13.5px;font-family:inherit">
          <button class="btn btn--primary" onclick="askAcme()">Ask</button>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${sugg.map(x=>`<button class="tag tag--grey" style="cursor:pointer" onclick="askAcme('${x.replace(/'/g,"\\'")}')">${esc(x)}</button>`).join('')}</div>
      </div></div>`;
  }
  const nameOf = s => `${esc(s.brand)} on ${esc(show(s.showId).name)}`;
  function answerQuery(raw){
    const q=raw.toLowerCase().trim();
    const live=SPOTS.filter(s=>projection(s));
    const brands=[...new Set(SPOTS.map(s=>s.brand))];
    const brandHit=brands.find(b=>q.includes(b.toLowerCase()));
    const showHit=SHOWS.find(s=>q.includes(s.name.toLowerCase())||q.includes(s.host.toLowerCase()));

    if(/make ?good|short|under.?deliver|owe/.test(q)){
      const need=needsMakegood(), open=MAKEGOODS.filter(m=>m.status!=='scheduled');
      let out = need.length
        ? `<b>${need.length}</b> flight${need.length>1?'s':''} project${need.length>1?'':'s'} short of the 90% IAB line: `+need.map(s=>{const v=verdict(s);return `${nameOf(s)} (<b>${Math.round(v.pr.ratio*100)}%</b>, ${K(shortfall(s))} short)`;}).join(', ')+`.`
        : `Nothing new projecting short — every live flight clears 90%.`;
      if(open.length) out += ` ${open.length} make good${open.length>1?'s are':' is'} already in the loop waiting on sign-off.`;
      return out+goChip('Open Make Goods →','makegoods');
    }
    if(/decision|day 1[0-4]|window|when.*(decide|call)/.test(q)){
      const d=live.filter(s=>phase(s)==='decide');
      return (d.length?`<b>${d.length}</b> flight${d.length>1?'s are':' is'} in the day 10–14 decision window: `+d.map(s=>`${nameOf(s)} — ${verdict(s).label.toLowerCase()}`).join(', ')+`.`:`Nothing in the decision window today.`)+goChip('Open Delivery →','delivery');
    }
    if(brandHit && showHit){
      const sp=SPOTS.filter(s=>s.brand===brandHit&&s.showId===showHit.id&&projection(s)).sort((a,b)=>liveDays(b)-liveDays(a))[0];
      if(sp){ const v=verdict(sp), pr=v.pr;
        return `<b>${nameOf(sp)}</b> is day ${pr.day} of 30. ${K(pr.got)} delivered against a ${K(sp.guarantee)} guarantee — that reads <b>${Math.round(pr.rawRatio*100)}%</b> raw, but ${esc(showHit.name)}'s curve only has ${Math.round(pr.curvePct*100)}% of the views in by now. Projected final is <b>${K(pr.proj)}</b> = <b>${Math.round(pr.ratio*100)}%</b> of guarantee. ${v.k==='short'?'That lands short — make good recommended.':'That clears the 90% line, no make good needed.'}`+goChip('Open Delivery →','delivery'); }
    }
    if(/behind|pacing|pace|at risk|track/.test(q)){
      const behind=live.filter(s=>['short','early'].includes(verdict(s).k)&&phase(s)!=='booked');
      const looksBad=live.filter(s=>{const v=verdict(s);return v.pr&&v.pr.rawRatio<0.7&&v.k!=='short';});
      let out = behind.filter(s=>verdict(s).k==='short').length
        ? `Behind: `+behind.filter(s=>verdict(s).k==='short').map(s=>`<b>${nameOf(s)}</b> (${Math.round(verdict(s).pr.ratio*100)}% projected)`).join(', ')+`.`
        : `Nothing projecting behind right now.`;
      if(looksBad.length) out += ` Note ${looksBad.map(s=>`<b>${nameOf(s)}</b>`).join(', ')} look${looksBad.length>1?'':'s'} light on raw numbers but the curve says ${looksBad.length>1?'they land':'it lands'} fine — no action needed.`;
      return out+goChip('Open Delivery →','delivery');
    }
    if(/copy|cta|proof of post|not opened|read receipt/.test(q)){
      const need=SPOTS.filter(s=>['needs_copy','needs_cta'].includes(s.copyStatus));
      const unseen=SPOTS.filter(s=>s.copyStatus==='sent');
      let out = need.length?`${need.length} spot${need.length>1?'s':''} still need copy or a CTA: `+need.map(s=>`<b>${nameOf(s)}</b> (${s.copyStatus==='needs_copy'?'ad copy':'CTA'}, airs ${fmtDate(s.published)})`).join(', ')+`.`:`Every booked spot has its copy in.`;
      if(unseen.length) out += ` ${unseen.length} copy email${unseen.length>1?'s have':' has'} been sent but not opened yet.`;
      return out+goChip('Open Copy & Proof →','copy');
    }
    if(/guarantee|too high|lower|reduce|fill rate|bonus/.test(q)){
      const adv=guaranteeAdvice(), f=fillStats();
      let out=`Paid fill rate is <b>${f.rate}%</b> — ${f.paid} paid spots against ${f.free} given as make goods or bonus.`;
      if(adv.length){ const a=adv[0]; out+=` <b>${esc(show(a.showId).name)}</b> has needed a make good on ${a.shortCount} of the last ${a.flights} flights. Its reads typically land near ${K(a.typical)}, so a ${K(a.suggest)} guarantee would stop the bleed (currently ${K(a.current)}).`; }
      return out+goChip('Open Shows & Inventory →','shows');
    }
    if(/aired today|today|daily|new episode|live check/.test(q)){
      const t=SPOTS.filter(s=>s.status==='aired');
      return (t.length?`<b>${t.length}</b> spots are due to air today — ${t.map(s=>esc(show(s.showId).name)).join(', ')}. Run the agent and it scans each channel for the episode, finds the read, and grabs the link + timestamp.`:`Every spot due today has been checked.`)+goChip('Open Delivery →','delivery');
    }
    if(/avail|inventory|open|slot|space|book/.test(q)){
      const sh=showHit||SHOWS[0]; const av=nextEpisodes(sh.id,3);
      return `<b>${esc(sh.name)}</b> publishes ${sh.publishDays.join('/')} with ${sh.positionsPerEp} ad positions an episode. Next avails: `+av.map(e=>`${fmtDate(e.date)} (${e.open} of ${e.cap} open)`).join(', ')+`.`+goChip('Open Shows & Inventory →','shows');
    }
    if(showHit){
      const sh=showHit; const sp=SPOTS.filter(s=>s.showId===sh.id&&projection(s));
      return `<b>${esc(sh.name)}</b> — ${sh.publishDays.join('/')}, ${sh.positionsPerEp} positions per episode, ${K(sh.guarantee)} guarantee. Learned curve: <b>${Math.round(curveAt(sh.curve,2)*100)}%</b> of views inside 48h, off ${sh.samples} verified reads. ${sp.length} flight${sp.length!==1?'s':''} live.`+goChip('Open Shows & Inventory →','shows');
    }
    if(brandHit){
      const sp=SPOTS.filter(s=>s.brand===brandHit&&projection(s));
      if(!sp.length) return `${esc(brandHit)} has nothing live right now.`+goChip('Open Delivery →','delivery');
      const g=sp.reduce((a,s)=>a+s.guarantee,0), got=sp.reduce((a,s)=>a+(delivered(s)||0),0), proj=sp.reduce((a,s)=>a+projection(s).proj,0);
      return `<b>${esc(brandHit)}</b> — ${sp.length} flight${sp.length>1?'s':''} across ${[...new Set(sp.map(s=>show(s.showId).name))].join(', ')}. ${K(got)} delivered so far against ${K(g)} guaranteed, projecting <b>${K(proj)}</b> = ${pctOf(proj,g)}%.`+goChip('Open Campaign Portal →','portal');
    }
    return `I can answer on delivery pacing, projections, the day 10–14 make-good call, copy status and guarantee tuning. Try "Will Kalshi on Sage Steele deliver?" or "What needs a make good?"`;
  }

  /* ═══════════════════════════ SHARED PIECES ═══════════════════════════ */
  const toneVar = t => ({green:'var(--green-text)',red:'var(--red-text)',orange:'var(--orange-text)',blue:'var(--blue-text)',purple:'var(--purple-text)',grey:'var(--text-tertiary)'}[t]||'var(--text-secondary)');

  // The four checks from the call: did it go live · weekly pace · day 10-14 call · 30-day final
  function clockBar(s){
    const i=PHASE_STEP[phase(s)]||0;
    return `<div style="min-width:172px;flex-shrink:0">
      <div class="clock">${PHASES.map((p,n)=>`<div class="clock__seg ${n<i?'done':n===i?'now':''}"></div>`).join('')}</div>
      <div class="clock__labels">${PHASES.map((p,n)=>`<span class="${n===i?'on':''}">${p.l}</span>`).join('')}</div></div>`;
  }

  // Delivered-so-far + where the curve says it lands, against the guarantee and the 90% line
  function projBar(s){
    const pr=projection(s); if(!pr) return '<span class="muted">—</span>';
    const max=Math.max(s.guarantee, pr.proj)*1.06;
    const w=v=>Math.min(100, v/max*100);
    const tone=verdict(s).tone;
    return `<div style="position:relative;height:10px;border-radius:5px;background:var(--secondary-lite);overflow:visible">
      <div style="position:absolute;inset:0 auto 0 0;width:${w(pr.proj)}%;border-radius:5px;background:${toneVar(tone)};opacity:.28"></div>
      <div style="position:absolute;inset:0 auto 0 0;width:${w(pr.got)}%;border-radius:5px;background:${toneVar(tone)}"></div>
      <div title="IAB full delivery · 90%" style="position:absolute;top:-3px;bottom:-3px;left:${w(s.guarantee*IAB_FULL)}%;width:2px;background:var(--green-text)"></div>
      <div title="Guarantee ${K(s.guarantee)}" style="position:absolute;top:-3px;bottom:-3px;left:${w(s.guarantee)}%;width:2px;background:var(--text-tertiary)"></div>
    </div>`;
  }

  // Deterministic jitter so the observed line has real texture instead of sitting on the model
  const jit=(id,d)=>{ let h=0; const k=id+':'+d; for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))|0; return ((h%1000)/1000-0.5)*0.09; };
  function observations(s){
    const pr=projection(s); if(!pr) return [];
    const sh=show(s.showId); const out=[{d:0,v:0}];
    for(let d=1; d<=pr.day && d<=30; d++){
      const base=curveAt(sh.curve,d)*pr.proj;
      out.push({ d, v: Math.max(0, Math.round(base*(1+(d===pr.day?0:jit(s.id,d))))) });
    }
    if(out[out.length-1]) out[out.length-1].v=pr.got;
    return out;
  }

  /* The chart that makes the call legible: this show's learned shape, where the
     episode actually is, the projection, the guarantee and the 90% IAB line. */
  function curveChart(s,{w=560,h=230}={}){
    const pr=projection(s); if(!pr) return '';
    const sh=show(s.showId), padL=44, padR=54, padT=14, padB=28;
    const max=Math.max(s.guarantee, pr.proj)*1.14;
    const X=d=>padL+(w-padL-padR)*(d/30);
    const Y=v=>h-padB-(h-padT-padB)*(v/max);
    const model=[]; for(let d=0;d<=30;d++) model.push([X(d),Y(curveAt(sh.curve,d)*pr.proj)]);
    const modelPath='M'+model.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
    const obs=observations(s);
    const obsPath='M'+obs.map(o=>X(o.d).toFixed(1)+' '+Y(o.v).toFixed(1)).join(' L');
    const gy=Y(s.guarantee), iy=Y(s.guarantee*IAB_FULL), tone=toneVar(verdict(s).tone);
    const grid=[0,.25,.5,.75,1].map(f=>`<line x1="${padL}" x2="${w-padR}" y1="${Y(max*f)}" y2="${Y(max*f)}" stroke="var(--border-light)" stroke-width="1"/><text x="${padL-6}" y="${Y(max*f)+3.5}" text-anchor="end" font-size="9.5" font-weight="600" fill="var(--text-tertiary)">${K(Math.round(max*f))}</text>`).join('');
    const ticks=[0,7,14,21,30].map(d=>`<text x="${X(d)}" y="${h-9}" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--text-tertiary)">${d?'d'+d:'pub'}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Projected delivery curve">
      ${grid}${ticks}
      <line x1="${padL}" x2="${w-padR}" y1="${gy}" y2="${gy}" stroke="var(--text-tertiary)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${w-padR+5}" y="${gy+3.5}" font-size="9.5" font-weight="800" fill="var(--text-secondary)">GUAR</text>
      <line x1="${padL}" x2="${w-padR}" y1="${iy}" y2="${iy}" stroke="var(--green-text)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${w-padR+5}" y="${iy+3.5}" font-size="9.5" font-weight="800" fill="var(--green-text)">90%</text>
      <path d="${modelPath}" fill="none" stroke="var(--text-tertiary)" stroke-width="2" stroke-dasharray="4 4" opacity=".85"/>
      <path d="${obsPath}" fill="none" stroke="${tone}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      ${obs.filter(o=>o.d%2===0&&o.d>0).map(o=>`<circle cx="${X(o.d)}" cy="${Y(o.v)}" r="2.6" fill="${tone}"><title>Day ${o.d}: ${K(o.v)}</title></circle>`).join('')}
      <line x1="${X(pr.day)}" x2="${X(pr.day)}" y1="${padT}" y2="${h-padB}" stroke="${tone}" stroke-width="1" opacity=".35"/>
      <circle cx="${X(pr.day)}" cy="${Y(pr.got)}" r="4.5" fill="${tone}" stroke="#fff" stroke-width="2"><title>Today · day ${pr.day}: ${K(pr.got)}</title></circle>
      <circle cx="${X(30)}" cy="${Y(pr.proj)}" r="4.5" fill="none" stroke="${tone}" stroke-width="2.4"><title>Projected day 30: ${K(pr.proj)}</title></circle>
      <text x="${X(30)}" y="${Y(pr.proj)-10}" text-anchor="end" font-size="11" font-weight="800" fill="${tone}">${K(pr.proj)}</text>
    </svg>
    <div class="curvekey">
      <span><i style="border-color:${tone}"></i>Actual to day ${pr.day}</span>
      <span><i style="border-color:var(--text-tertiary);border-top-style:dashed"></i>${esc(sh.name)}'s learned curve (${sh.samples} reads)</span>
      <span><i style="border-color:var(--green-text);border-top-style:dashed"></i>IAB full delivery · 90%</span>
    </div>`;
  }

  function sparkline(curveKey,{w=104,h=30}={}){
    const pts=[]; for(let d=0;d<=30;d++) pts.push([2+(w-4)*(d/30), h-2-(h-6)*curveAt(curveKey,d)]);
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><path d="M${pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')}" fill="none" stroke="var(--c2)" stroke-width="2" stroke-linecap="round"/></svg>`;
  }
  const curveNote = sh => `${Math.round(curveAt(sh.curve,2)*100)}% of the final number lands inside 48h`;

  /* ═══════════════════════════ VIEW: COMMAND CENTER ═══════════════════════════ */
  RENDER.overview = () => {
    const aired=SPOTS.filter(s=>s.status==='aired');
    const deciding=SPOTS.filter(s=>phase(s)==='decide');
    const mgOpen=MAKEGOODS.filter(m=>m.status!=='scheduled');
    const live=SPOTS.filter(s=>projection(s));
    const g=live.reduce((a,s)=>a+s.guarantee,0), proj=live.reduce((a,s)=>a+projection(s).proj,0);
    const needCopy=SPOTS.filter(s=>['needs_copy','needs_cta'].includes(s.copyStatus));
    const adv=guaranteeAdvice(), f=fillStats();
    const blocked=SPOTS.filter(s=>s.dlState==='requested');

    document.getElementById('view-overview').innerHTML = `
    <div class="inner">
      <div class="pagebar">
        <div class="head"><h1>Command Center <span class="live-dot"><i></i>Airtable + Booster</span></h1>
        <p>Everything the agent is watching, and what it needs from you. Delivery is judged against the IAB line — 90% of the guarantee is full delivery, anything over is bonus.</p></div>
        <div class="pagebar__right"><span class="tag tag--grey">${dayName(TODAY)} ${fmtDate(TODAY)}</span></div>
      </div>
      ${chatCard()}
      <div class="tiles">
        <div class="tile"><div class="tile__label">Airing today</div><div class="tile__val">${aired.length}</div><div class="tile__delta"><span class="muted">daily check pending</span></div></div>
        <div class="tile"><div class="tile__label">In the decision window</div><div class="tile__val" style="color:${deciding.length?'var(--orange-text)':'var(--text-primary)'}">${deciding.length}</div><div class="tile__delta"><span class="muted">day 10–14 · call it now</span></div></div>
        <div class="tile"><div class="tile__label">Make goods to sign off</div><div class="tile__val" style="color:${mgOpen.length?'var(--red-text)':'var(--text-primary)'}">${mgOpen.length}</div><div class="tile__delta"><span class="muted">${mgOpen.length?'drafted and waiting':'all clear'}</span></div></div>
        <div class="tile"><div class="tile__label">Projected vs guaranteed</div><div class="tile__val">${pctOf(proj,g)}%</div><div class="tile__delta ${proj>=g?'up':'down'}">${K(proj)} of ${K(g)} across ${live.length} flights</div></div>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="card__head"><div><div class="card__title">What needs you today</div><div class="card__sub">Pulled from the four checks the agent runs — live, weekly, day 10–14, and the 30-day final.</div></div></div>
        <div class="card__pad" style="display:flex;flex-direction:column;gap:11px">
          ${aired.length?actionRow('Daily check', `<b>${aired.length} spot${aired.length!==1?'s are':' is'} due to air today</b> on ${[...new Set(aired.map(s=>show(s.showId).name))].join(', ')}. The agent scans each channel for the episode, finds the read and grabs the link + timestamp.`,'delivery','Run the check'):''}
          ${deciding.length?(()=>{ const shorts=deciding.filter(s=>verdict(s).k==='short'), fresh=shorts.filter(s=>!mgForSpot(s.id));
            return actionRow('Decision window', `<b>${deciding.length} flight${deciding.length!==1?'s':''} hit day 10–14.</b> `+(shorts.length
              ? `${shorts.length} project under the 90% line — ${shorts.map(s=>esc(s.brand)).join(', ')}.`+(fresh.length?` ${fresh.length} still ${fresh.length>1?'need':'needs'} a make good raised.`:` Make goods already in flight.`)
              : `All of them clear the 90% line, nothing to raise.`),'delivery','Review'); })():''}
          ${mgOpen.length?actionRow('Make goods', `<b>${mgOpen.length} make good${mgOpen.length>1?'s':''}</b> drafted and waiting — ${mgOpen.map(m=>esc(spot(m.spotId).brand)+' / '+esc(show(spot(m.spotId).showId).name)).join(', ')}.`,'makegoods','Approve &amp; send'):''}
          ${blocked.length?actionRow('Blocked', `<b>${blocked.map(s=>esc(show(s.showId).name)).join(', ')}</b> — download numbers requested from the creator, not back yet. Can't close the delivery number until they land.`,'delivery','Chase'):''}
          ${needCopy.length?actionRow('Copy', `<b>${needCopy.length} booked spots</b> still need ad copy or a CTA before they air.`,'copy','Open copy'):''}
        </div>
      </div>

      <div class="grid" style="grid-template-columns:1.35fr 1fr;margin-top:16px">
        <div class="card">
          <div class="card__head"><div><div class="card__title">What the agent has learned</div><div class="card__sub">Patterns it can only see because it watches every read across every show.</div></div></div>
          <div class="card__pad" style="display:flex;flex-direction:column;gap:11px">
            ${adv.length?adv.slice(0,2).map(a=>`<div style="display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--orange-bg);border-radius:12px;background:rgba(255,237,213,.35)">
              <div style="width:30px;height:30px;border-radius:8px;background:var(--orange-bg);display:grid;place-items:center;flex-shrink:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--orange-text)" stroke-width="2.2"><path d="M3 12a9 9 0 1015-6.7L21 8"/><path d="M21 3v5h-5"/></svg></div>
              <div style="flex:1"><b style="font-size:13px">${esc(show(a.showId).name)} has needed a make good on ${a.shortCount} of its last ${a.flights} flights</b>
              <div class="muted" style="font-size:12.5px;margin-top:3px">Reads there typically land around ${K(a.typical)}. The ${K(a.current)} guarantee is set above what the show actually does — drop it to <b>${K(a.suggest)}</b> and the make goods stop.</div></div>
              <button class="btn btn--ghost btn--sm" onclick="applyGuarantee('${a.showId}',${a.suggest})">Apply</button></div>`).join(''):`<div class="empty" style="padding:22px">No guarantee is running hot right now.</div>`}
            <div style="display:flex;gap:12px;align-items:center;padding:13px 14px;border:1px solid var(--border-light);border-radius:12px">
              <div style="width:30px;height:30px;border-radius:8px;background:var(--blue-bg);display:grid;place-items:center;flex-shrink:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--blue-text)" stroke-width="2.2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg></div>
              <div style="flex:1"><b style="font-size:13px">Paid fill rate is ${f.rate}%</b><div class="muted" style="font-size:12.5px;margin-top:3px">${f.paid} spots sold against ${f.free} given away as make goods or bonus. That split is what tells you which guarantees are priced wrong.</div></div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card__head"><div class="card__title">How each show builds views</div></div>
          <div class="card__pad" style="display:flex;flex-direction:column;gap:9px">
            ${SHOWS.slice(0,5).map(sh=>`<div style="display:flex;align-items:center;gap:11px">
              <div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sh.name)}</div>
              <div class="muted" style="font-size:11px">${curveNote(sh)}</div></div>
              ${sparkline(sh.curve)}</div>`).join('')}
            <button class="btn btn--ghost btn--sm" style="justify-content:center;margin-top:4px" onclick="go('shows')">Show setup &amp; inventory →</button>
          </div>
        </div>
      </div>
      <div class="footnote">Acme Network Ops · MVP · Delivery Agent + Command Center + Campaign Portal · reads Airtable, respects Booster's inventory caps · powered by SpotsNow</div>
    </div>`;
    renderChatMsgs();
  };
  const actionRow = (by,txt,view,cta) => `
    <div style="display:flex;gap:13px;align-items:center;padding:13px 15px;border:1px solid var(--border-light);border-radius:12px">
      <div style="width:8px;height:8px;border-radius:50%;background:#3FB87C;flex-shrink:0"></div>
      <div style="flex:1"><div style="font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-tertiary)">${by}</div>
      <div style="font-size:13px;margin-top:2px">${txt}</div></div>
      <button class="btn btn--ghost btn--sm" style="flex-shrink:0" onclick="go('${view}')">${cta}</button>
    </div>`;
  function applyGuarantee(showId,v){ show(showId).guarantee=v; rerender(); toast(`${show(showId).name} guarantee set to ${K(v)}. Written back to Booster and Airtable.`); }

  /* ═══════════════════════════ VIEW: DELIVERY ═══════════════════════════ */
  let delTab='attention', delFilter='all', agentRunning=false;
  RENDER.delivery = () => {
    const A=deliveryAttention(), aired=A.aired, noEp=A.noEp;
    const blockedIds=new Set(SPOTS.filter(s=>s.dlState==='requested').map(s=>s.id));
    const deciding=SPOTS.filter(s=>phase(s)==='decide'&&!blockedIds.has(s.id));
    const weekly=SPOTS.filter(s=>phase(s)==='weekly');
    const settling=SPOTS.filter(s=>phase(s)==='settling');
    const finals=SPOTS.filter(s=>phase(s)==='final');
    const blocked=A.blocked, shortNow=A.shortNow, attCount=A.count;

    const attention=`
      ${aired.length?`<div class="card" style="margin-bottom:18px"><div class="card__pad" style="display:flex;align-items:center;gap:14px">
        <div style="width:38px;height:38px;border-radius:10px;background:var(--blue-bg);display:grid;place-items:center;flex-shrink:0"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--blue-text)" stroke-width="2"><path d="M12 2a3 3 0 013 3v6a3 3 0 01-6 0V5a3 3 0 013-3z"/><path d="M19 10a7 7 0 01-14 0M12 17v4"/></svg></div>
        <div style="flex:1"><b style="font-size:13.5px">Daily check · ${aired.length} spot${aired.length!==1?'s':''} due to air today</b><div class="muted" style="font-size:12.5px">The agent scans ${[...new Set(aired.map(s=>show(s.showId).channel))].join(', ')} for a new episode, finds the read and pulls the link + timestamp.</div></div>
        <button class="btn btn--primary btn--sm" id="runBtn" onclick="runAgent()">▶ Run check</button></div>
        <div id="scanPanel" style="padding:0 20px 6px"></div></div>`:'<div id="scanPanel"></div>'}

      ${section('No episode up yet', noEp.length, 'red',
        `The agent checked and the show hasn't posted. It rechecks every 24h — nudge the show if the window is closing.`,
        noEp.map(s=>`<div style="display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--red-bg);border-radius:11px;background:var(--white)">
          <div style="flex:1"><b style="font-size:13px">${esc(s.brand)} on ${esc(show(s.showId).name)}</b>
          <div class="muted" style="font-size:12px;margin-top:2px">Booked for ${dayName(s.published)} ${fmtDate(s.published)} · scanned ${esc(show(s.showId).channel)}, no new episode found.</div></div>
          <button class="btn btn--primary btn--sm" onclick="nudgeEpisode('${s.id}')">Nudge the show</button></div>`).join(''))}

      ${section('Decision window · day 10–14', deciding.length, deciding.length&&shortNow.length?'red':'orange',
        `This is where the make-good call gets made — not at day 30. Raw numbers lie early; the projection is what matters.`,
        deciding.map(s=>bigRow(s)).join(''))}

      ${section('Waiting on download numbers', blocked.length, 'purple',
        `${blocked.length?esc(show(blocked[0].showId).name)+' hosts elsewhere — audio downloads have to be requested from the creator before the number closes.':''}`,
        blocked.map(s=>bigRow(s)).join(''))}

      ${section('Live and pacing', weekly.length, 'blue',
        `Weekly check. Nothing to do unless the projection drops under 90%.`,
        weekly.map(s=>bigRow(s)).join(''))}

      ${section('Riding to the 30-day number', settling.length, 'grey',
        `The call is already made on these — the agent just keeps checking until day 30 locks the final number.`,
        settling.map(s=>bigRow(s)).join(''))}

      ${section('Closed out · 30-day final', finals.length, 'green',
        `Final numbers locked. Delivery reports ready to send.`,
        finals.map(s=>bigRow(s)).join(''))}

      ${attCount===0?`<div class="card"><div class="empty">✨ All clear — every live flight projects over the 90% line.</div></div>`:''}`;

    let rows=SPOTS.slice();
    if(delFilter!=='all') rows=rows.filter(s=>s.showId===delFilter||s.brand===delFilter);
    const ord={aired:0,found:1,verified:2,scheduled:3};
    rows.sort((a,b)=>(ord[a.status]-ord[b.status])||(liveDays(b)-liveDays(a)));
    const brands=[...new Set(SPOTS.map(s=>s.brand))];
    const all=`
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px">
        <button class="tag ${delFilter==='all'?'tag--blue':'tag--grey'}" onclick="delFilter='all';RENDER.delivery()">All</button>
        ${SHOWS.map(sh=>`<button class="tag ${delFilter===sh.id?'tag--blue':'tag--grey'}" onclick="delFilter='${sh.id}';RENDER.delivery()">${esc(sh.name)}</button>`).join('')}
        ${brands.map(b=>`<button class="tag ${delFilter===b?'tag--blue':'tag--grey'}" onclick="delFilter='${b}';RENDER.delivery()">${esc(b)}</button>`).join('')}
      </div>
      <div class="card"><table>
        <thead><tr><th>Campaign</th><th>Published</th><th>Day</th><th class="num">Guarantee</th><th class="num">Delivered</th><th class="num">Projected</th><th style="width:170px">Against guarantee</th><th></th></tr></thead>
        <tbody>${rows.map(s=>{ const pr=projection(s), v=verdict(s);
          return `<tr style="${v.k==='short'?'background:rgba(254,228,226,.28)':''}">
            <td style="cursor:pointer" onclick="openSpot('${s.id}')"><b>${esc(s.brand)}</b>${s.kind!=='paid'?` <span class="tag tag--purple">${esc(s.kind)}</span>`:''}<div class="muted" style="font-size:11.5px">${esc(show(s.showId).name)}</div></td>
            <td>${fmtDate(s.published)}</td>
            <td>${pr?`<b>${pr.day}</b><span class="muted">/30</span>`:'<span class="muted">—</span>'}</td>
            <td class="num">${s.guarantee?K(s.guarantee):'<span class="muted">bonus</span>'}</td>
            <td class="num">${delivered(s)!=null?K(delivered(s)):'<span class="muted">—</span>'}</td>
            <td class="num">${pr?`<b>${K(pr.proj)}</b>`:'<span class="muted">—</span>'}</td>
            <td>${pr?`<div style="display:flex;align-items:center;gap:9px"><div style="flex:1">${projBar(s)}</div><b style="font-size:12px;min-width:38px;color:${toneVar(v.tone)}">${Math.round(pr.ratio*100)}%</b></div>`:`<span class="tag tag--grey">${s.status==='scheduled'?'booked':'awaiting'}</span>`}</td>
            <td class="right"><button class="btn btn--ghost btn--sm" onclick="openSpot('${s.id}')">Open</button></td></tr>`; }).join('')}</tbody></table></div>`;

    document.getElementById('view-delivery').innerHTML=`
    <div class="inner">
      <div class="pagebar">
        <div class="head"><h1>Delivery <span class="live-dot"><i></i>Agent watching ${SHOWS.length} shows</span></h1>
        <p>${delTab==='attention'?'The four checks, in order: did it go live, weekly pace, the day 10–14 make-good call, and the 30-day final.':'Every spot with its delivered number, its projection and where it lands against the guarantee.'}</p></div>
        <div class="pagebar__right"><div class="seg">
          <button class="${delTab==='attention'?'active':''}" onclick="delTab='attention';RENDER.delivery()">Needs attention${attCount?' · '+attCount:''}</button>
          <button class="${delTab==='all'?'active':''}" onclick="delTab='all';RENDER.delivery()">All spots</button></div></div>
      </div>
      ${delTab==='attention'?attention:all}
      <div class="footnote">Projections come from each show's own view curve, refit every time a read is verified. 90% of guarantee is full delivery under IAB — a make good only gets raised below that line.</div>
    </div>`;
  };
  const section=(label,count,tone,sub,rowsHtml)=>count?`<div style="margin-bottom:20px">
    <div style="display:flex;align-items:center;gap:8px;margin:0 2px 4px"><span style="font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary)">${label}</span><span class="tag tag--${tone}">${count}</span></div>
    ${sub?`<div class="muted" style="font-size:12px;margin:0 2px 10px">${sub}</div>`:''}
    <div style="display:flex;flex-direction:column;gap:10px">${rowsHtml}</div></div>`:'';

  // One live flight, with everything you need to make the call visible at a glance
  function bigRow(s){
    const pr=projection(s), v=verdict(s), sh=show(s.showId);
    const thumb=s.yt?`<img class="thumb" src="https://img.youtube.com/vi/${s.yt}/mqdefault.jpg" onerror="this.style.display='none'">`:`<div class="thumb" style="display:grid;place-items:center;color:var(--text-tertiary);font-size:11px">${sh.simulcast?'YT+RSS':'YT'}</div>`;
    const m=mgForSpot(s.id);
    let action;
    if(v.k==='short'&&!m) action=`<button class="btn btn--primary btn--sm" onclick="createMakegood('${s.id}')">Set up make good</button>`;
    else if(m) action=`<button class="btn btn--ghost btn--sm" onclick="go('makegoods');setTimeout(()=>openMg('${m.id}'),60)">Make good · ${esc(m.status)}</button>`;
    else if(v.k==='blocked') action=`<button class="btn btn--primary btn--sm" onclick="chaseDownloads('${s.id}')">Chase creator</button>`;
    else if(v.k==='full'&&pr.final) action=`<button class="btn btn--green btn--sm" onclick="sendReport('${s.id}')">Send report</button>`;
    else action=`<button class="btn btn--ghost btn--sm" onclick="openSpot('${s.id}')">Open</button>`;
    const naive=pr&&Math.abs(pr.rawRatio-pr.ratio)>0.12;
    return `<div style="display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid ${v.k==='short'?'var(--red-bg)':'var(--border-light)'};border-radius:12px;background:var(--white)">
      ${thumb}
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:13.5px">${esc(s.brand)} on ${esc(sh.name)}</b>
          <span class="tag tag--${v.tone}"><i></i>${esc(v.label)}</span>
          ${pr?`<span class="tag tag--grey">Day ${pr.day} of 30</span>`:''}</div>
        <div class="muted" style="font-size:12.5px;margin-top:4px">
          ${pr?`${K(pr.got)} delivered · projecting <b style="color:${toneVar(v.tone)}">${K(pr.proj)}</b> against a ${K(s.guarantee)} guarantee${v.k==='short'?` — <b>${K(shortfall(s))} short</b>`:v.soft?` <span class="muted">· indicative, firms up at day ${DECIDE_FROM}</span>`:''}`:'Awaiting the episode.'}
        </div>
        ${naive?`<div style="font-size:11.5px;margin-top:5px;color:var(--text-secondary);background:var(--secondary-lite);border-radius:7px;padding:5px 9px;display:inline-block">Reads <b>${Math.round(pr.rawRatio*100)}%</b> raw, but ${esc(sh.name)} only has ${Math.round(pr.curvePct*100)}% of views in by day ${pr.day} — ${v.k==='short'?'it still lands short':'it lands fine'}.</div>`:''}
        ${pr?`<div style="margin-top:8px;max-width:340px">${projBar(s)}</div>`:''}
      </div>
      ${clockBar(s)}
      <div style="flex-shrink:0;display:flex;flex-direction:column;gap:6px">${action}
        ${s.yt?`<button class="btn btn--ghost btn--sm" onclick="playClip('${s.yt}',${s.ts})">▶ Hear it</button>`:''}</div>
    </div>`;
  }
  function nudgeEpisode(id){ const s=spot(id); toast(`Nudged ${show(s.showId).host} from adops@ — flagged in #adops-alerts. The agent keeps checking every 24h.`); }
  function chaseDownloads(id){ const s=spot(id); s.dlState='received'; s.downloads=Math.round(s.views*0.24); rerender(); refreshBadges(); toast(`Requested downloads from ${show(s.showId).host} — ${K(s.downloads)} came back and were added to the delivery number.`); }
  function sendReport(id){ const s=spot(id); toast(`Delivery report for ${s.brand} on ${show(s.showId).name} sent to the brand and copied to adops@. Logged in Airtable.`); }

  /* ── Spot drawer: the curve, the call, and the actual read ── */
  function openSpot(id){
    const s=spot(id), sh=show(s.showId), pr=projection(s), v=verdict(s), m=mgForSpot(s.id);
    openDrawer(`<div class="drawer__head"><div>
        <span class="tag tag--${v.tone}"><i></i>${esc(v.label)}</span>
        <h2 style="font-size:18px;font-weight:800;margin-top:8px">${esc(s.brand)} · ${esc(sh.name)}</h2>
        <div class="muted" style="font-size:12px">Published ${fmtDate(s.published)} · ${s.length} host-read · ${s.kind==='paid'?'paid spot':esc(s.kind)}</div>
      </div><button class="x" onclick="closeOverlays()">✕</button></div>
    <div class="drawer__body">
      ${pr?`<div class="curvewrap">${curveChart(s)}</div>
      <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px">
        ${kpi('Delivered so far',K(pr.got),`day ${pr.day} of 30`)}
        ${kpi('Projected final',K(pr.proj),`${Math.round(pr.ratio*100)}% of guarantee`,toneVar(v.tone))}
        ${kpi('Guarantee',K(s.guarantee),`90% line = ${K(Math.round(s.guarantee*IAB_FULL))}`)}
      </div>
      <div style="margin-top:14px;padding:13px 15px;border:1px solid var(--border-light);border-radius:12px;font-size:12.5px;line-height:1.6">
        <b>How the agent read it.</b> ${esc(sh.name)} publishes ${sh.publishDays.join('/')}, and across ${sh.samples} verified reads ${Math.round(curveAt(sh.curve,2)*100)}% of a video's views land inside 48 hours. At day ${pr.day} this episode should be ${Math.round(pr.curvePct*100)}% of the way to its final number, and it has ${K(pr.got)} — so the final lands near <b>${K(pr.proj)}</b>.
        ${v.k==='short'?` That's <b style="color:var(--red-text)">${K(shortfall(s))} under</b> the 90% IAB line, so a make good is warranted.`
          :v.k==='bonus'?` That clears the guarantee outright — the overage is bonus.`
          :v.k==='early'?` Only ${Math.round(pr.curvePct*100)}% of the curve is in, so there is nothing worth calling yet — the agent decides by day ${DECIDE_FROM}.`

        ${sh.simulcast?`<br><br><b>Simulcast.</b> ${K(s.views||0)} YouTube views ${s.dlState==='requested'?'· audio downloads requested from the creator, not back yet':'+ '+K(s.downloads||0)+' audio downloads from the host platform'}.`:''}

        :m?`<button class="btn btn--primary" onclick="closeOverlays();go('makegoods');setTimeout(()=>openMg('${m.id}'),60)">Open make good</button>`
        :pr&&pr.final?`<button class="btn btn--primary" onclick="closeOverlays();sendReport('${s.id}')">Send delivery report</button>`:''}

  }
  const kpi=(l,v,s,c)=>`<div style="border:1px solid var(--border-light);border-radius:11px;padding:12px 14px"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-tertiary)">${l}</div><div style="font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:4px;${c?`color:${c}`:''}">${v}</div><div class="muted" style="font-size:11px">${s}</div></div>`;

  /* ── Daily air check ── */
  async function runAgent(){
    if(agentRunning) return; agentRunning=true;
    const btn=document.getElementById('runBtn'); if(btn){ btn.textContent='Scanning…'; btn.disabled=true; }
    const panel=document.getElementById('scanPanel');
    if(panel) panel.innerHTML=`<div class="card" style="margin-bottom:16px"><div class="card__pad">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:8px"><span id="scanLabel">Scanning channels for new episodes…</span><span id="scanPct" class="muted">0%</span></div>
      <div class="scanbar"><div class="scanbar__fill" id="scanFill"></div></div></div></div>`;
    const aired=SPOTS.filter(s=>s.status==='aired');
    const finds={ s11:{yt:'dQw4w9WgXcQ',ts:455,epLen:5380,views:9200,downloads:1400,copy:['Named the brand','Read promo code KALSHI','Free-trial CTA']},
                  s12:{yt:'ScMzIvxBSi4',ts:612,epLen:6100,views:31000,downloads:0,copy:['Named the brand','Mental-health disclaimer','URL CTA']},
                  s13:{miss:true} };
    const steps=['Scanning channels for new episodes…','The Rubin Report posted 3h ago — pulling transcript…','Matching the ad segment to the Kalshi copy…','Warren Smith posted 6h ago — reading views…','Nate has no new episode yet — flagging…','Writing links + timestamps back to Airtable…'];
    for(let i=0;i<steps.length;i++){ const l=document.getElementById('scanLabel'); if(l) l.textContent=steps[i];
      const p=Math.round((i+1)/steps.length*100); const f=document.getElementById('scanFill'); if(f) f.style.width=p+'%';
      const pc=document.getElementById('scanPct'); if(pc) pc.textContent=p+'%'; await sleep(600); }
    try{ const r=await fetch('/api/transcript',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:'https://www.youtube.com/watch?v='+finds.s11.yt})});
      if(r.ok){ const j=await r.json(); const seg=findAd(j,'Kalshi'); if(seg){ finds.s11.ts=Math.round(seg.start); finds.s11.copy=['Named the brand','Verified in transcript','Free-trial CTA']; } }
    }catch(e){ /* offline demo → seeded */ }
    aired.forEach(s=>{ const f=finds[s.id]; if(!f) return; if(f.miss){ s.missed=true; return; } Object.assign(s,f,{status:'verified'}); });
    agentRunning=false; rerender(); refreshBadges();
    toast('Air check done — 2 reads found and timestamped, 1 show has no episode up yet.');
  }
  function findAd(json,brand){ const arr=json.transcript||json.segments||json.data||[]; const b=brand.toLowerCase();
    for(const seg of arr){ const t=(seg.text||'').toLowerCase(); if(t.includes(b)) return {start:seg.start||seg.offset||0}; } return null; }
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  function playClip(yt,ts){ openModal(`<div class="drawer__head"><h2 style="font-size:16px;font-weight:700">Ad read · jumps to ${mmss(ts)}</h2><button class="x" onclick="closeOverlays()">✕</button></div>
    <div style="padding:0"><div class="reel-stage"><iframe src="https://www.youtube.com/embed/${yt}?start=${ts}&autoplay=1" allow="autoplay" allowfullscreen></iframe></div></div>`); }

        <div class="card__pad" style="display:flex;flex-direction:column;gap:10px">${need.map(s=>`<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--red-bg);border-radius:11px">

    </div>`;
  };

      <div class="card__head"><div>

  function createMakegood(spotId){
    if(mgForSpot(spotId)) { go('makegoods'); return; }
    const s=spot(spotId), sh=show(s.showId);
    const av=nextEpisodes(s.showId,4).find(e=>e.open>0);
    MAKEGOODS.push({ id:'mg'+(++MG_SEQ), spotId, date:av?av.date:null, status:'proposed',
      showOk: sh.mgPolicy==='auto'?true:null, brandOk:null, showVia: sh.mgPolicy==='auto'?'auto':null, brandVia:null });

  function markCopy(id){ const s=spot(id); s.copyStatus='sent'; s.copySent=TODAY; s.copySeen=null; rerender(); refreshBadges();

    n.forEach(s=>{ s.copyStatus='sent'; s.copySent=TODAY; s.copySeen=null; }); rerender(); refreshBadges();
    toast(`Copy sent for ${n.length} spots. Read receipts show up here as the shows open them.`); }
  function nudgeShow(id){ const s=spot(id); s.copyStatus='seen'; s.copySeen=TODAY; rerender(); refreshBadges();
    toast(`Nudged ${show(s.showId).host} in the existing thread — opened it right after.`); }

  /* ═══════════════════════════ VIEW: CAMPAIGN PORTAL ═══════════════════════════ */
  let portalBrand='Kalshi';
  RENDER.portal = () => {
    const brands=[...new Set(SPOTS.filter(s=>projection(s)).map(s=>s.brand))];
    if(!brands.includes(portalBrand)) portalBrand=brands[0];
    const spots=SPOTS.filter(s=>s.brand===portalBrand&&projection(s));
    const g=spots.reduce((a,s)=>a+s.guarantee,0);
    const got=spots.reduce((a,s)=>a+(delivered(s)||0),0);
    const proj=spots.reduce((a,s)=>a+projection(s).proj,0);
    const yt=spots.reduce((a,s)=>a+(s.views||0),0), aud=spots.reduce((a,s)=>a+(s.downloads||0),0);
    const paid=spots.reduce((a,s)=>a+spotCost(s),0);          // make goods cost 0, so they pull the effective CPM down
    const cpm=got?(paid/(got/1000)):0;
    const bookedCpm=g?(paid/(g/1000)):0;
    const finals=spots.filter(s=>projection(s).final);
    const done=finals.length===spots.length&&spots.length>0;
    const bg=spots.find(s=>s.yt);
    const mgs=SPOTS.filter(s=>s.brand===portalBrand&&s.kind==='makegood');
    document.getElementById('view-portal').innerHTML=`
    <div class="inner">
      <div class="pagebar">
        <div class="head"><h1>Campaign Portal <span class="live-dot"><i></i>Live link</span></h1>
        <p>What the advertiser sees. Every read embedded at its exact timestamp so they can hear it, with delivery measured against the 90% IAB line — this is the delivery report, not a spreadsheet export.</p></div>
        <div class="pagebar__right">
          <select class="field" style="width:auto" onchange="portalBrand=this.value;RENDER.portal()">${brands.map(b=>`<option ${b===portalBrand?'selected':''}>${esc(b)}</option>`).join('')}</select>
          <button class="btn btn--ghost btn--sm" onclick="toast('Copied acme.live/${portalBrand.toLowerCase()}-aug — read-only, updates as spots land.')">🔗 Copy link</button>
          <button class="btn btn--primary btn--sm" onclick="toast('Delivery report sent to ${esc(portalBrand)} and copied to adops@.')">Send report</button></div>
      </div>
      <div class="portal-hero" style="position:relative;overflow:hidden">
        ${bg?`<iframe title="ad playing" style="position:absolute;inset:0;width:100%;height:100%;border:0;opacity:.22;pointer-events:none" src="https://www.youtube.com/embed/${bg.yt}?start=${bg.ts}&autoplay=1&mute=1&controls=0&loop=1&playlist=${bg.yt}&modestbranding=1&playsinline=1"></iframe><div style="position:absolute;inset:0;background:linear-gradient(120deg,rgba(23,33,43,.92),rgba(38,51,63,.78))"></div>`:''}
        <div style="position:relative;z-index:1">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <div class="brand-chip" style="background:${brandColor[portalBrand]||'#3B82F6'}">${esc(portalBrand[0])}</div>
          <div><div style="font-size:12px;opacity:.7;font-weight:600;letter-spacing:.04em">DELIVERY REPORT · AUGUST 2026</div><h2>${esc(portalBrand)} on Acme Network</h2></div>
          <div style="margin-left:auto;text-align:right"><div style="font-size:32px;font-weight:800">${pctOf(proj,g)}%</div><div style="font-size:12px;opacity:.7">${done?'of guaranteed impressions':'projected against guarantee'}</div></div>
        </div>
        <div style="display:flex;gap:26px;margin-top:22px;flex-wrap:wrap">
          ${portalMini('Delivered so far',K(got))}
          ${portalMini('Projected final',K(proj))}
          ${portalMini('Guaranteed',K(g))}
          ${portalMini('Effective CPM','$'+cpm.toFixed(2))}
          ${portalMini('Booked CPM','$'+bookedCpm.toFixed(2))}
          ${portalMini('YouTube views',K(yt))}
          ${portalMini('Audio downloads',K(aud))}
        </div>
        ${proj>=g?`<div style="margin-top:20px;padding:11px 14px;border-radius:10px;background:rgba(214,241,224,.16);border:1px solid rgba(214,241,224,.3);font-size:12.5px;display:flex;align-items:center;gap:9px">
          <span style="font-size:15px">✓</span><span><b>Full delivery.</b> ${K(proj-g)} impressions over the guarantee are bonus — no charge.</span></div>`
        :`<div style="margin-top:20px;padding:11px 14px;border-radius:10px;background:rgba(255,237,213,.16);border:1px solid rgba(255,237,213,.3);font-size:12.5px;display:flex;align-items:center;gap:9px">
          <span style="font-size:15px">↻</span><span><b>${mgs.length?`${mgs.length} additional read${mgs.length>1?'s':''} scheduled`:'Tracking under guarantee'}.</b> ${mgs.length?`Booked at no cost on ${mgs.map(m=>fmtDate(m.published)).join(', ')} to bring the flight back over.`:'We will add reads at no cost to close the gap.'}</span></div>`}
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="card__head"><div><div class="card__title">Every read, with the tape</div><div class="card__sub">Click a timestamp to hear the actual host read from that episode.</div></div>
        <span class="tag tag--grey">${spots.length} read${spots.length!==1?'s':''} · ${[...new Set(spots.map(s=>s.showId))].length} show${[...new Set(spots.map(s=>s.showId))].length!==1?'s':''}</span></div>
        <div class="card__pad" style="display:flex;flex-direction:column;gap:11px">
          ${spots.map(s=>{ const pr=projection(s), v=verdict(s);
            return `<div style="display:flex;align-items:center;gap:13px;padding:12px 14px;border:1px solid var(--border-light);border-radius:12px">
            ${s.yt?`<img src="https://img.youtube.com/vi/${s.yt}/mqdefault.jpg" style="width:84px;height:48px;border-radius:7px;object-fit:cover;flex-shrink:0" onerror="this.style.visibility='hidden'">`:''}
            <div style="flex:1;min-width:0"><b style="font-size:13px">${esc(show(s.showId).name)}</b>
              <div class="muted" style="font-size:12px;margin-top:2px">${fmtDate(s.published)} · ${s.length} host-read${show(s.showId).simulcast?` · ${K(s.views||0)} video + ${K(s.downloads||0)} audio`:''}</div>
              <div style="margin-top:6px;max-width:280px">${projBar(s)}</div></div>
            <div style="text-align:right;flex-shrink:0"><div style="font-size:16px;font-weight:800">${K(pr.got)}</div><div class="muted" style="font-size:11px">${pr.final?'final':'projecting '+K(pr.proj)}</div></div>
            ${s.yt?`<button class="btn btn--ghost btn--sm" onclick="playClip('${s.yt}',${s.ts})">▶ ${mmss(s.ts)}</button>`:''}</div>`; }).join('')}
          ${mgs.map(s=>`<div style="display:flex;align-items:center;gap:13px;padding:12px 14px;border:1px dashed var(--purple-bg);border-radius:12px;background:rgba(235,233,254,.3)">
            <div style="flex:1"><b style="font-size:13px">${esc(show(s.showId).name)}</b> <span class="tag tag--purple">Added at no cost</span>
            <div class="muted" style="font-size:12px;margin-top:2px">Scheduled ${dayName(s.published)} ${fmtDate(s.published)} · ${s.length} host-read</div></div></div>`).join('')}
        </div>
      </div>
      <div class="footnote">Read-only for the advertiser and updates itself as reads land — no export, no version to keep in sync.</div>
    </div>`;
  };
  const portalMini=(l,v)=>`<div><div style="font-size:24px;font-weight:800">${v}</div><div style="font-size:11.5px;opacity:.7;font-weight:600">${l}</div></div>`;

  /* ═══════════════════════════ VIEW: SHOWS & INVENTORY ═══════════════════════════ */
  RENDER.shows = () => {
    document.getElementById('view-shows').innerHTML=`
    <div class="inner">
      <div class="pagebar"><div class="head"><h1>Shows &amp; Inventory</h1>
        <p>The setup layer every projection reads from — how often a show publishes, how many ad positions exist per episode, where the audio numbers come from, and whether a make good needs the show's sign-off. Pulled from Booster where we can.</p></div>
        <div class="pagebar__right"><span class="tag tag--purple">${SHOWS.filter(s=>s.src==='booster').length} of ${SHOWS.length} synced from Booster</span></div>
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        ${SHOWS.map(sh=>{ const av=nextEpisodes(sh.id,3); const live=SPOTS.filter(s=>s.showId===sh.id&&projection(s));
        return `<div class="card"><div class="card__head"><div>
            <div class="card__title">${esc(sh.name)} <span class="srcpill ${sh.src==='booster'?'booster':''}">${sh.src}</span></div>
            <div class="card__sub">${esc(sh.host)} · ${esc(sh.category)} · ${esc(sh.channel)}</div></div>
            ${sparkline(sh.curve,{w:88,h:28})}</div>
          <div class="card__pad">
            <div class="kv"><span>Publishes</span><b>${sh.publishDays.join(' · ')}</b></div>
            <div class="kv"><span>Episodes a week</span><b>${sh.epsPerWeek}</b></div>
            <div class="kv"><span>Ad positions per episode</span><b>${sh.positionsPerEp} <span class="muted" style="font-weight:500">· cap from Booster</span></b></div>
            <div class="kv"><span>Impression guarantee</span><b>${K(sh.guarantee)} <span class="muted" style="font-weight:500">· 90% = ${K(Math.round(sh.guarantee*IAB_FULL))}</span></b></div>
            <div class="kv"><span>Delivery numbers</span><b>${sh.simulcast?`video + audio · ${sh.audioSrc==='hosting'?'auto from host':'request from creator'}`:'video only'}</b></div>
            <div class="kv"><span>Make goods</span><b>${sh.mgPolicy==='auto'?'auto-schedule':'ask the show first'}</b></div>
            <div style="margin-top:11px;padding:11px 12px;border-radius:10px;background:var(--page-bg);border:1px solid var(--border-light)">
              <div style="font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text-tertiary)">Learned view curve</div>
              <div style="font-size:12.5px;margin-top:4px;line-height:1.5">${curveNote(sh)}, and ${Math.round(curveAt(sh.curve,7)*100)}% by day 7. Fitted from <b>${sh.samples}</b> verified reads — the more we check, the tighter the projection gets.</div>
            </div>
            <div style="margin-top:11px"><div style="font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:6px">Next avails</div>
              <div style="display:flex;gap:6px;flex-wrap:wrap">${av.map(e=>`<span class="tag ${e.open?'tag--green':'tag--grey'}">${dayName(e.date)} ${fmtDate(e.date)} · ${e.open}/${e.cap}</span>`).join('')}</div></div>
            ${live.length?`<div class="muted" style="font-size:11.5px;margin-top:10px">${live.length} flight${live.length>1?'s':''} live · ${live.map(s=>esc(s.brand)).join(', ')}</div>`:''}
          </div></div>`; }).join('')}
      </div>
      <div class="footnote">Positions per episode and the guarantee live in Booster, so the agent never recommends a make-good slot that doesn't exist. Everything else is learned from what actually aired.</div>
    </div>`;
  };

  /* ═══════════════════════════ TOAST ═══════════════════════════ */
  let toastT;
  function toast(msg){ let el=document.getElementById('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:#fff;padding:12px 18px;border-radius:11px;font-size:13px;font-weight:600;z-index:80;box-shadow:var(--shadow-hover);opacity:0;transition:.25s;max-width:460px'; document.body.appendChild(el); }
    el.textContent=msg; requestAnimationFrame(()=>{el.style.opacity=1;el.style.transform='translateX(-50%) translateY(0)';}); clearTimeout(toastT); toastT=setTimeout(()=>{el.style.opacity=0;el.style.transform='translateX(-50%) translateY(20px)';},3400); }

  /* init */
  refreshBadges(); RENDER.overview();
  </script>
</body>
</html>
