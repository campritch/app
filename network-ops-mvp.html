<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acme Network Ops — MVP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317212B'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #17212B; --primary-hover: #282828;
      --accent: #17212B; --accent-hover: #282828; --accent-soft: #F3F4F6;
      --text-primary: #1D2027; --text-secondary: #707481; --text-tertiary: #9CA3AF;
      --border: #E4E6ED; --border-light: #EDEEF1; --border-strong: #C5CBD5;
      --white: #ffffff; --secondary-lite: #F3F4F6;
      --nav: #F3F4F6; --nav-current: #E4E6ED; --nav-hover: #EBEDF2;
      --page-bg: #F9FAFB;
      --green-text: #0E6832; --green-bg: #D6F1E0;
      --blue-text: #1435C0; --blue-bg: #C7E0FF;
      --orange-text: #C2410C; --orange-bg: #FFEDD5;
      --red-text: #B42318; --red-bg: #FEE4E2;
      --purple-text: #6941C6; --purple-bg: #EBE9FE;
      --shadow-post: 0 0 2px 0 rgba(166,175,195,.40);
      --shadow-btn: 0 1px 3px 0 rgba(166,175,195,.20);
      --shadow-card: 0 1px 2px rgba(166,175,195,.18);
      --shadow-hover: 0 12px 34px rgba(120,130,150,.18);
      --radius-card: 14px; --radius-btn: 9px; --radius-pill: 999px;
      /* categorical chart palette */
      --c1:#17212B; --c2:#3B82F6; --c3:#10B981; --c4:#F59E0B; --c5:#8B5CF6; --c6:#EC4899; --c7:#06B6D4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--page-bg); color: var(--text-primary);
      -webkit-font-smoothing: antialiased; line-height: 1.45; letter-spacing: -.01em;
      display: flex; height: 100vh; overflow: hidden;
    }
    button { font-family: inherit; cursor: pointer; }
    a { color: inherit; }

    /* ─── SIDEBAR ─── */
    .sidebar { width: 244px; flex-shrink: 0; height: 100vh; background: var(--white); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 18px 14px 14px; }
    .sb-brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 18px; }
    .sb-brand__mark { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: -.02em; }
    .sb-brand__name b { display: block; color: var(--text-primary); font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
    .sb-brand__name span { display: block; color: var(--text-tertiary); font-size: 10px; font-weight: 700; letter-spacing: .14em; margin-top: 1px; }
    .sb-scroll { overflow-y: auto; flex: 1; margin: 0 -6px; padding: 0 6px; }
    .sb-scroll::-webkit-scrollbar { width: 0; }
    .sb-group { margin-top: 10px; }
    .sb-group__label { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-tertiary); padding: 8px 10px 6px; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 11px; padding: 8.5px 11px; border: none; background: none; border-radius: 9px; color: var(--text-secondary); font-size: 13.5px; font-weight: 600; text-align: left; transition: background .12s, color .12s; position: relative; }
    .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; opacity: .85; }
    .nav-item:hover { background: var(--nav-hover); color: var(--text-primary); }
    .nav-item.active { background: var(--nav-current); color: var(--text-primary); }
    .nav-item.active svg { opacity: 1; }
    .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #3FB87C; margin-left: auto; box-shadow: 0 0 0 0 rgba(63,184,124,.6); animation: pulse 2.2s infinite; }
    .nav-item .badge { margin-left: auto; background: var(--red-bg); color: var(--red-text); font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(63,184,124,.5);} 70%{box-shadow:0 0 0 5px rgba(63,184,124,0);} 100%{box-shadow:0 0 0 0 rgba(63,184,124,0);} }
    .sb-foot { padding-top: 10px; border-top: 1px solid var(--border-light); margin-top: 8px; }
    .sb-powered { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 11px; font-weight: 600; color: var(--text-tertiary); width: 100%; border: none; background: none; text-align: left; border-radius: 9px; }
    .sb-powered .smark { width: 18px; height: 18px; border-radius: 5px; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 800; }
    .sb-powered b { color: var(--text-secondary); font-weight: 700; }
    .sb-user { display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; }
    .sb-user__av { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
    .sb-user__name { color: var(--text-primary); font-size: 12.5px; font-weight: 700; line-height: 1.2; }
    .sb-user__sub { color: var(--text-tertiary); font-size: 11px; font-weight: 500; }

    /* ─── MAIN ─── */
    .main { flex: 1; height: 100vh; overflow-y: auto; position: relative; }
    .view { display: none; }
    .view.active { display: block; }
    .inner { max-width: 1220px; margin: 0 auto; padding: 26px 34px 90px; }
    .pagebar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 22px; gap: 16px; flex-wrap: wrap; }
    .head h1 { font-size: 25px; font-weight: 700; letter-spacing: -.035em; display: flex; align-items: center; gap: 11px; }
    .head p { color: var(--text-secondary); font-size: 13.5px; margin-top: 4px; font-weight: 500; max-width: 640px; }
    .pagebar__right { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .live-dot { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; color: var(--green-text); background: var(--green-bg); padding: 4px 10px; border-radius: var(--radius-pill); }
    .live-dot i { width: 6px; height: 6px; border-radius: 50%; background: var(--green-text); animation: pulse 2s infinite; }

    /* filters */
    .seg { display: inline-flex; background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 3px; box-shadow: var(--shadow-btn); }
    .seg button { border: none; background: none; padding: 6px 13px; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); border-radius: 7px; }
    .seg button.active { background: var(--primary); color: #fff; }

    /* buttons */
    .btn { display: inline-flex; align-items: center; gap: 7px; border-radius: var(--radius-btn); padding: 9px 15px; font-size: 13px; font-weight: 600; border: 1px solid transparent; transition: .13s; }
    .btn svg { width: 15px; height: 15px; }
    .btn--primary { background: var(--primary); color: #fff; }
    .btn--primary:hover { background: var(--primary-hover); }
    .btn--ghost { background: var(--white); border-color: var(--border); color: var(--text-secondary); box-shadow: var(--shadow-btn); }
    .btn--ghost:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .btn--sm { padding: 6px 11px; font-size: 12px; }
    .btn--green { background: var(--green-text); color: #fff; }
    .btn--green:hover { filter: brightness(1.08); }

    /* cards + grid */
    .grid { display: grid; gap: 16px; }
    .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
    .card__pad { padding: 18px 20px; }
    .card__head { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid var(--border-light); }
    .card__title { font-size: 14px; font-weight: 700; letter-spacing: -.02em; display:flex; align-items:center; gap:8px; }
    .card__sub { font-size: 12px; color: var(--text-tertiary); font-weight: 500; margin-top: 2px; }

    /* stat tiles */
    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .tile { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 16px 18px; box-shadow: var(--shadow-card); }
    .tile__label { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .tile__val { font-size: 26px; font-weight: 800; letter-spacing: -.03em; margin-top: 7px; }
    .tile__delta { font-size: 11.5px; font-weight: 700; margin-top: 5px; display: inline-flex; align-items: center; gap: 4px; }
    .up { color: var(--green-text); } .down { color: var(--red-text); }

    /* tags */
    .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; letter-spacing: -.01em; }
    .tag--green { background: var(--green-bg); color: var(--green-text); }
    .tag--blue { background: var(--blue-bg); color: var(--blue-text); }
    .tag--orange { background: var(--orange-bg); color: var(--orange-text); }
    .tag--red { background: var(--red-bg); color: var(--red-text); }
    .tag--purple { background: var(--purple-bg); color: var(--purple-text); }
    .tag--grey { background: var(--secondary-lite); color: var(--text-secondary); }
    .tag i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* tables */
    table { width: 100%; border-collapse: collapse; }
    thead th { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); text-align: left; padding: 11px 20px; border-bottom: 1px solid var(--border-light); }
    tbody td { font-size: 13px; padding: 13px 20px; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr.clickable:hover { background: var(--page-bg); cursor: pointer; }
    .num { font-variant-numeric: tabular-nums; }
    .right { text-align: right; }

    /* progress / pacing bar */
    .pace { height: 8px; border-radius: 999px; background: var(--secondary-lite); overflow: hidden; position: relative; }
    .pace__fill { height: 100%; border-radius: 999px; background: var(--primary); transition: width .5s; }
    .pace--good .pace__fill { background: var(--green-text); }
    .pace--warn .pace__fill { background: var(--orange-text); }
    .pace--bad .pace__fill { background: var(--red-text); }

    /* progress ring */
    .ringwrap { display:flex; align-items:center; gap:14px; }

    /* coach */
    .coach-card { display: flex; gap: 14px; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--border-light); background: var(--white); }
    .coach-card + .coach-card { margin-top: 12px; }
    .coach-ico { width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center; }
    .coach-card b { font-size: 13.5px; font-weight: 700; }
    .coach-card p { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; line-height: 1.5; }
    .coach-act { margin-top: 9px; font-size: 12px; font-weight: 700; color: var(--primary); display: inline-flex; align-items: center; gap: 5px; }

    /* modal / drawer */
    .scrim { position: fixed; inset: 0; background: rgba(20,25,35,.44); backdrop-filter: blur(2px); z-index: 60; display: none; }
    .scrim.open { display: block; }
    .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: 560px; max-width: 94vw; background: var(--white); z-index: 61; box-shadow: -10px 0 40px rgba(20,25,35,.16); transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }
    .drawer__head { padding: 20px 24px; border-bottom: 1px solid var(--border-light); display: flex; align-items: flex-start; justify-content: space-between; }
    .drawer__body { padding: 22px 24px; overflow-y: auto; flex: 1; }
    .drawer__foot { padding: 16px 24px; border-top: 1px solid var(--border-light); display: flex; gap: 10px; justify-content: flex-end; }
    .x { border: none; background: var(--secondary-lite); width: 30px; height: 30px; border-radius: 8px; color: var(--text-secondary); font-size: 16px; display: grid; place-items: center; }

    /* modal center */
    .modal { position: fixed; z-index: 61; top: 50%; left: 50%; transform: translate(-50%,-46%); width: 720px; max-width: 94vw; max-height: 90vh; overflow-y: auto; background: var(--white); border-radius: 16px; box-shadow: var(--shadow-hover); opacity: 0; pointer-events: none; transition: .22s; }
    .modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%); }

    .kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; font-size: 13px; }
    .kv dt { color: var(--text-tertiary); font-weight: 600; }
    .kv dd { font-weight: 600; }

    .field { margin-bottom: 15px; }
    .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
    .field input, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; font-size: 13.5px; font-family: inherit; color: var(--text-primary); background: var(--white); }
    .field input:focus, .field select:focus { outline: none; border-color: var(--primary); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .footnote { margin-top: 26px; font-size: 11.5px; color: var(--text-tertiary); text-align: center; }
    .muted { color: var(--text-tertiary); }
    .empty { text-align: center; padding: 40px 20px; color: var(--text-tertiary); font-size: 13px; }

    /* air check agent scan */
    .scanbar { height: 4px; background: var(--secondary-lite); border-radius: 999px; overflow: hidden; }
    .scanbar__fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--c2), var(--c3)); transition: width .3s; }
    .agentrow { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border: 1px solid var(--border-light); border-radius: 12px; background: var(--white); }
    .agentrow + .agentrow { margin-top: 10px; }
    .thumb { width: 92px; height: 52px; border-radius: 8px; object-fit: cover; background: var(--secondary-lite); flex-shrink: 0; }
    .pulse-blue { animation: pulseb 1.4s infinite; }
    @keyframes pulseb { 0%,100%{opacity:1;} 50%{opacity:.45;} }

    /* proof reel */
    .reel-stage { background: #0b0f14; border-radius: 14px; overflow: hidden; position: relative; aspect-ratio: 16/9; display: grid; place-items: center; }
    .reel-stage iframe { width: 100%; height: 100%; border: 0; }
    .reel-strip { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px; }
    .reel-clip { width: 150px; flex-shrink: 0; border-radius: 10px; overflow: hidden; border: 2px solid transparent; background: var(--white); box-shadow: var(--shadow-card); }
    .reel-clip.active { border-color: var(--c2); }
    .reel-clip img { width: 100%; height: 84px; object-fit: cover; display: block; background:#222; }
    .reel-clip__meta { padding: 7px 9px; }

    /* deliverables & compliance (North Station pattern) */
    .ai-tag { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--purple-bg); color: var(--purple-text); padding: 3px 8px; border-radius: 999px; }
    .cmp-hint { font-size: 11.5px; color: var(--text-tertiary); margin: 6px 0 2px; line-height: 1.45; }
    .cmp-row { border: 1px solid var(--border-light); border-radius: 11px; padding: 11px 12px; margin-top: 9px; background: var(--white); }
    .cmp-row__top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
    .cmp-row__date { font-size: 12px; font-weight: 700; }
    .cmp-status { font-size: 10.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
    .cmp-status.ok { background: var(--green-bg); color: var(--green-text); }
    .cmp-status.pend { background: var(--secondary-lite); color: var(--text-secondary); }
    .cmp-inp { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-family: inherit; margin-top: 6px; color: var(--text-primary); background: var(--white); }
    .cmp-inp:focus { outline: none; border-color: var(--primary); }
    .cmp-inp::placeholder { color: var(--text-tertiary); }

    /* advertiser portal */
    .portal-hero { background: linear-gradient(135deg, #17212B, #26333F); color: #fff; border-radius: 16px; padding: 26px 28px; }
    .portal-hero h2 { font-size: 22px; font-weight: 800; letter-spacing: -.03em; }
    .brand-chip { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 15px; flex-shrink: 0; }

    @media (max-width: 900px) { .tiles { grid-template-columns: repeat(2,1fr); } }
  </style>
</head>
<body>
  <!-- ───────── SIDEBAR ───────── -->
  <nav class="sidebar">
    <div class="sb-brand">
      <div class="sb-brand__mark">A</div>
      <div class="sb-brand__name"><b>Acme Network</b><span>NETWORK OPS</span></div>
    </div>
    <div class="sb-scroll">
      <div class="sb-group">
        <div class="sb-group__label">Ops</div>
        <button class="nav-item active" data-view="overview" onclick="go('overview')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>Command Center</button>
        <button class="nav-item" data-view="delivery" onclick="go('delivery')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Delivery <span class="badge" id="nav-del-badge">3</span></button>
      </div>
      <div class="sb-group">
        <div class="sb-group__label">Advertiser</div>
        <button class="nav-item" data-view="portal" onclick="go('portal')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20 15 15 0 010-20z"/></svg>Campaign Portal <span class="dot"></span></button>
      </div>
    </div>
    <div class="sb-foot">
      <div class="sb-user">
        <div class="sb-user__av">JB</div>
        <div><div class="sb-user__name">Joe Blogs</div><div class="sb-user__sub">Ops · Acme Network</div></div>
      </div>
      <button class="sb-powered"><span class="smark">S</span>Connected to <b>Airtable</b> · Powered by <b>SpotsNow</b></button>
    </div>
  </nav>

  <main class="main" id="main">
    <section class="view active" id="view-overview"></section>
    <section class="view" id="view-deals"></section>
    <section class="view" id="view-intel"></section>
    <section class="view" id="view-billing"></section>
    <section class="view" id="view-aircheck"></section>
    <section class="view" id="view-delivery"></section>
    <section class="view" id="view-portal"></section>
    <section class="view" id="view-reels"></section>
    <section class="view" id="view-placements"></section>
    <section class="view" id="view-inventory"></section>
    <section class="view" id="view-conflicts"></section>
  </main>

  <!-- overlays -->
  <div class="scrim" id="scrim" onclick="closeOverlays()"></div>
  <aside class="drawer" id="drawer"></aside>
  <div class="modal" id="modal"></div>

  <script>
  /* ═══════════════════════════ SEED / STORE ═══════════════════════════ */
  const TODAY = '2026-07-09';
  const money = n => '$' + Math.round(n).toLocaleString('en-US');
  const money1 = n => '$' + n.toLocaleString('en-US', {maximumFractionDigits:0});
  const K = n => n >= 1000 ? (n/1000).toFixed(n>=10000?0:1)+'k' : ''+n;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const dt = s => new Date(s+'T00:00:00');
  const daysBetween = (a,b) => Math.round((dt(b)-dt(a))/864e5);
  const fmtDate = s => dt(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const mmss = sec => Math.floor(sec/60)+':'+String(Math.floor(sec%60)).padStart(2,'0');
  const hms = sec => { const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=Math.floor(sec%60); return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0'); };
  const adSecs = s => parseInt(s.length)||60;
  const epLenOf = s => s.epLen || 3600;
  const clipUrl = s => `https://www.youtube.com/watch?v=${s.yt}&t=${s.ts}s`;
  // Ad-read quality score — read completeness, delivery, placement, verification
  function qualityScore(s){
    const copyPts = Math.min((s.copy||[]).length,3)/3;
    const deliv = Math.min((s.actual||0)/(s.expected||1),1.2)/1.2;
    const pos = s.ts/epLenOf(s);
    const placement = (pos>=0.08 && pos<=0.75) ? 1 : (pos<0.08 ? 0.7 : 0.55);
    const verified = s.verified ? 1 : 0.6;
    const score = Math.round((copyPts*0.30 + deliv*0.30 + placement*0.20 + verified*0.20)*100);
    const grade = score>=90?'A':score>=80?'B':score>=70?'C':'D';
    const tone = score>=90?'green':score>=80?'blue':score>=70?'orange':'red';
    return { score, grade, tone, factors:[
      {k:'Copy read complete', v:Math.round(copyPts*100)},
      {k:'Impression delivery', v:Math.round(deliv*100)},
      {k:'Mid-roll placement', v:Math.round(placement*100)},
      {k:'Transcript verified', v:Math.round(verified*100)},
    ]};

    const overdue=INVOICES.filter(i=>i.brand===b&&i.status==='overdue'); const conf=analyzeBrand(b);
    let out=`<b>${esc(b)}</b> — ${money(spend)} booked across ${shows.length} show${shows.length!==1?'s':''} (${shows.map(s=>show(s).name).join(', ')})`;
    out+= pct!=null?`, pacing <b>${pct}%</b> to goal.`:'.';

    if(conf&&!conf.unknown&&Object.keys(conf.blockedBy).length) out+=` Note: category conflict with ${conf.conflicts[0].competitor}.`;

  function answerQuery(raw){

    }
    const brands=[...new Set(DEALS.map(d=>d.brand))];
    const brandHit=brands.find(b=>q.includes(b.toLowerCase())) || (q.includes('ag1')?'AG1':null);
    const showHit=SHOWS.find(s=>q.includes(s.name.toLowerCase()));
    if(/conflict|clash|compet|clear to sell|can (i|we) (sell|run)/.test(q)){

        return (blocked.length
          ? `${esc(b)} has a <b>${r.conflicts[0].severity}</b> conflict with <b>${esc(r.conflicts[0].competitor)}</b>, which runs on ${blocked.map(([s])=>show(s).name).join(' and ')}. Clear on the other ${SHOWS.length-blocked.length} shows.`
          : `No conflicts for <b>${esc(b)}</b> anywhere on the network — clear to sell on every show.`)+goChip('Open Conflict Check →','conflicts'); }
    }
    if(brandHit && /(how|hows|doing|going|status|summary|update|about|tell me|look)/.test(q)) return brandSummary(brandHit);
    if(/revenue|book|made|sales|how much/.test(q) && !/owe|overdue|outstanding|late/.test(q)){
      const mtd=won.filter(d=>monthKey(d.closeDate)==='2026-07').reduce((a,d)=>a+d.gross,0); const tot=won.reduce((a,d)=>a+d.gross,0);
      return `You've booked <b>${money(mtd)}</b> in July and <b>${money(tot)}</b> year to date across ${won.length} won deals — avg deal ${money(tot/won.length)}.`+goChip('Open Intelligence →','intel');
    }
    if(/top closer|best (rep|closer|sales)|who.*clos|leaderboard|selling most/.test(q)){
      const tc=topCloser(); const map={}; won.forEach(d=>{map[d.rep]=(map[d.rep]||0)+d.gross;});
      const board=Object.entries(map).sort((a,b)=>b[1]-a[1]);
      return `<b>${esc(tc.rep)}</b> is your top closer with ${money(tc.rev)} booked. Board: `+board.map(([r,v])=>`${esc(r.split(' ')[0])} ${money(v)}`).join(' · ')+`.`+goChip('Open Intelligence →','intel');
    }
    if(/behind|pacing|under.?deliver|at risk|falling|makegood/.test(q)){
      const approved=SPOTS.filter(s=>s.status==='approved'); const camps={};
      approved.forEach(s=>{const k=s.brand+'|'+s.showId;camps[k]=camps[k]||{b:s.brand,sh:s.showId,e:0,a:0};camps[k].e+=s.expected;camps[k].a+=(s.actual||0);});
      const behind=Object.values(camps).map(c=>({...c,pct:Math.round(c.a/c.e*100)})).filter(c=>c.pct<95);
      return (behind.length? `${behind.length} campaign${behind.length>1?'s are':' is'} behind pace: `+behind.map(c=>`<b>${esc(c.b)} on ${show(c.sh).name}</b> (${c.pct}%)`).join(', ')+`. The agent already drafted makegoods.` : `Everything's pacing on or above goal — nothing behind.`)+goChip('Open Delivery →','delivery');
    }
    if(/overdue|late|owe|unpaid|outstanding|collect|billing|invoice|paid/.test(q)){
      const overdue=INVOICES.filter(i=>i.status==='overdue'); const out=INVOICES.filter(i=>i.status!=='paid').reduce((a,i)=>a+i.total,0);
      return `${money(out)} is outstanding. `+(overdue.length?`<b>${overdue.map(i=>esc(i.brand)).join(', ')}</b> ${overdue.length>1?'are':'is'} overdue (${overdue.map(i=>money(i.total)+', '+daysBetween(i.dueDate,TODAY)+'d late').join('; ')}). Reminders drafted.`:`Nothing overdue.`)+goChip('Open Billing →','billing');
    }
    if(/approv|air ?check|verify|needs? (me|my|review)|to do|aired today|waiting on/.test(q)){
      const pend=SPOTS.filter(s=>s.status==='pending'),found=SPOTS.filter(s=>s.status==='agent_found');
      if(found.length) return `${found.length} air check${found.length>1?'s are':' is'} verified and waiting on your approval — ${found.map(s=>esc(s.brand)+' / '+show(s.showId).name).join(', ')}.`+goChip('Verify in Delivery →','delivery');
      if(pend.length) return `${pend.length} spot${pend.length>1?'s':''} aired today and are pending — run the agent to find + verify them.`+goChip('Verify in Delivery →','delivery');

    }
    if(/win rate|lose|lost|why.*(win|los)|conversion/.test(q)){
      const wr=Math.round(won.length/DEALS.length*100); const lr=tally(DEALS.filter(d=>d.outcome==='lost').map(d=>d.closeReason))[0];

    }
    if(/copy|cta|waiting for|not started|haven't started|hasnt started|ad read not|missing/.test(q)){

      return att.copy.length
        ? `${att.copy.length} spot${att.copy.length>1?'s':''} still need${att.copy.length>1?'':'s'} attention before they air: `+att.copy.map(s=>`<b>${esc(s.brand)} on ${show(s.showId).name}</b> (${copyState(s)==='needs_copy'?'ad copy':'CTA'})`).join(', ')+`.`+goChip('Open Delivery →','delivery')

      return `${b?esc(b)+': ':''}${left} spot${left!==1?'s':''} still to run, ${done} already aired and verified.`+goChip('Open Delivery →','delivery');
    }
    if(/inventory|open|available|slot|space|what can (i|we) sell/.test(q)){
      return `Open inventory this month sits on ${SHOWS.slice(0,3).map(s=>s.name).join(', ')} and more. Founder Mode has a slot held for DraftKings.`+goChip('Open Inventory →','inventory');

      <div class="card" style="margin-top:16px"><div class="card__head"><div class="card__title">Creator payouts</div><div class="card__sub">Net-to-creator by show · stems from the deal</div></div>

  function dealDetail(id){ const d=deal(id); const spots=SPOTS.filter(s=>s.dealId===id);

  // Synthesized deal story + email timeline (seeded from outcome/reason — stands in for the connected Gmail thread)
  function dealActivity(d){
    const sh=show(d.showId), first=d.rep.split(' ')[0], days=daysBetween(d.createdDate,d.closeDate);
    const c=dt(d.createdDate), e=dt(d.closeDate), mid=new Date((c.getTime()+e.getTime())/2).toISOString().slice(0,10);
    const cat=sh.category.split(' ')[0];
    const T={ won:{
      'Audience fit':{s:`Quick close. ${d.brand} replied to the outbound pitch the same day, called the ${cat} audience match the hook, and signed in ${days} days.`,n:null,e:[['out',d.createdDate,`${sh.name} × ${d.brand}`,`${first} pitched the ${cat} audience + rate card.`],['in',mid,`Re: ${sh.name} × ${d.brand}`,`"This is exactly the audience we want — send the IO."`],['out',d.closeDate,'IO + booking confirmed',`Signed at ${money(d.gross)}. Placements auto-generated.`]]},
      'Existing relationship':{s:`Warm re-up. ${d.brand} already knew ${sh.name} from a prior flight, so ${first} skipped the pitch and went straight to dates.`,n:null,e:[['out',d.createdDate,`${sh.name} — ready when you are`,`${first} flagged open weeks to ${d.brand}.`],['in',mid,`Re: ${sh.name} — ready when you are`,`"Let's run it back. Same terms as last time work."`],['out',d.closeDate,'Booked',`Renewed at ${money(d.gross)}.`]]},
      'Fast turnaround':{s:`Speed won it. ${d.brand} needed to be in-market fast; ${first} turned the IO around same week and closed in ${days} days.`,n:null,e:[['out',d.createdDate,`${sh.name} availability`,`${first} shared next-week inventory.`],['in',mid,`Re: ${sh.name} availability`,`"We need to launch ASAP — can you do next week?"`],['out',d.closeDate,'IO sent + countersigned',`Turned around same week. ${money(d.gross)} booked.`]]},
      'Price':{s:`Closed on price. ${d.brand} pushed on rate; ${first} adjusted the package rather than the CPM and got it over the line.`,n:null,e:[['out',d.createdDate,`${sh.name} proposal`,`${first} sent the ${money(d.gross)} package.`],['in',mid,`Re: ${sh.name} proposal`,`"Close — can you work with our budget?"`],['out',d.closeDate,'Revised package',`Repackaged the flight, kept the CPM, closed.`]]} },
    lost:{
      'Timing':{s:`Strong fit, wrong quarter. ${d.brand} liked ${sh.name} but had this quarter's budget committed. ${first} agreed to revisit next quarter — warm re-engage, not a dead deal.`,n:`Set a Q4 nudge for ${first}. This one comes back with a reminder.`,e:[['out',d.createdDate,`${sh.name} availability`,`${first} shared open weeks + the ${money(d.gross)} package.`],['in',mid,`Re: ${sh.name} availability`,`"Love it, but our quarter is locked. Can we look again next quarter?"`],['out',d.closeDate,`Re: ${sh.name} availability`,`${first} logged a Q4 follow-up; closed as lost (timing).`]]},
      'Budget':{s:`Interested but priced out. ${d.brand} was into the show but our CPM sat above their cap this quarter. Lost on budget — a lower-tier weekly package could win it back.`,n:`Feeds the Coach: "Budget" is your #1 loss reason. A starter package keeps these in play.`,e:[['out',d.createdDate,`${sh.name} × ${d.brand}`,`${first} sent the ${money(d.gross)} proposal.`],['in',mid,`Re: ${sh.name} × ${d.brand}`,`"We're in, but that's over our cap. Anything lighter?"`],['out',d.closeDate,`Re: ${sh.name} × ${d.brand}`,`No entry tier available yet; closed as lost (budget).`]]},
      'Category conflict':{s:`Blocked on exclusivity. A competing brand is already running on ${sh.name}, so ${d.brand} couldn't clear. Nothing to do until that flight ends.`,n:`Re-open once the conflicting flight wraps — check Conflict Check for the end date.`,e:[['out',d.createdDate,`${sh.name} for ${d.brand}`,`${first} pitched the slot.`],['in',mid,`Re: ${sh.name} for ${d.brand}`,`"Aren't you running a competitor on this show right now?"`],['out',d.closeDate,`Re: ${sh.name} for ${d.brand}`,`Confirmed conflict; paused until the current flight ends.`]]} } };
    const fb={s:`${d.brand} on ${sh.name} — ${d.outcome} in ${days} days (${d.closeReason}).`,n:null,e:[['out',d.createdDate,`${sh.name} × ${d.brand}`,`${first} opened the conversation.`],['in',d.closeDate,`Re: ${sh.name}`,`Closed as ${d.outcome}.`]]};
    const data=(T[d.outcome]&&T[d.outcome][d.closeReason])||fb;
    const av=(dir)=> dir==='out'
      ? `<div style="width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex-shrink:0">${esc(d.rep.split(' ').map(w=>w[0]).join(''))}</div>`
      : `<div style="width:28px;height:28px;border-radius:50%;background:${brandColor[d.brand]||'#3B82F6'};color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0">${esc(d.brand[0])}</div>`;
    const emails=data.e.map(m=>`<div style="display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border-light)">
      ${av(m[0])}
      <div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><b style="font-size:12.5px">${esc(m[2])}</b><span class="muted" style="font-size:11px;white-space:nowrap">${fmtDate(m[1])}</span></div>
      <div class="muted" style="font-size:12px;margin-top:2px">${esc(m[3])}</div></div></div>`).join('');
    return `<div style="margin-top:22px;display:flex;align-items:center;justify-content:space-between">
        <div style="font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em">Deal activity</div>
        <span class="tag tag--grey" style="font-weight:600"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg> Synced from Gmail · ${data.e.length} msgs</span></div>
      <div style="margin-top:11px;display:flex;gap:11px;padding:14px;border-radius:12px;background:var(--purple-bg)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--purple-text)" stroke-width="2.2" style="flex-shrink:0;margin-top:1px"><path d="M12 3a6 6 0 00-4 10.5V17h8v-3.5A6 6 0 0012 3z"/><path d="M9 21h6"/></svg>
        <div><div style="font-size:11px;font-weight:700;color:var(--purple-text);letter-spacing:.03em">WHAT HAPPENED</div>
        <p style="font-size:12.5px;color:var(--text-primary);margin-top:3px;line-height:1.5">${esc(data.s)}</p>
        ${data.n?`<p style="font-size:12px;color:var(--purple-text);font-weight:600;margin-top:7px">→ ${esc(data.n)}</p>`:''}</div></div>
      <div style="margin-top:8px">${emails}</div>`;
  }
  const statusTag = s => ({approved:'<span class="tag tag--green"><i></i>Approved</span>',agent_found:'<span class="tag tag--blue"><i></i>Agent found</span>',pending:'<span class="tag tag--orange"><i></i>Pending</span>',missed:'<span class="tag tag--red"><i></i>Missed</span>'}[s]||s);

  /* ═══════════════════════════ DEAL FORM (enter once) ═══════════════════════════ */
  function openDealForm(){
    openModal(`<div class="drawer__head"><div><h2 style="font-size:19px;font-weight:800">New deal</h2><div class="muted" style="font-size:12.5px;margin-top:2px">Saves once → placements, delivery and billing update instantly.</div></div><button class="x" onclick="closeOverlays()">✕</button></div>

  function submitDeal(){
    const brand=document.getElementById('f-brand').value.trim()||'New Brand';
    const showId=document.getElementById('f-show').value;
    const gross=+document.getElementById('f-gross').value||0;
    const type=document.getElementById('f-type').value;

  /* ═══════════════════════════ VIEW: AIR CHECKS (centerpiece) ═══════════════════════════ */
  let agentRunning=false, acFilter='queue';
  const AC_LABELS={queue:'Review queue',pending:'Pending spots',agent_found:'Agent found',approved:'Approved today',missed:'Needs review'};
  const acTile=(key,label,val,color)=>`<button class="tile" onclick="acFilter=(acFilter==='${key}'?'queue':'${key}');RENDER.aircheck()" style="width:100%;text-align:left;font-family:inherit;border:1px solid ${acFilter===key?'var(--primary)':'var(--border)'};box-shadow:${acFilter===key?'var(--shadow-hover)':'var(--shadow-card)'}"><div class="tile__label">${label}</div><div class="tile__val" ${color?`style="color:${color}"`:''}>${val}</div></button>`;
  RENDER.aircheck = () => {
    const pending=SPOTS.filter(s=>s.status==='pending');
    const found=SPOTS.filter(s=>s.status==='agent_found');
    const missed=SPOTS.filter(s=>s.status==='missed');
    const approved=SPOTS.filter(s=>s.status==='approved');
    document.getElementById('view-aircheck').innerHTML=`

        <div class="head"><h1>Air Check Agent <span class="live-dot"><i></i>Polling</span></h1><p>The agent watches every show for new episodes, finds the ad, grabs the link + timestamp + impressions, and verifies the copy actually ran. You approve.</p></div>

        <button class="btn btn--primary" id="runBtn" onclick="runAgent()">▶ Run now</button></div>

        ${acTile('agent_found','Agent found',found.length,'var(--blue-text)')}

        ${(acFilter==='queue'||acFilter==='agent_found')&&found.length?`<button class="btn btn--green btn--sm" onclick="approveAll()">✓ Approve all (${found.length})</button>`:''}</div>

    </div>`;
  };
  function renderQueue(){
    let q;
    if(acFilter==='pending') q=SPOTS.filter(s=>s.status==='pending');
    else if(acFilter==='agent_found') q=SPOTS.filter(s=>s.status==='agent_found');
    else if(acFilter==='approved') q=SPOTS.filter(s=>s.status==='approved'&&s.airDate===TODAY);
    else if(acFilter==='missed') q=SPOTS.filter(s=>s.status==='missed');
    else q=SPOTS.filter(s=>['pending','agent_found','missed'].includes(s.status));
    if(!q.length){ const m={pending:'No pending spots — the agent has everything.',agent_found:'Nothing waiting on you right now.',approved:'No spots approved today yet.',missed:'Nothing flagged. 🎉',queue:'All clear — every aired spot is checked and approved. ✨'}; return `<div class="empty">${m[acFilter]||m.queue}</div>`; }
    return q.map(s=>{
      const sh=show(s.showId);
      const thumb = s.yt ? `https://img.youtube.com/vi/${s.yt}/mqdefault.jpg` : '';
      if(s.status==='approved') return `<div class="agentrow" style="border-color:var(--green-bg)">
        ${thumb?`<img class="thumb" src="${thumb}" onerror="this.style.display='none'">`:`<div class="thumb" style="display:grid;place-items:center;color:var(--text-tertiary);font-size:11px">RSS</div>`}
        <div style="flex:1"><div style="font-weight:700;font-size:13.5px">${esc(sh.name)} <span class="tag tag--grey">${esc(s.brand)}</span> <span class="tag tag--green"><i></i>Approved</span> ${s.verified?'<span class="tag tag--green"><i></i>Copy verified</span>':''}</div>
        <div class="muted" style="font-size:12px;margin-top:3px">${s.yt?`Ad at <b>${mmss(s.ts)}</b> · `:''}${K(s.actual)} impressions · ${s.length}</div></div>
        ${s.yt?`<button class="btn btn--ghost btn--sm" onclick="playClip('${s.yt}',${s.ts})">▶ Hear it</button>`:''}</div>`;
      if(s.status==='pending') return `<div class="agentrow" id="row-${s.id}">
        <div class="thumb" style="display:grid;place-items:center;color:var(--text-tertiary);font-size:11px">${sh.source==='youtube'?'YT':'RSS'}</div>
        <div style="flex:1"><div style="font-weight:700;font-size:13.5px">${esc(sh.name)} <span class="tag tag--grey" style="margin-left:4px">${esc(s.brand)}</span></div>
        <div class="muted" style="font-size:12px;margin-top:2px">Aired ${fmtDate(s.airDate)} · ${s.length} · <span id="stat-${s.id}">waiting for episode…</span></div></div>
        <span class="tag tag--orange"><i></i>Pending</span></div>`;
      if(s.status==='missed') return `<div class="agentrow" id="row-${s.id}">
        <div class="thumb" style="display:grid;place-items:center;color:var(--red-text);font-size:11px">?</div>
        <div style="flex:1"><div style="font-weight:700;font-size:13.5px">${esc(sh.name)} <span class="tag tag--grey">${esc(s.brand)}</span></div>
        <div class="muted" style="font-size:12px;margin-top:2px">No episode found after polling. Flagged for you.</div></div>

  /* ═══════════════════════════ VIEW: PROOF REELS ═══════════════════════════ */

    </div>`;
  };

  /* ═══════════════════════════ VIEW: CONFLICTS ═══════════════════════════ */
  let confInput='', confRes=undefined;
  RENDER.conflicts = () => {
    document.getElementById('view-conflicts').innerHTML=`
    <div class="inner">
      <div class="pagebar"><div class="head"><h1>Conflict Check</h1><p>Paste a brand's URL. We check it against every advertiser running on the network and tell you exactly where it's clear to sell — the same check our SpotsNow agent runs.</p></div></div>
      <div class="card" style="max-width:660px"><div class="card__pad">
        <div style="display:flex;gap:10px">
          <div style="flex:1;position:relative">
            <svg style="position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="confBox" placeholder="Enter a brand or paste a URL — e.g. ritual.com" value="${esc(confInput)}" onkeydown="if(event.key==='Enter')runConflict()" style="width:100%;padding:11px 12px 11px 38px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit">
          </div>
          <button class="btn btn--primary" onclick="runConflict()">Check</button>
        </div>
        <div style="display:flex;gap:6px;margin-top:11px;flex-wrap:wrap;align-items:center">
          <span class="muted" style="font-size:11.5px">Try:</span>
          ${['ritual.com','kalshi.com','draftkings.com','notion.so'].map(d=>`<button class="tag tag--grey" style="cursor:pointer" onclick="checkBrand('${d}')">${d}</button>`).join('')}
        </div>
      </div></div>
      <div style="max-width:660px;margin-top:16px">${confRes!==undefined?renderConflictResult(confRes):''}</div>
    </div>`;
    const box=document.getElementById('confBox'); if(box&&confInput){ box.focus(); box.setSelectionRange(box.value.length,box.value.length); }
  };
  function runConflict(){ const el=document.getElementById('confBox'); if(el) confInput=el.value; confRes=analyzeBrand(confInput); RENDER.conflicts(); }
  function checkBrand(d){ confInput=d; confRes=analyzeBrand(d); RENDER.conflicts(); }
  function renderConflictResult(r){
    if(r===null) return `<div class="card"><div class="empty">Enter a brand URL above to check it against the network.</div></div>`;
    if(r.unknown) return `<div class="card"><div class="card__pad">
      <div style="display:flex;align-items:center;gap:11px"><div class="brand-chip" style="background:var(--text-tertiary)">${esc((r.q[0]||'?').toUpperCase())}</div>
      <div style="flex:1"><b style="font-size:15px">${esc(r.q)}</b><div class="muted" style="font-size:12px">Not currently on the network</div></div>
      <span class="tag tag--green"><i></i>Clear to sell</span></div>
      <p class="muted" style="font-size:12.5px;margin-top:10px">No competing advertiser found for this brand across any show. Clear to pitch anywhere.</p></div></div>`;
    const hasConflict = Object.keys(r.blockedBy).length>0;
    return `<div class="card"><div class="card__pad">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="brand-chip" style="background:${brandColor[r.brand]||'#3B82F6'}">${esc(r.brand[0])}</div>
        <div style="flex:1"><b style="font-size:16px">${esc(r.brand)}</b><div class="muted" style="font-size:12px">${esc(r.domain)} · ${esc(r.category)}</div></div>
        ${hasConflict?'<span class="tag tag--red"><i></i>Conflict found</span>':'<span class="tag tag--green"><i></i>Clear to sell</span>'}
      </div>
      ${r.conflicts.map(c=>`<div style="margin-top:14px;padding:14px;border-radius:12px;border:1px solid ${c.severity==='primary'?'var(--red-bg)':'var(--orange-bg)'};background:${c.severity==='primary'?'var(--red-bg)':'var(--white)'}">
        <div style="display:flex;align-items:center;gap:9px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c.severity==='primary'?'var(--red-text)':'var(--orange-text)'}" stroke-width="2.2"><path d="M12 9v4M12 17h.01M10.3 3.9L2 18a2 2 0 001.7 3h16.6A2 2 0 0022 18L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
        <b style="font-size:13.5px">${c.severity==='primary'?'Primary':'Secondary'} conflict · ${esc(r.brand)} ↔ ${esc(c.competitor)}</b><span class="tag tag--grey" style="margin-left:auto">${esc(c.category)}</span></div>
        <p style="font-size:12.5px;color:var(--text-secondary);margin-top:7px">${esc(c.note)}</p>
        ${c.shows.length?`<div style="margin-top:9px;display:flex;gap:6px;flex-wrap:wrap">${c.shows.map(s=>`<span class="tag tag--red"><i></i>${esc(c.competitor)} on ${esc(show(s).name)}</span>`).join('')}</div>`:''}
      </div>`).join('')}
      <div style="margin-top:16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-tertiary)">Where you can sell ${esc(r.brand)}</div>
      <div style="margin-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${SHOWS.map(s=>{ const blocked=r.blockedBy[s.id]; const own=r.ownShows.includes(s.id);
          const tag = blocked?`<span class="tag tag--red"><i></i>Blocked</span>`:own?`<span class="tag tag--blue"><i></i>Running here</span>`:`<span class="tag tag--green"><i></i>Clear</span>`;
          return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--border-light);border-radius:10px">
            <div><div style="font-weight:600;font-size:12.5px">${esc(s.name)}</div>${blocked?`<div class="muted" style="font-size:11px">${esc(blocked)} runs here</div>`:''}</div>${tag}</div>`; }).join('')}
      </div></div></div>`;
  }

  /* ═══════════════════════════ TOAST ═══════════════════════════ */
  let toastT;
  function toast(msg){ let el=document.getElementById('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:#fff;padding:12px 18px;border-radius:11px;font-size:13px;font-weight:600;z-index:80;box-shadow:var(--shadow-hover);opacity:0;transition:.25s;max-width:460px'; document.body.appendChild(el); }
    el.textContent=msg; requestAnimationFrame(()=>{el.style.opacity=1;el.style.transform='translateX(-50%) translateY(0)';}); clearTimeout(toastT); toastT=setTimeout(()=>{el.style.opacity=0;el.style.transform='translateX(-50%) translateY(20px)';},3400); }

  /* init */
  refreshBadges(); RENDER.overview();
  </script>
</body>
</html>
