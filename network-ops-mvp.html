<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VMG Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2064%2064%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2213%22%20fill%3D%22%23141519%22/%3E%3Ctext%20x%3D%2234.5%22%20y%3D%2233.5%22%20text-anchor%3D%22middle%22%20font-family%3D%22Helvetica%2CArial%2Csans-serif%22%20font-weight%3D%22900%22%20font-size%3D%2219%22%20letter-spacing%3D%225%22%20fill%3D%22%23fff%22%3EVMG%3C/text%3E%3Ctext%20x%3D%2233.6%22%20y%3D%2245%22%20text-anchor%3D%22middle%22%20font-family%3D%22Helvetica%2CArial%2Csans-serif%22%20font-weight%3D%22700%22%20font-size%3D%225.8%22%20letter-spacing%3D%223.2%22%20fill%3D%22%23fff%22%3ENETWORK%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #17212B; --primary-hover: #282828;
      --accent: #17212B; --accent-hover: #282828; --accent-soft: #F3F4F6;
      --text-primary: #1D2027; --text-secondary: #4E5561; --text-tertiary: #6F7683;
      --border: #E4E6ED; --border-light: #EDEEF1; --border-strong: #C5CBD5;
      --white: #ffffff; --secondary-lite: #F3F4F6;
      --nav: #F3F4F6; --nav-current: #E4E6ED; --nav-hover: #EBEDF2;
      --page-bg: #F6F7F9; --panel: #ffffff;
      --green-text: #0E6832; --green-bg: #D6F1E0;
      --blue-text: #1435C0; --blue-bg: #C7E0FF;
      --orange-text: #C2410C; --orange-bg: #FFEDD5;
      --red-text: #B42318; --red-bg: #FEE4E2;
      --purple-text: #6941C6; --purple-bg: #EBE9FE;
      --shadow-post: 0 0 2px 0 rgba(166,175,195,.40);
      --shadow-btn: 0 1px 3px 0 rgba(166,175,195,.20);
      --shadow-card: 0 1px 2px rgba(166,175,195,.18);
      --shadow-hover: 0 12px 34px rgba(120,130,150,.18);
      --radius-card: 12px; --radius-btn: 7px; --radius-pill: 999px;
      /* categorical chart palette */
      --c1:#17212B; --c2:#3B82F6; --c3:#10B981; --c4:#F59E0B; --c5:#8B5CF6; --c6:#EC4899; --c7:#06B6D4;
    }
    body.dark {
      --primary:#F3F4F6; --primary-hover:#E4E6ED;
      --text-primary:#F0F1F4; --text-secondary:#AAB2BF; --text-tertiary:#848D9C;
      --border:#2A2F38; --border-light:#232830; --border-strong:#3C434E;
      --white:#161A20; --panel:#161A20; --secondary-lite:#212630; --page-bg:#0D1015;
      --nav:#212630; --nav-current:#2A2F38; --nav-hover:#212630;
      --green-bg:#12351F; --blue-bg:#152A47; --orange-bg:#3A2410; --red-bg:#3D1A18; --purple-bg:#241C42;
      --green-text:#5BD68F; --blue-text:#7FB4FF; --orange-text:#F0A868; --red-text:#F58B84; --purple-text:#B69BF5;
      --shadow-card:0 1px 2px rgba(0,0,0,.4); --shadow-btn:0 1px 3px rgba(0,0,0,.35); --shadow-hover:0 12px 34px rgba(0,0,0,.5);
    }
    body.dark .btn--primary, body.dark .pill--solid, body.dark .askwrap__go, body.dark .tb-av { color:#12161C; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--page-bg); color: var(--text-primary);
      -webkit-font-smoothing: antialiased; line-height: 1.45; letter-spacing: -.01em;
      display: flex; gap: 0; height: 100vh; overflow: hidden; padding: 0;
    }
    button { font-family: inherit; cursor: pointer; }
    a { color: inherit; }

    /* ─── SIDEBAR ─── */
    .sidebar { width: 228px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 13px 13px; overflow: hidden; }
    .sb-brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 18px; }
    .sb-brand__mark { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; overflow: hidden; }
    .sb-brand__mark svg { display: block; width: 100%; height: 100%; }
    .sb-brand__name b { display: block; color: var(--text-primary); font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
    .sb-brand__name span { display: block; color: var(--text-tertiary); font-size: 10px; font-weight: 700; letter-spacing: .14em; margin-top: 1px; }
    .sb-scroll { overflow-y: auto; flex: 1; margin: 0 -6px; padding: 0 6px; }
    .sb-scroll::-webkit-scrollbar { width: 0; }
    .sb-group { margin-top: 14px; }
    .sb-group__label { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-tertiary); padding: 8px 12px 8px; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: none; background: none; border-radius: 12px; color: var(--text-secondary); font-size: 13.5px; font-weight: 600; text-align: left; transition: background .12s, color .12s; position: relative; }
    .nav-item + .nav-item { margin-top: 2px; }
    .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; opacity: .85; }
    .nav-item:hover { background: var(--nav-hover); color: var(--text-primary); }
    .nav-item.active { background: var(--nav-current); color: var(--text-primary); }
    .nav-item.active svg { opacity: 1; }
    .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #3FB87C; margin-left: auto; box-shadow: 0 0 0 0 rgba(63,184,124,.6); animation: pulse 2.2s infinite; }
    .nav-item .badge { margin-left: auto; background: var(--red-bg); color: var(--red-text); font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(63,184,124,.5);} 70%{box-shadow:0 0 0 5px rgba(63,184,124,0);} 100%{box-shadow:0 0 0 0 rgba(63,184,124,0);} }
    .sb-foot { padding-top: 10px; border-top: 1px solid var(--border-light); margin-top: 8px; }
    .sb-user { display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; }
    .sb-user__av { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
    .sb-user__name { color: var(--text-primary); font-size: 12.5px; font-weight: 700; line-height: 1.2; }


    /* ─── table toolbar + sortable header, network.spotsnow pattern ─── */
    .tbar { display:flex; align-items:center; gap:14px; padding:10px 14px; border-bottom:1px solid var(--border-light); }
    .tbar--bare { padding:0; border:none; }
    .tbar--bare .tbar__search input { width:150px; }
    .cmp-inp--link { color:var(--blue-text); text-decoration:underline; text-underline-offset:2px; cursor:pointer; }
    .cmp-copy { position:absolute; right:5px; top:50%; transform:translateY(-50%); width:24px; height:24px;
                border:none; background:none; color:var(--text-tertiary); cursor:pointer; display:grid; place-items:center; border-radius:6px; }
    .cmp-copy:hover { color:var(--text-primary); background:var(--secondary-lite); }
    .tbar__search { position:relative; }
    .tbar__search svg { position:absolute; left:9px; top:50%; transform:translateY(-50%); width:13px; height:13px; color:var(--text-tertiary); }
    .tbar__search input { width:210px; padding:6px 10px 6px 29px; border:1px solid var(--border); border-radius:8px;
                          font:inherit; font-size:12px; background:var(--white); color:var(--text-primary); }
    .tbar__search input:focus { outline:none; border-color:var(--border-strong); }
    .tsel { border:none; background:transparent; font:inherit; font-size:12px; font-weight:600; color:var(--text-primary); cursor:pointer; }
    .shead { display:grid; align-items:center; gap:0 13px; padding:8px 14px; border-bottom:1px solid var(--border-light); }
    .shead button, .shead span { border:none; background:none; padding:0; text-align:left; font-family:inherit;
                                 font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
                                 color:var(--text-tertiary); cursor:pointer; white-space:nowrap; }
    .shead button:hover { color:var(--text-primary); }
    /* ─── flat list card: rows divided by hairlines, one border around ─── */
    .listcard { background: var(--white); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .listcard .fhead { padding: 8px 14px; margin: 0; border-bottom: 1px solid var(--border-light); }
    .listcard .wrow { border: none; border-radius: 0; background: none; }
    .listcard .wrow + .wrow { margin-top: 0; border-top: 1px solid var(--border-light); }
    .listcard .archdiv { margin: 4px 0; padding: 8px 16px; }
    .listcard .archdiv::after { display: none; }
    /* report stat tiles — the lead one goes dark, like the network's impressions card */
    .pstat { background: var(--white); border: 1px solid var(--border-light); border-radius: 8px; padding: 9px 12px; }
    .pstat__l { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-tertiary); }
    .pstat__v { font-size: 18px; font-weight: 800; letter-spacing: -.03em; margin-top: 3px; }
    .pstat--dark { background: var(--primary); border-color: var(--primary); color: #fff; }
    .pstat--dark .pstat__l { color: inherit; opacity: .65; }
    .pstat--dark .pstat__v { font-size: 24px; }
    body.dark .pstat--dark { color: #12161C; }

    /* ─── TOP BAR ─── */
    .topbar { display: flex; align-items: center; gap: 4px; justify-content: flex-end; padding: 13px 18px 0; flex-shrink: 0; }
    .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #3FB87C; margin-left: auto; }
    .nav-item { border: none; background: none; border-radius: 8px; padding: 6px 11px; color: var(--text-tertiary); font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    .nav-item:hover { color: var(--text-primary); background: var(--nav-hover); }
    .nav-item.active { color: var(--text-primary); background: var(--nav-current); }
    .nav-item .badge { background: var(--red-bg); color: var(--red-text); font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 999px; }
    .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #3FB87C; }
    /* sidebar nav re-asserted over the topbar redefinition: chunky Bluewire pills */
    .sidebar .nav-item { display: flex; width: 100%; padding: 12px 14px; border-radius: 10px; font-size: 13.5px; color: var(--text-secondary); gap: 12px; }
    .sidebar .nav-item:hover { background: var(--nav-hover); color: var(--text-primary); }
    .sidebar .nav-item.active { background: var(--secondary-lite); color: var(--text-primary); }
    .tb-plain { display: inline-flex; align-items: center; gap: 6px; border: none; background: none; padding: 6px 8px;
                border-radius: 8px; color: var(--text-secondary); font-size: 12px; font-weight: 600; }
    .tb-plain:hover { background: var(--nav-hover); color: var(--text-primary); }
    .tb-plain svg { width: 14px; height: 14px; }
    .tb-btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--panel); color: var(--text-secondary); font-size: 12px; font-weight: 600; margin-left: 6px; }
    .tb-btn:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .tb-btn.active { background: var(--nav-current); color: var(--text-primary); border-color: transparent; }
    .tb-btn svg { width: 13px; height: 13px; }
    .tb-av { width: 30px; height: 30px; border-radius: 9px; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 11px; margin-left: 6px; border: none; flex-shrink: 0; }

    /* ─── MAIN ─── */
    .main { flex: 1; min-width: 0; background: var(--panel); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .views { flex: 1; overflow-y: auto; }
    .view { display: none; }
    .view.active { display: block; }
    .inner { max-width: 1220px; margin: 0 auto; padding: 16px 28px 70px; }
    .pagebar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; gap: 16px; flex-wrap: wrap; }
    .head h1 { font-size: 20px; font-weight: 700; letter-spacing: -.035em; display: flex; align-items: center; gap: 11px; }
    .head p { color: var(--text-secondary); font-size: 12.5px; margin-top: 4px; font-weight: 500; max-width: 640px; }
    .pagebar__right { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .live-dot { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; color: var(--green-text); background: var(--green-bg); padding: 4px 10px; border-radius: var(--radius-pill); }
    .live-dot i { width: 6px; height: 6px; border-radius: 50%; background: var(--green-text); animation: pulse 2s infinite; }

    /* filters */
    .seg { display: inline-flex; background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 3px; box-shadow: var(--shadow-btn); }
    .seg button { border: none; background: none; padding: 6px 13px; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); border-radius: 7px; }
    .seg button.active { background: var(--primary); color: #fff; }

    /* buttons */
    .btn { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; border-radius: var(--radius-btn); padding: 9px 15px; font-size: 13px; font-weight: 600; border: 1px solid transparent; transition: .13s; }
    .btn svg { width: 15px; height: 15px; }
    .btn--primary { background: var(--primary); color: #fff; }
    .btn--primary:hover { background: var(--primary-hover); }
    .btn--ghost { background: var(--white); border-color: var(--border); color: var(--text-secondary); box-shadow: var(--shadow-btn); }
    .btn--ghost:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .btn--sm { padding: 6px 11px; font-size: 12px; }
    .btn--green { background: var(--green-text); color: #fff; }
    .btn--green:hover { filter: brightness(1.08); }

    /* cards + grid */
    .grid { display: grid; gap: 16px; }
    .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
    .card__pad { padding: 15px 18px; }
    .card__head { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--border-light); }
    .card__title { font-size: 14px; font-weight: 700; letter-spacing: -.02em; display:flex; align-items:center; gap:8px; }
    .card__sub { font-size: 12px; color: var(--text-tertiary); font-weight: 500; margin-top: 2px; }

    /* stat tiles */
    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .tile { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 13px 15px; box-shadow: var(--shadow-card); }
    .tile__label { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .tile__val { font-size: 26px; font-weight: 800; letter-spacing: -.03em; margin-top: 7px; }
    .tile__delta { font-size: 11.5px; font-weight: 700; margin-top: 5px; display: inline-flex; align-items: center; gap: 4px; }
    .up { color: var(--green-text); } .down { color: var(--red-text); }

    /* tags */
    .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; letter-spacing: -.01em; }
    .tag--green { background: var(--green-bg); color: var(--green-text); }
    .tag--blue { background: var(--blue-bg); color: var(--blue-text); }
    .tag--orange { background: var(--orange-bg); color: var(--orange-text); }
    .tag--red { background: var(--red-bg); color: var(--red-text); }
    .tag--purple { background: var(--purple-bg); color: var(--purple-text); }
    .tag--grey { background: var(--secondary-lite); color: var(--text-secondary); }
    .tag i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* tables */
    table { width: 100%; border-collapse: collapse; }
    thead th { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); text-align: left; padding: 11px 20px; border-bottom: 1px solid var(--border-light); }
    tbody td { font-size: 13px; padding: 13px 20px; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr.clickable:hover { background: var(--page-bg); cursor: pointer; }
    .num { font-variant-numeric: tabular-nums; }
    .right { text-align: right; }

    /* progress / pacing bar */
    .pace { height: 8px; border-radius: 999px; background: var(--secondary-lite); overflow: hidden; position: relative; }
    .pace__fill { height: 100%; border-radius: 999px; background: var(--primary); transition: width .5s; }
    .pace--good .pace__fill { background: var(--green-text); }
    .pace--warn .pace__fill { background: var(--orange-text); }
    .pace--bad .pace__fill { background: var(--red-text); }

    /* progress ring */
    .ringwrap { display:flex; align-items:center; gap:14px; }

    /* coach */
    .coach-card { display: flex; gap: 14px; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--border-light); background: var(--white); }
    .coach-card + .coach-card { margin-top: 12px; }
    .coach-ico { width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center; }
    .coach-card b { font-size: 13.5px; font-weight: 700; }
    .coach-card p { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; line-height: 1.5; }
    .coach-act { margin-top: 9px; font-size: 12px; font-weight: 700; color: var(--primary); display: inline-flex; align-items: center; gap: 5px; }

    /* modal / drawer */
    .scrim { position: fixed; inset: 0; background: rgba(20,25,35,.44); backdrop-filter: blur(2px); z-index: 60; display: none; }
    .scrim.open { display: block; }
    .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: 560px; max-width: 94vw; background: var(--white); z-index: 61; box-shadow: -10px 0 40px rgba(20,25,35,.16); transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }
    /* full-screen variant — the episode view opened from a show record */
    .drawer--full { width: min(1020px, 96vw); max-width: none; left: 50%; right: auto; top: 20px; height: calc(100vh - 20px);
                    border-radius: 16px 16px 0 0; transform: translate(-50%, 102%); box-shadow: 0 -12px 48px rgba(20,25,35,.22); }
    .drawer--full.open { transform: translate(-50%, 0); }
    /* wide variant — the flight drawer runs two columns: numbers left, video + links right */
    .drawer--wide { width: min(1120px, 96vw); }
    .spotcols { display:grid; grid-template-columns:1fr 1.05fr; gap:0 26px; align-items:start; }
    @media (max-width: 1040px){ .spotcols { grid-template-columns:1fr; } }
    .drawer__head { padding: 20px 24px; border-bottom: 1px solid var(--border-light); display: flex; align-items: flex-start; justify-content: space-between; }
    .drawer__body { padding: 22px 24px; overflow-y: auto; flex: 1; }
    .drawer__foot { padding: 16px 24px; border-top: 1px solid var(--border-light); display: flex; gap: 10px; justify-content: flex-end; }
    .x { border: none; background: var(--secondary-lite); width: 30px; height: 30px; border-radius: 8px; color: var(--text-secondary); font-size: 16px; display: grid; place-items: center; }

    /* modal center */
    .modal { position: fixed; z-index: 61; top: 50%; left: 50%; transform: translate(-50%,-46%); width: 720px; max-width: 94vw; max-height: 90vh; overflow-y: auto; background: var(--white); border-radius: 16px; box-shadow: var(--shadow-hover); opacity: 0; pointer-events: none; transition: .22s; }
    .modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%); }

    .kv dt { color: var(--text-tertiary); font-weight: 600; }
    .kv dd { font-weight: 600; }

    .field { margin-bottom: 15px; }
    .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
    .field input, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; font-size: 13.5px; font-family: inherit; color: var(--text-primary); background: var(--white); }
    .field input:focus, .field select:focus { outline: none; border-color: var(--primary); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .footnote { margin-top: 26px; font-size: 11.5px; color: var(--text-tertiary); text-align: center; }
    .muted { color: var(--text-tertiary); }
    .empty { text-align: center; padding: 40px 20px; color: var(--text-tertiary); font-size: 13px; }

    /* air check agent scan */
    .scanbar { height: 4px; background: var(--secondary-lite); border-radius: 999px; overflow: hidden; }
    .scanbar__fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--c2), var(--c3)); transition: width .3s; }
    .agentrow { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border: 1px solid var(--border-light); border-radius: 12px; background: var(--white); }
    .agentrow + .agentrow { margin-top: 10px; }
    .thumb { width: 92px; height: 52px; border-radius: 8px; object-fit: cover; background: var(--secondary-lite); flex-shrink: 0; }
    .pulse-blue { animation: pulseb 1.4s infinite; }
    /* flight-row CTAs: one min-width for all so the column never shifts;
       In progress is a quiet underlined link until it becomes a real ask */
    .fcta { min-width: 92px; justify-content: center; text-align: center; }

    /* advertiser portal */

    .askwrap input:focus { outline:none; border-color:var(--border-strong); box-shadow:var(--shadow-hover); }
    .askwrap input::placeholder { color:var(--text-tertiary); }

    /* ─── MANAGE SHOWS GRID (ported from inventory-demo3) ─── */
    .msheet-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; }
    .msheet-toolbar { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-bottom: 1px solid var(--border); }
    .msheet-search { flex: 1; max-width: 320px; display: flex; align-items: center; gap: 9px; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 7px 12px; color: var(--text-tertiary); }
    .msheet-search input { border: none; outline: none; background: none; font-family: inherit; font-size: 13px; font-weight: 500; color: var(--text-primary); width: 100%; }

    .msheet .mh { background: var(--secondary-lite); border-bottom: 1px solid var(--border); border-right: 1px solid var(--border-light); padding: 11px 10px; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-align: center; white-space: nowrap; }

    .mshowcell--btn:hover { background: var(--secondary-lite); }
    .mshowdetail { display:flex; align-items:center; gap:1px; font-size:10.5px; font-weight:600; color:var(--blue-text); margin-top:1px; }
    .mshowcell--btn:hover .mshowdetail { text-decoration: underline; }
    .mshowcell { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 50px; overflow: hidden; }
    .mthumb { width: 32px; height: 32px; border-radius: 8px; background: var(--primary); color: var(--panel); display: grid; place-items: center; font-size: 11px; font-weight: 800; flex-shrink: 0; letter-spacing: -.02em; }
    .mshowname { font-size: 12.5px; font-weight: 700; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .maffix { font-size: 12px; font-weight: 400; color: var(--text-tertiary); }

    /* ─── transcript ─── */

    .txhd { display:flex; align-items:center; justify-content:space-between; padding:9px 12px; background:var(--secondary-lite); border-bottom:1px solid var(--border-light); }
    .txhd span { font-size:10px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--text-tertiary); }

    /* ─── one work row, used for every kind of item ─── */

    .fnum { text-align:center; font-size:13px; font-weight:500; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
    .fnum small { display:block; font-size:10.5px; font-weight:500; color:var(--text-tertiary); letter-spacing:0; margin-top:1px; }

            padding:4px 0; border-radius:7px; border:1px solid var(--border); background:var(--panel); color:var(--text-primary);
            font-variant-numeric:tabular-nums; cursor:pointer; overflow:hidden; }
    .fran:hover { border-color:var(--border-strong); }
    .fran--no { border-style:dashed; color:var(--text-tertiary); font-weight:400; cursor:default; white-space:nowrap; font-size:11px; }
    .wdots { width:26px; height:26px; border:none; border-radius:8px; background:none; color:var(--text-tertiary);
             display:grid; place-items:center; padding:0; cursor:pointer; justify-self:center; font-size:14px; font-weight:800; letter-spacing:1px; }
    .wdots:hover { background:var(--nav-hover); color:var(--text-primary); }

                   padding:8px 11px; font-size:12.5px; font-weight:600; color:var(--text-primary); cursor:pointer; }
    .wpop button:hover { background:var(--nav-hover); }
    .wnote { display:flex; align-items:center; gap:11px; padding:8px 10px 8px 14px; background:var(--page-bg);
             border:1px solid var(--border-light); border-radius:12px; cursor:pointer; }

    .wnote__body b { font-size:12.5px; }
    .wnote__txt { font-size:12px; color:var(--text-secondary); margin-left:8px; }
    .wnote__x { flex-shrink:0; width:24px; height:24px; border-radius:50%; border:none; background:var(--secondary-lite);
                color:var(--text-secondary); font-size:11px; line-height:1; cursor:pointer; display:grid; place-items:center; }
    .wnote__x:hover { background:var(--border); color:var(--text-primary); }
    .archdiv { display:flex; align-items:center; gap:9px; width:100%; margin:22px 0 10px; padding:0 2px; font-size:11px; font-weight:800;
               letter-spacing:.07em; text-transform:uppercase; color:var(--text-tertiary); border:none; background:none; cursor:pointer; font-family:inherit; }

    /* ─── show / brand sign-off toggles ─── */

    .curvewrap { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 14px 10px; }
    .curvekey { display:flex; flex-wrap:wrap; gap:14px; padding:2px 4px 0; }
    .curvekey span { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:400; color:var(--text-secondary); }
    .curvekey i { width:14px; height:0; border-top:2px solid; border-radius:2px; }

        .kv { display:flex; align-items:baseline; justify-content:space-between; gap:20px; font-size:13px; padding:10px 0; border-bottom:1px solid var(--border-light); }
    .kv:last-child { border-bottom:0; }
    .kv span { color:var(--text-secondary); font-weight:500; white-space:nowrap; }
    .kv b { font-weight:700; text-align:right; }

    .dhead { font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--text-primary); margin:18px 0 2px; }
    .srcpill { font-size:9.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:2px 6px; border-radius:5px; background:var(--secondary-lite); color:var(--text-tertiary); }
    .srcpill.booster { background:var(--purple-bg); color:var(--purple-text); }

    @media (max-width: 900px) { .tiles { grid-template-columns: repeat(2,1fr); } }

  <script>
  /* ═══════════════════════════ SEED / STORE ═══════════════════════════ */
  const TODAY = '2026-08-17';                 // Monday

  // Ad-read quality score — read completeness, delivery, placement, verification
  function qualityScore(s){
    const copyPts = Math.min((s.copy||[]).length,3)/3;
    const pr = projection(s);
    const deliv = Math.min((pr?pr.ratio:0),1.2)/1.2;
    const pos = (s.ts||0)/epLenOf(s);
    const placement = (pos>=0.08 && pos<=0.75) ? 1 : (pos<0.08 ? 0.7 : 0.55);
    const verified = s.status==='verified' ? 1 : 0.6;
    const score = Math.round((copyPts*0.30 + deliv*0.30 + placement*0.20 + verified*0.20)*100);
    const grade = score>=90?'A':score>=80?'B':score>=70?'C':'D';
    const tone = score>=90?'green':score>=80?'blue':score>=70?'orange':'red';
    return { score, grade, tone, factors:[
      {k:'Copy read complete', v:Math.round(copyPts*100)},
      {k:'Projected delivery', v:Math.round(deliv*100)},
      {k:'Mid-roll placement', v:Math.round(placement*100)},
      {k:'Air check verified', v:Math.round(verified*100)},
    ]};
  }

  function ring(pct, {size=64,thick=8,color='var(--green-text)'}={}){
    const r=(size-thick)/2,c=size/2,C=2*Math.PI*r,len=Math.min(pct,150)/100*C;
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--secondary-lite)" stroke-width="${thick}"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${thick}" stroke-linecap="round" stroke-dasharray="${len} ${C}" transform="rotate(-90 ${c} ${c})"/><text x="${c}" y="${c+4}" text-anchor="middle" font-size="14" font-weight="800" fill="var(--text-primary)">${pct}%</text></svg>`;

  /* ═══════════════════════════ ASK ═══════════════════════════ */
  let CHATS=[];

  const goChip=(label,view)=>`<button class="btn btn--ghost btn--sm" style="margin-top:10px" onclick="go('${view}')">${label}</button>`;
  const nameOf = s => `${esc(s.brand)} on ${esc(show(s.showId).name)}`;
  function answerQuery(raw){
    const q=raw.toLowerCase().trim();
    const live=SPOTS.filter(s=>projection(s));
    const brandHit=[...new Set(SPOTS.map(s=>s.brand))].find(b=>q.includes(b.toLowerCase()));
    const showHit=SHOWS.find(s=>q.includes(s.name.toLowerCase())||q.includes(s.host.toLowerCase()));
    if(brandHit && showHit){
      const sp=live.filter(s=>s.brand===brandHit&&s.showId===showHit.id).sort((x,y)=>liveDays(y)-liveDays(x))[0];
      if(sp){ const v=verdict(sp), pr=v.pr;
        return `<b>${nameOf(sp)}</b> is day ${pr.day} of 30. ${K(pr.got)} delivered against ${K(sp.guarantee)} — reads <b>${Math.round(pr.rawRatio*100)}%</b> raw, but ${esc(showHit.name)} only has ${Math.round(pr.curvePct*100)}% of views in by now. Projects <b>${K(pr.proj)}</b> = <b>${Math.round(pr.ratio*100)}%</b>. ${v.k==='short'?'Lands short — make good needed.':'Clears the 90% line.'}`; }
    }
    if(/make ?good|short|under.?deliver/.test(q)){
      const need=needsMakegood();
      return need.length?`${need.length} flight${need.length>1?'s':''} project${need.length>1?'':'s'} under 90%: `+need.map(x=>`<b>${nameOf(x)}</b> (${Math.round(verdict(x).pr.ratio*100)}%, ${K(shortfall(x))} short)`).join(', ')+`.`:`Nothing new projecting short.`;
    }
    if(/behind|pacing|pace|track/.test(q)){
      const soft=live.filter(x=>{const v=verdict(x);return v.pr&&v.pr.rawRatio<0.75&&v.k!=='short';});
      const bad=live.filter(x=>verdict(x).k==='short');
      return (bad.length?`Behind: `+bad.map(x=>`<b>${nameOf(x)}</b> (${Math.round(verdict(x).pr.ratio*100)}%)`).join(', ')+`. `:`Nothing behind. `)
        +(soft.length?`${soft.map(x=>`<b>${nameOf(x)}</b>`).join(', ')} look${soft.length>1?'':'s'} light on raw numbers but the curve says ${soft.length>1?'they land':'it lands'} fine.`:'');
    }
    if(/check.?in|note/.test(q)){
      const notes=DEALS.filter(d=>d.outcome==='won'&&(d.notes||'').trim());
      const due=DEALS.filter(d=>d.checkIn&&d.checkIn<=TODAY);
      return (notes.length||due.length)
        ? (notes.map(d=>`<b>${esc(d.brand)} · ${esc(d.title)}</b>: ${esc(d.notes)}`).join('<br>')

        : `No open check-ins or admin notes.`;
    }
    if(/copy|cta|opened/.test(q)){
      const n=SPOTS.filter(x=>['needs_copy','needs_cta'].includes(x.copyStatus)), u=SPOTS.filter(x=>x.copyStatus==='sent');
      return (n.length?`${n.length} spot${n.length>1?'s':''} need copy or a CTA: `+n.map(x=>`<b>${nameOf(x)}</b>`).join(', ')+`. `:`All copy is in. `)+(u.length?`${u.length} copy email${u.length>1?'s':''} sent but not opened.`:'');
    }
    if(/guarantee|too high|fill rate|bonus/.test(q)){
      const adv=guaranteeAdvice(), f=fillStats();
      return `Paid fill rate is <b>${f.rate}%</b> (${f.paid} sold, ${f.free} given).`+(adv.length?` <b>${esc(show(adv[0].showId).name)}</b> needed a make good on ${adv[0].shortCount} of its last ${adv[0].flights} flights — reads land near ${K(adv[0].typical)}, so drop the guarantee to ${K(adv[0].suggest)} from ${K(adv[0].current)}.`:'')+goChip('Open Shows →','shows');
    }
    if(showHit) return `<b>${esc(showHit.name)}</b> publishes ${showHit.publishDays.join('/')}, ${showHit.positionsPerEp} positions an episode, ${K(showHit.guarantee)} guarantee. <b>${Math.round(curveAt(showHit.curve,2)*100)}%</b> of views land inside 48h, off ${showHit.samples} reads.`+goChip('Open Shows →','shows');
    if(brandHit){
      const sp=live.filter(x=>x.brand===brandHit); if(!sp.length) return `${esc(brandHit)} has nothing live.`;
      const g=sp.reduce((t,x)=>t+x.guarantee,0), pj=sp.reduce((t,x)=>t+projection(x).proj,0);
      return `<b>${esc(brandHit)}</b> — ${sp.length} flight${sp.length>1?'s':''}, projecting ${K(pj)} against ${K(g)} = <b>${pctOf(pj,g)}%</b>.`+goChip('Open Portal →','portal');
    }
    return `Try "will Kalshi on Sage Steele deliver?", "what needs a make good?", or "which guarantees are too high?"`;
  }

  /* ═══════════════════════════ SHARED ═══════════════════════════ */
  const toneVar = t => ({green:'var(--green-text)',red:'var(--red-text)',orange:'var(--orange-text)',blue:'var(--blue-text)',purple:'var(--purple-text)',grey:'var(--text-tertiary)'}[t]||'var(--text-secondary)');
  function projBar(s){
    const pr=projection(s); if(!pr) return '';

      <div title="90% IAB line" style="position:absolute;top:-3px;bottom:-3px;left:${w(s.guarantee*IAB_FULL)}%;width:2px;background:var(--green-text)"></div></div>`;
  }

  /* One line for what landed, one dashed line for where it goes, one goal.
     The goal drawn is the 90% IAB line — the number that actually decides. */

  let SELSET=null, SELFOR=null;

  let DRAWER_SPOT=null, DRAWER_FULL=false;

  function dealChart(sel,{w=470,h=200}={}){
    const spots=sel.filter(x=>projection(x)); if(!spots.length) return '<div class="empty">Nothing selected.</div>';
    const start=spots.map(x=>x.published).sort()[0];
    const end=spots.map(x=>addDays(x.published,30)).sort().slice(-1)[0];
    const span=Math.max(daysBetween(start,end),1), today=Math.min(Math.max(daysBetween(start,TODAY),0),span);
    const goal=Math.round(spots.reduce((a,x)=>a+x.guarantee,0)*IAB_FULL);
    const total=d=>spots.reduce((acc,x)=>{ const pr=projection(x); const dd=d-daysBetween(start,x.published);
      return dd<=0?acc:acc+curveAt(show(x.showId).curve,Math.min(dd,30))*pr.proj; },0);
    const padL=14,padR=52,padT=18,padB=26, max=Math.max(goal,total(span))*1.15;
    const X=d=>padL+(w-padL-padR)*(d/span), Y=v=>h-padB-(h-padT-padB)*(v/max);
    const pts=[]; for(let d=0;d<=span;d++) pts.push([X(d),Y(total(d))]);
    const solid=pts.slice(0,today+1).map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1));
    const dash=pts.slice(Math.max(today,0)).map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1));
    return `<svg viewBox="0 0 ${w} ${h}" width="100%">
      <line x1="${padL}" x2="${w-padR}" y1="${h-padB}" y2="${h-padB}" stroke="var(--border)"/>
      ${spots.map(x=>{ const d=daysBetween(start,x.published);
        return `<line x1="${X(d)}" x2="${X(d)}" y1="${h-padB}" y2="${h-padB+4}" stroke="var(--text-tertiary)" stroke-width="1.5"/>
        <text x="${X(d)}" y="${h-9}" text-anchor="middle" font-size="9" font-weight="600" fill="var(--text-tertiary)">${fmtDate(x.published)}</text>`; }).join('')}
      <line x1="${padL}" x2="${w-padR}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--text-tertiary)" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text x="${w-padR+7}" y="${Y(goal)+3.5}" font-size="10.5" font-weight="700" fill="var(--text-secondary)">Goal ${K(goal)}</text>
      ${dash.length>1?`<path d="M${dash.join(' L')}" fill="none" stroke="var(--green-text)" stroke-width="2" stroke-dasharray="5 4" opacity=".5"/>`:''}
      <path d="M${solid.join(' L')}" fill="none" stroke="var(--green-text)" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="${X(today)}" cy="${Y(total(today))}" r="4.5" fill="var(--green-text)" stroke="var(--panel)" stroke-width="2"/>
      <text x="${X(span)}" y="${Y(total(span))-10}" text-anchor="end" font-size="11.5" font-weight="800" fill="var(--green-text)">${K(Math.round(total(span)))}</text>
    </svg>
    <div class="curvekey"><span><i style="border-color:var(--green-text)"></i>Delivered</span>
      <span><i style="border-color:var(--green-text);border-top-style:dashed"></i>Where it lands</span></div>`;
  }

  /* One sorter for every flight table - Needs you and All flights sort alike.
     Spots without a projection sort to the bottom on numeric keys. */
  function sortFlights(list){
    const fv={ad:s=>nameOf(s).toLowerCase(), day:s=>projection(s)?projection(s).day:-1,
              delivered:s=>projection(s)?projection(s).got:-1, pacing:s=>projection(s)?projection(s).ratio:-1};
    const f=fv[delSort.k]; if(!f) return list;
    return list.slice().sort((a,b)=>{ const x=f(a),y=f(b); return (x>y?1:x<y?-1:0)*delSort.dir; });
  }

  /* Three words on the button, and only one of them is dark.
     In progress → running, nothing to do. Verified → it landed.
     Make good → it came in under, and that is the only thing worth shouting. */
  function ctaFor(s){
    const pr=projection(s), v=verdict(s), m=mgForSpot(s.id);
    if(v.k==='short') return { label:'Make good', dark:!m };
    if(!pr || !pr.confident || s.status!=='verified') return { label:'In progress', dark:false };
    return { label:'Review', dark:false };
  }

  /* One row, used by Needs you and All flights alike. Six columns:

  function flightRow(s){
    const pr=projection(s), v=verdict(s), sh=show(s.showId), m=mgForSpot(s.id), c=ctaFor(s);
    const dash='<span class="muted">—</span>';

        ? `<button class="fran" onclick="playClip('${s.yt}',${s.ts})" title="Hear the read"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>${mmss(s.ts)}</button>`
        : `<span class="fran fran--no">${s.status==='scheduled'?'due '+fmtDate(s.published):s.missed?'Overdue '+fmtDate(s.published):'due today'}</span>`}

  /* In progress is a quiet underlined link — nothing to do yet. The moment it
     turns into Review or Make good it becomes a real button: time to act.

  const dcta=(label,onclick,dark)=>label==='In progress'
    ? `<button class="fcta fcta--quiet" onclick="${onclick}">${label}</button>`

  // Needs you: the same rows, filtered to the ads that want something.
  function workList(){
    const wants=new Set();
    SPOTS.filter(s=>s.status==='aired'&&s.missed).forEach(s=>wants.add(s.id));
    needsMakegood().forEach(s=>wants.add(s.id));
    MAKEGOODS.filter(m=>m.status!=='scheduled').forEach(m=>wants.add(m.spotId));

    SPOTS.filter(s=>['needs_copy','needs_cta','sent'].includes(s.copyStatus)).forEach(s=>wants.add(s.id));
    SPOTS.filter(s=>closedOut(s)&&!s.completed).forEach(s=>wants.add(s.id));
    let ids=[...wants].map(spot).sort((a,b)=>liveDays(b)-liveDays(a));
    if(delShowF!=='All shows') ids=ids.filter(s=>show(s.showId).name===delShowF);
    if(delQ2.trim()){ const q=delQ2.trim().toLowerCase(); ids=ids.filter(s=>nameOf(s).toLowerCase().includes(q)); }
    ids=sortFlights(ids);
    // Deal-level check-ins: admin notes and the check-in date Sydney sets.
    // One quiet line each, pinned above the table until she clears them (Aug 24, 9:37).
    const noteRow=(d,label,text,clearFn)=>`<div class="wnote" onclick="go('portal');openDeal('${d.id}')">

    </div>`;
    const checkRows=[];
    DEALS.filter(d=>d.outcome==='won'&&(d.notes||'').trim()).forEach(d=>checkRows.push(noteRow(d,'Note',d.notes,'clearDealNote')));
    DEALS.filter(d=>d.checkIn&&d.checkIn<=TODAY).forEach(d=>checkRows.push(noteRow(d,'Check-in',`You set a check-in for ${fmtDate(d.checkIn)} — how's it going?`,'clearCheckIn')));

    const arch=ids.filter(x=>isArchived(x.id));

    }
    active.count=ids.length-arch.length+checkRows.length;
    active.checks=checkRows.join('');
    return active;
  }

  // The agent's auto-detected numbers, hand-correctable when they land slightly off.

      <div class="scanbar"><div class="scanbar__fill" id="scanFill"></div></div></div></div>`;
    const finds={ s11:{yt:'dQw4w9WgXcQ',ts:455,epLen:5380,views:9200,downloads:1400,copy:['Named the brand','Read promo code KALSHI','Free-trial CTA']},
                  s12:{yt:'ScMzIvxBSi4',ts:612,epLen:6100,views:31000,downloads:0,copy:['Named the brand','URL CTA']}, s13:{miss:true} };
    const steps=['Scanning channels…','The Rubin Report posted 3h ago — pulling transcript…','Matching the read to the Kalshi copy…','Warren Smith posted 6h ago — reading views…','Nate has no episode yet — flagging…','Writing links + timestamps to Airtable…'];
    for(let i=0;i<steps.length;i++){ const l=q('#scanLabel'); if(l) l.textContent=steps[i];

      if(r.ok){ const j=await r.json(); const seg=findAd(j,'Kalshi'); if(seg) finds.s11.ts=Math.round(seg.start); }
    }catch(e){}

      if(f.miss){ s.missed=true; return; } Object.assign(s,f,{status:'verified'}); });

    const g=paidLive.reduce((a,s)=>a+s.guarantee,0), got=liveSpots.reduce((a,s)=>a+(delivered(s)||0),0);
    const proj=liveSpots.reduce((a,s)=>a+projection(s).proj,0), paid=paidLive.reduce((a,s)=>a+spotCost(s),0);
    const done=paidLive.length&&paidLive.every(s=>projection(s).final)&&!spots.some(s=>s.status==='scheduled'||s.status==='aired');
    const state = !liveSpots.length ? 'upcoming' : done ? 'complete' : 'live';
    const callable=paidLive.filter(s=>projection(s).confident);
    const gC=callable.reduce((a,s)=>a+s.guarantee,0), projC=callable.reduce((a,s)=>a+projection(s).proj,0);
    const blocked = liveSpots.some(s=>verdict(s).k==='blocked');

      : projC>=gC ? {k:'full', label:done?'Delivered in full':'Tracking over', tone:'green', rank:4}
      : mgs.length ? {k:'mg', label:'Make good booked', tone:'purple', rank:2}
      : {k:'under', label:'Tracking under', tone:'orange', rank:0};
    const first=spots[0], last=spots[spots.length-1];
    return { deal:d, brand:d.brand, title:d.title||'Flight', spots, liveSpots, paidLive, mgs, g, got, proj, paid, done, state, status,
      shows:[...new Set(spots.map(s=>s.showId))],
      yt:liveSpots.reduce((a,s)=>a+(s.views||0),0), aud:liveSpots.reduce((a,s)=>a+(s.downloads||0),0),

                 :`<div class="muted" style="font-size:11.5px;max-width:230px;overflow:hidden;text-overflow:ellipsis">${esc(epTitle(s))}</div>`}</td>

  const pStat=(l,v,dark)=>`<div class="pstat${dark?' pstat--dark':''}"><div class="pstat__l">${l}</div><div class="pstat__v">${v}</div></div>`;


  // Plain English, written for the advertiser reading the report.
  const PRE_LINES={
    rubin:"…and that's the part nobody wants to say out loud. Alright — quick word from a partner and we'll get straight back into it.",
    sage:"…which is exactly why the reaction was so overblown. Let me pause there for one second, because this one I actually use.",

  const POST_LINES={

  function transcript(s){
    const cr=creative(s.brand), sh=show(s.showId), dur=adSecs(s), start=s.ts;
    const words=cr.copy.split(/\s+/), lines=[]; let cur=[];
    words.forEach(w=>{ cur.push(w); if(cur.length>=11){ lines.push(cur.join(' ')); cur=[]; } });
    if(cur.length) lines.push(cur.join(' '));
    const step=dur/Math.max(lines.length,1);
    const out=[{ t:Math.max(0,start-13), text:PRE_LINES[sh.id]||'…and we will pick that back up in a moment. Quick word from a partner first.', ad:false }];
    lines.forEach((l,i)=>out.push({ t:Math.round(start+i*step), text:l, ad:true }));
    out.push({ t:start+dur+4, text:POST_LINES[sh.id]||'Right — back to it.', ad:false });
    return out;
  }
  function transcriptBlock(s){
    if(!s.yt) return '';
    const cr=creative(s.brand);
    return `<div class="txwrap">
      <div class="txhd"><span>Episode transcript</span>

    </div>
    <div class="muted" style="font-size:11.5px;margin-top:8px;line-height:1.5">Pulled from the episode and matched against the brief${(s.copy||cr.points).length?` — ${(s.copy||cr.points).join(', ').toLowerCase()} all present`:''}.</div>`;
  }


  function readNote(s){
    const pr=projection(s), v=verdict(s), m=mgForSpot(s.id);
    if(s.dlState==='requested') return 'Video counted. Waiting on the audio numbers from the show.';
    // A read that cannot be called yet gets a factual line, not a verdict. Views
    // build for a month, and a low early number is normal — not a warning.
    if(!pr.confident) return `Just live. ${esc(show(s.showId).name)} builds views over the first month; the number closes ${fmtDate(addDays(s.published,30))}.`;
    if(v.k==='bonus') return pr.final?`Delivered in full, plus ${K(pr.proj-s.guarantee)} bonus impressions.`:'Tracking over the guarantee.';
    if(v.k==='full')  return pr.final?'Delivered in full.':'On track to full delivery.';
    return m&&m.date?`Under the guarantee. An extra read is booked for ${fmtDate(m.date)} at no cost.`
                    :'Under the guarantee. We are adding a read at no cost.';
  }
  function openRead(id){
    const s=spot(id), sh=show(s.showId), pr=projection(s), v=verdict(s), cr=creative(s.brand);
    const waiting=s.dlState==='requested';
    const fact=(l,val)=>`<div><div style="font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary)">${l}</div><div style="font-size:14px;font-weight:700;margin-top:3px">${val}</div></div>`;
    openDrawer(`<div class="drawer__head"><div>
        ${pr.confident?`<span class="tag tag--${v.tone}"><i></i>${Math.round(pr.ratio*100)}% of guarantee</span>`:'<span class="tag tag--blue"><i></i>Just live</span>'}
        <h2 style="font-size:18px;font-weight:800;margin-top:8px">${esc(epTitle(s))}</h2>
        <div class="muted" style="font-size:12px">${esc(sh.name)} · ${fmtDate(s.published)} · ${esc(cr.len)} ${esc(cr.placement).toLowerCase()}</div>
      </div><button class="x" onclick="closeOverlays()">✕</button></div>
    <div class="drawer__body">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
        ${fact('Delivered',K(pr.got))}
        ${fact(pr.final?'Final':'Projected',pr.confident?K(pr.proj):'<span class="muted">building</span>')}
        ${fact('Video',K(s.views||0))}
        ${fact('Audio',sh.simulcast?(waiting?'<span class="muted">pending</span>':K(s.downloads||0)):'<span class="muted">—</span>')}
      </div>
      <div class="muted" style="font-size:12.5px;margin-top:11px;line-height:1.55">${esc(readNote(s))}</div>

      ${s.yt?`<div style="margin-top:16px;background:var(--primary);border-radius:12px;padding:14px 16px;color:var(--panel);display:flex;align-items:center;gap:14px">
        <button onclick="playClip('${s.yt}',${s.ts})" style="width:40px;height:40px;border-radius:50%;border:none;background:rgba(128,128,128,.28);color:inherit;font-size:14px;flex-shrink:0">▶</button>
        <div style="flex:1;min-width:0"><b style="font-size:13px">Hear the read · ${mmss(s.ts)}–${mmss(s.ts+adSecs(s))}</b>
        <div style="font-size:11.5px;opacity:.72;margin-top:2px">${(s.copy||cr.points).join(' · ')}</div></div>
      </div>
      <div style="margin-top:16px">${transcriptBlock(s)}</div>`:''}

      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border-light)">
        <div style="font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em">What the host was briefed to read</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:13px 0">
          ${fact('Placement',esc(cr.placement))}${fact('Read length',esc(cr.len))}
          ${fact('Promo code',cr.code?esc(cr.code):'<span class="muted">none</span>')}${fact('Offer',esc(cr.cta)||'—')}
        </div>
        <div style="background:var(--page-bg);border:1px solid var(--border-light);border-radius:11px;padding:13px 15px;font-size:12.5px;line-height:1.7">${esc(cr.copy)}</div>
        ${cr.url?`<div style="display:flex;align-items:center;gap:8px;margin-top:10px">
          <span style="font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary)">Landing</span>
          <a href="https://${esc(cr.url)}" target="_blank" style="font-size:12.5px;color:var(--blue-text);font-weight:600;text-decoration:none">${esc(cr.url)} ↗</a></div>`:''}
      </div>
    </div>
    <div class="drawer__foot"><button class="btn btn--ghost" onclick="closeOverlays()">Close</button>
      ${s.yt?`<a href="${clipUrl(s)}" target="_blank" class="btn btn--primary" style="text-decoration:none">Open the episode ↗</a>`:''}</div>`);
  }




  /* ═══════════════════════════ VIEW: SHOWS ═══════════════════════════ */
  /* ═══════════════════════════ MANAGE SHOWS GRID ═══════════════════════════
     Ported from the inventory demo: editable cells with a drag-fill handle.
     This is where show setup gets changed. Everything else only reads it. */
  const SHEET_COLS=[
    { key:'cpm',            label:'CPM',             type:'money',  w:82  },
    { key:'guarantee',      label:'Impr. guarantee', type:'int',    w:124 },
    { key:'epsPerWeek',     label:'Releases/wk',     type:'num',    w:102 },
    { key:'positionsPerEp', label:'Ad positions',    type:'int',    w:104 },
    { key:'delivery',       label:'Delivery',        type:'select', opts:['Video Only','Simulcast','Audio Only'], w:118 },
    { key:'audioSrc',       label:'Audio numbers',   type:'select', opts:['auto from host','request creator','n/a'], w:130 },
    { key:'scanEvery',      label:'Scan every',      type:'select', opts:['12h','24h','48h'], w:98 },
    { key:'revShare',       label:'Rev share',       type:'pct',    w:90  },
    { key:'mgPolicy',       label:'Make goods',      type:'select', opts:['auto','ask first'], w:104 },
  ];
  const AUDIO_LABEL={hosting:'auto from host', request:'request creator', none:'n/a'};
  const AUDIO_VALUE={'auto from host':'hosting','request creator':'request','n/a':'none'};

  function cellGet(sh,key){
    if(key==='delivery') return sh.simulcast?'Simulcast':(sh.audioSrc==='none'?'Video Only':'Audio Only');
    if(key==='audioSrc') return AUDIO_LABEL[sh.audioSrc]||'n/a';
    if(key==='scanEvery') return sh.scanEvery+'h';
    if(key==='revShare')  return Math.round(sh.revShare*100);
    if(key==='mgPolicy')  return sh.mgPolicy==='auto'?'auto':'ask first';
    return sh[key];
  }
  function cellSet(sh,key,raw){
    if(key==='delivery'){
      sh.simulcast = raw==='Simulcast';
      if(raw==='Video Only') sh.audioSrc='none';
      else if(sh.audioSrc==='none') sh.audioSrc='hosting';
      return;
    }
    if(key==='audioSrc'){ sh.audioSrc=AUDIO_VALUE[raw]||'none'; if(sh.audioSrc==='none') sh.simulcast=false; return; }
    if(key==='scanEvery'){ sh.scanEvery=parseInt(raw)||24; return; }
    if(key==='revShare'){ sh.revShare=Math.min(100,Math.max(0,parseFloat(raw)||0))/100; return; }
    if(key==='mgPolicy'){ sh.mgPolicy = raw==='auto'?'auto':'ask'; return; }
    const n=parseFloat(String(raw).replace(/[^0-9.]/g,''));
    if(!isNaN(n)) sh[key]= key==='epsPerWeek' ? n : Math.round(n);
  }

  let gridSel=null, gridDrag=null, gridQuery='', gridDirty=false;
  const gridRows = () => { const q=gridQuery.trim().toLowerCase();
    return q?SHOWS.filter(x=>x.name.toLowerCase().includes(q)||x.host.toLowerCase().includes(q)):SHOWS; };

  function selectCell(id,key){ gridSel={id,key}; renderGrid(); }
  function startFill(e,id,key){ e.stopPropagation(); e.preventDefault();
    const rows=gridRows(); gridDrag={key, from:rows.findIndex(x=>x.id===id), to:rows.findIndex(x=>x.id===id), srcId:id}; }
  function fillEnter(id){ if(!gridDrag) return; const rows=gridRows();
    const i=rows.findIndex(x=>x.id===id); if(i>=gridDrag.from){ gridDrag.to=i; renderGrid(); } }
  function endFill(){
    if(!gridDrag) return;
    const rows=gridRows(), {key,from,to,srcId}=gridDrag; gridDrag=null;
    if(to>from){
      const src=cellGet(show(srcId),key);
      for(let i=from+1;i<=to;i++) cellSet(rows[i],key,src);
      gridDirty=true; renderGrid(); refreshBadges();
      toast(`Filled ${SHEET_COLS.find(c=>c.key===key).label} down ${to-from} row${to-from>1?'s':''}.`);
    } else renderGrid();
  }
  document.addEventListener('mouseup', endFill);

  function gridEdit(id,key,raw){ cellSet(show(id),key,raw); gridDirty=true; markGridDirty(); }
  function gridCommit(id,key,raw){ cellSet(show(id),key,raw); gridDirty=true; renderGrid(); refreshBadges(); }
  function markGridDirty(){ const b=document.getElementById('gridSave'); if(b){ b.textContent='Save and update'; b.disabled=false; } }
  function saveGrid(){ gridDirty=false; renderGrid(); refreshBadges();
    toast('Show setup saved. Guarantees, positions and scan cadence written back to Booster and Airtable.'); }

  function addShow(){
    const n=SHOWS.length+1;
    SHOWS.push({ id:'new'+n, name:'New show '+n, host:'—', publishDays:['Mon'], epsPerWeek:1, positionsPerEp:2,
      curve:'medium', samples:0, simulcast:false, audioSrc:'none', scanEvery:24, revShare:0.60, mgPolicy:'ask',
      guarantee:50000, cpm:20, category:'—', channel:'@new', src:'manual' });
    gridDirty=true; renderGrid(); toast('Show added. Fill in its setup, then save.');
  }
  function deleteShow(id){
    if(SPOTS.some(x=>x.showId===id)){ toast(`${show(id).name} has spots booked — clear them before removing it.`); return; }
    const i=SHOWS.findIndex(x=>x.id===id); if(i>-1) SHOWS.splice(i,1);
    gridDirty=true; renderGrid(); refreshBadges(); toast('Show removed.');
  }

  function sheetControl(sh,col){
    const v=cellGet(sh,col.key);
    if(col.type==='select') return `<select class="mctl mctl--select" onmousedown="event.stopPropagation()" onchange="gridCommit('${sh.id}','${col.key}',this.value)">${col.opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    const pre=col.type==='money'?'<span class="maffix">$</span>':'';
    const suf=col.type==='pct'?'<span class="maffix">%</span>':'';
    return `<span class="mnum">${pre}<input class="mctl mctl--num" type="text" inputmode="decimal" value="${v}"
      onmousedown="event.stopPropagation()"
      oninput="gridEdit('${sh.id}','${col.key}',this.value)"
      onchange="gridCommit('${sh.id}','${col.key}',this.value)">${suf}</span>`;
  }

  function renderGrid(){
    const host=document.getElementById('gridHost'); if(!host) return;
    const rows=gridRows();
    host.innerHTML=`
      <div class="msheet-card">
        <div class="msheet-toolbar">
          <div class="msheet-search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input placeholder="Search shows…" value="${esc(gridQuery)}" oninput="gridQuery=this.value;renderGrid()">
          </div>
          <div class="msheet-tools">
            <button class="btn btn--primary btn--sm" onclick="addShow()">+ Add show</button>
            <button class="btn btn--ghost btn--sm" onclick="toast('Paste a CSV of shows to add them in bulk.')">⬆ Bulk CSV</button>
            <button class="btn btn--ghost btn--sm" onclick="toast('Exported vmg-shows.xlsx')">⬇ Export .xlsx</button>
          </div>
        </div>
        <div class="msheet-scroll"><table class="msheet">
          <thead><tr><th class="mh mh--show">Shows</th>
            ${SHEET_COLS.map(c=>`<th class="mh" style="width:${c.w}px;min-width:${c.w}px">${c.label}</th>`).join('')}
            <th class="mh" style="width:46px"></th></tr></thead>
          <tbody>${rows.map((sh,ri)=>`<tr class="mrow" onmouseenter="fillEnter('${sh.id}')">
            <td class="mtd mtd--show"><button class="mshowcell mshowcell--btn" onclick="openShow('${sh.id}')" title="Open the full show record">
              <div class="mthumb">${esc(sh.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div>
              <div style="min-width:0"><div class="mshowname">${esc(sh.name)}</div>
              <div class="mshowdetail">Details<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></div></div></button></td>
            ${SHEET_COLS.map(c=>{
              const sel = gridSel && gridSel.id===sh.id && gridSel.key===c.key;
              const inR = gridDrag && gridDrag.key===c.key && ri>gridDrag.from && ri<=gridDrag.to;
              return `<td class="mtd" style="width:${c.w}px;min-width:${c.w}px">
                <div class="mcell${sel?' mcell--sel':''}${inR?' mcell--range':''}" onmousedown="selectCell('${sh.id}','${c.key}')">
                  ${sheetControl(sh,c)}
                  ${sel?`<span class="mfill" onmousedown="startFill(event,'${sh.id}','${c.key}')"></span>`:''}
                </div></td>`; }).join('')}
            <td class="mtd" style="text-align:center"><button class="btn btn--ghost btn--sm" style="padding:4px 8px" onclick="deleteShow('${sh.id}')" title="Remove show"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg></button></td>
          </tr>`).join('')}</tbody>
        </table></div>
        <div class="msheet-foot">
          <span class="msheet-total">${rows.length} show${rows.length!==1?'s':''}${gridQuery?' matched':''} · click a cell, then drag the corner handle to fill down</span>
          <button class="btn btn--primary btn--sm" id="gridSave" onclick="saveGrid()" ${gridDirty?'':'disabled style="opacity:.5"'}>${gridDirty?'Save and update':'Saved ✓'}</button>
        </div>
      </div>`;
  }

  /* Each show gets its own page inside the Shows view — same page grammar as
     the rest of the app (back link, pagebar, cards), not a drawer. */
  let SHOW_PAGE=null;
  function openShow(id){ SHOW_PAGE=id; if(CURRENT!=='shows'){ go('shows'); } else RENDER.shows(); document.getElementById('main').scrollTop=0; }
  function closeShow(){ SHOW_PAGE=null; RENDER.shows(); document.getElementById('main').scrollTop=0; }

  function renderShowPage(sh){
    const id=sh.id;
    const live=SPOTS.filter(x=>x.showId===id&&projection(x)).sort((a,b)=>liveDays(a)-liveDays(b));
    const booked=SPOTS.filter(x=>x.showId===id&&x.status==='scheduled');
    const ran=SPOTS.filter(x=>x.showId===id&&x.kind==='paid'&&projection(x));
    const shorts=ran.filter(x=>verdict(x).k==='short').length;
    const owed=wonDeals().filter(d=>d.showId===id).reduce((a,d)=>a+Math.round(d.gross*0.85*sh.revShare),0);
    const adv=guaranteeAdvice().find(x=>x.showId===id);
    const kv=(l,v)=>`<div class="kv"><span>${l}</span><b>${v}</b></div>`;
    document.getElementById('view-shows').innerHTML=`
    <div class="inner" style="max-width:1080px">
      ${setBack(`<button class="tb-plain" onclick="closeShow()">← All shows</button>`)||''}
      <div class="pagebar">
        <div class="head">
          <h1>${esc(sh.name)}</h1>
          <div class="muted" style="font-size:12.5px;margin-top:3px">${esc(sh.host)} · ${esc(sh.category)} · ${esc(sh.channel)}</div>
        </div>
        <div class="pagebar__right"><span class="srcpill ${sh.src==='booster'?'booster':''}">${sh.src}</span></div>
      </div>

      <div class="grid" style="grid-template-columns:repeat(4,1fr);gap:10px">
        ${kpiBox('Guarantee',K(sh.guarantee),`90% = ${K(Math.round(sh.guarantee*IAB_FULL))}`)}
        ${kpiBox('Check-in','day '+checkInDay(sh),'set by its own curve')}
        ${kpiBox('Live reads',live.length,live.length?live.map(x=>esc(x.brand)).join(', '):'none right now')}
        ${kpiBox('Owed',money(owed),`${Math.round(sh.revShare*100)}% rev share`)}
      </div>

      <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;align-items:start">
        <div class="card">
          <div class="card__head"><div><div class="card__title">Show setup</div><div class="card__sub">Maps 1:1 to the Airtable show page; positions and the guarantee come from Booster.</div></div></div>
          <div class="card__pad" style="padding-top:2px">
            ${kv('Publishes', sh.publishDays.join(' · '))}
            ${kv('Episodes a week', sh.epsPerWeek)}
            ${kv('Ad positions an episode', `${sh.positionsPerEp} <em>Booster cap</em>`)}
            ${kv('Rate', money(sh.cpm)+' CPM')}
            ${kv('Delivery numbers', sh.simulcast?`Video + audio <em>${sh.audioSrc==='hosting'?'auto from host':'requested from creator'}</em>`:'Video only')}
            ${kv('Channel scan', 'Every '+sh.scanEvery+'h')}
            ${kv('Rev share', `${Math.round(sh.revShare*100)}% <em>${money(owed)} owed</em>`)}
            ${kv('Make goods', sh.mgPolicy==='auto'?'Auto-schedule':'Ask the show first')}
          </div>
        </div>
        <div class="card">
          <div class="card__head"><div><div class="card__title">Pacing</div><div class="card__sub">Fitted from ${sh.samples} verified reads on this channel.</div></div></div>
          <div class="card__pad" style="padding-top:2px">
            <p style="font-size:13px;line-height:1.6;color:var(--text-secondary);margin:0">
              <b style="color:var(--text-primary)">${Math.round(curveAt(sh.curve,2)*100)}%</b> of a read's views land inside 48 hours and
              <b style="color:var(--text-primary)">${Math.round(curveAt(sh.curve,7)*100)}%</b> by day 7.
              That is why the call gets made on day ${checkInDay(sh)} here rather than on a fixed rule.
              ${shorts?` ${shorts} of the last ${ran.length} flights came in under.`:''}
            </p>
            ${adv?`<div style="margin-top:12px;padding:12px 14px;border:1px solid var(--orange-bg);background:rgba(255,237,213,.4);border-radius:11px;display:flex;align-items:center;gap:11px">
              <div style="flex:1;font-size:12.5px">The guarantee is set above what the show does — reads land near ${K(adv.typical)}.</div>
              <button class="btn btn--ghost btn--sm" onclick="applyGuarantee('${sh.id}',${adv.suggest})">Drop to ${K(adv.suggest)}</button></div>`:''}
            <div class="dhead" style="margin-top:14px">Next avails</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${nextEpisodes(id,5).map(e=>`<span class="tag ${e.open?'tag--green':'tag--grey'}">${dayName(e.date)} ${fmtDate(e.date)} · ${e.open}/${e.cap}</span>`).join('')}</div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:12px">
        <div class="card__head"><div><div class="card__title">How it's tracking</div><div class="card__sub">Every read on this show — live flights project from the show's own curve.</div></div></div>
        <div class="card__pad" style="padding-top:2px;display:flex;flex-direction:column;gap:7px">
          ${live.length||booked.length?`
          ${live.map(x=>{ const pr=projection(x), vv=verdict(x);
            return `<div class="wrow wrow--click" style="padding:11px 13px" onclick="openSpot('${x.id}',1)">
              <div class="wrow__main"><b>${esc(x.brand)}</b><span>Day ${pr.day} · ${K(pr.got)} of ${K(x.guarantee)}</span></div>
              <div class="wrow__num" style="width:120px">${projBar(x)}<b style="color:${toneVar(vv.tone)}">${Math.round(pr.ratio*100)}%</b></div></div>`; }).join('')}
          ${booked.map(x=>`<div class="wrow" style="padding:11px 13px;border-style:dashed">
            <div class="wrow__main"><b>${esc(x.brand)}</b><span>Booked ${dayName(x.published)} ${fmtDate(x.published)}${x.kind!=='paid'?' · '+esc(x.kind):''}</span></div></div>`).join('')}`
          :`<div class="empty" style="padding:18px 0">No reads on this show yet.</div>`}
        </div>
      </div>
      <div class="footnote">Everything here maps 1:1 to the show page Sydney keeps in Airtable — this is its live view.</div>
    </div>`;
  }

  const kpiBox=(l,v,sub)=>`<div style="border:1px solid var(--border-light);border-radius:11px;padding:12px 14px"><div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-tertiary)">${l}</div><div style="font-size:21px;font-weight:800;letter-spacing:-.03em;margin-top:3px">${v}</div><div class="muted" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${sub}</div></div>`;

  RENDER.shows = () => {
    if(SHOW_PAGE){ const sh=show(SHOW_PAGE); if(sh) return renderShowPage(sh); SHOW_PAGE=null; }
    setBack('');
    const f=fillStats();
    document.getElementById('view-shows').innerHTML=`
    <div class="inner" style="max-width:1180px">
      <div class="pagebar">
        <div class="head"><h1>Shows</h1></div>
        <div class="pagebar__right"><span class="tag tag--purple">${SHOWS.filter(x=>x.src==='booster').length} of ${SHOWS.length} synced from Booster</span></div>
      </div>
      <div id="gridHost"></div>
      <div class="footnote">Positions and the guarantee come from Booster; everything else maps 1:1 to the show page Sydney keeps in Airtable, so this pulls straight from there. Paid fill rate is ${f.rate}% — ${f.paid} spots sold, ${f.free} given as make goods or bonus.</div>
    </div>`;
    renderGrid();
  };


  function toggleDark(){
    document.body.classList.toggle('dark');
    const d=document.body.classList.contains('dark'), b=document.getElementById('dmBtn');
    if(b) b.lastChild.textContent = d?'Light Mode':'Dark Mode';
  }
  function applyGuarantee(showId,v){ show(showId).guarantee=v; rerender(); toast(`${show(showId).name} guarantee set to ${K(v)}. Written back to Booster and Airtable.`); }

  /* ═══════════════════════════ TOAST ═══════════════════════════ */
  let toastT;
  function toast(msg){ let el=document.getElementById('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:#fff;padding:12px 18px;border-radius:11px;font-size:13px;font-weight:600;z-index:80;box-shadow:var(--shadow-hover);opacity:0;transition:.25s;max-width:460px'; document.body.appendChild(el); }
    el.textContent=msg; requestAnimationFrame(()=>{el.style.opacity=1;el.style.transform='translateX(-50%) translateY(0)';}); clearTimeout(toastT); toastT=setTimeout(()=>{el.style.opacity=0;el.style.transform='translateX(-50%) translateY(20px)';},3400); }

  /* init */
  refreshBadges(); RENDER.overview();
  // The agent is not something you start — it has already run by the time you look.
  setTimeout(()=>{ if(SPOTS.some(s=>s.status==='aired')) runAgent(); }, 900);
  </script>
</body>
</html>
