<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VMG Command Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317212B'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #17212B; --primary-hover: #282828;
      --accent: #17212B; --accent-hover: #282828; --accent-soft: #F3F4F6;
      --text-primary: #1D2027; --text-secondary: #707481; --text-tertiary: #9CA3AF;
      --border: #E4E6ED; --border-light: #EDEEF1; --border-strong: #C5CBD5;
      --white: #ffffff; --secondary-lite: #F3F4F6;
      --nav: #F3F4F6; --nav-current: #E4E6ED; --nav-hover: #EBEDF2;
      --page-bg: #EDEEF1; --panel: #ffffff;
      --green-text: #0E6832; --green-bg: #D6F1E0;
      --blue-text: #1435C0; --blue-bg: #C7E0FF;
      --orange-text: #C2410C; --orange-bg: #FFEDD5;
      --red-text: #B42318; --red-bg: #FEE4E2;
      --purple-text: #6941C6; --purple-bg: #EBE9FE;
      --shadow-post: 0 0 2px 0 rgba(166,175,195,.40);
      --shadow-btn: 0 1px 3px 0 rgba(166,175,195,.20);
      --shadow-card: 0 1px 2px rgba(166,175,195,.18);
      --shadow-hover: 0 12px 34px rgba(120,130,150,.18);
      --radius-card: 14px; --radius-btn: 9px; --radius-pill: 999px;
      /* categorical chart palette */
      --c1:#17212B; --c2:#3B82F6; --c3:#10B981; --c4:#F59E0B; --c5:#8B5CF6; --c6:#EC4899; --c7:#06B6D4;
    }
    body.dark {
      --primary:#F3F4F6; --primary-hover:#E4E6ED;
      --text-primary:#F0F1F4; --text-secondary:#9BA3B0; --text-tertiary:#6C7581;
      --border:#2A2F38; --border-light:#232830; --border-strong:#3C434E;
      --white:#161A20; --panel:#161A20; --secondary-lite:#212630; --page-bg:#0D1015;
      --nav:#212630; --nav-current:#2A2F38; --nav-hover:#212630;
      --green-bg:#12351F; --blue-bg:#152A47; --orange-bg:#3A2410; --red-bg:#3D1A18; --purple-bg:#241C42;
      --green-text:#5BD68F; --blue-text:#7FB4FF; --orange-text:#F0A868; --red-text:#F58B84; --purple-text:#B69BF5;
      --shadow-card:0 1px 2px rgba(0,0,0,.4); --shadow-btn:0 1px 3px rgba(0,0,0,.35); --shadow-hover:0 12px 34px rgba(0,0,0,.5);
    }
    body.dark .btn--primary, body.dark .pill--solid, body.dark .askwrap__go, body.dark .tb-av, body.dark .sb-powered .smark { color:#12161C; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--page-bg); color: var(--text-primary);
      -webkit-font-smoothing: antialiased; line-height: 1.45; letter-spacing: -.01em;
      display: flex; gap: 9px; height: 100vh; overflow: hidden; padding: 9px;
    }
    button { font-family: inherit; cursor: pointer; }
    a { color: inherit; }

    /* ─── SIDEBAR ─── */
    .sidebar { width: 244px; flex-shrink: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 15px; display: flex; flex-direction: column; padding: 16px 13px 13px; overflow: hidden; }
    .sb-brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 18px; }
    .sb-brand__mark { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: -.02em; }
    .sb-brand__name b { display: block; color: var(--text-primary); font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
    .sb-brand__name span { display: block; color: var(--text-tertiary); font-size: 10px; font-weight: 700; letter-spacing: .14em; margin-top: 1px; }
    .sb-scroll { overflow-y: auto; flex: 1; margin: 0 -6px; padding: 0 6px; }
    .sb-scroll::-webkit-scrollbar { width: 0; }
    .sb-group { margin-top: 10px; }
    .sb-group__label { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-tertiary); padding: 8px 10px 6px; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 11px; padding: 8.5px 11px; border: none; background: none; border-radius: 9px; color: var(--text-secondary); font-size: 13.5px; font-weight: 600; text-align: left; transition: background .12s, color .12s; position: relative; }
    .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; opacity: .85; }
    .nav-item:hover { background: var(--nav-hover); color: var(--text-primary); }
    .nav-item.active { background: var(--nav-current); color: var(--text-primary); }
    .nav-item.active svg { opacity: 1; }
    .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #3FB87C; margin-left: auto; box-shadow: 0 0 0 0 rgba(63,184,124,.6); animation: pulse 2.2s infinite; }
    .nav-item .badge { margin-left: auto; background: var(--red-bg); color: var(--red-text); font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(63,184,124,.5);} 70%{box-shadow:0 0 0 5px rgba(63,184,124,0);} 100%{box-shadow:0 0 0 0 rgba(63,184,124,0);} }
    .sb-foot { padding-top: 10px; border-top: 1px solid var(--border-light); margin-top: 8px; }
    .sb-powered { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 11px; font-weight: 600; color: var(--text-tertiary); width: 100%; border: none; background: none; text-align: left; border-radius: 9px; }
    .sb-powered .smark { width: 18px; height: 18px; border-radius: 5px; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 800; }
    .sb-powered b { color: var(--text-secondary); font-weight: 700; }
    .sb-user { display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; }
    .sb-user__av { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
    .sb-user__name { color: var(--text-primary); font-size: 12.5px; font-weight: 700; line-height: 1.2; }
    .sb-user__sub { color: var(--text-tertiary); font-size: 11px; font-weight: 500; }


    /* ─── TOP BAR ─── */
    .topbar { display: flex; align-items: center; gap: 4px; justify-content: flex-end; padding: 13px 18px 0; flex-shrink: 0; }
    .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #3FB87C; margin-left: auto; }
    .nav-item { border: none; background: none; border-radius: 8px; padding: 6px 11px; color: var(--text-tertiary); font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    .nav-item:hover { color: var(--text-primary); background: var(--nav-hover); }
    .nav-item.active { color: var(--text-primary); background: var(--nav-current); }
    .nav-item .badge { background: var(--red-bg); color: var(--red-text); font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 999px; }
    .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #3FB87C; }
    .tb-btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--panel); color: var(--text-secondary); font-size: 12px; font-weight: 600; margin-left: 6px; }
    .tb-btn:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .tb-btn svg { width: 13px; height: 13px; }
    .tb-av { width: 30px; height: 30px; border-radius: 9px; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 11px; margin-left: 6px; border: none; flex-shrink: 0; }

    /* ─── MAIN ─── */
    .main { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 15px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .views { flex: 1; overflow-y: auto; }
    .view { display: none; }
    .view.active { display: block; }
    .inner { max-width: 1220px; margin: 0 auto; padding: 26px 34px 90px; }
    .pagebar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 22px; gap: 16px; flex-wrap: wrap; }
    .head h1 { font-size: 25px; font-weight: 700; letter-spacing: -.035em; display: flex; align-items: center; gap: 11px; }
    .head p { color: var(--text-secondary); font-size: 13.5px; margin-top: 4px; font-weight: 500; max-width: 640px; }
    .pagebar__right { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .live-dot { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; color: var(--green-text); background: var(--green-bg); padding: 4px 10px; border-radius: var(--radius-pill); }
    .live-dot i { width: 6px; height: 6px; border-radius: 50%; background: var(--green-text); animation: pulse 2s infinite; }

    /* filters */
    .seg { display: inline-flex; background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 3px; box-shadow: var(--shadow-btn); }
    .seg button { border: none; background: none; padding: 6px 13px; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); border-radius: 7px; }
    .seg button.active { background: var(--primary); color: #fff; }

    /* buttons */
    .btn { display: inline-flex; align-items: center; gap: 7px; border-radius: var(--radius-btn); padding: 9px 15px; font-size: 13px; font-weight: 600; border: 1px solid transparent; transition: .13s; }
    .btn svg { width: 15px; height: 15px; }
    .btn--primary { background: var(--primary); color: #fff; }
    .btn--primary:hover { background: var(--primary-hover); }
    .btn--ghost { background: var(--white); border-color: var(--border); color: var(--text-secondary); box-shadow: var(--shadow-btn); }
    .btn--ghost:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .btn--sm { padding: 6px 11px; font-size: 12px; }
    .btn--green { background: var(--green-text); color: #fff; }
    .btn--green:hover { filter: brightness(1.08); }

    /* cards + grid */
    .grid { display: grid; gap: 16px; }
    .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
    .card__pad { padding: 18px 20px; }
    .card__head { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid var(--border-light); }
    .card__title { font-size: 14px; font-weight: 700; letter-spacing: -.02em; display:flex; align-items:center; gap:8px; }
    .card__sub { font-size: 12px; color: var(--text-tertiary); font-weight: 500; margin-top: 2px; }

    /* stat tiles */
    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .tile { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 16px 18px; box-shadow: var(--shadow-card); }
    .tile__label { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .tile__val { font-size: 26px; font-weight: 800; letter-spacing: -.03em; margin-top: 7px; }
    .tile__delta { font-size: 11.5px; font-weight: 700; margin-top: 5px; display: inline-flex; align-items: center; gap: 4px; }
    .up { color: var(--green-text); } .down { color: var(--red-text); }

    /* tags */
    .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; letter-spacing: -.01em; }
    .tag--green { background: var(--green-bg); color: var(--green-text); }
    .tag--blue { background: var(--blue-bg); color: var(--blue-text); }
    .tag--orange { background: var(--orange-bg); color: var(--orange-text); }
    .tag--red { background: var(--red-bg); color: var(--red-text); }
    .tag--purple { background: var(--purple-bg); color: var(--purple-text); }
    .tag--grey { background: var(--secondary-lite); color: var(--text-secondary); }
    .tag i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* tables */
    table { width: 100%; border-collapse: collapse; }
    thead th { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); text-align: left; padding: 11px 20px; border-bottom: 1px solid var(--border-light); }
    tbody td { font-size: 13px; padding: 13px 20px; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr.clickable:hover { background: var(--page-bg); cursor: pointer; }
    .num { font-variant-numeric: tabular-nums; }
    .right { text-align: right; }

    /* progress / pacing bar */
    .pace { height: 8px; border-radius: 999px; background: var(--secondary-lite); overflow: hidden; position: relative; }
    .pace__fill { height: 100%; border-radius: 999px; background: var(--primary); transition: width .5s; }
    .pace--good .pace__fill { background: var(--green-text); }
    .pace--warn .pace__fill { background: var(--orange-text); }
    .pace--bad .pace__fill { background: var(--red-text); }

    /* progress ring */
    .ringwrap { display:flex; align-items:center; gap:14px; }

    /* coach */
    .coach-card { display: flex; gap: 14px; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--border-light); background: var(--white); }
    .coach-card + .coach-card { margin-top: 12px; }
    .coach-ico { width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center; }
    .coach-card b { font-size: 13.5px; font-weight: 700; }
    .coach-card p { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; line-height: 1.5; }
    .coach-act { margin-top: 9px; font-size: 12px; font-weight: 700; color: var(--primary); display: inline-flex; align-items: center; gap: 5px; }

    /* modal / drawer */
    .scrim { position: fixed; inset: 0; background: rgba(20,25,35,.44); backdrop-filter: blur(2px); z-index: 60; display: none; }
    .scrim.open { display: block; }
    .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: 560px; max-width: 94vw; background: var(--white); z-index: 61; box-shadow: -10px 0 40px rgba(20,25,35,.16); transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }
    .drawer__head { padding: 20px 24px; border-bottom: 1px solid var(--border-light); display: flex; align-items: flex-start; justify-content: space-between; }
    .drawer__body { padding: 22px 24px; overflow-y: auto; flex: 1; }
    .drawer__foot { padding: 16px 24px; border-top: 1px solid var(--border-light); display: flex; gap: 10px; justify-content: flex-end; }
    .x { border: none; background: var(--secondary-lite); width: 30px; height: 30px; border-radius: 8px; color: var(--text-secondary); font-size: 16px; display: grid; place-items: center; }

    /* modal center */
    .modal { position: fixed; z-index: 61; top: 50%; left: 50%; transform: translate(-50%,-46%); width: 720px; max-width: 94vw; max-height: 90vh; overflow-y: auto; background: var(--white); border-radius: 16px; box-shadow: var(--shadow-hover); opacity: 0; pointer-events: none; transition: .22s; }
    .modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%); }

    .kv dt { color: var(--text-tertiary); font-weight: 600; }
    .kv dd { font-weight: 600; }

    .field { margin-bottom: 15px; }
    .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
    .field input, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; font-size: 13.5px; font-family: inherit; color: var(--text-primary); background: var(--white); }
    .field input:focus, .field select:focus { outline: none; border-color: var(--primary); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .footnote { margin-top: 26px; font-size: 11.5px; color: var(--text-tertiary); text-align: center; }
    .muted { color: var(--text-tertiary); }
    .empty { text-align: center; padding: 40px 20px; color: var(--text-tertiary); font-size: 13px; }

    /* air check agent scan */
    .scanbar { height: 4px; background: var(--secondary-lite); border-radius: 999px; overflow: hidden; }
    .scanbar__fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--c2), var(--c3)); transition: width .3s; }
    .agentrow { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border: 1px solid var(--border-light); border-radius: 12px; background: var(--white); }
    .agentrow + .agentrow { margin-top: 10px; }
    .thumb { width: 92px; height: 52px; border-radius: 8px; object-fit: cover; background: var(--secondary-lite); flex-shrink: 0; }
    .pulse-blue { animation: pulseb 1.4s infinite; }
    @keyframes pulseb { 0%,100%{opacity:1;} 50%{opacity:.45;} }

    /* proof reel */
    .reel-stage { background: #0b0f14; border-radius: 14px; overflow: hidden; position: relative; aspect-ratio: 16/9; display: grid; place-items: center; }
    .reel-stage iframe { width: 100%; height: 100%; border: 0; }
    .reel-strip { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px; }
    .reel-clip { width: 150px; flex-shrink: 0; border-radius: 10px; overflow: hidden; border: 2px solid transparent; background: var(--white); box-shadow: var(--shadow-card); }
    .reel-clip.active { border-color: var(--c2); }
    .reel-clip img { width: 100%; height: 84px; object-fit: cover; display: block; background:#222; }
    .reel-clip__meta { padding: 7px 9px; }

    /* deliverables & compliance (North Station pattern) */
    .ai-tag { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--purple-bg); color: var(--purple-text); padding: 3px 8px; border-radius: 999px; }
    .cmp-hint { font-size: 11.5px; color: var(--text-tertiary); margin: 6px 0 2px; line-height: 1.45; }
    .cmp-row { border: 1px solid var(--border-light); border-radius: 11px; padding: 11px 12px; margin-top: 9px; background: var(--white); }
    .cmp-row__top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
    .cmp-row__date { font-size: 12px; font-weight: 700; }
    .cmp-status { font-size: 10.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
    .cmp-status.ok { background: var(--green-bg); color: var(--green-text); }
    .cmp-status.pend { background: var(--secondary-lite); color: var(--text-secondary); }
    .cmp-inp { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-family: inherit; margin-top: 6px; color: var(--text-primary); background: var(--white); }
    .cmp-inp:focus { outline: none; border-color: var(--primary); }
    .cmp-inp::placeholder { color: var(--text-tertiary); }

    /* advertiser portal */
    .brand-chip { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 15px; flex-shrink: 0; }


    /* ─── chat-first hero (matches the SpotsNow Intelligence layout) ─── */
    .hero { max-width:720px; margin:0 auto; padding:44px 0 0; text-align:center; }
    .hero h1 { font-size:34px; font-weight:800; letter-spacing:-.04em; }
    .hero p { color:var(--text-secondary); font-size:14px; font-weight:500; line-height:1.6; max-width:560px; margin:12px auto 0; }
    .hero__pills { display:flex; gap:9px; justify-content:center; margin-top:18px; }
    .pill { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--white); color:var(--text-secondary); box-shadow:var(--shadow-btn); }
    .pill--solid { background:var(--primary); border-color:var(--primary); color:#fff; }
    .pill i { width:7px; height:7px; border-radius:50%; background:currentColor; }
    .askwrap { position:relative; margin-top:26px; }
    .askwrap input { width:100%; padding:16px 92px 16px 18px; border:1px solid var(--border); border-radius:13px; font-size:14.5px; font-family:inherit; background:var(--white); box-shadow:var(--shadow-card); color:var(--text-primary); }
    .askwrap input:focus { outline:none; border-color:var(--border-strong); box-shadow:var(--shadow-hover); }
    .askwrap input::placeholder { color:var(--text-tertiary); }
    .askwrap__go { position:absolute; right:9px; top:50%; transform:translateY(-50%); width:36px; height:36px; border-radius:9px; border:none; background:var(--primary); color:#fff; display:grid; place-items:center; }

    /* ─── MANAGE SHOWS GRID (ported from inventory-demo3) ─── */
    .msheet-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; }
    .msheet-toolbar { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-bottom: 1px solid var(--border); }
    .msheet-search { flex: 1; max-width: 320px; display: flex; align-items: center; gap: 9px; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 7px 12px; color: var(--text-tertiary); }
    .msheet-search input { border: none; outline: none; background: none; font-family: inherit; font-size: 13px; font-weight: 500; color: var(--text-primary); width: 100%; }
    .msheet-tools { display: flex; align-items: center; gap: 7px; margin-left: auto; }
    .msheet-scroll { overflow-x: auto; }
    .msheet { border-collapse: collapse; width: 100%; }

    const pr=projection(s); if(!pr) return '';
    const max=Math.max(s.guarantee,pr.proj)*1.06, w=v=>Math.min(100,v/max*100), tone=toneVar(verdict(s).tone);
    return `<div style="position:relative;flex:1;height:8px;border-radius:4px;background:var(--secondary-lite)">
      <div style="position:absolute;inset:0 auto 0 0;width:${w(pr.proj)}%;border-radius:4px;background:${tone};opacity:.3"></div>
      <div style="position:absolute;inset:0 auto 0 0;width:${w(pr.got)}%;border-radius:4px;background:${tone}"></div>
      <div title="90% IAB line" style="position:absolute;top:-3px;bottom:-3px;left:${w(s.guarantee*IAB_FULL)}%;width:2px;background:var(--green-text)"></div></div>`;
  }
  const jit=(id,d)=>{ let h=0; const k=id+':'+d; for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))|0; return ((h%1000)/1000-0.5)*0.09; };

  /* The agent does not watch views tick over — it pulls a number on a schedule:
     the daily scan that finds the read, then weekly, the show's own check-in
     day, and the 30-day final. These are the readings we actually hold. */
  function checkPoints(s){
    const pr=projection(s); if(!pr) return [];
    const sh=show(s.showId);
    const days=[...new Set([1,7,checkInDay(sh),14,21,30])].sort((a,b)=>a-b).filter(d=>d>=1&&d<pr.day);
    days.push(pr.day);
    return days.map(d=>({ d, v: d===pr.day ? pr.got : Math.round(curveAt(sh.curve,d)*pr.proj*(1+jit(s.id,d))), latest:d===pr.day }));
  }
  const nextCheck = s => { const pr=projection(s); if(!pr||pr.final) return null;
    const sh=show(s.showId);
    return [...new Set([1,7,checkInDay(sh),14,21,30])].sort((a,b)=>a-b).find(d=>d>pr.day) || 30; };

  function curveChart(s,{w=520,h=210}={}){
    const pr=projection(s); if(!pr) return '';
    const sh=show(s.showId), padL=42, padR=50, padT=16, padB=30;
    const max=Math.max(s.guarantee, pr.proj)*1.14, X=d=>padL+(w-padL-padR)*(d/30), Y=v=>h-padB-(h-padT-padB)*(v/max);
    const pts=checkPoints(s), tone=toneVar(verdict(s).tone);
    const last=pts[pts.length-1];
    const model=[]; for(let d=0;d<=30;d++) model.push(X(d).toFixed(1)+' '+Y(curveAt(sh.curve,d)*pr.proj).toFixed(1));
    const grid=[0,.5,1].map(f=>`<line x1="${padL}" x2="${w-padR}" y1="${Y(max*f)}" y2="${Y(max*f)}" stroke="var(--border-light)"/><text x="${padL-6}" y="${Y(max*f)+3.5}" text-anchor="end" font-size="9.5" font-weight="600" fill="var(--text-tertiary)">${K(Math.round(max*f))}</text>`).join('');
    // straight segments between the readings we hold — no pretend detail in between
    const readPath = pts.length ? 'M'+[[X(0),Y(0)]].concat(pts.map(p=>[X(p.d),Y(p.v)])).map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L') : '';
    const runout = last ? `M${X(last.d).toFixed(1)} ${Y(last.v).toFixed(1)} L${X(30).toFixed(1)} ${Y(pr.proj).toFixed(1)}` : '';
    return `<svg viewBox="0 0 ${w} ${h}" width="100%">${grid}
      ${[0,10,20,30].map(d=>`<text x="${X(d)}" y="${h-10}" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--text-tertiary)">${d?'d'+d:'pub'}</text>`).join('')}
      <line x1="${padL}" x2="${w-padR}" y1="${Y(s.guarantee)}" y2="${Y(s.guarantee)}" stroke="var(--text-tertiary)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${w-padR+5}" y="${Y(s.guarantee)+3.5}" font-size="9.5" font-weight="800" fill="var(--text-secondary)">GUAR</text>
      <line x1="${padL}" x2="${w-padR}" y1="${Y(s.guarantee*IAB_FULL)}" y2="${Y(s.guarantee*IAB_FULL)}" stroke="var(--green-text)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${w-padR+5}" y="${Y(s.guarantee*IAB_FULL)+3.5}" font-size="9.5" font-weight="800" fill="var(--green-text)">90%</text>
      <path d="M${model.join(' L')}" fill="none" stroke="var(--text-tertiary)" stroke-width="1.6" stroke-dasharray="3 4" opacity=".6"/>
      ${readPath?`<path d="${readPath}" fill="none" stroke="${tone}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`:''}
      ${runout?`<path d="${runout}" fill="none" stroke="${tone}" stroke-width="2" stroke-dasharray="5 4" opacity=".5"/>`:''}
      ${pts.map(p=>`<g><line x1="${X(p.d)}" x2="${X(p.d)}" y1="${Y(p.v)}" y2="${h-padB}" stroke="${tone}" stroke-width="1" opacity=".14"/>
        <circle cx="${X(p.d)}" cy="${Y(p.v)}" r="${p.latest?4.5:3.2}" fill="${p.latest?tone:'var(--panel)'}" stroke="${tone}" stroke-width="2"><title>Day ${p.d}: ${K(p.v)}${p.latest?' (latest reading)':''}</title></circle></g>`).join('')}
      <circle cx="${X(30)}" cy="${Y(pr.proj)}" r="4.5" fill="none" stroke="${tone}" stroke-width="2.4" stroke-dasharray="2 2"/>
      <text x="${X(30)}" y="${Y(pr.proj)-10}" text-anchor="end" font-size="11" font-weight="800" fill="${tone}">${K(pr.proj)}</text></svg>
    <div class="curvekey">
      <span><i style="border-color:${tone}"></i>${pts.length} reading${pts.length!==1?'s':''} taken</span>
      <span><i style="border-color:${tone};border-top-style:dashed"></i>Projected to day 30</span>
      <span><i style="border-color:var(--text-tertiary);border-top-style:dashed"></i>${esc(sh.name)}'s usual shape</span></div>`;
  }

  function sparkline(k,{w=88,h=26}={}){
    const pts=[]; for(let d=0;d<=30;d++) pts.push((2+(w-4)*(d/30)).toFixed(1)+' '+(h-2-(h-6)*curveAt(k,d)).toFixed(1));
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><path d="M${pts.join(' L')}" fill="none" stroke="var(--c2)" stroke-width="2" stroke-linecap="round"/></svg>`;
  }

  /* ═══════════════════════════ THE WORK LIST ═══════════════════════════
     Everything that wants a human, in one flat list. No sub-tabs, no
     section headers — just the next thing to do. */
  const ICO={ mic:'<path d="M12 2a3 3 0 013 3v6a3 3 0 01-6 0V5a3 3 0 013-3z"/><path d="M19 10a7 7 0 01-14 0M12 17v4"/>',
    warn:'<path d="M12 9v4M12 17h.01M10.3 3.9L2 18a2 2 0 001.7 3h16.6A2 2 0 0022 18L13.7 3.9a2 2 0 00-3.4 0z"/>',
    doc:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/>',
    mg:'<path d="M3 12a9 9 0 1015-6.7L21 8"/><path d="M21 3v5h-5"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    wave:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
    check:'<path d="M20 6L9 17l-5-5"/>' };
  const icoBox=(k,tone)=>`<div class="wrow__ico" style="background:var(--${tone}-bg)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--${tone}-text)" stroke-width="2.1">${ICO[k]}</svg></div>`;
  const row=(lead,title,sub,num,action,click)=>`<div class="wrow${click?' wrow--click':''}"${click?` onclick="${click}"`:''}>${lead}<div class="wrow__main"><b>${title}</b><span>${sub}</span></div>${num||''}${action?`<span onclick="event.stopPropagation()">${action}</span>`:''}</div>`;
  const spotNum=s=>{ const pr=projection(s); if(!pr) return ''; const v=verdict(s);
    return `<div class="wrow__num">${projBar(s)}<b style="color:${toneVar(v.tone)}">${Math.round(pr.ratio*100)}%</b></div>`; };

  const warch=(kind,id)=>kind?`<button class="warch" title="Archive" onclick="event.stopPropagation();archiveItem('${kind}','${id}')">✕</button>`:'<span></span>';
  const ARCHIVED={};
  function archiveItem(kind,id){ ARCHIVED[kind+':'+id]=true; rerender(); refreshBadges();
    toast('Archived. It stays on the record, it just stops asking.'); }
  const unarchived=(kind,id)=>!ARCHIVED[kind+':'+id];

  /* Three words on the button, and only one of them is dark.
     In progress → running, nothing to do. Verified → it landed.
     Make good → it came in under, and that is the only thing worth shouting. */
  function ctaFor(s){
    const pr=projection(s), v=verdict(s), m=mgForSpot(s.id);
    if(v.k==='short') return { label:'Make good', dark:!m };
    if(!pr || !pr.confident || s.status!=='verified') return { label:'In progress', dark:false };
    return { label:'Verified', dark:false };
  }

  /* One row, used by Needs you and All flights alike. Six columns:
     the ad · did it run · what it delivered · how it is pacing · make good · action */
  function flightRow(s){
    const pr=projection(s), v=verdict(s), sh=show(s.showId), m=mgForSpot(s.id), c=ctaFor(s);
    const dash='<span class="muted" style="font-weight:600">—</span>';
    return `<div class="wrow wflight wrow--click" onclick="openSpot('${s.id}')">
      <div class="wrow__main"><b>${nameOf(s)}</b></div>
      <span onclick="event.stopPropagation()">${s.yt
        ? `<button class="fran" onclick="playClip('${s.yt}',${s.ts})" title="Hear the read"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>${mmss(s.ts)}</button>`
        : `<span class="fran fran--no">${s.status==='scheduled'?'booked':s.missed?'no episode':'scanning'}</span>`}</span>
      <div class="fnum">${pr?K(pr.got):dash}${pr&&sh.simulcast?`<small>${K(s.views||0)} + ${s.dlState==='requested'?'?':K(s.downloads||0)}</small>`:pr?'<small>video</small>':''}</div>
      <div class="wrow__num">${pr?`${projBar(s)}<b style="color:${toneVar(v.tone)}">${Math.round(pr.ratio*100)}%</b>`:dash}</div>
      <div class="fnum">${m?`<span class="tag tag--purple">${fmtDate(m.date)}</span>`
        : v.k==='short'?'<span class="tag tag--red"><i></i>Needed</span>' : dash}</div>
      <span onclick="event.stopPropagation()">${cta(c.label,`openSpot('${s.id}')`,c.dark)}</span>
    </div>`;
  }
  const dcta=(label,onclick,dark)=>`<button class="btn ${dark?'btn--primary':'btn--ghost'} btn--sm" onclick="${onclick}">${label}</button>`;
  const cta=dcta;

  const flightHead=()=>`<div class="fhead"><span>Ad</span><span>Ran</span><span>Delivered</span><span>Pacing</span><span>Make good</span><span></span></div>`;

  // Needs you: the same rows, filtered to the ads that want something.
  function workList(){
    const wants=new Set();
    SPOTS.filter(s=>s.status==='aired'&&s.missed).forEach(s=>wants.add(s.id));
    needsMakegood().forEach(s=>wants.add(s.id));
    MAKEGOODS.filter(m=>m.status!=='scheduled').forEach(m=>wants.add(m.spotId));
    SPOTS.filter(s=>s.dlState==='requested').forEach(s=>wants.add(s.id));
    SPOTS.filter(s=>['needs_copy','needs_cta','sent'].includes(s.copyStatus)).forEach(s=>wants.add(s.id));
    SPOTS.filter(s=>closedOut(s)&&!s.completed).forEach(s=>wants.add(s.id));
    return [...wants].filter(id=>unarchived('w',id)).map(spot)
      .sort((a,b)=>(ctaFor(b).dark?1:0)-(ctaFor(a).dark?1:0))
      .map(flightRow);
  }


  function deliveryAttention(){ return { count: workList().length }; }

  /* ═══════════════════════════ VIEW: COMMAND CENTER ═══════════════════════════
     The glance. Three numbers, the next three things, one thing worth knowing.
     Everything else lives one click away in Delivery. */
  RENDER.overview = () => {
    const work=workList();
    document.getElementById('view-overview').innerHTML=`
    <div class="inner" style="max-width:940px;padding-top:8px">
      <div class="hero">
        <h1>VMG Command Center</h1>
        <p>Ask anything about the network — delivery pacing, what needs a make good, which guarantees are running hot. Answered off Airtable and Booster.</p>
        <div class="hero__pills">
          <span class="pill"><i style="background:var(--green-text)"></i>Agent checked ${LAST_CHECK}</span>
          <button class="pill pill--solid" onclick="go('delivery')">${work.length} need${work.length===1?'s':''} you</button>
        </div>
        <div class="askwrap">
          <input id="acAsk" placeholder="Ask anything…" onkeydown="if(event.key==='Enter')askVmg()">
          <button class="askwrap__go" onclick="askVmg()" aria-label="Ask">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h13M12 5l7 7-7 7"/></svg></button>
        </div>
      </div>
      ${CHATS.length?`<div class="thread">
        <div class="thread__hd"><span>Conversation</span><button onclick="newChat()">Clear</button></div>
        ${CHATS.map(c=>`<div class="turn"><div class="turn__q">${esc(c.q)}</div><div class="turn__a">${c.a}</div></div>`).join('')}
      </div>`:''}
    </div>`;
    const el=document.querySelector('.view.active #acAsk'); if(el&&CHATS.length) el.focus();
  };

  /* ═══════════════════════════ VIEW: DELIVERY ═══════════════════════════ */
  let delTab='work';
  RENDER.delivery = () => {
    const work=workList();
    const live=SPOTS.filter(s=>projection(s)).sort((a,b)=>liveDays(a)-liveDays(b));
    document.getElementById('view-delivery').innerHTML=`
    <div class="inner" style="max-width:940px">
      <div class="pagebar">
        <div class="head"><h1>Delivery <span class="live-dot"><i></i>Checked ${LAST_CHECK}</span></h1>
        <p>Every read is projected off its own show's view curve, and each show gets its own check-in date — Warren Smith settles by day 3, Sage Steele needs to day 13. 90% of guarantee is full delivery.</p></div>
        <div class="pagebar__right"><div class="seg">
          <button class="${delTab==='work'?'active':''}" onclick="delTab='work';RENDER.delivery()">Needs you${work.length?' · '+work.length:''}</button>
          <button class="${delTab==='all'?'active':''}" onclick="delTab='all';RENDER.delivery()">All flights</button>
          <button class="${delTab==='mg'?'active':''}" onclick="delTab='mg';RENDER.delivery()">Make goods${MAKEGOODS.length?' · '+MAKEGOODS.length:''}</button></div></div>
      </div>
      <div id="scanPanel"></div>
      ${delTab==='mg' ? makeGoodsPanel() : delTab==='work'
        ? (work.length?flightHead()+work.join(''):`<div class="card"><div class="empty">✨ Nothing needs you — every flight projects over the 90% line.</div></div>`)
        : flightHead() + live.map(flightRow).join('')}
      <div class="footnote">Projections come from each show's own curve, refit every time a read is verified.</div>
    </div>`;
  };

  /* Every make good, in every state, plus what they have cost. The flowchart's
     back half: written to Airtable, flagged in Booster, and the analytics that
     come out of tracking sold against given. */
  const MGSTEP=[['Date from avails',m=>!!m.date],['Show approved',m=>m.showOk===true],
                ['Brand approved',m=>m.brandOk===true],['In Airtable',m=>m.status==='scheduled']];
  function makeGoodsPanel(){
    const st=mgStats();
    const card=m=>{ const sp=spot(m.spotId), sh=show(sp.showId), done=m.status==='scheduled';
      return `<div class="card" style="${done?'':'border-color:var(--orange-bg)'}">
        <div class="card__pad">
          <div style="display:flex;align-items:flex-start;gap:13px">
            ${icoBox('mg',done?'green':'orange')}
            <div style="flex:1;min-width:0">
              <b style="font-size:13.5px">${esc(sp.brand)} on ${esc(sh.name)}</b>
              <div class="muted" style="font-size:12px;margin-top:2px">Original read ${fmtDate(sp.published)} landed ${Math.round(projection(sp).ratio*100)}% · ${K(shortfall(sp))} short · worth ${money(mgValue(m))} at ${money(sh.cpm)} CPM</div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              ${done?`<span class="tag tag--green"><i></i>Booked ${fmtDate(m.date)}</span>`
                   :`<button class="btn btn--primary btn--sm" onclick="openMg('${m.id}')">${!m.date?'Pick a date':'Open'}</button>`}
            </div>
          </div>
          <div style="display:flex;gap:7px;margin-top:13px;flex-wrap:wrap">
            ${MGSTEP.map(([label,test])=>`<span class="tag ${test(m)?'tag--green':'tag--grey'}">${test(m)?'✓':'○'} ${label}</span>`).join('')}
            ${sh.mgPolicy==='auto'&&m.showOk===true?'<span class="muted" style="font-size:11px;align-self:center">show auto-schedules</span>':''}
          </div>
          ${done?`<div class="muted" style="font-size:11.5px;margin-top:10px">Inventory type <b>Make Good</b> on ${fmtDate(m.date)}, its own colour in Airtable, and the slot is flagged in Booster so it cannot be sold twice.</div>`:''}
        </div></div>`; };
    return `
      <div class="tiles" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
        <div class="tile"><div class="tile__label">Given away</div><div class="tile__val">${money(st.val)}</div><div class="tile__delta"><span class="muted">${K(st.imps)} impressions</span></div></div>
        <div class="tile"><div class="tile__label">Paid fill rate</div><div class="tile__val">${st.rate}%</div><div class="tile__delta"><span class="muted">${st.paid} sold · ${st.free} given</span></div></div>
        <div class="tile"><div class="tile__label">Booked</div><div class="tile__val" style="color:var(--green-text)">${st.sched}</div></div>
        <div class="tile"><div class="tile__label">Still open</div><div class="tile__val" style="color:${st.open?'var(--orange-text)':'var(--text-primary)'}">${st.open}</div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:11px">${MAKEGOODS.map(card).join('')||'<div class="card"><div class="empty">No make goods.</div></div>'}</div>
      ${st.shows.length?`<div class="card" style="margin-top:16px">
        <div class="card__head"><div><div class="card__title">What it is costing, by show</div>

        <table><thead><tr><th>Show</th><th class="num">Make goods</th><th class="num">Impressions</th><th class="num">Value</th><th>What it says</th></tr></thead>
        <tbody>${st.shows.map(r=>{ const sh=show(r.showId), adv=guaranteeAdvice().find(a=>a.showId===r.showId);
          return `<tr><td><b>${esc(sh.name)}</b></td><td class="num">${r.n}</td><td class="num">${K(r.imps)}</td><td class="num">${money(r.val)}</td>
            <td>${adv?`<span style="font-size:12.5px">Guarantee too high — reads land near ${K(adv.typical)}. <button class="btn btn--ghost btn--sm" style="margin-left:4px" onclick="applyGuarantee('${sh.id}',${adv.suggest})">Drop to ${K(adv.suggest)}</button></span>`
                     :'<span class="muted" style="font-size:12.5px">Within normal range</span>'}</td></tr>`; }).join('')}</tbody></table>
      </div>`:''}`;
  }

  /* ── the one drawer that explains a call ── */
  // Every read booked on the same deal — the flight this one belongs to.
  const flightRows = s => SPOTS.filter(x=>x.dealId===s.dealId&&x.showId===s.showId).sort((x,y)=>dt(x.published)-dt(y.published));
  const reelStat=(l,v)=>`<div><div style="font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--text-tertiary);text-transform:uppercase">${l}</div><div style="font-size:14px;font-weight:700;margin-top:2px">${v}</div></div>`;

  function openSpot(id){
    const s=spot(id), sh=show(s.showId), pr=projection(s), v=verdict(s), m=mgForSpot(s.id), cr=creative(s.brand);
    const q = pr ? qualityScore(s) : null, end = s.ts!=null ? s.ts+adSecs(s) : null, nx = pr ? nextCheck(s) : null;
    openDrawer(`<div class="drawer__head"><div>
        <span class="tag tag--${v.tone}"><i></i>${esc(v.label)}</span>
        <h2 style="font-size:18px;font-weight:800;margin-top:8px">${esc(s.brand)} · ${esc(sh.name)}</h2>
        <div class="muted" style="font-size:12px">${pr?`${esc(epTitle(s))} · published ${fmtDate(s.published)}`:`Airs ${fmtDate(s.published)}`} · ${esc(cr.len)} ${esc(cr.placement).toLowerCase()}</div>
      </div><button class="x" onclick="closeOverlays()">✕</button></div>
    <div class="drawer__body">
    ${!pr?(()=>{ const kv=(l,v)=>`<div class="kv"><span>${l}</span><b>${v}</b></div>`;
      const copyLabel = s.copyStatus==='needs_copy'?'<span style="color:var(--blue-text)">Not in yet</span>'
        : s.copyStatus==='needs_cta'?'<span style="color:var(--blue-text)">In · needs a CTA</span>'
        : s.copyStatus==='sent'?`Sent ${fmtDate(s.copySent)} · <span style="color:var(--orange-text)">not opened</span>`
        : s.copySeen?`Sent · opened ${fmtDate(s.copySeen)}`:'In and confirmed';
      return `
      <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:10px">
        ${kpiBox(s.missed?'Booked for':'Airs', fmtDate(s.published), dayName(s.published)+(s.missed?' · nothing posted yet':''))}
        ${kpiBox('Guarantee', K(s.guarantee), '90% = '+K(Math.round(s.guarantee*IAB_FULL)))}
        ${kpiBox('Check-in', 'day '+checkInDay(sh), 'call it '+fmtDate(addDays(s.published,checkInDay(sh))))}
      </div>

      <div style="margin-top:8px">
        ${kv('Ad copy', copyLabel)}
        ${kv('Placement', `${esc(cr.placement)} · ${esc(cr.len)}`)}
        ${cr.code?kv('Promo code', `<span style="font-family:ui-monospace,monospace;letter-spacing:.03em">${esc(cr.code)}</span>`):''}
        ${cr.cta?kv('Offer', esc(cr.cta)):''}
        ${cr.url?kv('Landing', `<a href="https://${esc(cr.url)}" target="_blank" style="color:var(--blue-text);text-decoration:none">${esc(cr.url)} ↗</a>`):''}
        ${kv('Air check', s.missed?`Scanned ${esc(sh.channel)} — no episode yet · rechecks every ${sh.scanEvery}h`:`Starts ${fmtDate(s.published)} · every ${sh.scanEvery}h on ${esc(sh.channel)}`)}
      </div>

      <div class="dhead">What the host reads</div>

    const finds={ s11:{yt:'dQw4w9WgXcQ',ts:455,epLen:5380,views:9200,downloads:1400,copy:['Named the brand','Read promo code KALSHI','Free-trial CTA']},

    for(let i=0;i<steps.length;i++){ const l=q('#scanLabel'); if(l) l.textContent=steps[i];

  function campaignSummary(brand){
    const spots=SPOTS.filter(s=>s.brand===brand&&projection(s)).sort((x,y)=>dt(x.published)-dt(y.published));
    const mgs=SPOTS.filter(s=>s.brand===brand&&s.kind==='makegood');
    const g=spots.reduce((a,s)=>a+s.guarantee,0), got=spots.reduce((a,s)=>a+(delivered(s)||0),0);
    const proj=spots.reduce((a,s)=>a+projection(s).proj,0), paid=spots.reduce((a,s)=>a+spotCost(s),0);
    const done=spots.length&&spots.every(s=>projection(s).final);
    // same confidence rule the rest of the app uses — an early read is not "behind"
    const blocked = spots.some(s=>verdict(s).k==='blocked');
    const anyConfident = spots.some(s=>projection(s).confident);
    const status = proj>=g ? {k:'full', label:done?'Delivered in full':'Tracking over', tone:'green', rank:4}
      : mgs.length ? {k:'mg', label:'Make good booked', tone:'purple', rank:2}
      : blocked ? {k:'blocked', label:'Waiting on downloads', tone:'purple', rank:1}
      : !anyConfident ? {k:'early', label:'Too early to call', tone:'grey', rank:3}
      : {k:'under', label:'Tracking under', tone:'orange', rank:0};
    return { brand, spots, mgs, g, got, proj, paid, done, status,
      shows:[...new Set(spots.map(s=>s.showId))],
      yt:spots.reduce((a,s)=>a+(s.views||0),0), aud:spots.reduce((a,s)=>a+(s.downloads||0),0),
      pct:pctOf(proj,g),
      flight: spots.length?`${fmtDate(spots[0].published)} – ${fmtDate(addDays(spots[spots.length-1].published,30))}`:'—' };
  }

  // tiny version of the tracking line, for the index cards
  function campaignSpark(c,{w=200,h=44}={}){
    if(!c.spots.length) return '';
    const start=c.spots[0].published, end=addDays(c.spots[c.spots.length-1].published,30);
    const span=Math.max(daysBetween(start,end),1), today=Math.min(Math.max(daysBetween(start,TODAY),0),span);
    const total=d=>c.spots.reduce((acc,x)=>{ const pr=projection(x); if(!pr) return acc;
      const dd=d-daysBetween(start,x.published); return dd<=0?acc:acc+curveAt(show(x.showId).curve,Math.min(dd,30))*pr.proj; },0);
    const max=Math.max(c.g,total(span))*1.1;
    const X=d=>2+(w-4)*(d/span), Y=v=>h-3-(h-8)*(v/max);
    const pts=[]; for(let d=0;d<=span;d++) pts.push([X(d),Y(total(d))]);
    const solid=pts.slice(0,today+1).map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1));
    const dash=pts.slice(today).map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1));
    const tone=toneVar(c.status.tone);
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
      <line x1="0" x2="${w}" y1="${Y(c.g)}" y2="${Y(c.g)}" stroke="var(--text-tertiary)" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>
      ${dash.length>1?`<path d="M${dash.join(' L')}" fill="none" stroke="${tone}" stroke-width="2" stroke-dasharray="4 3" opacity=".5"/>`:''}
      <path d="M${solid.join(' L')}" fill="none" stroke="${tone}" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="${X(today)}" cy="${Y(total(today))}" r="3" fill="${tone}"/></svg>`;
  }

  function transcript(s){
    const cr=creative(s.brand), sh=show(s.showId), dur=adSecs(s), start=s.ts;
    const words=cr.copy.split(/\s+/), lines=[]; let cur=[];
    words.forEach(w=>{ cur.push(w); if(cur.length>=11){ lines.push(cur.join(' ')); cur=[]; } });
    if(cur.length) lines.push(cur.join(' '));
    const step=dur/Math.max(lines.length,1);
    const out=[{ t:Math.max(0,start-13), text:PRE_LINES[sh.id]||'…and we will pick that back up in a moment. Quick word from a partner first.', ad:false }];
    lines.forEach((l,i)=>out.push({ t:Math.round(start+i*step), text:l, ad:true }));
    out.push({ t:start+dur+4, text:POST_LINES[sh.id]||'Right — back to it.', ad:false });
    return out;
  }

  /* ═══════════════════════════ VIEW: SHOWS ═══════════════════════════ */
  /* ═══════════════════════════ MANAGE SHOWS GRID ═══════════════════════════
     Ported from the inventory demo: editable cells with a drag-fill handle.
     This is where show setup gets changed. Everything else only reads it. */
  const SHEET_COLS=[
    { key:'cpm',            label:'CPM',             type:'money',  w:82  },
    { key:'guarantee',      label:'Impr. guarantee', type:'int',    w:124 },
    { key:'epsPerWeek',     label:'Releases/wk',     type:'num',    w:102 },
    { key:'positionsPerEp', label:'Ad positions',    type:'int',    w:104 },
    { key:'delivery',       label:'Delivery',        type:'select', opts:['Video Only','Simulcast','Audio Only'], w:118 },
    { key:'audioSrc',       label:'Audio numbers',   type:'select', opts:['auto from host','request creator','n/a'], w:130 },
    { key:'scanEvery',      label:'Scan every',      type:'select', opts:['12h','24h','48h'], w:98 },
    { key:'revShare',       label:'Rev share',       type:'pct',    w:90  },
    { key:'mgPolicy',       label:'Make goods',      type:'select', opts:['auto','ask first'], w:104 },
  ];
  const AUDIO_LABEL={hosting:'auto from host', request:'request creator', none:'n/a'};
  const AUDIO_VALUE={'auto from host':'hosting','request creator':'request','n/a':'none'};

  function cellGet(sh,key){
    if(key==='delivery') return sh.simulcast?'Simulcast':(sh.audioSrc==='none'?'Video Only':'Audio Only');
    if(key==='audioSrc') return AUDIO_LABEL[sh.audioSrc]||'n/a';
    if(key==='scanEvery') return sh.scanEvery+'h';
    if(key==='revShare')  return Math.round(sh.revShare*100);
    if(key==='mgPolicy')  return sh.mgPolicy==='auto'?'auto':'ask first';
    return sh[key];
  }
  function cellSet(sh,key,raw){
    if(key==='delivery'){
      sh.simulcast = raw==='Simulcast';
      if(raw==='Video Only') sh.audioSrc='none';
      else if(sh.audioSrc==='none') sh.audioSrc='hosting';
      return;
    }
    if(key==='audioSrc'){ sh.audioSrc=AUDIO_VALUE[raw]||'none'; if(sh.audioSrc==='none') sh.simulcast=false; return; }
    if(key==='scanEvery'){ sh.scanEvery=parseInt(raw)||24; return; }
    if(key==='revShare'){ sh.revShare=Math.min(100,Math.max(0,parseFloat(raw)||0))/100; return; }
    if(key==='mgPolicy'){ sh.mgPolicy = raw==='auto'?'auto':'ask'; return; }
    const n=parseFloat(String(raw).replace(/[^0-9.]/g,''));
    if(!isNaN(n)) sh[key]= key==='epsPerWeek' ? n : Math.round(n);
  }

  let gridSel=null, gridDrag=null, gridQuery='', gridDirty=false;
  const gridRows = () => { const q=gridQuery.trim().toLowerCase();
    return q?SHOWS.filter(x=>x.name.toLowerCase().includes(q)||x.host.toLowerCase().includes(q)):SHOWS; };

  function selectCell(id,key){ gridSel={id,key}; renderGrid(); }
  function startFill(e,id,key){ e.stopPropagation(); e.preventDefault();
    const rows=gridRows(); gridDrag={key, from:rows.findIndex(x=>x.id===id), to:rows.findIndex(x=>x.id===id), srcId:id}; }
  function fillEnter(id){ if(!gridDrag) return; const rows=gridRows();
    const i=rows.findIndex(x=>x.id===id); if(i>=gridDrag.from){ gridDrag.to=i; renderGrid(); } }
  function endFill(){
    if(!gridDrag) return;
    const rows=gridRows(), {key,from,to,srcId}=gridDrag; gridDrag=null;
    if(to>from){
      const src=cellGet(show(srcId),key);
      for(let i=from+1;i<=to;i++) cellSet(rows[i],key,src);
      gridDirty=true; renderGrid(); refreshBadges();
      toast(`Filled ${SHEET_COLS.find(c=>c.key===key).label} down ${to-from} row${to-from>1?'s':''}.`);
    } else renderGrid();
  }
  document.addEventListener('mouseup', endFill);

  function gridEdit(id,key,raw){ cellSet(show(id),key,raw); gridDirty=true; markGridDirty(); }
  function gridCommit(id,key,raw){ cellSet(show(id),key,raw); gridDirty=true; renderGrid(); refreshBadges(); }
  function markGridDirty(){ const b=document.getElementById('gridSave'); if(b){ b.textContent='Save and update'; b.disabled=false; } }
  function saveGrid(){ gridDirty=false; renderGrid(); refreshBadges();
    toast('Show setup saved. Guarantees, positions and scan cadence written back to Booster and Airtable.'); }

  function addShow(){
    const n=SHOWS.length+1;
    SHOWS.push({ id:'new'+n, name:'New show '+n, host:'—', publishDays:['Mon'], epsPerWeek:1, positionsPerEp:2,
      curve:'medium', samples:0, simulcast:false, audioSrc:'none', scanEvery:24, revShare:0.60, mgPolicy:'ask',
      guarantee:50000, cpm:20, category:'—', channel:'@new', src:'manual' });
    gridDirty=true; renderGrid(); toast('Show added. Fill in its setup, then save.');
  }
  function deleteShow(id){
    if(SPOTS.some(x=>x.showId===id)){ toast(`${show(id).name} has spots booked — clear them before removing it.`); return; }
    const i=SHOWS.findIndex(x=>x.id===id); if(i>-1) SHOWS.splice(i,1);
    gridDirty=true; renderGrid(); refreshBadges(); toast('Show removed.');
  }

  function sheetControl(sh,col){
    const v=cellGet(sh,col.key);
    if(col.type==='select') return `<select class="mctl mctl--select" onmousedown="event.stopPropagation()" onchange="gridCommit('${sh.id}','${col.key}',this.value)">${col.opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    const pre=col.type==='money'?'<span class="maffix">$</span>':'';
    const suf=col.type==='pct'?'<span class="maffix">%</span>':'';
    return `<span class="mnum">${pre}<input class="mctl mctl--num" type="text" inputmode="decimal" value="${v}"
      onmousedown="event.stopPropagation()"
      oninput="gridEdit('${sh.id}','${col.key}',this.value)"
      onchange="gridCommit('${sh.id}','${col.key}',this.value)">${suf}</span>`;
  }

  function renderGrid(){
    const host=document.getElementById('gridHost'); if(!host) return;
    const rows=gridRows();
    host.innerHTML=`
      <div class="msheet-card">
        <div class="msheet-toolbar">
          <div class="msheet-search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input placeholder="Search shows…" value="${esc(gridQuery)}" oninput="gridQuery=this.value;renderGrid()">
          </div>
          <div class="msheet-tools">
            <button class="btn btn--primary btn--sm" onclick="addShow()">+ Add show</button>
            <button class="btn btn--ghost btn--sm" onclick="toast('Paste a CSV of shows to add them in bulk.')">⬆ Bulk CSV</button>
            <button class="btn btn--ghost btn--sm" onclick="toast('Exported vmg-shows.xlsx')">⬇ Export .xlsx</button>
          </div>
        </div>
        <div class="msheet-scroll"><table class="msheet">
          <thead><tr><th class="mh mh--show">Shows</th>
            ${SHEET_COLS.map(c=>`<th class="mh" style="width:${c.w}px;min-width:${c.w}px">${c.label}</th>`).join('')}
            <th class="mh" style="width:46px"></th></tr></thead>
          <tbody>${rows.map((sh,ri)=>`<tr class="mrow" onmouseenter="fillEnter('${sh.id}')">
            <td class="mtd mtd--show"><button class="mshowcell mshowcell--btn" onclick="openShow('${sh.id}')" title="Open the full show record">
              <div class="mthumb">${esc(sh.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div>
              <div style="min-width:0"><div class="mshowname">${esc(sh.name)}</div>
              <div class="mshowdetail">Details<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></div></div></button></td>
            ${SHEET_COLS.map(c=>{
              const sel = gridSel && gridSel.id===sh.id && gridSel.key===c.key;
              const inR = gridDrag && gridDrag.key===c.key && ri>gridDrag.from && ri<=gridDrag.to;
              return `<td class="mtd" style="width:${c.w}px;min-width:${c.w}px">
                <div class="mcell${sel?' mcell--sel':''}${inR?' mcell--range':''}" onmousedown="selectCell('${sh.id}','${c.key}')">
                  ${sheetControl(sh,c)}
                  ${sel?`<span class="mfill" onmousedown="startFill(event,'${sh.id}','${c.key}')"></span>`:''}
                </div></td>`; }).join('')}
            <td class="mtd" style="text-align:center"><button class="btn btn--ghost btn--sm" style="padding:4px 8px" onclick="deleteShow('${sh.id}')" title="Remove show">✕</button></td>
          </tr>`).join('')}</tbody>
        </table></div>
        <div class="msheet-foot">
          <span class="msheet-total">${rows.length} show${rows.length!==1?'s':''}${gridQuery?' matched':''} · click a cell, then drag the corner handle to fill down</span>
          <button class="btn btn--primary btn--sm" id="gridSave" onclick="saveGrid()" ${gridDirty?'':'disabled style="opacity:.5"'}>${gridDirty?'Save and update':'Saved ✓'}</button>
        </div>
      </div>`;
  }

  function openShow(id){
    const sh=show(id);
    const live=SPOTS.filter(x=>x.showId===id&&projection(x)).sort((a,b)=>liveDays(a)-liveDays(b));
    const booked=SPOTS.filter(x=>x.showId===id&&x.status==='scheduled');
    const ran=SPOTS.filter(x=>x.showId===id&&x.kind==='paid'&&projection(x));
    const shorts=ran.filter(x=>verdict(x).k==='short').length;
    const owed=wonDeals().filter(d=>d.showId===id).reduce((a,d)=>a+Math.round(d.gross*0.85*sh.revShare),0);
    const adv=guaranteeAdvice().find(x=>x.showId===id);
    const kv=(l,v)=>`<div class="kv"><span>${l}</span><b>${v}</b></div>`;
    openDrawer(`<div class="drawer__head"><div>
        <span class="srcpill ${sh.src==='booster'?'booster':''}">${sh.src}</span>
        <h2 style="font-size:19px;font-weight:800;margin-top:8px;letter-spacing:-.03em">${esc(sh.name)}</h2>
        <div class="muted" style="font-size:12px">${esc(sh.host)} · ${esc(sh.category)} · ${esc(sh.channel)}</div>
      </div><button class="x" onclick="closeOverlays()">✕</button></div>
    <div class="drawer__body">
      <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:10px">
        ${kpiBox('Guarantee',K(sh.guarantee),`90% = ${K(Math.round(sh.guarantee*IAB_FULL))}`)}
        ${kpiBox('Check-in','day '+checkInDay(sh),'set by its own curve')}
        ${kpiBox('Live reads',live.length,live.length?live.map(x=>esc(x.brand)).join(', '):'none right now')}
      </div>

      <div style="margin-top:8px">
        ${kv('Publishes', sh.publishDays.join(' · '))}
        ${kv('Episodes a week', sh.epsPerWeek)}
        ${kv('Ad positions an episode', `${sh.positionsPerEp} <em>Booster cap</em>`)}
        ${kv('Rate', money(sh.cpm)+' CPM')}
        ${kv('Delivery numbers', sh.simulcast?`Video + audio <em>${sh.audioSrc==='hosting'?'auto from host':'requested from creator'}</em>`:'Video only')}
        ${kv('Channel scan', 'Every '+sh.scanEvery+'h')}
        ${kv('Rev share', `${Math.round(sh.revShare*100)}% <em>${money(owed)} owed</em>`)}
        ${kv('Make goods', sh.mgPolicy==='auto'?'Auto-schedule':'Ask the show first')}
      </div>

      <div class="dhead">Pacing</div>
      <p style="font-size:13px;line-height:1.6;color:var(--text-secondary);margin-top:6px">
        <b style="color:var(--text-primary)">${Math.round(curveAt(sh.curve,2)*100)}%</b> of a read's views land inside 48 hours and
        <b style="color:var(--text-primary)">${Math.round(curveAt(sh.curve,7)*100)}%</b> by day 7, fitted from ${sh.samples} verified reads.
        That is why the call gets made on day ${checkInDay(sh)} here rather than on a fixed rule.
        ${shorts?` ${shorts} of the last ${ran.length} flights came in under.`:''}
      </p>
      ${adv?`<div style="margin-top:11px;padding:12px 14px;border:1px solid var(--orange-bg);background:rgba(255,237,213,.4);border-radius:11px;display:flex;align-items:center;gap:11px">
        <div style="flex:1;font-size:12.5px">The guarantee is set above what the show does — reads land near ${K(adv.typical)}.</div>
        <button class="btn btn--ghost btn--sm" onclick="applyGuarantee('${sh.id}',${adv.suggest});closeOverlays()">Drop to ${K(adv.suggest)}</button></div>`:''}

      ${live.length||booked.length?`<div class="dhead">Reads on this show</div>
      <div style="display:flex;flex-direction:column;gap:7px;margin-top:8px">
        ${live.map(x=>{ const pr=projection(x), vv=verdict(x);
          return `<div class="wrow wrow--click" style="padding:11px 13px" onclick="openSpot('${x.id}')">
            <div class="wrow__main"><b>${esc(x.brand)}</b><span>Day ${pr.day} · ${K(pr.got)} of ${K(x.guarantee)}</span></div>
            <div class="wrow__num" style="width:120px">${projBar(x)}<b style="color:${toneVar(vv.tone)}">${Math.round(pr.ratio*100)}%</b></div></div>`; }).join('')}
        ${booked.map(x=>`<div class="wrow" style="padding:11px 13px;border-style:dashed">
          <div class="wrow__main"><b>${esc(x.brand)}</b><span>Booked ${dayName(x.published)} ${fmtDate(x.published)}${x.kind!=='paid'?' · '+esc(x.kind):''}</span></div></div>`).join('')}
      </div>`:''}

      <div class="dhead">Next avails</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${nextEpisodes(id,5).map(e=>`<span class="tag ${e.open?'tag--green':'tag--grey'}">${dayName(e.date)} ${fmtDate(e.date)} · ${e.open}/${e.cap}</span>`).join('')}</div>
    </div>
    <div class="drawer__foot"><button class="btn btn--ghost" onclick="closeOverlays()">Close</button></div>`);
  }

  const kpiBox=(l,v,sub)=>`<div style="border:1px solid var(--border-light);border-radius:11px;padding:12px 14px"><div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-tertiary)">${l}</div><div style="font-size:21px;font-weight:800;letter-spacing:-.03em;margin-top:3px">${v}</div><div class="muted" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${sub}</div></div>`;

  RENDER.shows = () => {
    const f=fillStats();
    document.getElementById('view-shows').innerHTML=`
    <div class="inner" style="max-width:1180px">
      <div class="pagebar">
        <div class="head"><h1>Shows</h1>
        <p>Show setup lives here — every projection, avail and make-good recommendation reads off this grid. Click a show name for its full record.</p></div>
        <div class="pagebar__right"><span class="tag tag--purple">${SHOWS.filter(x=>x.src==='booster').length} of ${SHOWS.length} synced from Booster</span></div>
      </div>
      <div id="gridHost"></div>
      <div class="footnote">Ad positions an episode and the guarantee are Booster's numbers, so a make good is never offered a slot that doesn't exist. Paid fill rate is ${f.rate}% — ${f.paid} spots sold, ${f.free} given as make goods or bonus.</div>
    </div>`;
    renderGrid();
  };


  function toggleDark(){
    document.body.classList.toggle('dark');
    const d=document.body.classList.contains('dark'), b=document.getElementById('dmBtn');
    if(b) b.lastChild.textContent = d?'Light Mode':'Dark Mode';
  }
  function applyGuarantee(showId,v){ show(showId).guarantee=v; rerender(); toast(`${show(showId).name} guarantee set to ${K(v)}. Written back to Booster and Airtable.`); }

  /* ═══════════════════════════ TOAST ═══════════════════════════ */
  let toastT;
  function toast(msg){ let el=document.getElementById('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:#fff;padding:12px 18px;border-radius:11px;font-size:13px;font-weight:600;z-index:80;box-shadow:var(--shadow-hover);opacity:0;transition:.25s;max-width:460px'; document.body.appendChild(el); }
    el.textContent=msg; requestAnimationFrame(()=>{el.style.opacity=1;el.style.transform='translateX(-50%) translateY(0)';}); clearTimeout(toastT); toastT=setTimeout(()=>{el.style.opacity=0;el.style.transform='translateX(-50%) translateY(20px)';},3400); }

  /* init */
  refreshBadges(); RENDER.overview();
  // The agent is not something you start — it has already run by the time you look.
  setTimeout(()=>{ if(SPOTS.some(s=>s.status==='aired')) runAgent(); }, 900);
  </script>
</body>
</html>
