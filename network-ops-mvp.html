<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VMG Command Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317212B'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #17212B; --primary-hover: #282828;
      --accent: #17212B; --accent-hover: #282828; --accent-soft: #F3F4F6;
      --text-primary: #1D2027; --text-secondary: #707481; --text-tertiary: #9CA3AF;
      --border: #E4E6ED; --border-light: #EDEEF1; --border-strong: #C5CBD5;
      --white: #ffffff; --secondary-lite: #F3F4F6;
      --nav: #F3F4F6; --nav-current: #E4E6ED; --nav-hover: #EBEDF2;
      --page-bg: #EDEEF1; --panel: #ffffff;
      --green-text: #0E6832; --green-bg: #D6F1E0;
      --blue-text: #1435C0; --blue-bg: #C7E0FF;
      --orange-text: #C2410C; --orange-bg: #FFEDD5;
      --red-text: #B42318; --red-bg: #FEE4E2;
      --purple-text: #6941C6; --purple-bg: #EBE9FE;
      --shadow-post: 0 0 2px 0 rgba(166,175,195,.40);
      --shadow-btn: 0 1px 3px 0 rgba(166,175,195,.20);
      --shadow-card: 0 1px 2px rgba(166,175,195,.18);
      --shadow-hover: 0 12px 34px rgba(120,130,150,.18);
      --radius-card: 14px; --radius-btn: 9px; --radius-pill: 999px;
      /* categorical chart palette */
      --c1:#17212B; --c2:#3B82F6; --c3:#10B981; --c4:#F59E0B; --c5:#8B5CF6; --c6:#EC4899; --c7:#06B6D4;
    }
    body.dark {
      --primary:#F3F4F6; --primary-hover:#E4E6ED;
      --text-primary:#F0F1F4; --text-secondary:#9BA3B0; --text-tertiary:#6C7581;
      --border:#2A2F38; --border-light:#232830; --border-strong:#3C434E;
      --white:#161A20; --panel:#161A20; --secondary-lite:#212630; --page-bg:#0D1015;
      --nav:#212630; --nav-current:#2A2F38; --nav-hover:#212630;
      --green-bg:#12351F; --blue-bg:#152A47; --orange-bg:#3A2410; --red-bg:#3D1A18; --purple-bg:#241C42;
      --green-text:#5BD68F; --blue-text:#7FB4FF; --orange-text:#F0A868; --red-text:#F58B84; --purple-text:#B69BF5;
      --shadow-card:0 1px 2px rgba(0,0,0,.4); --shadow-btn:0 1px 3px rgba(0,0,0,.35); --shadow-hover:0 12px 34px rgba(0,0,0,.5);
    }
    body.dark .btn--primary, body.dark .pill--solid, body.dark .askwrap__go, body.dark .tb-av, body.dark .sb-powered .smark { color:#12161C; }
    body.dark .portal-hero { background: linear-gradient(135deg,#212630,#2A3038); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--page-bg); color: var(--text-primary);
      -webkit-font-smoothing: antialiased; line-height: 1.45; letter-spacing: -.01em;
      display: flex; gap: 9px; height: 100vh; overflow: hidden; padding: 9px;
    }
    button { font-family: inherit; cursor: pointer; }
    a { color: inherit; }

    /* ─── SIDEBAR ─── */
    .sidebar { width: 244px; flex-shrink: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 15px; display: flex; flex-direction: column; padding: 16px 13px 13px; overflow: hidden; }
    .sb-brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 18px; }
    .sb-brand__mark { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: -.02em; }
    .sb-brand__name b { display: block; color: var(--text-primary); font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
    .sb-brand__name span { display: block; color: var(--text-tertiary); font-size: 10px; font-weight: 700; letter-spacing: .14em; margin-top: 1px; }
    .sb-scroll { overflow-y: auto; flex: 1; margin: 0 -6px; padding: 0 6px; }
    .sb-scroll::-webkit-scrollbar { width: 0; }
    .sb-group { margin-top: 10px; }
    .sb-group__label { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-tertiary); padding: 8px 10px 6px; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 11px; padding: 8.5px 11px; border: none; background: none; border-radius: 9px; color: var(--text-secondary); font-size: 13.5px; font-weight: 600; text-align: left; transition: background .12s, color .12s; position: relative; }
    .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; opacity: .85; }
    .nav-item:hover { background: var(--nav-hover); color: var(--text-primary); }
    .nav-item.active { background: var(--nav-current); color: var(--text-primary); }
    .nav-item.active svg { opacity: 1; }
    .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #3FB87C; margin-left: auto; box-shadow: 0 0 0 0 rgba(63,184,124,.6); animation: pulse 2.2s infinite; }
    .nav-item .badge { margin-left: auto; background: var(--red-bg); color: var(--red-text); font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(63,184,124,.5);} 70%{box-shadow:0 0 0 5px rgba(63,184,124,0);} 100%{box-shadow:0 0 0 0 rgba(63,184,124,0);} }
    .sb-foot { padding-top: 10px; border-top: 1px solid var(--border-light); margin-top: 8px; }
    .sb-powered { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 11px; font-weight: 600; color: var(--text-tertiary); width: 100%; border: none; background: none; text-align: left; border-radius: 9px; }
    .sb-powered .smark { width: 18px; height: 18px; border-radius: 5px; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 800; }
    .sb-powered b { color: var(--text-secondary); font-weight: 700; }
    .sb-user { display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; }
    .sb-user__av { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
    .sb-user__name { color: var(--text-primary); font-size: 12.5px; font-weight: 700; line-height: 1.2; }
    .sb-user__sub { color: var(--text-tertiary); font-size: 11px; font-weight: 500; }

    /* recent questions, under the nav */
    .recent { margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--border-light); }
    .recent__hd { display: flex; align-items: center; justify-content: space-between; padding: 0 10px 7px; }
    .recent__hd span { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-tertiary); }
    .recent__hd button { border: none; background: none; color: var(--text-tertiary); font-size: 11px; font-weight: 700; padding: 2px 5px; border-radius: 6px; }
    .recent__hd button:hover { color: var(--text-primary); background: var(--nav-hover); }
    .chat { display: block; width: 100%; text-align: left; border: none; background: none; border-radius: 9px; padding: 7px 10px; color: var(--text-tertiary); font-size: 11.5px; font-weight: 500; line-height: 1.45; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .chat:hover { background: var(--nav-hover); color: var(--text-secondary); }
    .chat.active { background: var(--nav-current); color: var(--text-primary); font-weight: 600; }

    /* ─── TOP BAR ─── */
    .topbar { display: flex; align-items: center; gap: 4px; justify-content: flex-end; padding: 13px 18px 0; flex-shrink: 0; }
    .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #3FB87C; margin-left: auto; }
    .nav-item { border: none; background: none; border-radius: 8px; padding: 6px 11px; color: var(--text-tertiary); font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    .nav-item:hover { color: var(--text-primary); background: var(--nav-hover); }
    .nav-item.active { color: var(--text-primary); background: var(--nav-current); }
    .nav-item .badge { background: var(--red-bg); color: var(--red-text); font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 999px; }
    .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #3FB87C; }
    .tb-btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--panel); color: var(--text-secondary); font-size: 12px; font-weight: 600; margin-left: 6px; }
    .tb-btn:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .tb-btn svg { width: 13px; height: 13px; }
    .tb-av { width: 30px; height: 30px; border-radius: 9px; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 11px; margin-left: 6px; border: none; flex-shrink: 0; }

    /* ─── MAIN ─── */
    .main { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 15px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .views { flex: 1; overflow-y: auto; }
    .view { display: none; }
    .view.active { display: block; }
    .inner { max-width: 1220px; margin: 0 auto; padding: 26px 34px 90px; }
    .pagebar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 22px; gap: 16px; flex-wrap: wrap; }
    .head h1 { font-size: 25px; font-weight: 700; letter-spacing: -.035em; display: flex; align-items: center; gap: 11px; }
    .head p { color: var(--text-secondary); font-size: 13.5px; margin-top: 4px; font-weight: 500; max-width: 640px; }
    .pagebar__right { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .live-dot { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; color: var(--green-text); background: var(--green-bg); padding: 4px 10px; border-radius: var(--radius-pill); }
    .live-dot i { width: 6px; height: 6px; border-radius: 50%; background: var(--green-text); animation: pulse 2s infinite; }

    /* filters */
    .seg { display: inline-flex; background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 3px; box-shadow: var(--shadow-btn); }
    .seg button { border: none; background: none; padding: 6px 13px; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); border-radius: 7px; }
    .seg button.active { background: var(--primary); color: #fff; }

    /* buttons */
    .btn { display: inline-flex; align-items: center; gap: 7px; border-radius: var(--radius-btn); padding: 9px 15px; font-size: 13px; font-weight: 600; border: 1px solid transparent; transition: .13s; }
    .btn svg { width: 15px; height: 15px; }
    .btn--primary { background: var(--primary); color: #fff; }
    .btn--primary:hover { background: var(--primary-hover); }
    .btn--ghost { background: var(--white); border-color: var(--border); color: var(--text-secondary); box-shadow: var(--shadow-btn); }
    .btn--ghost:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .btn--sm { padding: 6px 11px; font-size: 12px; }
    .btn--green { background: var(--green-text); color: #fff; }
    .btn--green:hover { filter: brightness(1.08); }

    /* cards + grid */
    .grid { display: grid; gap: 16px; }
    .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
    .card__pad { padding: 18px 20px; }
    .card__head { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid var(--border-light); }
    .card__title { font-size: 14px; font-weight: 700; letter-spacing: -.02em; display:flex; align-items:center; gap:8px; }
    .card__sub { font-size: 12px; color: var(--text-tertiary); font-weight: 500; margin-top: 2px; }

    /* stat tiles */
    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .tile { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 16px 18px; box-shadow: var(--shadow-card); }
    .tile__label { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .tile__val { font-size: 26px; font-weight: 800; letter-spacing: -.03em; margin-top: 7px; }
    .tile__delta { font-size: 11.5px; font-weight: 700; margin-top: 5px; display: inline-flex; align-items: center; gap: 4px; }
    .up { color: var(--green-text); } .down { color: var(--red-text); }

    /* tags */
    .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; letter-spacing: -.01em; }
    .tag--green { background: var(--green-bg); color: var(--green-text); }
    .tag--blue { background: var(--blue-bg); color: var(--blue-text); }
    .tag--orange { background: var(--orange-bg); color: var(--orange-text); }
    .tag--red { background: var(--red-bg); color: var(--red-text); }
    .tag--purple { background: var(--purple-bg); color: var(--purple-text); }
    .tag--grey { background: var(--secondary-lite); color: var(--text-secondary); }
    .tag i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* tables */
    table { width: 100%; border-collapse: collapse; }
    thead th { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); text-align: left; padding: 11px 20px; border-bottom: 1px solid var(--border-light); }
    tbody td { font-size: 13px; padding: 13px 20px; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr.clickable:hover { background: var(--page-bg); cursor: pointer; }
    .num { font-variant-numeric: tabular-nums; }
    .right { text-align: right; }

    /* progress / pacing bar */
    .pace { height: 8px; border-radius: 999px; background: var(--secondary-lite); overflow: hidden; position: relative; }
    .pace__fill { height: 100%; border-radius: 999px; background: var(--primary); transition: width .5s; }
    .pace--good .pace__fill { background: var(--green-text); }
    .pace--warn .pace__fill { background: var(--orange-text); }
    .pace--bad .pace__fill { background: var(--red-text); }

    /* progress ring */
    .ringwrap { display:flex; align-items:center; gap:14px; }

    /* coach */
    .coach-card { display: flex; gap: 14px; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--border-light); background: var(--white); }
    .coach-card + .coach-card { margin-top: 12px; }
    .coach-ico { width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center; }
    .coach-card b { font-size: 13.5px; font-weight: 700; }
    .coach-card p { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; line-height: 1.5; }
    .coach-act { margin-top: 9px; font-size: 12px; font-weight: 700; color: var(--primary); display: inline-flex; align-items: center; gap: 5px; }

    /* modal / drawer */
    .scrim { position: fixed; inset: 0; background: rgba(20,25,35,.44); backdrop-filter: blur(2px); z-index: 60; display: none; }
    .scrim.open { display: block; }
    .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: 560px; max-width: 94vw; background: var(--white); z-index: 61; box-shadow: -10px 0 40px rgba(20,25,35,.16); transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }
    .drawer__head { padding: 20px 24px; border-bottom: 1px solid var(--border-light); display: flex; align-items: flex-start; justify-content: space-between; }
    .drawer__body { padding: 22px 24px; overflow-y: auto; flex: 1; }
    .drawer__foot { padding: 16px 24px; border-top: 1px solid var(--border-light); display: flex; gap: 10px; justify-content: flex-end; }
    .x { border: none; background: var(--secondary-lite); width: 30px; height: 30px; border-radius: 8px; color: var(--text-secondary); font-size: 16px; display: grid; place-items: center; }

    /* modal center */
    .modal { position: fixed; z-index: 61; top: 50%; left: 50%; transform: translate(-50%,-46%); width: 720px; max-width: 94vw; max-height: 90vh; overflow-y: auto; background: var(--white); border-radius: 16px; box-shadow: var(--shadow-hover); opacity: 0; pointer-events: none; transition: .22s; }
    .modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%); }

    .kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; font-size: 13px; }
    .kv dt { color: var(--text-tertiary); font-weight: 600; }
    .kv dd { font-weight: 600; }

    .field { margin-bottom: 15px; }
    .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
    .field input, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; font-size: 13.5px; font-family: inherit; color: var(--text-primary); background: var(--white); }
    .field input:focus, .field select:focus { outline: none; border-color: var(--primary); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .footnote { margin-top: 26px; font-size: 11.5px; color: var(--text-tertiary); text-align: center; }
    .muted { color: var(--text-tertiary); }
    .empty { text-align: center; padding: 40px 20px; color: var(--text-tertiary); font-size: 13px; }

    /* air check agent scan */
    .scanbar { height: 4px; background: var(--secondary-lite); border-radius: 999px; overflow: hidden; }
    .scanbar__fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--c2), var(--c3)); transition: width .3s; }
    .agentrow { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border: 1px solid var(--border-light); border-radius: 12px; background: var(--white); }
    .agentrow + .agentrow { margin-top: 10px; }
    .thumb { width: 92px; height: 52px; border-radius: 8px; object-fit: cover; background: var(--secondary-lite); flex-shrink: 0; }
    .pulse-blue { animation: pulseb 1.4s infinite; }
    @keyframes pulseb { 0%,100%{opacity:1;} 50%{opacity:.45;} }

    /* proof reel */
    .reel-stage { background: #0b0f14; border-radius: 14px; overflow: hidden; position: relative; aspect-ratio: 16/9; display: grid; place-items: center; }
    .reel-stage iframe { width: 100%; height: 100%; border: 0; }
    .reel-strip { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px; }
    .reel-clip { width: 150px; flex-shrink: 0; border-radius: 10px; overflow: hidden; border: 2px solid transparent; background: var(--white); box-shadow: var(--shadow-card); }
    .reel-clip.active { border-color: var(--c2); }
    .reel-clip img { width: 100%; height: 84px; object-fit: cover; display: block; background:#222; }
    .reel-clip__meta { padding: 7px 9px; }

    /* deliverables & compliance (North Station pattern) */
    .ai-tag { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--purple-bg); color: var(--purple-text); padding: 3px 8px; border-radius: 999px; }
    .cmp-hint { font-size: 11.5px; color: var(--text-tertiary); margin: 6px 0 2px; line-height: 1.45; }
    .cmp-row { border: 1px solid var(--border-light); border-radius: 11px; padding: 11px 12px; margin-top: 9px; background: var(--white); }
    .cmp-row__top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
    .cmp-row__date { font-size: 12px; font-weight: 700; }
    .cmp-status { font-size: 10.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
    .cmp-status.ok { background: var(--green-bg); color: var(--green-text); }
    .cmp-status.pend { background: var(--secondary-lite); color: var(--text-secondary); }
    .cmp-inp { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-family: inherit; margin-top: 6px; color: var(--text-primary); background: var(--white); }
    .cmp-inp:focus { outline: none; border-color: var(--primary); }
    .cmp-inp::placeholder { color: var(--text-tertiary); }

    /* advertiser portal */
    .portal-hero { background: linear-gradient(135deg, #17212B, #26333F); color: #fff; border-radius: 16px; padding: 26px 28px; }
    .portal-hero h2 { font-size: 22px; font-weight: 800; letter-spacing: -.03em; }
    .brand-chip { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 15px; flex-shrink: 0; }


    /* ─── chat-first hero (matches the SpotsNow Intelligence layout) ─── */
    .hero { max-width:720px; margin:0 auto; padding:44px 0 0; text-align:center; }
    .hero h1 { font-size:34px; font-weight:800; letter-spacing:-.04em; }
    .hero p { color:var(--text-secondary); font-size:14px; font-weight:500; line-height:1.6; max-width:560px; margin:12px auto 0; }
    .hero__pills { display:flex; gap:9px; justify-content:center; margin-top:18px; }
    .pill { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--white); color:var(--text-secondary); box-shadow:var(--shadow-btn); }
    .pill--solid { background:var(--primary); border-color:var(--primary); color:#fff; }
    .pill i { width:7px; height:7px; border-radius:50%; background:currentColor; }
    .askwrap { position:relative; margin-top:26px; }

  /* ── IAB: full delivery is 90% of the guarantee. Anything over 100% is bonus. ── */
  const IAB_FULL = 0.90;
  /* ── The make-good call gets made as soon as the show's own curve is settled
        enough to trust, not on a fixed day-10 rule and not at day 30. Warren
        Smith is callable on day 3; Sage Steele needs to day 13. ── */
  const FINAL_DAY = 30, CALL_AT = 0.90;

  /* ═══ LEARNED VIEW CURVES ═══
     Cumulative share of the 30-day number by day. The agent refits these from
     every read it verifies, so each show gets its own shape:
       Warren Smith front-loads (~85% inside 2 days) · Sage Steele has a long tail. */
  const CURVES = {
    fast:   {0:0, 1:.55, 2:.83, 3:.90, 5:.95, 7:.97, 10:.985, 14:.99, 21:.997, 30:1},
    quick:  {0:0, 1:.42, 2:.68, 3:.79, 5:.89, 7:.93, 10:.96, 14:.98, 21:.995, 30:1},
    medium: {0:0, 1:.30, 2:.50, 3:.63, 5:.76, 7:.84, 10:.90, 14:.94, 21:.98, 30:1},
    steady: {0:0, 1:.22, 2:.38, 3:.50, 5:.66, 7:.76, 10:.85, 14:.91, 21:.96, 30:1},
    slow:   {0:0, 1:.06, 2:.18, 3:.34, 5:.62, 7:.75, 10:.85, 14:.92, 21:.97, 30:1},
  };
  // First day this show's curve is settled enough to call the number.
  const _ci={};
  function checkInDay(sh){
    if(_ci[sh.id]!=null) return _ci[sh.id];
    let d=3; while(d<30 && curveAt(sh.curve,d)<CALL_AT) d++;
    return _ci[sh.id]=d;
  }
  const checkInDate = s => addDays(s.published, checkInDay(show(s.showId)));

  function curveAt(key, day){
    const c=CURVES[key]||CURVES.medium; const ks=Object.keys(c).map(Number).sort((a,b)=>a-b);
    if(day<=0) return 0; if(day>=30) return 1;
    for(let i=0;i<ks.length-1;i++){ const a=ks[i], b=ks[i+1];
      if(day>=a && day<=b) return c[a] + (c[b]-c[a])*((day-a)/(b-a)); }
    return 1;
  }

  const REPS = ['Marcus Bell','Priya Shah','Devin Cole'];

  /* ═══ SHOW SETUP LAYER ═══

  const SHOWS = [
    { id:'rubin',  name:'The Rubin Report', host:'Dave Rubin',    publishDays:['Mon','Tue','Wed','Thu','Fri'], epsPerWeek:5, positionsPerEp:4, curve:'medium', samples:46, simulcast:true,  audioSrc:'hosting', mgPolicy:'auto', guarantee:95000,  cpm:26, category:'Politics / Culture', channel:'@rubinreport',   src:'booster' },

  /* ═══ AD SPOTS ═══

  const SPOTS = [

    { id:'s5',  dealId:'d5',  brand:'Kalshi', showId:'sage', kind:'paid', published:'2026-08-12', guarantee:120000, views:62000, downloads:13000, dlState:'auto', status:'verified', length:'60s', yt:'M7lc1UVf-VE', ts:286, epLen:5100, copyStatus:'seen', copy:['Named the brand','Read promo code KALSHI','Free-trial CTA'] },

  const spot = id => SPOTS.find(s=>s.id===id);

  /* ═══ DELIVERY MATH ═══ */
  const delivered = s => s.views==null ? null : (s.views + (s.downloads||0));
  const liveDays  = s => s.status==='scheduled' ? -1 : daysBetween(s.published, TODAY);
  function projection(s){
    const d = liveDays(s), sh = show(s.showId), got = delivered(s);

    const p = curveAt(sh.curve, Math.max(d,1));
    const proj = d >= FINAL_DAY ? got : Math.round(got / Math.max(p,.02));
    return { day:d, curvePct:p, got, proj, ratio: proj/Math.max(s.guarantee,1), rawRatio: got/Math.max(s.guarantee,1),
             final: d >= FINAL_DAY, confident: d >= checkInDay(sh), callAt: checkInDay(sh), samples: sh.samples };
  }

     make good. Firm means the day 10–14 window is open, or enough of the curve
     is already in that the number can't move much. Before that it's indicative:
     still useful as an early warning, not something you act on. */
  function verdict(s){
    const pr = projection(s); if(!pr) return { k:'pending', label:'Awaiting episode', tone:'grey' };
    if(s.dlState==='requested') return { k:'blocked', label:'Waiting on downloads', tone:'purple', pr };
    if(pr.curvePct < .45 && !pr.confident) return { k:'early', label:'Too early to call', tone:'grey', pr };
    if(!pr.confident){
      if(pr.ratio >= 1.0)     return { k:'trackOver',  label:'Tracking over',        tone:'green',  pr, soft:true };
      if(pr.ratio >= IAB_FULL) return { k:'trackFull', label:'Tracking to clear 90%', tone:'green',  pr, soft:true };
      return { k:'trackLight', label:'Tracking light', tone:'orange', pr, soft:true };
    }
    if(pr.ratio >= 1.0) return { k:'bonus', label:pr.final?'Delivered + bonus':'Tracking over', tone:'green', pr };
    if(pr.ratio >= IAB_FULL) return { k:'full', label:pr.final?'Delivered in full':'On track to 90%', tone:'green', pr };
    return { k:'short', label:pr.final?'Under-delivered':'Projected short', tone:'red', pr };
  }
  // what the advertiser paid for this read, at the show's rate
  const spotCost = s => Math.round(s.guarantee/1000 * show(s.showId).cpm);
  const shortfall = s => { const pr=projection(s); return pr?Math.max(0, Math.round(s.guarantee - pr.proj)):0; };

  /* ═══ AVAILS ═══ Airtable knows what's booked; Booster knows the cap per episode. ═══ */
  function nextEpisodes(showId, n=4, from){
    const sh=show(showId), out=[]; let d=from||addDays(TODAY,1);
    for(let i=0;i<45 && out.length<n;i++,d=addDays(d,1)){
      if(!sh.publishDays.includes(dayName(d))) continue;
      const booked = SPOTS.filter(x=>x.showId===showId && x.published===d).length;
      out.push({ date:d, booked, cap:sh.positionsPerEp, open:Math.max(0, sh.positionsPerEp-booked) });
    }
    return out;
  }

  /* ═══ MAKE GOODS ═══ the loop from the call: recommend → approve date → draft to
     show + brand → two sign-offs → write back to Airtable as a Make Good. ═══ */
  const MAKEGOODS = [
    { id:'mg1', spotId:'s3', date:'2026-08-20', status:'scheduled', showOk:true, brandOk:true,
      showVia:'gmail', brandVia:'gmail', note:'Written to Airtable as Make Good · Aug 20.' },
    { id:'mg3', spotId:'s7', date:'2026-08-19', status:'awaiting', showOk:true, brandOk:null,
      showVia:'auto', brandVia:null, sentBrand:'2026-08-16' },
  ];
  let MG_SEQ = 10;
  const mg = id => MAKEGOODS.find(m=>m.id===id);
  const mgForSpot = id => MAKEGOODS.find(m=>m.spotId===id);
  // Any spot projected short that hasn't got a make-good yet
  const needsMakegood = () => SPOTS.filter(s=>verdict(s).k==='short' && !mgForSpot(s.id));

  // Everything on the Delivery page that wants a human — kept in one place so the
  // sidebar badge and the tab counter can never drift apart.
  function deliveryAttention(){
    const aired   = SPOTS.filter(s=>s.status==='aired' && !s.missed);
    const noEp    = SPOTS.filter(s=>s.status==='aired' && s.missed);
    const blocked = SPOTS.filter(s=>s.dlState==='requested');
    const shortNow= needsMakegood();
    return { aired, noEp, blocked, shortNow, count: aired.length+noEp.length+blocked.length+shortNow.length };
  }

  /* ═══ WHAT THE AGENT LEARNED ═══ the guarantee-tuning + fill-rate read ═══ */
  function fillStats(){
    const ran = SPOTS.filter(s=>s.status==='verified' || s.kind==='makegood');
    const paid = ran.filter(s=>s.kind==='paid').length;
    const free = ran.filter(s=>s.kind!=='paid').length;
    return { paid, free, total:paid+free, rate: pctOf(paid, paid+free) };
  }
  function guaranteeAdvice(){
    const out=[];
    SHOWS.forEach(sh=>{
      const ran = SPOTS.filter(s=>s.showId===sh.id && s.kind==='paid' && projection(s));
      if(ran.length < 2) return;
      const shortCount = ran.filter(s=>['short'].includes(verdict(s).k)).length;
      if(!shortCount) return;
      const typical = Math.round(ran.reduce((a,s)=>a+(projection(s).proj||0),0)/ran.length);
      const suggest = Math.round(typical*0.95/1000)*1000;
      if(suggest >= sh.guarantee) return;
      out.push({ showId:sh.id, shortCount, flights:ran.length, current:sh.guarantee, suggest, typical });
    });
    return out.sort((a,b)=>b.shortCount-a.shortCount);
  }

  const brandColor = { 'Kalshi':'#00d09c','DraftKings':'#53d337','Ritual':'#f8b3c0','Ramp':'#f7b32b','Notion':'#111','BetterHelp':'#2f9e97','AG1':'#0b3d2e' };
  const BRAND_DOMAIN = { Kalshi:'kalshi.com', DraftKings:'draftkings.com', Ritual:'ritual.com', Ramp:'ramp.com', Notion:'notion.so', BetterHelp:'betterhelp.com', AG1:'drinkag1.com' };

  // Ad-read quality score — read completeness, delivery, placement, verification
  function qualityScore(s){
    const copyPts = Math.min((s.copy||[]).length,3)/3;
    const pr = projection(s);
    const deliv = Math.min((pr?pr.ratio:0),1.2)/1.2;
    const pos = (s.ts||0)/epLenOf(s);
    const placement = (pos>=0.08 && pos<=0.75) ? 1 : (pos<0.08 ? 0.7 : 0.55);
    const verified = s.status==='verified' ? 1 : 0.6;
    const score = Math.round((copyPts*0.30 + deliv*0.30 + placement*0.20 + verified*0.20)*100);
    const grade = score>=90?'A':score>=80?'B':score>=70?'C':'D';
    const tone = score>=90?'green':score>=80?'blue':score>=70?'orange':'red';
    return { score, grade, tone, factors:[
      {k:'Copy read complete', v:Math.round(copyPts*100)},
      {k:'Projected delivery', v:Math.round(deliv*100)},
      {k:'Mid-roll placement', v:Math.round(placement*100)},
      {k:'Air check verified', v:Math.round(verified*100)},
    ]};
  }

  /* ═══════════════════════════ CHART HELPERS (inline SVG) ═══════════════════════════ */
  const PAL = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)'];
  function barChart(data, {w=560,h=210,pad=30,fmt=money,color='var(--c1)'}={}){
    const max = Math.max(...data.map(d=>d.v),1);
    const bw = (w-pad*2)/data.length;
    let bars='';
    data.forEach((d,i)=>{
      const bh = (h-pad-24)*(d.v/max);
      const x = pad+i*bw+bw*0.16, y=h-24-bh, ww=bw*0.68;
      const cc = d.color || color;
      bars += `<rect x="${x}" y="${y}" width="${ww}" height="${bh}" rx="4" fill="${cc}"><title>${esc(d.k)}: ${fmt(d.v)}</title></rect>`;
      bars += `<text x="${x+ww/2}" y="${h-8}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--text-tertiary)">${esc(d.k)}</text>`;
      bars += `<text x="${x+ww/2}" y="${y-5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--text-secondary)">${d.lbl||fmt(d.v)}</text>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" width="100%">${bars}</svg>`;
  }
  function stackedBar(cats, series, {w=560,h=230,pad=32,fmt=money}={}){
    // cats: ['Jan',...]; series: [{name,color,vals:[..]}]
    const totals = cats.map((_,i)=>series.reduce((a,s)=>a+s.vals[i],0));
    const max = Math.max(...totals,1);
    const bw=(w-pad*2)/cats.length; let out='';
    cats.forEach((c,i)=>{
      let y=h-24; const x=pad+i*bw+bw*0.15, ww=bw*0.7;
      series.forEach(s=>{
        const seg=(h-pad-24)*(s.vals[i]/max); if(seg<=0)return;
        y-=seg; out+=`<rect x="${x}" y="${y}" width="${ww}" height="${seg}" fill="${s.color}"><title>${s.name} · ${esc(c)}: ${fmt(s.vals[i])}</title></rect>`;
      });
      out+=`<text x="${x+ww/2}" y="${h-8}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--text-tertiary)">${esc(c)}</text>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" width="100%">${out}</svg>`;
  }
  function donut(data, {size=150,thick=26}={}){
    const total=data.reduce((a,d)=>a+d.v,0)||1; const r=(size-thick)/2, cx=size/2, cy=size/2, C=2*Math.PI*r;
    let off=0, segs='';
    data.forEach((d,i)=>{
      const frac=d.v/total, len=frac*C;
      segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color||PAL[i%7]}" stroke-width="${thick}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"><title>${esc(d.k)}: ${d.v}</title></circle>`;
      off+=len;
    });
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${segs}<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="19" font-weight="800" fill="var(--text-primary)">${total}</text><text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--text-tertiary)">deals</text></svg>`;
  }
  function lineChart(pts, {w=560,h=200,pad=32,fmt=v=>v,color='var(--c2)'}={}){
    const max=Math.max(...pts.map(p=>p.v))*1.15||1, min=0;
    const X=i=>pad+(w-pad*2)*(i/(pts.length-1||1)); const Y=v=>h-26-(h-pad-26)*((v-min)/(max-min||1));
    let d='',dots='',area='';
    pts.forEach((p,i)=>{ const x=X(i),y=Y(p.v); d+=(i?'L':'M')+x+' '+y+' '; dots+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${color}"><title>${esc(p.k)}: ${fmt(p.v)}</title></circle>`; });
    area=`M${X(0)} ${h-26} `+pts.map((p,i)=>'L'+X(i)+' '+Y(p.v)).join(' ')+` L${X(pts.length-1)} ${h-26} Z`;
    const labels=pts.map((p,i)=>`<text x="${X(i)}" y="${h-8}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--text-tertiary)">${esc(p.k)}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%"><path d="${area}" fill="${color}" opacity="0.08"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}</svg>`;
  }
  function ring(pct, {size=64,thick=8,color='var(--green-text)'}={}){
    const r=(size-thick)/2,c=size/2,C=2*Math.PI*r,len=Math.min(pct,150)/100*C;
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--secondary-lite)" stroke-width="${thick}"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${thick}" stroke-linecap="round" stroke-dasharray="${len} ${C}" transform="rotate(-90 ${c} ${c})"/><text x="${c}" y="${c+4}" text-anchor="middle" font-size="14" font-weight="800" fill="var(--text-primary)">${pct}%</text></svg>`;
  }
  function legend(items){ return `<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:12px">`+items.map(i=>`<span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text-secondary)"><i style="width:9px;height:9px;border-radius:3px;background:${i.color}"></i>${esc(i.k)}</span>`).join('')+`</div>`; }

  /* ═══════════════════════════ ASK ═══════════════════════════ */
  let ANSWER='', CHATS=[], ACTIVE_CHAT=-1;
  function renderChats(){
    const el=document.getElementById('chats'); if(!el) return;
    const wrap=document.getElementById('recentWrap'); if(wrap) wrap.style.display = CHATS.length?'':'none';
    el.innerHTML = CHATS.slice(0,6).map((c,i)=>`<button class="chat ${i===ACTIVE_CHAT?'active':''}" onclick="openChat(${i})">${esc(c.q)}</button>`).join('');
  }
  function openChat(i){ ACTIVE_CHAT=i; ANSWER=CHATS[i].a; go('overview'); }
  function newChat(){ ACTIVE_CHAT=-1; ANSWER=''; go('overview'); const el=document.querySelector('.view.active #acAsk'); if(el) el.focus(); }
  function askVmg(q){
    const el=document.querySelector('.view.active #acAsk'); const t=q||(el?el.value.trim():''); if(!t) return;
    ANSWER=answerQuery(t);
    CHATS.unshift({q:t, a:ANSWER}); ACTIVE_CHAT=0; CHATS=CHATS.slice(0,12);
    if(el) el.value=''; if(CURRENT!=='overview') go('overview'); else rerender();

  const goChip=(label,view)=>`<button class="btn btn--ghost btn--sm" style="margin-top:10px" onclick="go('${view}')">${label}</button>`;
  const nameOf = s => `${esc(s.brand)} on ${esc(show(s.showId).name)}`;
  function answerQuery(raw){
    const q=raw.toLowerCase().trim();
    const live=SPOTS.filter(s=>projection(s));
    const brandHit=[...new Set(SPOTS.map(s=>s.brand))].find(b=>q.includes(b.toLowerCase()));
    const showHit=SHOWS.find(s=>q.includes(s.name.toLowerCase())||q.includes(s.host.toLowerCase()));
    if(brandHit && showHit){
      const sp=live.filter(s=>s.brand===brandHit&&s.showId===showHit.id).sort((x,y)=>liveDays(y)-liveDays(x))[0];
      if(sp){ const v=verdict(sp), pr=v.pr;
        return `<b>${nameOf(sp)}</b> is day ${pr.day} of 30. ${K(pr.got)} delivered against ${K(sp.guarantee)} — reads <b>${Math.round(pr.rawRatio*100)}%</b> raw, but ${esc(showHit.name)} only has ${Math.round(pr.curvePct*100)}% of views in by now. Projects <b>${K(pr.proj)}</b> = <b>${Math.round(pr.ratio*100)}%</b>. ${v.k==='short'?'Lands short — make good needed.':'Clears the 90% line.'}`; }
    }
    if(/make ?good|short|under.?deliver/.test(q)){
      const need=needsMakegood();
      return need.length?`${need.length} flight${need.length>1?'s':''} project${need.length>1?'':'s'} under 90%: `+need.map(x=>`<b>${nameOf(x)}</b> (${Math.round(verdict(x).pr.ratio*100)}%, ${K(shortfall(x))} short)`).join(', ')+`.`:`Nothing new projecting short.`;
    }
    if(/behind|pacing|pace|track/.test(q)){
      const soft=live.filter(x=>{const v=verdict(x);return v.pr&&v.pr.rawRatio<0.75&&v.k!=='short';});
      const bad=live.filter(x=>verdict(x).k==='short');
      return (bad.length?`Behind: `+bad.map(x=>`<b>${nameOf(x)}</b> (${Math.round(verdict(x).pr.ratio*100)}%)`).join(', ')+`. `:`Nothing behind. `)
        +(soft.length?`${soft.map(x=>`<b>${nameOf(x)}</b>`).join(', ')} look${soft.length>1?'':'s'} light on raw numbers but the curve says ${soft.length>1?'they land':'it lands'} fine.`:'');
    }
    if(/copy|cta|opened/.test(q)){
      const n=SPOTS.filter(x=>['needs_copy','needs_cta'].includes(x.copyStatus)), u=SPOTS.filter(x=>x.copyStatus==='sent');
      return (n.length?`${n.length} spot${n.length>1?'s':''} need copy or a CTA: `+n.map(x=>`<b>${nameOf(x)}</b>`).join(', ')+`. `:`All copy is in. `)+(u.length?`${u.length} copy email${u.length>1?'s':''} sent but not opened.`:'');
    }
    if(/guarantee|too high|fill rate|bonus/.test(q)){
      const adv=guaranteeAdvice(), f=fillStats();
      return `Paid fill rate is <b>${f.rate}%</b> (${f.paid} sold, ${f.free} given).`+(adv.length?` <b>${esc(show(adv[0].showId).name)}</b> needed a make good on ${adv[0].shortCount} of its last ${adv[0].flights} flights — reads land near ${K(adv[0].typical)}, so drop the guarantee to ${K(adv[0].suggest)} from ${K(adv[0].current)}.`:'')+goChip('Open Shows →','shows');
    }
    if(showHit) return `<b>${esc(showHit.name)}</b> publishes ${showHit.publishDays.join('/')}, ${showHit.positionsPerEp} positions an episode, ${K(showHit.guarantee)} guarantee. <b>${Math.round(curveAt(showHit.curve,2)*100)}%</b> of views land inside 48h, off ${showHit.samples} reads.`+goChip('Open Shows →','shows');
    if(brandHit){
      const sp=live.filter(x=>x.brand===brandHit); if(!sp.length) return `${esc(brandHit)} has nothing live.`;
      const g=sp.reduce((t,x)=>t+x.guarantee,0), pj=sp.reduce((t,x)=>t+projection(x).proj,0);
      return `<b>${esc(brandHit)}</b> — ${sp.length} flight${sp.length>1?'s':''}, projecting ${K(pj)} against ${K(g)} = <b>${pctOf(pj,g)}%</b>.`+goChip('Open Portal →','portal');
    }
    return `Try "will Kalshi on Sage Steele deliver?", "what needs a make good?", or "which guarantees are too high?"`;
  }

  /* ═══════════════════════════ SHARED ═══════════════════════════ */
  const toneVar = t => ({green:'var(--green-text)',red:'var(--red-text)',orange:'var(--orange-text)',blue:'var(--blue-text)',purple:'var(--purple-text)',grey:'var(--text-tertiary)'}[t]||'var(--text-secondary)');
  function projBar(s){
    const pr=projection(s); if(!pr) return '';
    const max=Math.max(s.guarantee,pr.proj)*1.06, w=v=>Math.min(100,v/max*100), tone=toneVar(verdict(s).tone);
    return `<div style="position:relative;flex:1;height:8px;border-radius:4px;background:var(--secondary-lite)">
      <div style="position:absolute;inset:0 auto 0 0;width:${w(pr.proj)}%;border-radius:4px;background:${tone};opacity:.3"></div>
      <div style="position:absolute;inset:0 auto 0 0;width:${w(pr.got)}%;border-radius:4px;background:${tone}"></div>
      <div title="90% IAB line" style="position:absolute;top:-3px;bottom:-3px;left:${w(s.guarantee*IAB_FULL)}%;width:2px;background:var(--green-text)"></div></div>`;
  }
  const jit=(id,d)=>{ let h=0; const k=id+':'+d; for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))|0; return ((h%1000)/1000-0.5)*0.09; };
  function observations(s){
    const pr=projection(s); if(!pr) return []; const sh=show(s.showId); const out=[{d:0,v:0}];
    for(let d=1;d<=pr.day&&d<=30;d++) out.push({d, v:Math.max(0,Math.round(curveAt(sh.curve,d)*pr.proj*(1+(d===pr.day?0:jit(s.id,d)))))});
    if(out.length>1) out[out.length-1].v=pr.got;
    return out;
  }
  function curveChart(s,{w=520,h=210}={}){
    const pr=projection(s); if(!pr) return '';
    const sh=show(s.showId), padL=42, padR=50, padT=14, padB=26;
    const max=Math.max(s.guarantee,pr.proj)*1.14, X=d=>padL+(w-padL-padR)*(d/30), Y=v=>h-padB-(h-padT-padB)*(v/max);
    const model=[]; for(let d=0;d<=30;d++) model.push(X(d).toFixed(1)+' '+Y(curveAt(sh.curve,d)*pr.proj).toFixed(1));
    const obs=observations(s), tone=toneVar(verdict(s).tone);
    const grid=[0,.5,1].map(f=>`<line x1="${padL}" x2="${w-padR}" y1="${Y(max*f)}" y2="${Y(max*f)}" stroke="var(--border-light)"/><text x="${padL-6}" y="${Y(max*f)+3.5}" text-anchor="end" font-size="9.5" font-weight="600" fill="var(--text-tertiary)">${K(Math.round(max*f))}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%">${grid}
      ${[0,10,20,30].map(d=>`<text x="${X(d)}" y="${h-8}" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--text-tertiary)">${d?'d'+d:'pub'}</text>`).join('')}
      <line x1="${padL}" x2="${w-padR}" y1="${Y(s.guarantee)}" y2="${Y(s.guarantee)}" stroke="var(--text-tertiary)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${w-padR+5}" y="${Y(s.guarantee)+3.5}" font-size="9.5" font-weight="800" fill="var(--text-secondary)">GUAR</text>
      <line x1="${padL}" x2="${w-padR}" y1="${Y(s.guarantee*IAB_FULL)}" y2="${Y(s.guarantee*IAB_FULL)}" stroke="var(--green-text)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${w-padR+5}" y="${Y(s.guarantee*IAB_FULL)+3.5}" font-size="9.5" font-weight="800" fill="var(--green-text)">90%</text>
      <path d="M${model.join(' L')}" fill="none" stroke="var(--text-tertiary)" stroke-width="2" stroke-dasharray="4 4" opacity=".8"/>
      <path d="M${obs.map(o=>X(o.d).toFixed(1)+' '+Y(o.v).toFixed(1)).join(' L')}" fill="none" stroke="${tone}" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="${X(pr.day)}" cy="${Y(pr.got)}" r="4.5" fill="${tone}" stroke="#fff" stroke-width="2"/>
      <circle cx="${X(30)}" cy="${Y(pr.proj)}" r="4.5" fill="none" stroke="${tone}" stroke-width="2.4"/>
      <text x="${X(30)}" y="${Y(pr.proj)-10}" text-anchor="end" font-size="11" font-weight="800" fill="${tone}">${K(pr.proj)}</text></svg>
    <div class="curvekey"><span><i style="border-color:${tone}"></i>This episode</span>
      <span><i style="border-color:var(--text-tertiary);border-top-style:dashed"></i>${esc(sh.name)}'s usual curve</span></div>`;
  }
  function sparkline(k,{w=88,h=26}={}){
    const pts=[]; for(let d=0;d<=30;d++) pts.push((2+(w-4)*(d/30)).toFixed(1)+' '+(h-2-(h-6)*curveAt(k,d)).toFixed(1));

  }

  /* ═══════════════════════════ THE WORK LIST ═══════════════════════════
     Everything that wants a human, in one flat list. No sub-tabs, no
     section headers — just the next thing to do. */
  const ICO={ mic:'<path d="M12 2a3 3 0 013 3v6a3 3 0 01-6 0V5a3 3 0 013-3z"/><path d="M19 10a7 7 0 01-14 0M12 17v4"/>',
    warn:'<path d="M12 9v4M12 17h.01M10.3 3.9L2 18a2 2 0 001.7 3h16.6A2 2 0 0022 18L13.7 3.9a2 2 0 00-3.4 0z"/>',
    doc:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/>',
    mg:'<path d="M3 12a9 9 0 1015-6.7L21 8"/><path d="M21 3v5h-5"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    wave:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>' };
  const icoBox=(k,tone)=>`<div class="wrow__ico" style="background:var(--${tone}-bg)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--${tone}-text)" stroke-width="2.1">${ICO[k]}</svg></div>`;
  const row=(lead,title,sub,num,action)=>`<div class="wrow">${lead}<div class="wrow__main"><b>${title}</b><span>${sub}</span></div>${num||''}${action||''}</div>`;
  const spotLead=s=>icoBox('wave', verdict(s).tone==='grey'?'blue':verdict(s).tone);
  const spotNum=s=>{ const pr=projection(s); if(!pr) return ''; const v=verdict(s);
    return `<div class="wrow__num">${projBar(s)}<b style="color:${toneVar(v.tone)}">${Math.round(pr.ratio*100)}%</b></div>`; };

  function workList(){
    const aired=SPOTS.filter(s=>s.status==='aired'&&!s.missed);
    const noEp=SPOTS.filter(s=>s.status==='aired'&&s.missed);
    const out=[];
    if(aired.length) out.push(row(icoBox('mic','blue'),
      `${aired.length} spot${aired.length!==1?'s':''} due to air today`,
      `The agent scans ${[...new Set(aired.map(s=>show(s.showId).channel))].join(', ')} for the episode and pulls the link + timestamp.`,
      '', `<button class="btn btn--primary btn--sm" id="runBtn" onclick="runAgent()">▶ Run check</button>`));
    noEp.forEach(s=>out.push(row(icoBox('warn','red'), `${nameOf(s)} — no episode up yet`,
      `Booked for ${fmtDate(s.published)}. Scanned ${esc(show(s.showId).channel)}, nothing posted. Rechecking every 24h.`,
      '', `<button class="btn btn--ghost btn--sm" onclick="nudgeEpisode('${s.id}')">Nudge show</button>`)));
    needsMakegood().forEach(s=>out.push(row(spotLead(s), nameOf(s),
      `Day ${projection(s).day} · projecting ${K(projection(s).proj)} of ${K(s.guarantee)} — ${K(shortfall(s))} short`,
      spotNum(s), `<button class="btn btn--primary btn--sm" onclick="createMakegood('${s.id}')">Make good</button>`)));
    MAKEGOODS.filter(m=>m.status!=='scheduled').forEach(m=>{ const s=spot(m.spotId);
      out.push(row(icoBox('mg','orange'), `Make good · ${nameOf(s)}`,
        m.date?`${fmtDate(m.date)} · ${m.showOk===true?'show ✓':'waiting on show'} · ${m.brandOk===true?'brand ✓':'waiting on brand'}`:'Needs a date',
        '', `<button class="btn btn--primary btn--sm" onclick="openMg('${m.id}')">Open</button>`)); });
    SPOTS.filter(s=>s.dlState==='requested').forEach(s=>out.push(row(icoBox('clock','purple'),
      `${nameOf(s)} — waiting on downloads`,
      `${esc(show(s.showId).host)} hosts elsewhere. Audio numbers have to come back before the total closes.`,
      '', `<button class="btn btn--ghost btn--sm" onclick="chaseDownloads('${s.id}')">Chase</button>`)));
    SPOTS.filter(s=>['needs_copy','needs_cta'].includes(s.copyStatus)).forEach(s=>out.push(row(icoBox('doc','blue'),
      `Copy for ${nameOf(s)}`, `Airs ${dayName(s.published)} ${fmtDate(s.published)} · ${s.copyStatus==='needs_copy'?'no ad copy yet':'needs a CTA'}`,
      '', `<button class="btn btn--ghost btn--sm" onclick="markCopy('${s.id}')">Send copy</button>`)));
    SPOTS.filter(s=>s.copyStatus==='sent').forEach(s=>out.push(row(icoBox('doc','orange'),
      `Copy not opened · ${nameOf(s)}`, `Sent ${fmtDate(s.copySent)} to ${esc(show(s.showId).host)} · unopened after ${daysBetween(s.copySent,TODAY)} days`,
      '', `<button class="btn btn--ghost btn--sm" onclick="nudgeShow('${s.id}')">Nudge</button>`)));
    return out;
  }
  function deliveryAttention(){ return { count: workList().length }; }

  /* ═══════════════════════════ VIEW: COMMAND CENTER ═══════════════════════════
     The glance. Three numbers, the next three things, one thing worth knowing.
     Everything else lives one click away in Delivery. */
  RENDER.overview = () => {
    const work=workList();
    const live=SPOTS.filter(s=>projection(s));
    const g=live.reduce((a,s)=>a+s.guarantee,0), proj=live.reduce((a,s)=>a+projection(s).proj,0);
    const adv=guaranteeAdvice()[0];
    document.getElementById('view-overview').innerHTML=`
    <div class="inner" style="max-width:940px;padding-top:8px">
      <div class="hero">
        <h1>VMG Command Center</h1>
        <p>Ask anything about the network — delivery pacing, what needs a make good, which guarantees are running hot. Answered off Airtable and Booster.</p>
        <div class="hero__pills">
          <span class="pill"><i style="background:var(--green-text)"></i>Agent checked ${LAST_CHECK}</span>
          <button class="pill pill--solid" onclick="go('delivery')">${work.length} need${work.length===1?'s':''} you</button>
        </div>
        <div class="askwrap">
          <input id="acAsk" placeholder="Ask anything…" onkeydown="if(event.key==='Enter')askVmg()">
          <button class="askwrap__go" onclick="askVmg()" aria-label="Ask">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h13M12 5l7 7-7 7"/></svg></button>
        </div>
        ${ANSWER?`<div class="answer" style="text-align:left;margin-top:14px;margin-bottom:0">${ANSWER}
          <button class="x" style="float:right;margin-top:-22px" onclick="ANSWER='';rerender()">✕</button></div>`:''}
      </div>

      <div style="display:flex;align-items:baseline;justify-content:space-between;margin:36px 2px 10px">
        <b style="font-size:14px;letter-spacing:-.02em">Next up</b>
        <span class="muted" style="font-size:12px">Projecting ${K(proj)} against ${K(g)} guaranteed · ${pctOf(proj,g)}%
          ${work.length>3?` · <button class="btn btn--ghost btn--sm" style="margin-left:6px" onclick="go('delivery')">See all ${work.length} →</button>`:''}</span>
      </div>
      <div id="scanPanel"></div>
      ${work.length?work.slice(0,3).join(''):`<div class="card"><div class="empty">✨ Nothing needs you — every flight projects over the 90% line.</div></div>`}

      ${adv?`<div class="wrow" style="margin-top:20px;background:rgba(255,237,213,.4);border-color:var(--orange-bg)">
        <div class="wrow__ico" style="background:var(--orange-bg)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--orange-text)" stroke-width="2.1">${ICO.mg}</svg></div>
        <div class="wrow__main"><b>${esc(show(adv.showId).name)}'s guarantee is set too high</b>
        <span>A make good on ${adv.shortCount} of its last ${adv.flights} flights. Reads land near ${K(adv.typical)}, not ${K(adv.current)}.</span></div>
        <button class="btn btn--ghost btn--sm" onclick="applyGuarantee('${adv.showId}',${adv.suggest})">Drop to ${K(adv.suggest)}</button></div>`:''}

      <div class="footnote">VMG Command Center · reads Airtable, respects Booster's inventory caps · powered by SpotsNow</div>
    </div>`;
  };

  /* ═══════════════════════════ VIEW: DELIVERY ═══════════════════════════ */
  let delTab='work';
  RENDER.delivery = () => {
    const work=workList();
    const live=SPOTS.filter(s=>projection(s)).sort((a,b)=>liveDays(a)-liveDays(b));
    document.getElementById('view-delivery').innerHTML=`
    <div class="inner" style="max-width:940px">
      <div class="pagebar">
        <div class="head"><h1>Delivery <span class="live-dot"><i></i>Checked ${LAST_CHECK}</span></h1>
        <p>Every read is projected off its own show's view curve, and each show gets its own check-in date — Warren Smith settles by day 3, Sage Steele needs to day 13. 90% of guarantee is full delivery.</p></div>
        <div class="pagebar__right"><div class="seg">
          <button class="${delTab==='work'?'active':''}" onclick="delTab='work';RENDER.delivery()">Needs you${work.length?' · '+work.length:''}</button>

      </div>
      <div class="askbar">
        <input id="acAsk" placeholder="Ask anything — e.g. will Kalshi on Sage Steele deliver?" onkeydown="if(event.key==='Enter')askVmg()">
        <button class="btn btn--primary" onclick="askVmg()">Ask</button>
      </div>
      ${ANSWER?`<div class="answer">${ANSWER}<button class="x" style="float:right;margin-top:-22px" onclick="ANSWER='';rerender()">✕</button></div>`:''}
      <div id="scanPanel"></div>
      ${delTab==='work'
        ? (work.length?work.join(''):`<div class="card"><div class="empty">✨ Nothing needs you — every flight projects over the 90% line.</div></div>`)
        : live.map(s=>{ const pr=projection(s);
            return row(spotLead(s), nameOf(s),
              `Day ${pr.day} · ${K(pr.got)} delivered · projecting ${K(pr.proj)} of ${K(s.guarantee)}`
              + (pr.confident?'':` · <b>call it ${fmtDate(checkInDate(s))}</b>`),
              spotNum(s), `<button class="btn btn--ghost btn--sm" onclick="openSpot('${s.id}')">Open</button>`); }).join('')}
      <div class="footnote">Projections come from each show's own curve, refit every time a read is verified.</div>
    </div>`;
  };

  /* ── the one drawer that explains a call ── */
  function openSpot(id){
    const s=spot(id), sh=show(s.showId), pr=projection(s), v=verdict(s), m=mgForSpot(s.id);
    openDrawer(`<div class="drawer__head"><div><span class="tag tag--${v.tone}"><i></i>${esc(v.label)}</span>
      <h2 style="font-size:18px;font-weight:800;margin-top:8px">${esc(s.brand)} · ${esc(sh.name)}</h2>
      <div class="muted" style="font-size:12px">Published ${fmtDate(s.published)} · ${s.length} host-read</div></div>
      <button class="x" onclick="closeOverlays()">✕</button></div>
    <div class="drawer__body">
      ${pr?`<div class="curvewrap">${curveChart(s)}</div>
      <div style="margin-top:14px;padding:13px 15px;border:1px solid var(--border-light);border-radius:12px;font-size:12.5px;line-height:1.6">
        Across ${sh.samples} reads, ${Math.round(curveAt(sh.curve,2)*100)}% of ${esc(sh.name)}'s views land inside 48h. At day ${pr.day} this episode should be ${Math.round(pr.curvePct*100)}% of the way there, and it has ${K(pr.got)} — so it lands near <b>${K(pr.proj)}</b>, <b>${Math.round(pr.ratio*100)}%</b> of the ${K(s.guarantee)} guarantee.
        ${v.k==='short'?` That's <b style="color:var(--red-text)">${K(shortfall(s))} under</b> the 90% line — make good warranted.`
          :v.k==='bonus'?` Clears the guarantee outright; the overage is bonus.`
          :v.soft||v.k==='early'?` Still ${100-Math.round(pr.curvePct*100)}% of the curve to come. ${esc(sh.name)} settles on day ${pr.callAt}, so the call gets made ${fmtDate(checkInDate(s))}.`
          :` Clears the 90% line — no make good needed.`}
        ${sh.simulcast?`<br><br>${K(s.views||0)} video ${s.dlState==='requested'?'· audio downloads still requested from the creator':'+ '+K(s.downloads||0)+' audio'}.`:''}
      </div>
      ${s.yt?`<div style="margin-top:14px;background:var(--primary);border-radius:12px;padding:14px 16px;color:#fff;display:flex;align-items:center;gap:14px">
        <button onclick="playClip('${s.yt}',${s.ts})" style="width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:14px;flex-shrink:0">▶</button>
        <div style="flex:1;min-width:0">
          <b style="font-size:13px">Ad read verified · ${mmss(s.ts)}–${mmss(s.ts+adSecs(s))}</b>
          <div style="font-size:11.5px;opacity:.72;margin-top:2px">${(s.copy||[]).join(' · ')||'Copy points logged on approval'}</div>
        </div>
        <button class="btn btn--sm" style="background:rgba(255,255,255,.15);color:#fff;flex-shrink:0" onclick="playClip('${s.yt}',${s.ts})">Play</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:9px">
        <a href="${clipUrl(s)}" target="_blank" style="font-size:12px;color:var(--blue-text);font-weight:600;text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${clipUrl(s)} ↗</a>
        <button class="btn btn--ghost btn--sm" onclick="navigator.clipboard&&navigator.clipboard.writeText('${clipUrl(s)}');toast('Deep link copied — opens at ${mmss(s.ts)}.')">Copy link</button>
      </div>`:''}`
      :`<div class="empty">Airs ${fmtDate(s.published)} on ${esc(sh.name)}.</div>`}
    </div>
    <div class="drawer__foot"><button class="btn btn--ghost" onclick="closeOverlays()">Close</button>
      ${v.k==='short'&&!m?`<button class="btn btn--primary" onclick="closeOverlays();createMakegood('${s.id}')">Set up make good</button>`
        :m?`<button class="btn btn--primary" onclick="closeOverlays();openMg('${m.id}')">Open make good</button>`:''}</div>`);
  }

  /* ── make good: date, two drafts, two sign-offs, write back ── */
  function createMakegood(spotId){
    const ex=mgForSpot(spotId); if(ex){ openMg(ex.id); return; }
    const s=spot(spotId), sh=show(s.showId), av=nextEpisodes(s.showId,4).find(e=>e.open>0);
    const m={ id:'mg'+(++MG_SEQ), spotId, date:av?av.date:null, status:'proposed',
      showOk: sh.mgPolicy==='auto'?true:null, brandOk:null, showVia: sh.mgPolicy==='auto'?'auto':null, brandVia:null };
    MAKEGOODS.push(m); rerender(); refreshBadges(); openMg(m.id);
  }
  function setMgDate(id,d){ mg(id).date=d; openMg(id); rerender(); }
  function toggleMg(id,key){ const m=mg(id); m[key]=m[key]===true?null:true; openMg(id); rerender(); refreshBadges(); }
  function commitMg(id){
    const m=mg(id), s=spot(m.spotId), sh=show(s.showId);
    m.status='scheduled';
    SPOTS.push({ id:'mgs'+m.id, dealId:s.dealId, brand:s.brand, showId:s.showId, kind:'makegood', published:m.date,
      guarantee:0, views:null, downloads:null, dlState:sh.simulcast?'auto':'none', status:'scheduled',
      length:s.length, yt:'', ts:null, copyStatus:'seen', copy:[] });
    closeOverlays(); rerender(); refreshBadges();
    toast(`${s.brand} make good scheduled on ${sh.name} for ${fmtDate(m.date)}. Written to Airtable as "Make Good" and flagged in Booster so the slot can't be sold twice.`);
  }
  function openMg(id){
    const m=mg(id), s=spot(m.spotId), sh=show(s.showId), pr=projection(s), auto=sh.mgPolicy==='auto';
    const d=m.date?fmtDate(m.date):'[date]', both=m.showOk===true&&m.brandOk===true;
    const sw=(on,label,note,key)=>`<div class="tog"><button class="tog__sw ${on?'on':''}" onclick="toggleMg('${id}','${key}')"><i></i></button>
      <div style="flex:1"><b>${label}</b><small>${note}</small></div></div>`;
    openDrawer(`<div class="drawer__head"><div><span class="tag tag--orange"><i></i>${K(shortfall(s))} short</span>
      <h2 style="font-size:18px;font-weight:800;margin-top:8px">Make good · ${esc(s.brand)} on ${esc(sh.name)}</h2>
      <div class="muted" style="font-size:12px">Projecting ${K(pr?pr.proj:0)} against a ${K(s.guarantee)} guarantee</div></div>
      <button class="x" onclick="closeOverlays()">✕</button></div>
    <div class="drawer__body">
      <div style="font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:7px">Date · from ${esc(sh.name)}'s avails</div>
      <div style="display:flex;gap:7px;flex-wrap:wrap">${nextEpisodes(s.showId,4).map(e=>`<button class="tag ${m.date===e.date?'tag--blue':'tag--grey'}" style="padding:7px 11px;cursor:${e.open?'pointer':'not-allowed'};opacity:${e.open?1:.45}" ${e.open?`onclick="setMgDate('${id}','${e.date}')"`:''}>${dayName(e.date)} ${fmtDate(e.date)} · ${e.open}/${e.cap}</button>`).join('')}</div>
      <div class="muted" style="font-size:11.5px;margin-top:8px">Booster caps ${esc(sh.name)} at ${sh.positionsPerEp} positions an episode, so these slots are real.</div>

      <div style="display:flex;flex-direction:column;gap:9px;margin-top:16px">
        ${sw(m.showOk===true,'Show approved', auto?`${esc(sh.name)} auto-schedules — no ask needed`:m.showVia==='gmail'?'Detected from the reply in adops@':'Send the draft below', 'showOk')}
        ${sw(m.brandOk===true,'Brand approved', m.sentBrand?`Sent ${fmtDate(m.sentBrand)} · no reply yet`:'Send the draft below', 'brandOk')}
      </div>

      <details style="margin-top:16px"><summary style="font-size:12.5px;font-weight:700;cursor:pointer;color:var(--text-secondary)">Drafts${auto?' · brand only':''}</summary>
        ${auto?'':`<div style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text-tertiary);margin:12px 0 6px">To ${esc(sh.host)}</div>
        <textarea class="cmp-inp" style="min-height:110px;line-height:1.6;font-size:12.5px">Hey ${esc(sh.host.split(' ')[0])} — the ${esc(s.brand)} read from ${fmtDate(s.published)} is tracking to land near ${K(pr?pr.proj:0)} against a ${K(s.guarantee)} guarantee, so we owe them a make good. Can we put a free ${esc(s.length)} read on ${d}? Same placement, same copy — comes out of our end, no change to your split. Thanks, Sydney</textarea>
        <button class="btn btn--primary btn--sm" style="margin-top:7px" onclick="sendMg('${id}','show')">Send to show</button>`}
        <div style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text-tertiary);margin:14px 0 6px">To ${esc(s.brand)}</div>
        <textarea class="cmp-inp" style="min-height:110px;line-height:1.6;font-size:12.5px">Hi ${esc(s.brand)} team — heads up on the ${esc(sh.name)} read from ${fmtDate(s.published)}. It's pacing a little under the guarantee, so we've queued an additional read on ${d} at no cost to bring the flight back over. Nothing needed on your end. Thanks, Sydney</textarea>
        <button class="btn btn--primary btn--sm" style="margin-top:7px" onclick="sendMg('${id}','brand')">Send to brand</button>
      </details>
    </div>
    <div class="drawer__foot"><button class="btn btn--ghost" onclick="closeOverlays()">Close</button>
      <button class="btn btn--green" ${both?'':'disabled style="opacity:.45"'} onclick="commitMg('${id}')">✓ Write to Airtable</button></div>`);
  }
  function sendMg(id,who){ const m=mg(id), s=spot(m.spotId);
    if(who==='show') toast(`Sent to ${show(s.showId).host} from adops@. The agent reads the reply and flips the toggle.`);
    else { m.sentBrand=TODAY; toast(`Sent to ${s.brand} in the existing thread.`); }
    m.status='awaiting'; openMg(id); rerender(); refreshBadges(); }

  function nudgeEpisode(id){ const s=spot(id); toast(`Nudged ${show(s.showId).host} from adops@. The agent keeps checking every 24h.`); }
  function chaseDownloads(id){ const s=spot(id); s.dlState='received'; s.downloads=Math.round(s.views*0.24); rerender(); refreshBadges();
    toast(`Requested downloads from ${show(s.showId).host} — ${K(s.downloads)} came back and were added to the total.`); }
  function markCopy(id){ const s=spot(id); s.copyStatus='sent'; s.copySent=TODAY; rerender(); refreshBadges();
    toast(`Copy written to the ${s.brand} spot in Airtable. Auto-email sent to ${show(s.showId).host}.`); }
  function nudgeShow(id){ const s=spot(id); s.copyStatus='seen'; s.copySeen=TODAY; rerender(); refreshBadges();
    toast(`Nudged ${show(s.showId).host} — opened it right after.`); }

  /* ── daily air check ── */
  let agentRunning=false, LAST_CHECK='2h ago';
  async function runAgent(){
    if(agentRunning) return; agentRunning=true;
    const q=sel=>document.querySelector('.view.active '+sel);   // both views carry these ids
    const btn=q('#runBtn'); if(btn){ btn.textContent='Scanning…'; btn.disabled=true; }
    const panel=q('#scanPanel');
    if(panel) panel.innerHTML=`<div class="card" style="margin-bottom:12px"><div class="card__pad">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:8px"><span id="scanLabel">Scanning channels…</span><span id="scanPct" class="muted">0%</span></div>
      <div class="scanbar"><div class="scanbar__fill" id="scanFill"></div></div></div></div>`;
    const finds={ s11:{yt:'dQw4w9WgXcQ',ts:455,epLen:5380,views:9200,downloads:1400,copy:['Named the brand','Read promo code KALSHI','Free-trial CTA']},
                  s12:{yt:'ScMzIvxBSi4',ts:612,epLen:6100,views:31000,downloads:0,copy:['Named the brand','URL CTA']}, s13:{miss:true} };
    const steps=['Scanning channels…','The Rubin Report posted 3h ago — pulling transcript…','Matching the read to the Kalshi copy…','Warren Smith posted 6h ago — reading views…','Nate has no episode yet — flagging…','Writing links + timestamps to Airtable…'];
    for(let i=0;i<steps.length;i++){ const l=q('#scanLabel'); if(l) l.textContent=steps[i];
      const p=Math.round((i+1)/steps.length*100); const f=q('#scanFill'); if(f) f.style.width=p+'%';
      const pc=q('#scanPct'); if(pc) pc.textContent=p+'%'; await sleep(560); }
    try{ const r=await fetch('/api/transcript',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:'https://www.youtube.com/watch?v='+finds.s11.yt})});
      if(r.ok){ const j=await r.json(); const seg=findAd(j,'Kalshi'); if(seg) finds.s11.ts=Math.round(seg.start); }
    }catch(e){}
    SPOTS.filter(s=>s.status==='aired').forEach(s=>{ const f=finds[s.id]; if(!f) return;
      if(f.miss){ s.missed=true; return; } Object.assign(s,f,{status:'verified'}); });
    agentRunning=false; rerender(); refreshBadges();
    LAST_CHECK='just now'; rerender();
    toast('2 reads found and timestamped. 1 show has no episode up yet.');
  }
  function findAd(json,brand){ const arr=json.transcript||json.segments||json.data||[]; const b=brand.toLowerCase();
    for(const seg of arr){ if((seg.text||'').toLowerCase().includes(b)) return {start:seg.start||seg.offset||0}; } return null; }
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  function playClip(yt,ts){ openModal(`<div class="drawer__head"><h2 style="font-size:16px;font-weight:700">Ad read · ${mmss(ts)}</h2><button class="x" onclick="closeOverlays()">✕</button></div>
    <div class="reel-stage"><iframe src="https://www.youtube.com/embed/${yt}?start=${ts}&autoplay=1" allow="autoplay" allowfullscreen></iframe></div>`); }

  /* ═══════════════════════════ VIEW: CAMPAIGN PORTAL ═══════════════════════════ */
  let portalBrand='Kalshi';
  RENDER.portal = () => {
    const brands=[...new Set(SPOTS.filter(s=>projection(s)).map(s=>s.brand))];
    if(!brands.includes(portalBrand)) portalBrand=brands[0];
    const spots=SPOTS.filter(s=>s.brand===portalBrand&&projection(s));
    const g=spots.reduce((a,s)=>a+s.guarantee,0), got=spots.reduce((a,s)=>a+(delivered(s)||0),0);
    const proj=spots.reduce((a,s)=>a+projection(s).proj,0);
    const paid=spots.reduce((a,s)=>a+spotCost(s),0);
    const mgs=SPOTS.filter(s=>s.brand===portalBrand&&s.kind==='makegood');
    document.getElementById('view-portal').innerHTML=`
    <div class="inner" style="max-width:940px">
      <div class="pagebar">
        <div class="head"><h1>Campaign Portal</h1><p>What the advertiser sees — every read playable at its exact timestamp, updating itself as spots land.</p></div>
        <div class="pagebar__right">
          <select class="field" style="width:auto" onchange="portalBrand=this.value;RENDER.portal()">${brands.map(b=>`<option ${b===portalBrand?'selected':''}>${esc(b)}</option>`).join('')}</select>
          <button class="btn btn--primary btn--sm" onclick="toast('Delivery report sent to ${esc(portalBrand)} and copied to adops@.')">Send report</button></div>
      </div>
      <div class="portal-hero">
        <div style="position:relative;z-index:1">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <div class="brand-chip" style="background:${brandColor[portalBrand]||'#3B82F6'}">${esc(portalBrand[0])}</div>
          <div><div style="font-size:12px;opacity:.7;font-weight:600;letter-spacing:.04em">DELIVERY REPORT · AUGUST 2026</div><h2>${esc(portalBrand)} on VMG</h2></div>
          <div style="margin-left:auto;text-align:right"><div style="font-size:32px;font-weight:800">${pctOf(proj,g)}%</div><div style="font-size:12px;opacity:.7">of guarantee</div></div>
        </div>
        <div style="display:flex;gap:30px;margin-top:20px;flex-wrap:wrap">
          ${portalMini('Delivered',K(got))}${portalMini('Projected',K(proj))}${portalMini('Guaranteed',K(g))}${portalMini('Effective CPM','$'+(got?(paid/(got/1000)):0).toFixed(2))}
        </div>
        ${proj>=g?`<div style="margin-top:18px;padding:10px 13px;border-radius:10px;background:rgba(214,241,224,.16);font-size:12.5px">✓ <b>Full delivery.</b> ${K(proj-g)} impressions over the guarantee are bonus, no charge.</div>`
        :mgs.length?`<div style="margin-top:18px;padding:10px 13px;border-radius:10px;background:rgba(255,237,213,.16);font-size:12.5px">↻ <b>${mgs.length} additional read${mgs.length>1?'s':''} booked at no cost</b> on ${mgs.map(m=>fmtDate(m.published)).join(', ')} to bring the flight back over.</div>`:''}
        </div>
      </div>
      <div style="margin-top:16px">
        ${spots.map(s=>{ const pr=projection(s);
          return row(spotLead(s), esc(show(s.showId).name),
            `${fmtDate(s.published)} · ${K(pr.got)} delivered${pr.final?'':' · projecting '+K(pr.proj)}`,
            spotNum(s), s.yt?`<button class="btn btn--ghost btn--sm" onclick="playClip('${s.yt}',${s.ts})">▶ ${mmss(s.ts)}</button>`:''); }).join('')}
        ${mgs.map(s=>row(icoBox('mg','purple'), esc(show(s.showId).name)+' <span class="tag tag--purple">Added at no cost</span>',
          `Scheduled ${dayName(s.published)} ${fmtDate(s.published)}`,'','')).join('')}
      </div>
      <div class="footnote">Read-only for the advertiser, updates itself as reads land.</div>
    </div>`;
  };
  const portalMini=(l,v)=>`<div><div style="font-size:23px;font-weight:800">${v}</div><div style="font-size:11.5px;opacity:.7;font-weight:600">${l}</div></div>`;

  /* ═══════════════════════════ VIEW: SHOWS ═══════════════════════════ */
  RENDER.shows = () => {
    const f=fillStats();
    document.getElementById('view-shows').innerHTML=`
    <div class="inner" style="max-width:940px">
      <div class="pagebar"><div class="head"><h1>Shows</h1>
        <p>What every projection reads from. The check-in date is set by each show's own curve, so a fast show gets called in days and a slow one is left alone until its number is real.</p></div></div>
      <div class="card"><table>
        <thead><tr><th>Show</th><th>Publishes</th><th class="num">Positions</th><th class="num">Guarantee</th><th class="num">Call it</th><th>Make goods</th><th>View curve</th></tr></thead>
        <tbody>${SHOWS.map(sh=>`<tr>
          <td><b>${esc(sh.name)}</b><div class="muted" style="font-size:11.5px">${esc(sh.channel)} · ${sh.simulcast?'video + audio':'video only'}</div></td>
          <td style="font-size:12.5px">${sh.publishDays.join(' · ')}</td>
          <td class="num">${sh.positionsPerEp}<div class="muted" style="font-size:10.5px">per ep</div></td>
          <td class="num">${K(sh.guarantee)}<div class="muted" style="font-size:10.5px">90% = ${K(Math.round(sh.guarantee*IAB_FULL))}</div></td>
          <td class="num"><b>day ${checkInDay(sh)}</b><div class="muted" style="font-size:10.5px">of 30</div></td>
          <td><span class="tag ${sh.mgPolicy==='auto'?'tag--green':'tag--grey'}">${sh.mgPolicy==='auto'?'auto':'ask first'}</span></td>
          <td><div style="display:flex;align-items:center;gap:9px">${sparkline(sh.curve)}<div class="muted" style="font-size:11px;line-height:1.35">${Math.round(curveAt(sh.curve,2)*100)}% in 48h<br>${sh.samples} reads</div></div></td>
        </tr>`).join('')}</tbody></table></div>
      <div class="footnote">Positions per episode and the guarantee come from Booster, so a make good is never offered a slot that doesn't exist. Paid fill rate is ${f.rate}% — ${f.paid} spots sold, ${f.free} given as make goods or bonus.</div>
    </div>`;
  };
  function toggleDark(){
    document.body.classList.toggle('dark');
    const d=document.body.classList.contains('dark');
    const b=document.getElementById('dmBtn');
    if(b) b.lastChild.textContent = d?'Light Mode':'Dark Mode';
  }
  function applyGuarantee(showId,v){ show(showId).guarantee=v; rerender(); toast(`${show(showId).name} guarantee set to ${K(v)}. Written back to Booster and Airtable.`); }

  /* ═══════════════════════════ TOAST ═══════════════════════════ */
  let toastT;
  function toast(msg){ let el=document.getElementById('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:#fff;padding:12px 18px;border-radius:11px;font-size:13px;font-weight:600;z-index:80;box-shadow:var(--shadow-hover);opacity:0;transition:.25s;max-width:460px'; document.body.appendChild(el); }
    el.textContent=msg; requestAnimationFrame(()=>{el.style.opacity=1;el.style.transform='translateX(-50%) translateY(0)';}); clearTimeout(toastT); toastT=setTimeout(()=>{el.style.opacity=0;el.style.transform='translateX(-50%) translateY(20px)';},3400); }

  /* init */
  refreshBadges(); renderChats(); RENDER.overview();
  </script>
</body>
</html>
