        <button class="${delMode==='episodes'?'active':''}" onclick="delMode='episodes';RENDER.delivery()">By episode</button></div></div>
      ${delMode==='campaigns'
        ? (()=>{ const cs=bookedDeals().filter(d=>dealSummary(d).state==='live').filter(d=>!delQ2.trim()||d.brand.toLowerCase().includes(delQ2.trim().toLowerCase()))
            .sort((a,b)=>(dealSummary(b).start||'').localeCompare(dealSummary(a).start||''));
            return `<div class="listcard">${cs.length?cs.map((d,i)=>dealIndexRow(d,i,`toggleDelDeal('${d.id}')`,!!DEL_OPEN[d.id])
              +(DEL_OPEN[d.id]?`<div style="background:var(--page-bg);box-shadow:inset 0 1px 0 var(--border-light)">${d.reads.filter(r=>r.status!=='cancelled').map(r=>Object.assign(r,{_d:d})).sort((a,b)=>a.date<b.date?1:-1).map(dvRow).join('')}</div>`:'')).join(''):'<div class="empty">No live campaigns.</div>'}</div>`; })()
        : `<div class="listcard">${head}${live.length?live.map(dvRow).join(''):'<div class="empty">No flights match.</div>'}</div>`}`;
  const html=`<div class="inner" style="max-width:1080px">
    <div class="pagebar"><div class="head"><h1>Delivery</h1></div>
      <div class="pagebar__right">${delTab!=='mg'?delBar:''}<div class="seg">
        <button class="${delTab==='work'?'active':''}" onclick="delTab='work';RENDER.delivery()">Needs you${work.length?' · '+work.length:''}</button>
        <button class="${delTab==='all'?'active':''}" onclick="delTab='all';RENDER.delivery()">All flights</button>
        <button class="${delTab==='mg'?'active':''}" onclick="delTab='mg';RENDER.delivery()">Make goods${MG.length?' · '+MG.length:''}</button></div></div>
    </div>
    ${banner}${body}
    <div class="footnote">Projections come from your show's own curve, refit every time a read is verified. Audio is ${S.show.sources.some(s=>s.type.startsWith('HOSTING'))?'from your host':'creator-reported'}.</div>
  </div>`;
  $('view-delivery').innerHTML=gate('delivery', html);
  refocusQ();
};
function makeGoodsPanel(MG){
  const given=MG.reduce((a,r)=>a+(r.status==='aired'?delivered(r):guaranteeOf(r)),0), value=MG.reduce((a,r)=>a+rateCents(r.placement),0);
  return `<div class="tiles" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">
      <div class="tile"><div class="tile__label">Make goods + bonus</div><div class="tile__val" style="font-size:28px">${MG.length}</div></div>
      <div class="tile"><div class="tile__label">Given at no charge</div><div class="tile__val" style="font-size:28px">${$$(value)}</div><div class="help">at your rate card</div></div>
      <div class="tile"><div class="tile__label">Impressions given</div><div class="tile__val" style="font-size:28px">${K(given)}</div></div></div>
    <div class="listcard">${MG.length?MG.sort((a,b)=>a.date<b.date?1:-1).map(r=>`<div class="att wrow--click" style="cursor:pointer" onclick="${r.status==='aired'?`openRead('${r.id}')`:`openCampaign('${r._d.id}')`}">${blogo(r._d.domain,r._d.brand)}<div class="att__main"><b>${esc(r._d.brand)} <span class="tag ${r.kind==='bonus'?'tag--green':'tag--purple'}" style="margin-left:4px">${r.kind==='bonus'?'Bonus':'Make good'}</span></b><span>${PL[r.placement]} · ${dayName(r.date)} ${fmtDate(r.date)}${r.forRead?' · for the '+fmtDate(readById(r.forRead)?.date||r.date)+' read':''}</span></div><b style="font-size:13px">${r.status==='aired'?K(delivered(r)):'Scheduled'}</b></div>`).join(''):'<div class="empty">No make goods yet. That means every read landed.</div>'}</div>
    <div style="margin-top:12px"><button class="btn btn--ghost btn--sm" onclick="(()=>{const d=bookedDeals().find(x=>dealSummary(x).state==='live'); if(d) openMakegood(null,d.id,'bonus');})()">+ Bonus spot</button></div>`;
}
function plSummary(d){ const m={}; d.reads.filter(r=>r.kind==='paid'&&r.status!=='cancelled').forEach(r=>m[r.placement]=(m[r.placement]||0)+1); return Object.entries(m).map(([p,n])=>`${PL[p]} ×${n}`).join(', ')||'—'; }
function dealIndexRow(d,i,click,open){
  const c=dealSummary(d), b=brandBadge(c);
  const proj=c.proj+c.sched.reduce((a,r)=>a+(r.kind==='paid'?guaranteeOf(Object.assign(r,{_d:d})):0),0);
  const tone = !c.aired.length||c.tooEarly ? 'var(--text-tertiary)' : c.pct>=90 ? 'var(--green-text)' : c.pct>=80 ? '#CA8A04' : 'var(--orange-text)';
  const max=Math.max(c.g,proj)*1.06||1, w=x=>Math.min(100,x/max*100);
  const missed=d.reads.some(r=>r.status==='missed'), flag=c.aired.some(r=>compMissed(r)>0&&!hasMakegoodFor(r)), mg=d.reads.some(r=>r.kind==='makegood'&&r.status==='scheduled');
  const st = c.under?['warn','Tracking under'] : missed?['clock','Missed read'] : flag?['warn','Read flagged'] : mg?['mg','Make good scheduled'] : null;
  const ICO={warn:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',mg:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'};
  return `<div class="wrow--click" style="display:grid;grid-template-columns:minmax(0,0.9fr) minmax(0,1fr) 108px 150px 168px 118px 26px;align-items:center;gap:0 13px;padding:13px 16px;${i===0?'':'border-top:1px solid var(--border-light)'}" onclick="${click||`openReport('${d.id}')`}">
    <div style="min-width:0;display:flex;align-items:center;gap:10px">${blogo(d.domain,d.brand,'sm')}<b style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.brand)}${d.agency?` <span style="font-weight:400;color:var(--text-secondary)">· ${esc(d.agency)}</span>`:''}</b></div>
    <div class="muted" style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">${plSummary(d)}</div>
    <div class="muted" style="font-size:11.5px;white-space:nowrap">${c.start?fmtDate(c.start)+' – '+fmtDate(c.end):'—'}</div>
    <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-start;min-width:0">${st?`<b style="font-size:12.5px;display:inline-flex;align-items:center;gap:6px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICO[st[0]]}</svg>${st[1]}</b>`
        :`<span class="muted" style="font-size:11.5px">${c.state==='upcoming'?'Starts '+fmtDate(c.start):c.state==='done'?'Complete':c.tooEarly?'Too early to call':'On track'}</span>`}
      <button class="rpt-reqlink" onclick="event.stopPropagation();openBrief('${d.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>Requirements</button></div>
    <div class="wrow__num" style="width:auto;justify-content:flex-end;display:flex;align-items:center;gap:9px">${c.aired.length?`
      <div style="position:relative;flex:1;height:8px;border-radius:4px;background:var(--secondary-lite)">
        <div style="position:absolute;inset:0 auto 0 0;width:${w(proj)}%;border-radius:4px;background:${tone};opacity:.28"></div>
        <div style="position:absolute;inset:0 auto 0 0;width:${w(c.got)}%;border-radius:4px;background:${tone}"></div>
        <div style="position:absolute;top:-2px;bottom:-2px;left:${w(c.g*FULL_AT)}%;width:2px;background:var(--green-text)"></div>
      </div><b style="font-size:12px;color:${tone};min-width:36px;text-align:right">${c.tooEarly?'—':c.pct+'%'}</b>`
      :'<span style="flex:1;text-align:left;font-size:12px;color:var(--text-tertiary)">Not started</span>'}</div>
    <div style="text-align:right"><span class="muted" style="font-size:11.5px">${c.aired.length?K(c.got)+' of '+K(c.g):K(c.g)+' booked'}</span></div>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2.4" style="justify-self:center;transition:transform .15s;transform:rotate(${open?90:0}deg)"><path d="M9 6l6 6-6 6"/></svg>
  </div>`;
}
RENDER.deals = function(){
  const allD=bookedDeals(); const stOf=d=>{ const s=dealSummary(d).state; return s==='done'?'complete':s; };
  const live=allD.filter(d=>stOf(d)==='live');
  const totG=live.reduce((a,d)=>a+dealSummary(d).g,0), totP=live.reduce((a,d)=>{ const c=dealSummary(d); return a+c.proj+c.sched.reduce((x,r)=>x+(r.kind==='paid'?guaranteeOf(Object.assign(r,{_d:d})):0),0); },0);
  const brands=[...new Set(allD.map(d=>d.brand))].sort();
  const FILTERS=[['all','All'],['live','Live'],['upcoming','Upcoming'],['complete','Complete'],['brands','Brands']];
  let body;
  if(portalFilter==='brands'){
    body=`<div style="display:flex;flex-direction:column;gap:10px">${brands.map(b=>{ const bd=allD.filter(d=>d.brand===b), open=!!BRAND_OPEN[b], deliv=bd.reduce((a,d)=>a+dealSummary(d).got,0);
      return `<div class="card"><button style="width:100%;border:none;background:none;font-family:inherit;color:var(--text-primary);text-align:left;padding:11px 14px;display:flex;align-items:center;gap:12px;cursor:pointer" onclick="BRAND_OPEN['${esc(b)}']=!BRAND_OPEN['${esc(b)}'];RENDER.deals()">
        ${blogo(bd[0].domain,b,'sm')}<b style="font-size:14.5px;letter-spacing:-.02em;flex:1">${esc(b)}</b><span class="muted" style="font-size:11.5px">${K(deliv)} delivered to date · ${bd.length} deal${bd.length!==1?'s':''}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2.4" style="transform:rotate(${open?90:0}deg);transition:.15s"><path d="M9 6l6 6-6 6"/></svg></button>
        ${open?`<div style="border-top:1px solid var(--border-light)">${bd.map((d,i)=>dealIndexRow(d,i+1)).join('')}</div>`:''}</div>`; }).join('')}</div>`;
  } else {
    let cs=allD.filter(d=>portalFilter==='all'||stOf(d)===portalFilter);
    if(dealQ.trim()){ const q=dealQ.trim().toLowerCase(); cs=cs.filter(d=>(d.brand+' '+(d.agency||'')+' '+plSummary(d)).toLowerCase().includes(q)); }
    const dv={ deal:d=>d.brand.toLowerCase(), date:d=>dealSummary(d).start||'', status:d=>{ const c=dealSummary(d); return c.under?0:d.reads.some(r=>r.status==='missed')?1:2; }, pacing:d=>dealSummary(d).pct||0, delivered:d=>dealSummary(d).got||0 };
    const sf=dv[dealSort.k]||dv.date; cs=cs.slice().sort((a,b)=>{ const x=sf(a), y=sf(b); return (x>y?1:x<y?-1:0)*dealSort.dir; });
    const head=`<div class="shead" style="grid-template-columns:minmax(0,0.9fr) minmax(0,1fr) 108px 150px 168px 118px 26px">${[['deal','Deal'],['pl','Placement'],['date','Dates'],['status','Status'],['pacing','Pacing'],['delivered','Delivered']].map(([k,l])=>k==='pl'?`<span>${l}</span>`:`<button onclick="setDealSort('${k}')">${l}${dealSort.k===k?(dealSort.dir>0?' ↑':' ↓'):''}</button>`).join('')}<span></span></div>`;
    body=`<div class="card" style="overflow:hidden">${head}${cs.length?cs.map((d,i)=>dealIndexRow(d,i+1)).join(''):'<div class="empty">No deals match.</div>'}</div>`;
  }
  $('view-deals').innerHTML=`<div class="inner" style="max-width:1080px">
    <div class="pagebar"><div class="head"><h1>Campaign Portal</h1></div>
      <div class="pagebar__right">${portalFilter!=='brands'?`<div class="tbar tbar--bare"><div class="tbar__search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="dealQInp" placeholder="Search deals…" value="${esc(dealQ)}" oninput="dealQ=this.value;FOCUS_Q='dealQInp';RENDER.deals()"></div></div>`:''}
        <div class="seg">${FILTERS.map(([k,l])=>{ const n=k==='brands'?brands.length:allD.filter(d=>k==='all'||stOf(d)===k).length; return `<button class="${portalFilter===k?'active':''}" onclick="portalFilter='${k}';RENDER.deals()">${l}${k==='all'?'':' · '+n}</button>`; }).join('')}</div>
        <button class="btn btn--dark btn--sm" onclick="openIngest()">+ Add deal</button></div>
    </div>
    ${body}
    <div class="footnote">Every deal opens its own read-only report. Live deals projecting ${totG?Math.round(totP/totG*100):0}%.</div>
  </div>`;
  refocusQ();
};

/* ════════ BOOT ════════ */
(function init(){
  const ws=seedDemo(); WORKSPACES[ws.id]=ws; S=ws;
  // network workspaces are unaffected; this page only renders workspaceKind CREATOR
  refreshChrome();
  const h=(location.hash||'').replace('#','');
  const start = RENDER[h] ? h : 'home';
  go(start);
  if(h==='onboarding') openOnboarding();
  if(h==='storefront') openStorefront();
  if(h.startsWith('report-')) openReport('d_'+h.slice(7), false);
  if(h.startsWith('campaign-')) openCampaign('d_'+h.slice(9));
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('drawer').classList.contains('open')||$('modal').classList.contains('open')) closeOverlays(); else if($('report').classList.contains('open')) closeReport(); else if($('storefront').classList.contains('open')) closeStorefront(); } });
})();
</script>
</body>
