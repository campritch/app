<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpotsNow for Creators</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317212B'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='%23ffffff' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <style>
    /* ═══ Reused verbatim from acme-delivery.html (Network OS Delivery) ═══ */
    :root {
      --primary: #17212B; --primary-hover: #282828;
      --accent: #FF6267; --accent-hover: #ff4d52; --accent-soft: #FFF1F1;
      --secondary: #E4E6ED;
      --text-primary: #0E1323; --text-secondary: #707481; --text-tertiary: #707481;
      --border: #DEE0E4; --border-light: #EDEEF1; --border-strong: #C5CBD5;
      --white: #ffffff; --secondary-lite: #F3F4F6;
      --nav: #F3F4F6; --nav-current: #E4E6ED; --nav-hover: #EBEDF2;
      --page-bg: #F9FAFB; --panel: #ffffff;
      --green-text: #0E6832; --green-bg: #D6F1E0;
      --blue-text: #1435C0; --blue-bg: #C7E0FF;
      --orange-text: #C2410C; --orange-bg: #FFEDD5;
      --red-text: #B42318; --red-bg: #FEE4E2;
      --purple-text: #6941C6; --purple-bg: #EBE9FE;
      --shadow-post: 0 0 2px 0 rgba(166,175,195,.40);
      --shadow-btn: none;
      --shadow-card: none;
      --shadow-pop: 0 8px 24px rgba(14,19,35,.08);
      --shadow-hover: 0 10px 40px rgba(14,19,35,.12);
      --radius-card: 16px; --radius-panel: 12px; --radius-btn: 8px; --radius-pill: 999px;
      /* categorical chart palette */
      --c1:#17212B; --c2:#3B82F6; --c3:#10B981; --c4:#F59E0B; --c5:#8B5CF6; --c6:#EC4899; --c7:#06B6D4;
    }
    body.dark {
      --primary:#F3F4F6; --primary-hover:#E4E6ED;
      --text-primary:#F0F1F4; --text-secondary:#AAB2BF; --text-tertiary:#848D9C;
      --border:#2A2F38; --border-light:#232830; --border-strong:#3C434E;
      --white:#161A20; --panel:#161A20; --secondary-lite:#212630; --page-bg:#0D1015;
      --nav:#212630; --nav-current:#2A2F38; --nav-hover:#212630;
      --green-bg:#12351F; --blue-bg:#152A47; --orange-bg:#3A2410; --red-bg:#3D1A18; --purple-bg:#241C42;
      --green-text:#5BD68F; --blue-text:#7FB4FF; --orange-text:#F0A868; --red-text:#F58B84; --purple-text:#B69BF5;
      --shadow-card:0 1px 2px rgba(0,0,0,.4); --shadow-btn:0 1px 3px rgba(0,0,0,.35); --shadow-hover:0 12px 34px rgba(0,0,0,.5);
    }
    body.dark .btn--primary, body.dark .pill--solid, body.dark .askwrap__go, body.dark .tb-av { color:#12161C; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--page-bg); color: var(--text-primary);
      -webkit-font-smoothing: antialiased; line-height: 1.45; letter-spacing: -.01em;
      display: flex; gap: 0; height: 100vh; overflow: hidden; padding: 0;
    }
    button { font-family: inherit; cursor: pointer; }
    a { color: inherit; }

    /* ─── SIDEBAR ─── */
    .sidebar { width: 228px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 13px 13px; overflow: hidden; }
    body.embedded .sidebar { display: none !important; }
    .sb-brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 18px; }
    .sb-brand__mark { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; overflow: hidden; }
    .sb-brand__mark svg { display: block; width: 100%; height: 100%; }
    .sb-brand__name b { display: block; color: var(--text-primary); font-size: 15px; font-weight:700; letter-spacing: -.02em; }
    .sb-brand__name span { display: block; color: var(--text-tertiary); font-size: 10px; font-weight: 700; letter-spacing: .14em; margin-top: 1px; }
    .sb-scroll { overflow-y: auto; flex: 1; margin: 0 -6px; padding: 0 6px; }
    .sb-scroll::-webkit-scrollbar { width: 0; }
    .sb-group { margin-top: 14px; }
    .sb-group__label { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-tertiary); padding: 8px 12px 8px; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: none; background: none; border-radius: 12px; color: var(--text-secondary); font-size: 13.5px; font-weight: 600; text-align: left; transition: background .12s, color .12s; position: relative; }
    .nav-item + .nav-item { margin-top: 2px; }
    .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; opacity: .85; }
    .nav-item:hover { background: var(--nav-hover); color: var(--text-primary); }
    .nav-item.active { background: var(--nav-current); color: var(--text-primary); }
    .nav-item.active svg { opacity: 1; }
    .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #3FB87C; margin-left: auto; box-shadow: 0 0 0 0 rgba(63,184,124,.6); animation: pulse 2.2s infinite; }
    .nav-item .badge { margin-left: auto; background: var(--red-bg); color: var(--red-text); font-size: 10.5px; font-weight:700; padding: 1px 7px; border-radius: 999px; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(63,184,124,.5);} 70%{box-shadow:0 0 0 5px rgba(63,184,124,0);} 100%{box-shadow:0 0 0 0 rgba(63,184,124,0);} }
    .sb-foot { padding-top: 10px; border-top: 1px solid var(--border-light); margin-top: 8px; }
    .sb-user { display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; }
    .sb-user__av { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
    .sb-user__name { color: var(--text-primary); font-size: 12.5px; font-weight: 700; line-height: 1.2; }


    /* ─── table toolbar + sortable header, network.spotsnow pattern ─── */
    .tbar { display:flex; align-items:center; gap:14px; padding:10px 14px; border-bottom:1px solid var(--border-light); }
    .tbar--bare { padding:0; border:none; }
    .tbar--bare .tbar__search input { width:150px; }
    .cmp-inp--link { color:var(--blue-text); text-decoration:underline; text-underline-offset:2px; cursor:pointer; }
    .cmp-copy { position:absolute; right:5px; top:50%; transform:translateY(-50%); width:24px; height:24px;
                border:none; background:none; color:var(--text-tertiary); cursor:pointer; display:grid; place-items:center; border-radius:6px; }
    .cmp-copy:hover { color:var(--text-primary); background:var(--secondary-lite); }
    .tbar__search { position:relative; }
    .tbar__search svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-secondary); }
    .tbar__search input { width:240px; padding:9px 12px 9px 34px; border:0; border-radius:8px;
                          font:inherit; font-size:14px; background:var(--white); color:var(--text-primary); box-shadow: inset 0 0 0 1px var(--border), var(--shadow-btn); }
    .tbar__search input::placeholder { color:var(--text-secondary); }
    .tbar__search input:focus { outline:none; box-shadow: inset 0 0 0 1.5px var(--text-primary), var(--shadow-btn); }
    .tsel { border:none; background:transparent; font:inherit; font-size:12px; font-weight:600; color:var(--text-primary); cursor:pointer; }
    .shead { display:grid; align-items:center; gap:0 13px; padding:10px 16px; border-bottom:1px solid var(--border-light); background:#F7F8FA; }
    .shead button, .shead span { border:none; background:none; padding:0; text-align:left; font-family:inherit; font-size:12px; font-weight:600; letter-spacing:0; text-transform:none; color:var(--text-secondary); cursor:pointer; white-space:nowrap; }
    .shead button:hover { color:var(--text-primary); }
    /* ─── flat list card: rows divided by hairlines, one border around ─── */
    .listcard { background: var(--white); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .listcard .fhead { padding: 8px 14px; margin: 0; border-bottom: 1px solid var(--border-light); }
    .listcard .wrow { border: none; border-radius: 0; background: none; }
    .listcard .wrow + .wrow { margin-top: 0; border-top: 1px solid var(--border-light); }
    .listcard .archdiv { margin: 4px 0; padding: 8px 16px; }
    .listcard .archdiv::after { display: none; }
    /* report stat tiles — the lead one goes dark, like the network's impressions card */
    .pstat { background: var(--white); border: 1px solid var(--border-light); border-radius: 8px; padding: 9px 12px; }
    .pstat__l { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-tertiary); }
    .pstat__v { font-size: 18px; font-weight:700; letter-spacing: -.03em; margin-top: 3px; }
    .pstat--dark { background: var(--primary); border-color: var(--primary); color: #fff; }
    .pstat--dark .pstat__l { color: inherit; opacity: .65; }
    .pstat--dark .pstat__v { font-size: 24px; }
    body.dark .pstat--dark { color: #12161C; }

    /* ─── TOP BAR ─── */
    .topbar { display: flex; align-items: center; gap: 4px; justify-content: flex-end; padding: 13px 18px 0; flex-shrink: 0; }
    .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #3FB87C; margin-left: auto; }
    .nav-item { border: none; background: none; border-radius: 8px; padding: 6px 11px; color: var(--text-tertiary); font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    .nav-item:hover { color: var(--text-primary); background: var(--nav-hover); }
    .nav-item.active { color: var(--text-primary); background: var(--nav-current); }
    .nav-item .badge { background: var(--red-bg); color: var(--red-text); font-size: 10px; font-weight:700; padding: 1px 6px; border-radius: 999px; }
    .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #3FB87C; }
    /* sidebar nav re-asserted over the topbar redefinition: chunky Acme Network pills */
    .sidebar .nav-item { display: flex; width: 100%; padding: 12px 14px; border-radius: 10px; font-size: 13.5px; color: var(--text-secondary); gap: 12px; }
    .sidebar .nav-item:hover { background: var(--nav-hover); color: var(--text-primary); }
    .sidebar .nav-item.active { background: var(--secondary-lite); color: var(--text-primary); }
    .tb-plain { display: inline-flex; align-items: center; gap: 6px; border: none; background: none; padding: 6px 8px;
                border-radius: 8px; color: var(--text-secondary); font-size: 12px; font-weight: 600; }
    .tb-plain:hover { background: var(--nav-hover); color: var(--text-primary); }
    .tb-plain svg { width: 14px; height: 14px; }
    .tb-btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--white); color: var(--text-secondary); font-size: 12px; font-weight: 600; margin-left: 6px; box-shadow: var(--shadow-btn); }
    .tb-btn:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .tb-btn.active { background: var(--nav-current); color: var(--text-primary); border-color: transparent; }
    .tb-btn svg { width: 13px; height: 13px; }
    .tb-av { width: 30px; height: 30px; border-radius: 9px; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 11px; margin-left: 6px; border: none; flex-shrink: 0; }

    /* ─── MAIN ─── */
    .main { flex: 1; min-width: 0; background: var(--panel); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .views { flex: 1; overflow-y: auto; }
    .view { display: none; }
    .view.active { display: block; }
    .inner { max-width: 1220px; margin: 0 auto; padding: 16px 28px 70px; }
    .pagebar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; gap: 16px; flex-wrap: wrap; }
    .head h1 { font-size: 20px; font-weight: 700; letter-spacing: -.035em; display: flex; align-items: center; gap: 11px; }
    .head p { color: var(--text-secondary); font-size: 12.5px; margin-top: 4px; font-weight: 500; max-width: 640px; }
    .pagebar__right { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .live-dot { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; color: var(--green-text); background: var(--green-bg); padding: 4px 10px; border-radius: var(--radius-pill); }
    .live-dot i { width: 6px; height: 6px; border-radius: 50%; background: var(--green-text); animation: pulse 2s infinite; }

    /* filters */
    .seg { display: inline-flex; gap: 4px; background: var(--secondary-lite); border: none; border-radius: 10px; padding: 4px; }
    .seg button { border: none; background: none; padding: 5px 13px; font-size: 12.5px; font-weight: 500; color: var(--text-secondary); border-radius: 8px; transition: all .2s; }
    .seg button:hover { color: var(--text-primary); }
    .seg button.active { background: var(--white); color: #000; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1); }

    /* buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; border-radius: var(--radius-btn); padding: 9px 16px; font-size: 14px; font-weight: 500; line-height: 1; border: 1px solid transparent; transition: all .2s; }
    .btn svg { width: 16px; height: 16px; }
    .btn--primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn--primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn--ghost { background: var(--white); border-color: var(--border); color: var(--text-primary); box-shadow: var(--shadow-btn); }
    .btn--ghost:hover { background: var(--secondary); border-color: var(--secondary); color: #000; box-shadow: none; }
    .btn--sm { padding: 6px 12px; font-size: 12.5px; font-weight: 600; }
    .btn--green { background: var(--green-text); color: #fff; border-color: var(--green-text); }
    .btn--green:hover { filter: brightness(1.08); }
    .btn--danger { background: var(--white); color: var(--red-text); border-color: color-mix(in srgb, var(--red-text) 45%, transparent); }
    .btn--danger:hover { background: var(--red-bg); border-color: var(--red-text); }
    /* reschedule avails - what's open vs already sold on the show */
    .resch-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    @media (max-width:520px){ .resch-grid { grid-template-columns:1fr; } }
    .resch-slot { display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; font-family:inherit; border:1px solid var(--border); border-radius:12px; padding:12px 14px; background:var(--white); cursor:pointer; transition:border-color .12s, box-shadow .12s; }
    .resch-slot:hover:not(:disabled) { border-color:var(--primary); box-shadow:inset 0 0 0 1px var(--primary); }
    .resch-slot.full { background:var(--secondary-lite); cursor:not-allowed; opacity:.75; }
    .resch-slot__day { font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-tertiary); }
    .resch-slot__date { font-size:14px; font-weight:700; color:var(--text-primary); }
    .resch-slot__cap { font-size:11.5px; font-weight:600; color:var(--green-text); margin-top:2px; }
    .resch-slot__cap.full { color:var(--text-tertiary); }

    /* cards + grid */
    .grid { display: grid; gap: 16px; }
    .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
    .card__pad { padding: 15px 18px; }
    .card__head { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--border-light); }
    .card__title { font-size: 14px; font-weight: 700; letter-spacing: -.02em; display:flex; align-items:center; gap:8px; }
    .card__sub { font-size: 12px; color: var(--text-tertiary); font-weight: 500; margin-top: 2px; }

    /* stat tiles */
    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .tile { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow-card); }
    .tile__label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .tile__val { font-size: 34px; font-weight: 700; letter-spacing: -.04em; margin-top: 8px; font-variant-numeric: tabular-nums; }
    .tile__delta { font-size: 12px; font-weight: 700; margin-top: 6px; display: inline-flex; align-items: center; gap: 4px; }
    .up { color: var(--green-text); } .down { color: var(--red-text); }

    /* tags */
    .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; letter-spacing: -.01em; }
    .tag--green { background: var(--green-bg); color: var(--green-text); }
    .tag--blue { background: var(--blue-bg); color: var(--blue-text); }
    .tag--orange { background: var(--orange-bg); color: var(--orange-text); }
    .tag--red { background: var(--red-bg); color: var(--red-text); }
    .tag--purple { background: var(--purple-bg); color: var(--purple-text); }
    .tag--grey { background: var(--secondary-lite); color: var(--text-secondary); }
    .tag i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* tables */
    table { width: 100%; border-collapse: collapse; }
    thead th { font-size: 12px; font-weight: 600; letter-spacing: 0; color: var(--text-secondary); text-align: left; padding: 12px 20px; border-bottom: 1px solid var(--border-light); background: #F7F8FA; }
    tbody td { font-size: 13px; padding: 13px 20px; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr.clickable:hover { background: var(--page-bg); cursor: pointer; }
    .num { font-variant-numeric: tabular-nums; }
    .right { text-align: right; }

    /* progress / pacing bar */
    .pace { height: 8px; border-radius: 999px; background: var(--secondary-lite); overflow: hidden; position: relative; }
    .pace__fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width .5s; }
    .pace--good .pace__fill { background: var(--green-text); }
    .pace--warn .pace__fill { background: var(--orange-text); }
    .pace--bad .pace__fill { background: var(--red-text); }

    /* progress ring */
    .ringwrap { display:flex; align-items:center; gap:14px; }

    /* coach */
    .coach-card { display: flex; gap: 14px; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--border-light); background: var(--white); }
    .coach-card + .coach-card { margin-top: 12px; }
    .coach-ico { width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center; }
    .coach-card b { font-size: 13.5px; font-weight: 700; }
    .coach-card p { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; line-height: 1.5; }
    .coach-act { margin-top: 9px; font-size: 12px; font-weight: 700; color: var(--primary); display: inline-flex; align-items: center; gap: 5px; }

    /* modal / drawer */
    .scrim { position: fixed; inset: 0; background: rgba(20,25,35,.44); backdrop-filter: blur(2px); z-index: 60; display: none; }
    .scrim.open { display: block; }
    .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: 560px; max-width: 94vw; background: var(--white); z-index: 61; box-shadow: -10px 0 40px rgba(20,25,35,.16); transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }
    /* full-screen variant — the episode view opened from a show record */
    .drawer--full { width: min(1020px, 96vw); max-width: none; left: 50%; right: auto; top: 20px; height: calc(100vh - 20px);
                    border-radius: 11px 11px 0 0; transform: translate(-50%, 102%); box-shadow: 0 -12px 48px rgba(20,25,35,.22); }
    .drawer--full.open { transform: translate(-50%, 0); }
    /* wide variant — the flight drawer runs two columns: numbers left, video + links right */
    .drawer--wide { width: min(1120px, 96vw); }
    .drawer--reqs { width: min(840px, 96vw); padding: 0; }
    .drawer--reqs iframe { height: 100vh; }
    .spotcols { display:grid; grid-template-columns:1fr 1.05fr; gap:0 26px; align-items:start; }
    @media (max-width: 1040px){ .spotcols { grid-template-columns:1fr; } }
    .drawer__head { padding: 20px 24px; border-bottom: 1px solid var(--border-light); display: flex; align-items: flex-start; justify-content: space-between; }
    .drawer__body { padding: 22px 24px; overflow-y: auto; flex: 1; }
    .drawer__foot { padding: 16px 24px; border-top: 1px solid var(--border-light); display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-shrink: 0; background: var(--white); }
    .drawer__foot--split { justify-content: space-between; }
    .drawer__foot-sum { font-size: 12.5px; color: var(--text-secondary); }
    .drawer__foot-sum b { color: var(--text-primary); font-weight:700; }
    .drawer__foot-btns { display: flex; gap: 10px; align-items: center; }
    .x { border: none; background: var(--secondary-lite); width: 30px; height: 30px; border-radius: 8px; color: var(--text-secondary); font-size: 16px; display: grid; place-items: center; }

    /* modal center */
    .modal { position: fixed; z-index: 61; top: 50%; left: 50%; transform: translate(-50%,-46%); width: 720px; max-width: 94vw; max-height: 90vh; overflow-y: auto; background: var(--white); border-radius: 16px; box-shadow: var(--shadow-hover); opacity: 0; pointer-events: none; transition: .22s; }
    .modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%); }

    .kv dt { color: var(--text-tertiary); font-weight: 600; }
    .kv dd { font-weight: 600; }

    .field { margin-bottom: 15px; }
    .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
    .field input { width: 100%; min-height: 44px; padding: 12px 14px; border: 0; border-radius: 6px; font-size: 14px; font-family: inherit; color: var(--text-primary); background: var(--white); box-shadow: inset 0 0 0 1px var(--border), var(--shadow-btn); }
    .field input:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--text-primary), var(--shadow-btn); }
    .field input::placeholder { color: var(--text-secondary); }
    .field select { width: 100%; min-height: 44px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; font-family: inherit; color: var(--text-primary); background: var(--white); box-shadow: var(--shadow-btn); }
    .field select:focus { outline: none; border-color: var(--text-primary); box-shadow: inset 0 0 0 1px var(--text-primary); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .footnote { margin-top: 26px; font-size: 11.5px; color: var(--text-tertiary); text-align: center; }
    .muted { color: var(--text-tertiary); }
    .empty { text-align: center; padding: 40px 20px; color: var(--text-tertiary); font-size: 13px; }

    /* air check agent scan */
    .scanbar { height: 4px; background: var(--secondary-lite); border-radius: 999px; overflow: hidden; }
    .scanbar__fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--c2), var(--c3)); transition: width .3s; }
    .agentrow { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border: 1px solid var(--border-light); border-radius: 12px; background: var(--white); }
    .agentrow + .agentrow { margin-top: 10px; }
    .thumb { width: 92px; height: 52px; border-radius: 2px; object-fit: cover; background: var(--secondary-lite); flex-shrink: 0; }
    .pulse-blue { animation: pulseb 1.4s infinite; }
    /* flight-row CTAs: one min-width for all so the column never shifts;
       In progress is a quiet underlined link until it becomes a real ask */
    .fcta { min-width: 92px; justify-content: center; text-align: center; }
    .fcta--quiet { background: none; border: none; font-family: inherit; font-size: 12px; font-weight: 600;
                   color: var(--text-secondary); text-decoration: underline; text-underline-offset: 3px;
                   cursor: pointer; padding: 0; }
    .fcta--quiet:hover { color: var(--text-primary); }
    .fflag { width:24px; height:24px; border-radius:50%; display:grid; place-items:center; flex-shrink:0; border:none; padding:0; cursor:pointer; background:var(--red-bg); color:var(--red-text); transition:background .12s, color .12s; }
    .fflag svg { width:14px; height:14px; }
    .fflag:hover { background:var(--red-text); color:#fff; }
    @keyframes pulseb { 0%,100%{opacity:1;} 50%{opacity:.45;} }

    /* proof reel */
    .reel-stage { background: #0b0f14; border-radius: 14px; overflow: hidden; position: relative; aspect-ratio: 16/9; display: grid; place-items: center; }
    .reel-stage iframe { width: 100%; height: 100%; border: 0; }
    .reel-strip { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px; }
    .reel-clip { width: 150px; flex-shrink: 0; border-radius: 10px; overflow: hidden; border: 2px solid transparent; background: var(--white); box-shadow: var(--shadow-card); }
    .reel-clip.active { border-color: var(--c2); }
    .reel-clip img { width: 100%; height: 84px; object-fit: cover; display: block; background:#222; }
    .reel-clip__meta { padding: 7px 9px; }

    /* deliverables & compliance (North Station pattern) */
    .ai-tag { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--purple-bg); color: var(--purple-text); padding: 3px 8px; border-radius: 999px; }
    .cmp-hint { font-size: 11.5px; color: var(--text-tertiary); margin: 6px 0 2px; line-height: 1.45; }
    .cmp-row { border: 1px solid transparent; border-radius: 12px; padding: 11px 12px; margin-top: 9px; background: var(--page-bg); }
    .cmp-row__top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
    .cmp-row__date { font-size: 12px; font-weight: 700; }
    .cmp-status { font-size: 10.5px; font-weight: 600; padding: 2px 10px; border-radius: 999px; }
    .cmp-status.ok { background: var(--green-bg); color: var(--green-text); }
    .cmp-status.pend { background: var(--secondary-lite); color: var(--text-secondary); }
    .cmp-row--active { background: var(--white); border-color: var(--border); box-shadow: var(--shadow-btn); }
    .cmp-row[onclick], .cmp-row__top[onclick] { }
    .cmp-row__top[style*="cursor"]:hover .cmp-row__date { color: var(--primary); }
    .cmp-score { font-size: 11px; font-weight:700; font-variant-numeric: tabular-nums; }
    .cmp-inp { width: 100%; padding: 10px 12px; border: 0; border-radius: 8px; font-size: 13.5px; font-family: inherit; margin-top: 6px; color: var(--text-primary); background: var(--white); box-shadow: inset 0 0 0 1px var(--border), var(--shadow-btn); }
    .cmp-inp:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--text-primary), var(--shadow-btn); }
    .cmp-inp::placeholder { color: var(--text-secondary); }

    /* advertiser portal */


    /* ─── chat-first hero (matches the SpotsNow Intelligence layout) ─── */
    .hero { max-width:720px; margin:0 auto; padding:44px 0 0; text-align:center; }
    .hero h1 { font-size:34px; font-weight:700; letter-spacing:-.04em; }
    .hero p { color:var(--text-secondary); font-size:14px; font-weight:500; line-height:1.6; max-width:560px; margin:12px auto 0; }
    .hero__pills { display:flex; gap:9px; justify-content:center; margin-top:18px; }
    .pill { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:500; padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--white); color:var(--text-secondary); box-shadow:var(--shadow-btn); }
    .pill--solid { background:var(--primary); border-color:var(--primary); color:#fff; }
    .pill i { width:7px; height:7px; border-radius:50%; background:currentColor; }
    .askwrap { position:relative; margin-top:26px; }
    .askwrap input { width:100%; padding:16px 92px 16px 18px; border:1px solid var(--border); border-radius:13px; font-size:14.5px; font-family:inherit; background:var(--white); box-shadow:var(--shadow-card); color:var(--text-primary); }
    .askwrap input:focus { outline:none; border-color:var(--border-strong); box-shadow:var(--shadow-hover); }
    .askwrap input::placeholder { color:var(--text-tertiary); }
    .askwrap__go { position:absolute; right:9px; top:50%; transform:translateY(-50%); width:36px; height:36px; border-radius:9px; border:none; background:var(--primary); color:#fff; display:grid; place-items:center; }

    /* ─── MANAGE SHOWS GRID (ported from inventory-demo3) ─── */
    .msheet-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; }
    .msheet-toolbar { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-bottom: 1px solid var(--border); }
    .msheet-search { flex: 1; max-width: 320px; display: flex; align-items: center; gap: 9px; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 7px 12px; color: var(--text-tertiary); }
    .msheet-search input { border: none; outline: none; background: none; font-family: inherit; font-size: 13px; font-weight: 500; color: var(--text-primary); width: 100%; }
    .msheet-tools { display: flex; align-items: center; gap: 7px; margin-left: auto; }
    .msheet-scroll { overflow-x: auto; }
    .msheet { border-collapse: collapse; width: 100%; }
    .msheet .mh { background: var(--secondary-lite); border-bottom: 1px solid var(--border); border-right: 1px solid var(--border-light); padding: 11px 10px; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-align: center; white-space: nowrap; }
    .msheet .mh--show { text-align: left; padding-left: 16px; width: 210px; min-width: 210px; position: sticky; left: 0; z-index: 3; }
    .msheet .mtd { border-bottom: 1px solid var(--border-light); border-right: 1px solid var(--border-light); height: 50px; padding: 0; vertical-align: middle; background: var(--panel); }
    .msheet .mrow:hover .mtd { background: var(--nav-hover); }
    .mtd--show { position: sticky; left: 0; z-index: 1; width: 210px; min-width: 210px; box-shadow: 1px 0 0 var(--border-light); }
    .mshowcell--btn { width:100%; border:none; background:none; font-family:inherit; text-align:left; cursor:pointer; }
    .mshowcell--btn:hover { background: var(--secondary-lite); }
    .mshowdetail { display:flex; align-items:center; gap:1px; font-size:10.5px; font-weight:600; color:var(--blue-text); margin-top:1px; }
    .mshowcell--btn:hover .mshowdetail { text-decoration: underline; }
    .mshowcell { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 50px; overflow: hidden; }
    .mthumb { width: 32px; height: 32px; border-radius: 2px; background: var(--primary); color: var(--panel); display: grid; place-items: center; font-size: 11px; font-weight:700; flex-shrink: 0; letter-spacing: -.02em; }
    .mshowname { font-size: 12.5px; font-weight: 700; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mshowsub { font-size: 10.5px; font-weight: 600; color: var(--text-tertiary); }
    .mcell { position: relative; height: 50px; display: flex; align-items: center; justify-content: center; padding: 0 4px; cursor: cell; }
    .mcell--sel { box-shadow: inset 0 0 0 2px var(--primary); border-radius: 3px; z-index: 3; }
    .mcell--range { background: var(--nav-current); box-shadow: inset 0 0 0 1px var(--border-strong); }
    .mfill { position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; background: var(--primary); border: 1.5px solid var(--panel); cursor: crosshair; z-index: 5; }
    .mctl { font-family: inherit; border: none; background: transparent; outline: none; color: var(--text-primary); font-weight: 400; }
    .mctl--num { width: 100%; text-align: center; font-size: 13px; }
    .mnum { display: inline-flex; align-items: center; justify-content: center; gap: 1px; width: 100%; }
    .maffix { font-size: 12px; font-weight: 400; color: var(--text-tertiary); }
    .mctl--pick { width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
                  font-size: 12.5px; padding: 0 4px; cursor: pointer; border-radius: 7px; }
    .mctl--pick:hover { background: var(--nav-hover); }
    .msheet-foot { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-top: 1px solid var(--border); }
    .msheet-total { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }

    /* ─── transcript ─── */
    .txwrap { border:1px solid var(--border-light); border-radius:11px; overflow:hidden; }
    .txhd { display:flex; align-items:center; justify-content:space-between; padding:9px 12px; background:var(--secondary-lite); border-bottom:1px solid var(--border-light); }
    .txhd span { font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-tertiary); }
    .txbody { max-height:238px; overflow-y:auto; padding:6px; }
    .tx { display:flex; gap:10px; width:100%; text-align:left; padding:6px 8px; border:none; background:none; border-radius:7px; font-family:inherit; font-size:12.5px; line-height:1.55; color:var(--text-secondary); cursor:pointer; }
    .tx:hover { background:var(--nav-hover); color:var(--text-primary); }
    .tx time { font-variant-numeric:tabular-nums; color:var(--text-tertiary); font-size:11px; font-weight:700; flex-shrink:0; width:38px; padding-top:1px; }
    .tx--ad { color:var(--text-primary); background:var(--blue-bg); box-shadow:inset 2px 0 0 var(--blue-text); }
    .tx--ad:hover { background:var(--blue-bg); filter:brightness(.97); }
    .tx--ad time { color:var(--blue-text); }


    /* ─── one work row, used for every kind of item ─── */
    .wrow { display:flex; align-items:center; gap:13px; padding:11px 14px; border:1px solid var(--border-light); border-radius:10px; background:var(--white); }
    .wrow + .wrow { margin-top:8px; }
    /* ─── flight rows: one grid for Needs you and All flights alike ─── */
    .wflight { display:grid; grid-template-columns:minmax(0,1fr) 56px 92px 118px 168px 118px 26px; align-items:center; gap:0 14px; padding:10px 14px; }
    .wflight .wrow__main > b { font-size:13px; font-weight:700; }
    .wflight .wrow__num { width:auto; justify-content:flex-end; }
    .wflight .wrow__num b { font-weight:600; }
    .wflight .btn { width:auto; justify-content:center; padding-left:10px; padding-right:10px; }
    .wflight > span { text-align:center; }
    .fhead { display:grid; grid-template-columns:minmax(0,1fr) 56px 92px 118px 168px 118px 26px; gap:0 14px; padding:0 18px 9px;
             font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-tertiary); }
    .fhead span:nth-child(2),.fhead span:nth-child(3),.fhead span:nth-child(4),.fhead span:nth-child(6) { text-align:center; }
    .fhead span:nth-child(5) { text-align:right; }
    .fnum { text-align:center; font-size:13px; font-weight:500; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
    .fnum small { display:block; font-size:10.5px; font-weight:500; color:var(--text-tertiary); letter-spacing:0; margin-top:1px; }
    .fran { display:inline-flex; align-items:center; justify-content:center; gap:5px; width:100%; max-width:100%; font-size:12.5px; font-weight:500;
            padding:4px 0; border-radius:7px; border:1px solid var(--border); background:var(--panel); color:var(--text-primary);
            font-variant-numeric:tabular-nums; cursor:pointer; overflow:hidden; }
    .fran:hover { border-color:var(--border-strong); }
    .fran--no { border-style:dashed; color:var(--text-tertiary); font-weight:400; cursor:default; white-space:nowrap; font-size:11px; }
    .wdots { width:26px; height:26px; border:none; border-radius:8px; background:none; color:var(--text-tertiary);
             display:grid; place-items:center; padding:0; cursor:pointer; justify-self:center; font-size:14px; font-weight:700; letter-spacing:1px; }
    .wdots:hover { background:var(--nav-hover); color:var(--text-primary); }
    .wrow--dim { opacity:.55; }
    .wpop { position:fixed; z-index:90; min-width:172px; background:var(--panel); border:1px solid var(--border); border-radius:11px;
            box-shadow:var(--shadow-hover); padding:5px; }
    .wpop button { display:block; width:100%; text-align:left; border:none; background:none; border-radius:7px;
                   padding:8px 11px; font-size:12.5px; font-weight:600; color:var(--text-primary); cursor:pointer; }
    .wpop button:hover { background:var(--nav-hover); }
    .wnote { display:flex; align-items:center; gap:11px; padding:8px 10px 8px 14px; background:var(--page-bg);
             border:1px solid var(--border-light); border-radius:12px; cursor:pointer; }
    .wnote__x { background:var(--white); }
    .wnote + .wnote, .wnote + .wrow { margin-top:8px; }
    .wnote__body { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .wnote__body b { font-size:12.5px; }
    .wnote__txt { font-size:12px; color:var(--text-secondary); margin-left:8px; }
    .wnote__x { flex-shrink:0; width:24px; height:24px; border-radius:50%; border:none; background:var(--secondary-lite);
                color:var(--text-secondary); font-size:11px; line-height:1; cursor:pointer; display:grid; place-items:center; }
    .wnote__x:hover { background:var(--border); color:var(--text-primary); }
    .archdiv { display:flex; align-items:center; gap:9px; width:100%; margin:22px 0 10px; padding:0 2px; font-size:11px; font-weight:700;
               letter-spacing:.07em; text-transform:uppercase; color:var(--text-tertiary); border:none; background:none; cursor:pointer; font-family:inherit; }
    .archdiv:hover { color:var(--text-secondary); }
    .archdiv::after { content:''; flex:1; height:1px; background:var(--border-light); }
    .archdiv svg { transition:transform .15s; }

    .statedit { border:none; background:none; font:inherit; font-size:14px; font-weight:700; color:inherit;
                padding:0; margin-top:2px; width:100%; border-bottom:1px dashed transparent; }
    .statedit:hover, .statedit:focus { border-bottom-color:var(--border-strong); outline:none; }
    .warch { width:26px; height:26px; border-radius:7px; border:none; background:none; color:var(--text-tertiary); font-size:12px; justify-self:center; }
    .warch:hover { background:var(--nav-hover); color:var(--text-primary); }
    .wrow--click { cursor:pointer; transition:border-color .12s, box-shadow .12s; }
    .wrow--click:hover { border-color:var(--border-strong); box-shadow:var(--shadow-card); }
    .wrow__ico { width:34px; height:34px; border-radius:2px; display:grid; place-items:center; flex-shrink:0; }
    .wrow__main { flex:1; min-width:0; }
    .wrow__main > b { font-size:13px; font-weight:700; display:block; }
    .wrow__main span { font-size:12px; color:var(--text-secondary); font-weight:400; }
    .wrow__main span b { font-weight:700; color:var(--text-primary); }
    .wrow__num { width:132px; flex-shrink:0; display:flex; align-items:center; gap:9px; }
    .wrow__num b { font-size:12.5px; min-width:38px; text-align:right; }
    .wrow button { flex-shrink:0; }
    .answer { background:var(--white); border:1px solid var(--border); border-radius:12px; padding:14px 16px; font-size:13px; line-height:1.6; margin-bottom:18px; box-shadow:var(--shadow-card); }
    .thread { max-width:720px; margin:30px auto 0; }
    .thread__hd { display:flex; align-items:center; justify-content:space-between; padding:0 2px 10px; }
    .thread__hd span { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-tertiary); }
    .thread__hd button { border:none; background:none; color:var(--text-tertiary); font-size:11.5px; font-weight:700; padding:3px 7px; border-radius:6px; }
    .thread__hd button:hover { color:var(--text-primary); background:var(--nav-hover); }

    .turn__a { font-size:13px; line-height:1.65; color:var(--text-secondary); }
    .turn__a b { color:var(--text-primary); }

    /* ─── show / brand sign-off toggles ─── */
    .tog { display:flex; align-items:center; gap:11px; padding:11px 13px; border:1px solid var(--border-light); border-radius:11px; background:var(--white); }
    .tog__sw { width:42px; height:24px; border-radius:999px; background:var(--border-strong); position:relative; flex-shrink:0; transition:.16s; border:none; }
    .tog__sw i { position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.16s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
    .tog__sw.on { background:var(--green-text); } .tog__sw.on i { left:21px; }
    .tog b { font-size:12.5px; display:block; } .tog small { font-size:11px; color:var(--text-tertiary); font-weight:500; }

    /* ─── curve / projection chart ─── */
    .curvewrap { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 14px 10px; }
    .curvekey { display:flex; flex-wrap:wrap; gap:14px; padding:2px 4px 0; }
    .curvekey span { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:400; color:var(--text-secondary); }
    .curvekey i { width:14px; height:0; border-top:2px solid; border-radius:2px; }

        .kv { display:flex; align-items:baseline; justify-content:space-between; gap:20px; font-size:13px; padding:10px 0; border-bottom:1px solid var(--border-light); }
    .kv:last-child { border-bottom:0; }
    .kv span { color:var(--text-secondary); font-weight:500; white-space:nowrap; }
    .kv b { font-weight:700; text-align:right; }

    .dhead { font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--text-primary); margin:18px 0 2px; }
    .srcpill { font-size:9.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:2px 6px; border-radius:5px; background:var(--secondary-lite); color:var(--text-tertiary); }
    .srcpill.adserver { background:var(--purple-bg); color:var(--purple-text); }

    @media (max-width: 900px) { .tiles { grid-template-columns: repeat(2,1fr); } }
  /* ═══ modern brand-facing campaign report ═══ */
  .rpt { max-width:1120px; margin:0 auto; }

  .rpt-ac { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
  @media (max-width:620px){ .rpt-ac{ grid-template-columns:1fr; } }
  .rpt-ac__panel { background:var(--page-bg); border-radius:10px; padding:13px 15px; }
  .rpt-ac__h { font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:10px; }

  /* ═══ report-as-side-modal (consumer-grade) ═══ */
  .drawer--report { width:min(1140px,97vw); max-width:none; padding:0; background:var(--page-bg); }

  /* now-playing hero player */
  .npl { margin-top:-18px; position:relative; z-index:2; background:var(--panel); border:1px solid var(--border); border-radius:16px; box-shadow:0 10px 34px rgba(20,25,35,.1); padding:16px 18px; display:flex; align-items:center; gap:16px; }

  .rpt-grid2 { display:grid; grid-template-columns:1.3fr 1fr; gap:14px; margin-top:16px; }

  .rpt-card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:18px 20px; }
  .rpt-card__h { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:14px; }
  /* operator-only report controls - shape what the brand sees on the share link */

  /* campaign-level delivery-metric selector — networks set whether a campaign is judged on
     total impressions or YouTube engaged views (how YouTube inventory is bought now) */
  .rpt-metric { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:16px; }
  .rpt-metric__lbl { font-size:10.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--text-tertiary); }
  .rpt-metric__val { font-size:12.5px; font-weight:700; color:var(--text-primary); }
  .rpt-metric__hint { font-size:11px; color:var(--text-tertiary); font-weight:500; flex-basis:100%; }
  .rpt-seg { display:inline-flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; background:var(--white); }
  .rpt-seg__b { padding:7px 14px; font-size:12.5px; font-weight:600; color:var(--text-secondary); background:transparent; border:none; border-left:1px solid var(--border); cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .rpt-seg__b:first-child { border-left:none; }

  .rpt-deliv--nochart { grid-template-columns:1fr; }
  /* campaign note - a sentence or two at the top of the brand's report */
  .rpt-note { margin-top:14px; }
  .rpt-note--show { background:var(--secondary-lite); border:1px solid var(--border-light); border-radius:14px; padding:15px 18px; }
  .rpt-note--show p { margin:0; font-size:14px; line-height:1.55; color:var(--text-primary); font-weight:500; }

  /* operator compliance scoring checklist */
  .cplist { margin-top:18px; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .cplist__hd { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 15px; background:var(--page-bg); border-bottom:1px solid var(--border-light); cursor:pointer; list-style:none; user-select:none; }

  .cprow__ic.no { background:var(--red-bg); color:var(--red-text); }
  .cprow__t { flex:1; font-size:13px; font-weight:600; }

  .cprow__hint.no { color:var(--red-text); }
  .cprow__t em { display:block; font-style:normal; font-size:11.5px; font-weight:600; color:var(--red-text); margin-top:3px; line-height:1.35; }
  .cprow--no { background:color-mix(in srgb, var(--red-bg) 55%, transparent); }

  .cplist__foot { display:flex; align-items:center; gap:10px; padding:11px 15px; border-top:1px solid var(--border-light); background:var(--page-bg); }
  /* escalation — only shown when a requirement failed */

  .cplist--alert .cplist__hd:hover { background:color-mix(in srgb, var(--red-bg) 80%, var(--red-text)); }
  .cplist__score.bad { background:var(--red-text); color:#fff; }
  .cpesc { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 15px; background:color-mix(in srgb, var(--red-bg) 45%, transparent); border-bottom:1px solid var(--border-light); }
  .cpesc__steps { display:flex; align-items:center; flex:1; min-width:230px; flex-wrap:wrap; row-gap:6px; }
  .cpesc__step { display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; color:var(--text-tertiary); white-space:nowrap; }
  .cpesc__step.on { color:var(--red-text); }
  .cpesc__step.done { color:var(--green-text); }

  .cpesc__arr { width:16px; height:1.5px; background:var(--border-strong); margin:0 8px; flex-shrink:0; }

  /* grade chip in the compliance header */

  /* compliance themes — the 10 checks roll into a few expandable chunks.
     a clean theme stays contracted; a theme with a flag opens to its itemized checks. */
  .cpth { border-top:1px solid var(--border-light); }
  .cpth__sm { list-style:none; cursor:pointer; display:flex; align-items:center; gap:11px; padding:12px 15px; user-select:none; }
  .cpth__sm::-webkit-details-marker { display:none; }
  .cpth__sm:hover { background:var(--page-bg); }
  .cpth__ic { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; flex-shrink:0; background:var(--green-bg); color:var(--green-text); font-weight:800; font-size:12px; }
  .cpth__ic svg { width:13px; height:13px; }
  .cpth__t { flex:1; font-size:13px; font-weight:700; }
  .cpth__n { font-size:11px; font-weight:700; color:var(--green-text); font-variant-numeric:tabular-nums; text-transform:uppercase; letter-spacing:.03em; }
  .cpth__chev { color:var(--text-tertiary); transition:transform .18s ease; flex-shrink:0; }

  .cpth__body { border-top:1px solid var(--border-light); background:var(--secondary-lite); }

  /* a flagged theme: red accent, opens by default so the problem is visible */

  .cpth--bad > .cpth__sm:hover { background:var(--red-bg); }

  .cpth--bad .cpth__n { color:var(--red-text); }
  /* a theme with on-screen placements still to verify: neutral gray — these often can't be
     confirmed from the transcript, so they shouldn't read as a warning. opens by default. */
  .cpth--check > .cpth__sm { background:var(--secondary-lite); }
  .cpth--check > .cpth__sm:hover { background:var(--secondary); }
  .cpth--check .cpth__ic { background:var(--secondary); color:var(--text-secondary); }
  .cpth--check .cpth__n { color:var(--text-secondary); }
  /* manual-verify rows + controls — neutral gray */
  .cprow__ic.check { background:var(--secondary); color:var(--text-secondary); font-size:13px; }
  .cprow--check { background:transparent; }
  .cprow__t em.cprow__sub { display:block; font-style:normal; font-size:11.5px; font-weight:500; color:var(--text-tertiary); margin-top:3px; line-height:1.35; }

  .scard__sub-main { flex:1; min-width:0; }

  .scard__sub-d { font-size:11.5px; color:var(--text-secondary); margin-top:2px; line-height:1.4; }
  .scard__sub-badge { font-size:10.5px; font-weight:700; padding:2px 10px; border-radius:999px; display:inline-block; margin-top:6px; text-transform:capitalize; }

<script>
/* ════════════════════════════════════════════════════════════════════
   SpotsNow for Creators: creator mode of the Network OS (CREATOR-OS-PRD)
   One Deal object is the spine. Calendar, Delivery, Report, Storefront,
   Invoices and the public API all read the same S.deals + S.slots.
   ════════════════════════════════════════════════════════════════════ */
const TODAY = '2026-11-09';
const CALL_AT = 0.84;            // curve share at which a read can be called (check-in day)
const FULL_AT = 0.90;            // 90% of guarantee is full delivery
const CURVES = {
  medium: {0:0, 1:.30, 2:.50, 3:.63, 5:.76, 7:.84, 10:.90, 14:.94, 21:.98, 30:1},
  fitted: {0:0, 1:.34, 2:.55, 3:.68, 5:.80, 6:.85, 10:.92, 14:.95, 21:.98, 30:1},
};
const PL = { PRE:'Pre-roll', MID1:'Mid 1', MID2:'Mid 2', MID3:'Mid 3', MID4:'Mid 4', POST:'Post-roll', YT:'YouTube integration' };
const PL_SHORT = { PRE:'Pre', MID1:'Mid 1', MID2:'Mid 2', MID3:'Mid 3', MID4:'Mid 4', POST:'Post', YT:'YT integ.' };
const PL_SECS = { PRE:30, MID1:60, MID2:60, MID3:60, MID4:60, POST:30, YT:90 };
const CATEGORIES = ['Supplements','Fitness wearables','Apparel & footwear','Food & beverage','Finance','Sleep & recovery','Software','Gambling','Alcohol','Crypto','Telehealth','Travel'];

/* ── tiny utils ── */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
function d2(s){ const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function isoOf(dt){ return dt.getUTCFullYear()+'-'+pad(dt.getUTCMonth()+1)+'-'+pad(dt.getUTCDate()); }
function addDays(s,n){ const t=d2(s); t.setUTCDate(t.getUTCDate()+n); return isoOf(t); }
function diffDays(a,b){ return Math.round((d2(b)-d2(a))/864e5); }   // b - a
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtDate(s){ const t=d2(s); return MON[t.getUTCMonth()]+' '+t.getUTCDate(); }
function fmtDateY(s){ const t=d2(s); return MON[t.getUTCMonth()]+' '+t.getUTCDate()+', '+t.getUTCFullYear(); }
function dayName(s){ return DOW[d2(s).getUTCDay()]; }
function K(n){ n=Math.round(n||0); if(Math.abs(n)>=1e6) return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M'; if(Math.abs(n)>=1e3) return (n/1e3).toFixed(n>=1e5?0:1).replace(/\.0$/,'')+'K'; return String(n); }
function $$(c){ return '$'+Math.round((c||0)/100).toLocaleString('en-US'); }
function $$c(c){ return '$'+((c||0)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function mmss(s){ s=Math.round(s||0); return Math.floor(s/60)+':'+pad(s%60); }
function rel(mins){ return mins<1?'just now':mins<60?mins+'m ago':Math.round(mins/60)+'h ago'; }
function initials(str){ const w=(str||'').replace(/[^A-Za-z0-9 ]/g,' ').split(' ').filter(Boolean); if(!w.length) return '?'; return (w.length>1 ? w[0][0]+w[1][0] : w[0].slice(0,2)).toUpperCase(); }
let _uid=100; const uid = p => (p||'x')+(++_uid);
const CK = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const CX = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
const LOCK = '<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const ICO_DL = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>';
const ICO_LINK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>';
const ICO_SEND = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg>';
const ICO_PLAY = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

/* BrandLogo: favicon first, letter tile fallback. Domain is the brand key. */
const BRAND_COL = {};
function brandColor(domain){ if(BRAND_COL[domain]) return BRAND_COL[domain]; let h=0; for(const c of (domain||'x')) h=(h*31+c.charCodeAt(0))>>>0; const pal=['#17212B','#0E6832','#1435C0','#C2410C','#6941C6','#0F766E','#9D174D','#334155']; return BRAND_COL[domain]=pal[h%pal.length]; }
function blogo(domain,name,size){ const cls='blogo'+(size?' '+size:''); return `<span class="${cls}"><span class="bl-l" style="background:${brandColor(domain)}">${esc(initials(name||domain))}</span><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64" alt="" onload="if(this.naturalWidth>16){this.previousElementSibling.style.display='none'}else{this.style.display='none'}" onerror="this.style.display='none'" style="position:relative"></span>`; }
function art(sh,size,fs){ const c=sh.colors||['#0E7C66','#0B3B5C']; return `<div class="art" style="width:${size}px;height:${size}px;font-size:${fs||Math.round(size*.36)}px;background:linear-gradient(140deg,${c[0]},${c[1]})">${esc(initials(sh.name))}</div>`; }

/* ════════ WORKSPACES ════════
   A NetworkOsWorkspace with workspaceKind CREATOR and exactly one primaryShow. */
const WORKSPACES = {};
let S = null;   // current workspace

function makeEpisodes(sh, from, to){
  const eps=[]; let n=sh.epStart||180; const titles=sh.titles||[];
  for(let d=from; d<=to; d=addDays(d,1)){
    if(sh.releaseDays.includes(dayName(d))){ eps.push({ date:d, n:n, title: titles[n%Math.max(1,titles.length)] || ('Episode '+n) }); n++; }
  }
  return eps;
}
function placements(sh){
  sh=sh||S.show;
  const p=[]; if(sh.pre) p.push('PRE'); for(let i=1;i<=sh.midSlots;i++) p.push('MID'+i); if(sh.post) p.push('POST'); if(sh.ytIntegration && sh.sources.some(x=>x.type==='YOUTUBE')) p.push('YT');
  return p;
}
const slotKey = (date,pl) => date+'|'+pl;
function slot(date,pl){ return S.slots[slotKey(date,pl)] || null; }
function rateCents(pl, sh){ sh=sh||S.show; if(sh.priceModel==='CPM'){ const imp = pl==='YT'?sh.ytAvg:sh.imprPerEp; return Math.round((sh.cpm[pl]||25)*imp/1000)*100; } return (sh.flat[pl]||0)*100; }
function priceLabel(pl, sh){ sh=sh||S.show; return sh.priceModel==='CPM' ? `$${sh.cpm[pl]} CPM` : $$(rateCents(pl,sh)); }
const episode = d => S.episodes.find(e=>e.date===d);
const deal = id => S.deals.find(d=>d.id===id);
function allReads(){ const out=[]; S.deals.forEach(d=>d.reads.forEach(r=>out.push(Object.assign(r,{_d:d})))); return out; }
function readById(id){ for(const d of S.deals){ const r=d.reads.find(x=>x.id===id); if(r){ r._d=d; return r; } } return null; }

/* ── delivery math (unchanged network rules) ── */
function curveKey(){ const verified=allReads().filter(r=>r.status==='aired').length; return verified>=5?'fitted':'medium'; }
function curveAt(day, key){ const c=CURVES[key||curveKey()]; const ks=Object.keys(c).map(Number).sort((a,b)=>a-b);
  if(day<=0) return 0; if(day>=30) return 1;
  for(let i=0;i<ks.length-1;i++){ const a=ks[i], b=ks[i+1]; if(day>=a&&day<=b) return c[a]+(c[b]-c[a])*((day-a)/(b-a)); } return 1; }
function checkInDay(){ let d=2; while(d<30 && curveAt(d)<CALL_AT) d++; return d; }
function guaranteeOf(r){ return r.guarantee || r._d?.guaranteePerRead || S.show.guarantee; }
function ageOf(r){ return diffDays(r.date, TODAY); }
function delivered(r){ if(r.status!=='aired') return 0; const f=curveAt(ageOf(r)); return Math.round((r.final||0)*f); }
function deliveredSplit(r){ const t=delivered(r); const yt=Math.round(t*(r.ytShare??0.7)); return { yt, aud:t-yt, total:t }; }
function projected(r){ return r.status==='aired' ? (r.final||0) : 0; }
function pastCheckIn(r){ return r.status==='aired' && ageOf(r)>=checkInDay(); }

function dealSummary(d){
  const paid=d.reads.filter(r=>r.kind==='paid'&&r.status!=='cancelled');
  const extra=d.reads.filter(r=>r.kind!=='paid'&&r.status!=='cancelled');
  const aired=d.reads.filter(r=>r.status==='aired');
  const g=paid.reduce((a,r)=>a+guaranteeOf(Object.assign(r,{_d:d})),0);
  const got=aired.reduce((a,r)=>a+delivered(r),0);
  const proj=aired.reduce((a,r)=>a+projected(r),0);
  const yt=aired.reduce((a,r)=>a+deliveredSplit(r).yt,0), aud=got-yt;
  const sched=d.reads.filter(r=>r.status==='scheduled');
  const airedPaidG=aired.filter(r=>r.kind==='paid').reduce((a,r)=>a+guaranteeOf(r),0);
  const anyCalled=aired.some(r=>pastCheckIn(r));
  // deal-level call: projection of what has aired, plus scheduled reads at guarantee
  const projTotal = proj + sched.reduce((a,r)=>a+(r.kind==='paid'?guaranteeOf(r):0),0);
  const pct = g ? Math.round(projTotal/g*100) : 0;
  const airedPct = airedPaidG ? Math.round(aired.filter(r=>r.kind==='paid').reduce((a,r)=>a+projected(r),0)/airedPaidG*100) : 0;
  const dates=d.reads.map(r=>r.date).sort();
  const start=dates[0], end=dates[dates.length-1];
  const state = d.status==='PROPOSED'?'proposed': d.status==='DRAFT'?'draft' : !aired.length?'upcoming' : (!sched.length && !d.reads.some(r=>r.status==='missed') && (end<=TODAY))?'done':'live';
  const under = anyCalled && airedPct < FULL_AT*100;
  const tooEarly = aired.length>0 && !anyCalled;
  const totalCents = d.reads.filter(r=>r.kind==='paid'&&r.status!=='cancelled').reduce((a,r)=>a+(r.priceCents||0),0);
  return { paid, extra, aired, sched, g, got, proj, yt, aud, pct, airedPct, start, end, state, under, tooEarly, totalCents, done:state==='done' };
}
/* Brand-facing badge: positive-only. Never red on the sponsor's view. */
function brandBadge(c){
  if(c.state==='proposed') return {t:'Requested',tone:'grey'};
  if(c.state==='upcoming') return {t:'Scheduled',tone:'grey'};
  if(c.tooEarly) return {t:'Building',tone:'grey'};
  if(c.done && c.airedPct>=100 && c.extra.length) return {t:'Delivered + bonus',tone:'green'};
  if(c.done && c.airedPct>=FULL_AT*100) return {t:'Delivered',tone:'green'};
  if(c.under) return {t:'Under delivered',tone:'orange'};
  return {t:'Live',tone:'green'};
}

/* Slots are derived from Deal reads + open episodes: one source of truth. */
function rebuildSlots(ws){
  ws=ws||S; const slots={};
  ws.deals.forEach(d=>{ if(d.status==='DECLINED') return; d.reads.forEach(r=>{ if(r.status==='cancelled') return;
    const st = r.status==='hold'?'hold' : r.status==='requested'?'req' : (r.kind==='makegood'?'mg':'sold');
    slots[slotKey(r.date,r.placement)] = { state:st, dealId:d.id, readId:r.id, priceCents:r.priceCents, priceModel:d.priceModel, packageId:r.packageId||null, holdExpiresAt: st==='hold'? d.holdExpiresAt : st==='req'? addDays(d.requestedAt||TODAY,1) : null };
  }); });
  ws.slots = slots;
}

/* Exclusivity + excluded categories: the Vetting pre-check, creator-sized. Flags, never blocks. */
function categoryLock(category, date, exceptDealId){
  const out=[]; if(!category) return out;
  if(S.show.excludedCategories.includes(category)) out.push({kind:'excluded', text:`${category} is on your "won't read for" list.`});
  S.deals.forEach(d=>{ if(d.id===exceptDealId || d.category!==category || d.status==='DECLINED' || d.status==='PROPOSED') return;
    const live=d.reads.filter(r=>r.status!=='cancelled'); if(!live.length) return;
    const start=live.map(r=>r.date).sort()[0], end=live.map(r=>r.date).sort().slice(-1)[0];
    const lockEnd=addDays(end, S.show.exclusivityWindowDays||0);
    if(date>=start && date<=lockEnd) out.push({kind:'exclusive', dealId:d.id, text:`${category} is locked by ${d.brand} through ${fmtDate(lockEnd)}.`});
  });
  return out;
}
function isOpen(date,pl){ return !slot(date,pl) && date>TODAY; }
function openFutureSlots(pl, from, n){ const out=[]; for(const e of S.episodes){ if(e.date<from) continue; if(isOpen(e.date,pl)) out.push(e.date); if(out.length>=n) break; } return out; }

/* Invoice status rolls forward with the calendar (OVERDUE is computed, not stored). */
function invStatus(inv){ if(!inv) return null; if(inv.status==='PAID'||inv.status==='VOID'||inv.status==='DRAFT') return inv.status; if(inv.dueAt<TODAY) return 'OVERDUE'; if(diffDays(TODAY,inv.dueAt)<=3) return 'DUE'; return inv.status; }
function invBadge(inv, d){
  if(!inv) return d&&d.status==='PROPOSED'?'<span class="tag tag--grey">Pays after accept</span>':'<span class="tag tag--grey">None yet</span>';
  const st=invStatus(inv);
  const m={DRAFT:['grey','Draft'],SENT:['blue','Sent'],DUE:['blue','Due'],OVERDUE:['orange','Overdue'],PAID:['green','Paid'],VOID:['grey','Void']}[st];
  return `<span class="tag tag--${m[0]}">${m[1]}${inv.external?' · ext':''}</span>`;
}

function ask(q){ q=(q||'').trim(); if(!q) return; const a=answer(q); CHAT.push({q,a}); RENDER.home(); setTimeout(()=>{ const t=document.querySelector('.thread'); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); },30); }
function answer(q){
  const l=q.toLowerCase();
  const d=S.deals.find(x=>l.includes(x.brand.toLowerCase()) || l.includes(x.domain.split('.')[0]));
  if(d){ const c=dealSummary(d); const b=brandBadge(c);
    if(c.state==='proposed') return `<b>${esc(d.brand)}</b> is a request waiting on you: ${d.reads.length} slots, ${$$(c.totalCents)} authorized. <a href="#" onclick="openBookingRequest('${d.id}');return false">Review it</a>.`;
    if(c.tooEarly) return `<b>${esc(d.brand)}</b> is too early to call. Its reads haven't reached day ${checkInDay()} on your curve yet. So far: <b>${K(c.got)}</b> delivered, ${c.sched.length} reads still to air. The sponsor sees "Building".`;
    return `<b>${esc(d.brand)}</b>: ${K(c.got)} delivered so far, projecting <b>${c.pct}%</b> of the ${K(c.g)} guarantee at the deal level. ${c.under?`That's under the 90% line. <a href="#" onclick="openMakegood('${c.aired.slice(-1)[0].id}');return false">Offer a make-good</a>.`:c.pct>100?'Over 100%, so the overage reports as bonus.':'On track.'} ${c.sched.length?`${c.sched.length} read${c.sched.length>1?'s':''} still scheduled.`:''} Sponsor sees: <span class="tag tag--${b.tone}">${b.t}</span>`; }
  if(/open|avail|next month/.test(l)){ const m=d2(TODAY).getUTCMonth()+1; const from=TODAY.slice(0,8)+'01'; const start=addDays(isoOf(new Date(Date.UTC(2026,m,1))),0), end=addDays(isoOf(new Date(Date.UTC(2026,m+1,1))),-1);
    const eps=S.episodes.filter(e=>e.date>=start&&e.date<=end); let open=0,val=0; const per={};
    eps.forEach(e=>placements().forEach(p=>{ if(!slot(e.date,p)){ open++; val+=rateCents(p); per[p]=(per[p]||0)+1; } }));
    return `${MONL[m%12]} has <b>${open} open slots</b> across ${eps.length} episodes, worth about <b>${$$(val)}</b> at your rate card: ${Object.entries(per).map(([p,n])=>`${n} ${PL[p]}`).join(', ')}. <a href="#" onclick="openStorefront();return false">Your storefront</a> shows exactly these.`; }
  if(/paid|pay|invoice|owe/.test(l)){ const un=S.deals.filter(x=>x.invoice&&['SENT','DUE','OVERDUE'].includes(invStatus(x.invoice)));
    if(!un.length) return 'Everyone has paid. Nothing outstanding.';
    return un.map(x=>`<b>${esc(x.brand)}</b> ${x.invoice.number}: ${$$(x.invoice.amountCents)}, ${invStatus(x.invoice)==='OVERDUE'?`<b style="color:var(--orange-text)">${diffDays(x.invoice.dueAt,TODAY)} days overdue</b>`:'due '+fmtDate(x.invoice.dueAt)}${x.invoice.external?' (invoiced outside SpotsNow)':''}`).join('<br>'); }
  if(/score|lowest|worst|best/.test(l)){ const rs=allReads().filter(r=>r.status==='aired'&&r._d.brief).map(r=>({r,sc:scorecard(r)})).sort((a,b)=>a.sc.overall-b.sc.overall);
    if(!rs.length) return 'No graded reads yet.'; const w=rs[0];
    return `Lowest: <b>${esc(w.r._d.brand)}</b> on ${fmtDate(w.r.date)} at <b>${w.sc.overall}</b>. ${w.sc.coach} <a href="#" onclick="openRead('${w.r.id}');return false">Open the read</a>. This score is private and never appears on a sponsor report.`; }
  return `I can answer about your sponsors, open inventory, invoices and read scores. Try "Is AG1 on track?" or "What's open next month?"`;
}

let CAL_TAB='calendar', CAL_LOCKCAT='', CAL_SEL=new Set(), CAL_PAST=false;

function overview(from){
  from=from||TODAY; const to=WINDOW_END(); const pls=placements(); const out={}; let tot={open:0,held:0,sold:0,openValue:0};
  pls.forEach(p=>out[p]={open:0,held:0,sold:0,openValue:0});
  S.episodes.filter(e=>e.date>from && e.date<=to).forEach(e=>pls.forEach(p=>{ const s=slot(e.date,p), o=out[p];
    if(!s){ o.open++; o.openValue+=rateCents(p); } else if(s.state==='hold'||s.state==='req') o.held++; else o.sold++; }));
  Object.values(out).forEach(o=>{ tot.open+=o.open; tot.held+=o.held; tot.sold+=o.sold; tot.openValue+=o.openValue; });
  return {per:out, tot};
}
function calCell(e,p,prev,next,past){
  const s=slot(e.date,p), k=slotKey(e.date,p), ring=CAL_SEL.has(k)?' ring':'';
  if(!s){
    if(CAL_LOCKCAT){ const lk=categoryLock(CAL_LOCKCAT,e.date); if(lk.length) return `<div class="cell cell--blocked${ring}" title="${esc(lk[0].text)}">🔒</div>`; }
    if(past) return `<div class="cell" style="cursor:default;border-style:dotted">Unsold</div>`;
    return `<button class="cell${ring}" onclick="openSlotEditor('${e.date}','${p}')">+ <span class="price">${$$(rateCents(p))}</span></button>`;
  }
  const d=deal(s.dealId), r=d.reads.find(x=>x.id===s.readId);
  const join = (o)=>{ if(!o) return false; const x=slot(o.date,p); return x && x.dealId===s.dealId && x.state===s.state; };
  const jc=(join(prev)?' join-up':'')+(join(next)?' join-down':'');
  if(s.state==='hold'){ const exp=s.holdExpiresAt&&s.holdExpiresAt<TODAY; return `<button class="cell cell--hold${jc}${ring}${exp?' expired':''}" onclick="openSlot('${e.date}','${p}')"><span>${esc(d.brand)}</span><small>${exp?'hear back overdue':'hear back '+fmtDate(s.holdExpiresAt)}</small></button>`; }
  if(s.state==='req') return `<button class="cell cell--req${jc}${ring}" onclick="openBookingRequest('${d.id}')">${blogo(d.domain,d.brand,'sm')}<span>${esc(d.brand)}</span><span class="price">request</span></button>`;
  const cls = r && r.kind==='makegood' ? 'cell--mg' : 'cell--sold';
  const tagTxt = r && r.kind==='bonus' ? 'bonus' : r && r.kind==='makegood' ? 'make-good' : r && r.status==='missed' ? 'missed' : '';
  return `<button class="cell ${cls}${jc}${ring}" onclick="openSlot('${e.date}','${p}')">${blogo(d.domain,d.brand,'sm')}<span style="overflow:hidden;text-overflow:ellipsis">${esc(d.brand)}</span>${tagTxt?`<span class="price">${tagTxt}</span>`:''}</button>`;
}

  if(SE.apply==='flight'){ return S.episodes.filter(e=>e.date>=SE.date && e.date<=SE.flightEnd).map(e=>[e.date,pl]); }

function seSponsor(v){ SE.domain=v; if(v&&v!=='__new'){ const x=sponsorsList().find(s=>s.domain===v); SE.brand=x.brand; SE.category=x.category; } renderSlotEditor(); }
function saveSlot(){

  let d=S.deals.find(x=>x.domain===domain && ['BOOKED','HOLD'].includes(x.status) && dealSummary(x).state!=='done' && (x.status==='HOLD')===(SE.state==='hold'));
  if(!d){ d={ id:uid('d'), brand, domain, category:SE.category||'Software', source:'MANUAL', agency:null, contact:{name:'',email:''}, promoCode:'', landingUrl:'', priceModel:S.show.priceModel, status:SE.state==='hold'?'HOLD':'BOOKED', holdExpiresAt:SE.state==='hold'?SE.hearBack:null,
    invoiceTerms:{terms:'NET_30',invoiceOn:'FIRST_AIR',collectVia:'SPOTSNOW'}, invoice:null, brief:null, publicSponsor:false, reportNote:'', sendLog:[], copyIn:false, createdAt:TODAY, reads:[] }; S.deals.push(d); }
  tg.forEach(t=>d.reads.push({ id:uid('r'), date:t[0], placement:t[1], kind:'paid', status:SE.state==='hold'?'hold':'scheduled', final:0, ytShare:.7, ts:700, priceCents:each, packageId:pk?pk.id:null, comp:{} }));
  if(SE.state==='hold' && SE.remind) S.reminders.push({ id:uid('rm'), text:`Chase ${brand} on ${PL[SE.pl]} ${fmtDate(SE.date)}`, due:SE.hearBack, origin:'HOLD', ref:d.id });
  rebuildSlots(); CAL_SEL.clear(); closeOverlays(); refreshChrome(); rerender();

function releaseHold(id){ const d=deal(id); d.reads.forEach(r=>{ if(r.status==='hold') r.status='cancelled'; }); d.status='RELEASED'; clearRemindersFor(id); rebuildSlots(); closeOverlays(); refreshChrome(); rerender(); toast(`${d.brand} hold released. Those slots are open on the storefront again.`); }

/* ════════ DEALS (the spine) ════════ */
let DL_F='all', DL_Q='';
function dealStatusTag(d,c){
  if(d.status==='PROPOSED') return '<span class="tag tag--blue">Request</span>';
  if(d.status==='COUNTERED') return '<span class="tag tag--blue">Counter sent</span>';
  if(d.status==='HOLD') return `<span class="tag ${d.holdExpiresAt<TODAY?'tag--orange':'tag--grey'}">Hold${d.holdExpiresAt<TODAY?' expired':''}</span>`;
  if(d.status==='DRAFT') return '<span class="tag tag--grey">Draft</span>';
  if(d.status==='DECLINED'||d.status==='RELEASED') return `<span class="tag tag--grey">${d.status==='DECLINED'?'Declined':'Released'}</span>`;
  if(c.state==='done') return '<span class="tag tag--green">Complete</span>';
  if(c.state==='upcoming') return '<span class="tag tag--grey">Scheduled</span>';
  return '<span class="tag tag--green"><i></i>Live</span>';
}
function paceCell(d,c){
  if(!['BOOKED'].includes(d.status) || !c.aired.length) return `<span class="muted" style="font-size:12px">${c.sched.length?c.sched.length+' to air':'—'}</span>`;
  if(c.tooEarly) return `<span class="muted" style="font-size:12px">Too early to call</span>`;
  const p=c.airedPct, cls=p>=90?'pace--good':p>=80?'pace--warn':'pace--bad';
  return `<div class="pbar"><div class="pace ${cls}" style="${p<80?'':''}"><div class="pace__fill" style="width:${Math.min(100,p)}%;${p<80?'background:var(--orange-text)':p<90?'background:#EAB308':''}"></div></div><b>${p}%</b></div>`;
}
function exportDeals(){ const rows=[['Sponsor','Domain','Source','Start','End','Reads','Value','Delivered','Guarantee','Invoice']].concat(S.deals.map(d=>{const c=dealSummary(d);return [d.brand,d.domain,d.source,c.start,c.end,c.paid.length,(c.totalCents/100).toFixed(2),c.got,c.g,d.invoice?invStatus(d.invoice):''];}));
  dlFile('second-wind-deals.csv', rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\n'), 'text/csv'); }
function dlFile(name, text, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.parentNode.removeChild(a); },100); }

/* ── Invoicing (5.9): drafted, approved, sent. Overdue is orange, never red. ── */
function termDays(t){ return t==='UPFRONT'?0:+String(t).replace('NET_',''); }
function createInvoice(id){ const d=deal(id), c=dealSummary(d); const n=1048+S.deals.filter(x=>x.invoice).length;

  S.reminders.push({ id:uid('rm'), text:`${d.brand} ${d.invoice.number} due`, due:d.invoice.dueAt, origin:'INVOICE', ref:d.id });

function invoiceReminder(id){ const d=deal(id), inv=d.invoice; const late=diffDays(inv.dueAt,TODAY);

    onSend:()=>{ (inv.remindersSent=inv.remindersSent||[]).push(TODAY); DISMISSED.add('iv_'+id); }, sentMsg:`Reminder sent from your inbox. Next one in 7 days if it's still open.` }); }
function markPaid(id){ const d=deal(id); d.invoice.status='PAID'; d.invoice.paidAt=TODAY; if(!d.invoice.external){ d.invoice.payout={at:addDays(TODAY,2),amountCents:d.invoice.amountCents-d.invoice.feeCents,status:'SCHEDULED'}; S.payouts.unshift({id:uid('po'),at:addDays(TODAY,2),amountCents:d.invoice.amountCents-d.invoice.feeCents,status:'SCHEDULED',ref:d.brand+' · '+d.invoice.number}); }

function complianceItems(r){

  b.talkingPoints.forEach((t,i)=>it.push({k:'pt'+i, label:`${CREATOR_TYPE_LABEL.pt}: ${t}`, short:'talking point', met:ok('pt'+i), why:'Not mentioned.'}));
  b.banned.forEach((t,i)=>it.push({k:'ban'+i, label:`${CREATOR_TYPE_LABEL.ban}: "${t}"`, short:`said "${t}"`, met:ok('ban'+i), why:`"${t}" was said at ${mmss(r.ts+22)}.`}));
  if(b.disclaimer) it.push({k:'disc', label:`${CREATOR_TYPE_LABEL.disc}`, short:'disclaimer', met:ok('disc'), why:'Disclaimer not read.'});

  it.push({k:'len', label:`${CREATOR_TYPE_LABEL.len}: ${PL_SECS[r.placement]||b.lengthSec}s`, short:'length', met:ok('len'), why:'Ran short.'});
  if(b.descLink){ const yt=S.show.sources.some(s=>s.type==='YOUTUBE'), rss=S.show.sources.some(s=>s.type==='RSS');
    if(yt) it.push({k:'descyt', label:`${CREATOR_TYPE_LABEL.desc} · YouTube description`, short:'YouTube link', met:ok('descyt'), why:'Link missing from the YouTube description.'});

  if(b.fresh) it.push({k:'fresh', label:CREATOR_TYPE_LABEL.fresh, short:'reused read', met:ok('fresh'), why:'Matches an earlier read word for word.'});

function reportChart(d){
  const c=dealSummary(d); const pts=[]; const dates=d.reads.filter(r=>r.status!=='cancelled').map(r=>r.date).sort(); if(!dates.length) return '';
  const start=dates[0], end=addDays(dates[dates.length-1],30), days=Math.max(1,diffDays(start,end));
  const step=Math.max(1,Math.round(days/40));
  const g=c.g||1; const W=480,H=150;
  const cum=(t)=>d.reads.filter(r=>r.status==='aired'&&r.date<=t).reduce((a,r)=>a+Math.round((r.final||0)*curveAt(diffDays(r.date,t))),0);
  const proj=(t)=>d.reads.filter(r=>(r.status==='aired'||r.status==='scheduled')&&r.date<=t).reduce((a,r)=>a+Math.round((r.status==='aired'?r.final:(r.kind==='paid'?guaranteeOf(Object.assign(r,{_d:d})):0))*curveAt(diffDays(r.date,t))),0);
  const maxV=Math.max(g*1.1, proj(end));
  const X=t=>diffDays(start,t)/days*W, Y=v=>H-v/maxV*H;
  let a='',b='';
  for(let i=0;i<=days;i+=step){ const t=addDays(start,i); if(t<=TODAY) a+=(a?'L':'M')+X(t).toFixed(1)+','+Y(cum(t)).toFixed(1); }
  for(let i=Math.max(0,diffDays(start,TODAY));i<=days;i+=step){ const t=addDays(start,i); b+=(b?'L':'M')+X(t).toFixed(1)+','+Y(proj(t)).toFixed(1); }
  const gy=Y(g);
  return `<svg viewBox="0 0 ${W} ${H}" class="rchart" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--border-strong)" stroke-dasharray="4 4"/><path d="${b}" fill="none" stroke="var(--green-text)" stroke-width="2" stroke-dasharray="5 4" opacity=".5"/><path d="${a}" fill="none" stroke="var(--green-text)" stroke-width="2.5"/></svg>

}

function crChart(d, eng){

  const g=c.g||1, W=560, H=230, maxV=Math.max(g*1.08, cum(TODAY)*1.08);

  let path='', last=null; const stop=TODAY<addDays(end,30)?TODAY:addDays(end,30);

  const gy=Y(g);

      <line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--text-tertiary)" stroke-dasharray="6 6" stroke-width="1"/>

function submitRequest(){
  const p=products().find(x=>x.id===SF.product), instant=false;
  const site=(RQ.site||'').toLowerCase().replace(/^https?:\/\//,'').replace(/\/.*$/,'').replace(/^www\./,'');
  if(!RQ.brand||!site||!RQ.email.includes('@')){ toast('Add the brand, website and a contact email.'); return; }
  if(!RQ.terms){ toast('Agree to the IO terms to continue.'); return; }
  // re-check availability against the calendar at submit time (no separate store)
  const targets=[]; SF.sel.forEach(dt=>targets.push([dt,p.placement])); if(p.pkg&&p.extra) p.extra.forEach(x=>{ let n=0; for(const e of S.episodes){ if(e.date<SF.sel[0]) continue; if(!slot(e.date,x.placement)&&bookable(e.date,x.placement,RQ.category).ok){ targets.push([e.date,x.placement]); if(++n>=x.count) break; } } });
  if(targets.some(t=>slot(t[0],t[1]))){ toast('One of those dates was just booked. Pick again.'); SF.sel=[]; closeOverlays(); renderStorefront(); return; }
  const each = p.pkg ? Math.round(p.priceCents/targets.length) : rateCents(p.placement);
  const d={ id:uid('d'), brand:RQ.brand, domain:site, category:RQ.category||'Software', source:'STOREFRONT', agency:null, contact:{name:RQ.name,email:RQ.email}, promoCode:RQ.promo, landingUrl:'', priceModel:S.show.priceModel,

    brief: RQ.tps.trim()? { cta:`Go to ${site}${RQ.promo?' and use code '+RQ.promo:''}`, talkingPoints:RQ.tps.split('\n').map(x=>x.trim()).filter(Boolean), banned:[], disclaimer:'', position:p.placement, lengthSec:PL_SECS[p.placement], descLink:true, fresh:true } : null,
    publicSponsor:false, reportNote:'', sendLog:[], copyIn:!!RQ.tps.trim(), createdAt:TODAY, conversationId:uid('conv'),
    reads: targets.map(t=>({ id:uid('r'), date:t[0], placement:t[1], kind:'paid', status:instant?'scheduled':'requested', final:0, ytShare:t[1]==='YT'?1:.7, ts:700, priceCents:each, packageId:p.pkg?p.id:null, comp:{} })) };
  S.deals.push(d);
  if(instant){ const c=dealSummary(d), fee=Math.round(c.totalCents*.10); d.invoice={ number:'INV-'+(1048+S.deals.filter(x=>x.invoice).length), amountCents:c.totalCents, feeCents:fee, feeLabel:'SpotsNow marketplace fee (10%)', issuedAt:TODAY, dueAt:TODAY, status:'PAID', paidAt:TODAY, upfront:true, payout:{at:d.reads[0].date,amountCents:c.totalCents-fee,status:'SCHEDULED'} };
    S.payouts.unshift({id:uid('po'),at:d.reads[0].date,amountCents:c.totalCents-fee,status:'SCHEDULED',ref:d.brand+' · '+d.invoice.number+' · on first verified air'}); S.gmvMonthCents+=c.totalCents; }
  rebuildSlots(); closeOverlays(); refreshChrome(); SF.done=d.id; SF.sel=[]; renderStorefront(); $('storefront').scrollTop=0;
}

function simpleStatus(d){ const c=dealSummary(d), ist=invStatus(d.invoice);

  if(d.status==='HOLD') return ['On hold','grey'];
  if(d.status==='DRAFT') return ['Draft','grey'];
  if(ist==='OVERDUE') return ['Unpaid','orange'];
  if(d.invoice && d.invoice.payLink && ist!=='PAID') return ['Waiting for payment','blue'];
