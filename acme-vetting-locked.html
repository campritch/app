<!DOCTYPE html>

  <style>
    :root { --navy:#17212B; --ink:#1D2027; --grey:#707481; --border:#E4E6ED; --bg:#F9FAFB; --white:#fff; }

    .card { width: 100%; max-width: 440px; background: var(--white); border: 1px solid var(--border); border-radius: 18px; padding: 36px 30px; text-align: center; box-shadow: 0 1px 2px rgba(166,175,195,.18); }
    .mark { width: 46px; height: 46px; border-radius: 13px; background: var(--navy); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 800; letter-spacing: -.03em; margin-bottom: 9px; }
    p { font-size: 13.5px; color: var(--grey); line-height: 1.6; font-weight: 500; }
