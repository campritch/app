<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpotsNow — Marketplace</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/credits.css" />
  <style>
    :root {
      --coral: #ed5a4f;
      --coral-soft: #fdecea;
      --coral-deep: #d94a3f;
      --ink: #11151c;
      --ink-2: #2a2f3a;
      --muted: #6b7280;
      --line: #e8eaed;
      --line-soft: #f1f2f4;
      --bg: #ffffff;
      --bg-soft: #fafafa;
      --green-bg: #d6f0e0;
      --green-text: #0d6832;
      --pill-bg: #f3f4f6;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px; line-height: 1.4;
      color: var(--ink); background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; }
    img { display: block; }
    a { color: inherit; text-decoration: none; }

    /* ── Top nav (replicates spotsnow.io) ─────────────── */
    .sn-nav {
      position: sticky; top: 0; z-index: 200;
      height: 64px; display: flex; align-items: center; gap: 28px;
      padding: 0 32px; background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .sn-logo {
      display: inline-flex; align-items: center; gap: 8px;
      flex-shrink: 0;
      font-weight: 800; font-size: 22px; color: var(--coral);
      letter-spacing: -0.5px;
    }
    .sn-logo__mark {
      width: 28px; height: 28px;
      display: inline-flex; align-items: center; justify-content: center;
    }

    .sn-search {
      position: relative;
      flex: 1; max-width: 460px;
    }
    .sn-search__input {
      width: 100%; height: 40px;
      padding: 0 50px 0 18px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 14px; font-family: inherit;
      color: var(--ink); outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .sn-search__input::placeholder { color: #b5b9c1; }
    .sn-search__input:focus { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(237,90,79,0.12); }
    .sn-search__btn {
      position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
      width: 30px; height: 30px;
      background: var(--coral); border: none; border-radius: 50%;
      color: white;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .sn-search__btn:hover { background: var(--coral-deep); }

    .sn-nav__right {
      display: flex; align-items: center; gap: 18px;
      flex-shrink: 0;
    }
    .sn-nav__link {
      font-size: 13px; font-weight: 500; color: var(--ink-2);
      transition: color .15s;
      white-space: nowrap;
    }
    .sn-nav__link:hover { color: var(--ink); }
    .sn-nav__icon {
      position: relative;
      width: 32px; height: 32px;
      display: inline-flex; align-items: center; justify-content: center;
      background: none; border: none; color: var(--ink-2); border-radius: 8px;
    }
    .sn-nav__icon:hover { background: var(--line-soft); color: var(--ink); }
    .sn-nav__badge {
      position: absolute; top: -2px; right: -4px;
      min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
      background: var(--coral); color: white;
      font-size: 9px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .sn-nav__campaign {
      display: inline-flex; align-items: center; gap: 6px;
      height: 36px; padding: 0 12px 0 14px;
      background: var(--line-soft);
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 13px; font-weight: 600; color: var(--ink);
    }
    .sn-nav__campaign:hover { background: #ebedf0; }

    /* ── Page hero ─────────────────────────────────── */
    .page {
      max-width: 1240px; margin: 0 auto;
      padding: 32px 32px 80px;
    }
    .page__crumb {
      font-size: 13px; font-weight: 500; color: var(--coral);
      margin-bottom: 8px;
    }
    .page__head {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 24px; margin-bottom: 26px;
    }
    .page__title {
      margin: 0 0 6px;
      font-size: 36px; font-weight: 800; letter-spacing: -0.8px;
      color: var(--ink); line-height: 1.05;
    }
    .page__sub { margin: 0; font-size: 14px; color: var(--muted); max-width: 600px; }
    .page__hint {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px;
      background: var(--coral-soft);
      border-radius: 999px;
      font-size: 12px; font-weight: 600; color: var(--coral-deep);
      flex-shrink: 0;
    }

    /* ── Tabs ──────────────────────────────────────── */
    .sn-tabs {
      display: flex; align-items: center; gap: 28px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 24px;
    }
    .sn-tab {
      position: relative;
      padding: 12px 0 14px;
      background: none; border: none;
      font-size: 14px; font-weight: 600; color: var(--muted);
      transition: color .15s;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .sn-tab:hover { color: var(--ink); }
    .sn-tab.is-active { color: var(--coral); }
    .sn-tab.is-active::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
      height: 2px; background: var(--coral); border-radius: 2px;
    }
    .sn-tab__count {
      font-size: 11px; font-weight: 700; padding: 2px 7px;
      background: var(--line-soft); color: var(--muted);
      border-radius: 999px;
    }
    .sn-tab.is-active .sn-tab__count { background: var(--coral-soft); color: var(--coral-deep); }

    /* Filter strip */
    .sn-filters {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 24px;
    }
    .sn-filter {
      height: 32px; padding: 0 14px;
      background: white; border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px; font-weight: 600; color: var(--ink-2);
      transition: all .12s;
    }
    .sn-filter:hover { background: var(--line-soft); }
    .sn-filter.is-active { background: var(--ink); color: white; border-color: var(--ink); }

    /* ── Result grid (mirrors SpotsNow card density) ── */
    .sn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .sn-card {
      display: flex; flex-direction: column;
      background: white; border: 1px solid var(--line);
      border-radius: 14px; overflow: hidden;
      cursor: pointer;
      transition: border-color .15s, transform .15s, box-shadow .15s;
    }
    .sn-card:hover {
      border-color: #cfd2d8;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(15,18,30,0.06);
    }
    .sn-card__top {
      display: flex; gap: 14px; padding: 18px 18px 14px;
      align-items: flex-start;
    }
    .sn-card__thumb {
      width: 64px; height: 64px; border-radius: 14px;
      object-fit: cover; flex-shrink: 0;
      background: #1a1a1a;
    }
    .sn-card__head { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .sn-card__crumb {
      font-size: 11px; font-weight: 600; color: var(--coral);
    }
    .sn-card__title {
      margin: 0; font-size: 17px; font-weight: 800; color: var(--ink);
      letter-spacing: -0.4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sn-card__site { font-size: 12px; color: var(--muted); }
    .sn-card__site b { color: var(--coral); font-weight: 600; }

    .sn-card__desc {
      padding: 0 18px 14px;
      font-size: 13px; line-height: 1.55; color: #4a5160;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .sn-card__metrics {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 1px; background: var(--line);
      border-top: 1px solid var(--line);
    }
    .sn-card__metric {
      background: white; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .sn-card__metric-label {
      font-size: 9px; font-weight: 700; color: var(--muted);
      letter-spacing: 0.4px; text-transform: uppercase;
    }
    .sn-card__metric-value { font-size: 14px; font-weight: 800; color: var(--ink); letter-spacing: -0.2px; }
    .sn-card__foot {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px; border-top: 1px solid var(--line);
    }
    .sn-card__cta {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 700; color: var(--ink);
    }
    .sn-card__cost {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px;
      background: var(--green-bg); color: var(--green-text);
      border-radius: 999px;
      font-size: 10px; font-weight: 800;
    }

    .sn-empty {
      grid-column: 1 / -1;
      padding: 56px 24px; text-align: center; color: var(--muted);
      background: white; border: 1px dashed var(--line);
      border-radius: 14px;
    }
    .sn-empty__title { font-size: 15px; font-weight: 700; color: var(--ink); margin: 0 0 4px; }

    .sn-summary {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
      font-size: 13px; color: var(--muted);
    }
    .sn-summary b { color: var(--ink); font-weight: 700; }

    /* ── Floating support bubble (mirrors live site) ── */
    .sn-fab {
      position: fixed; right: 20px; bottom: 20px; z-index: 50;
      width: 52px; height: 52px; border-radius: 50%;
      background: #ffd60a;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 22px rgba(0,0,0,0.18);
      cursor: pointer; border: none;
    }

    /* Responsive */
    @media (max-width: 1100px) {
      .sn-grid { grid-template-columns: repeat(2, 1fr); }
      .sn-search { max-width: 320px; }
    }
    @media (max-width: 860px) {
      .sn-nav { padding: 0 18px; gap: 14px; }
      .sn-nav__right { gap: 12px; }
      .sn-nav__link { display: none; }
      .sn-nav__campaign { display: none; }
      .page { padding: 22px 18px 60px; }
      .page__title { font-size: 26px; }
    }
    @media (max-width: 600px) {
      .sn-search { display: none; }
      .sn-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ── SpotsNow nav ──────────────────────────────── -->
<header class="sn-nav">
  <a href="/marketplace.html" class="sn-logo" aria-label="SpotsNow">
    <span class="sn-logo__mark">
      <!-- Coral target/eye mark -->
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="#ed5a4f" stroke-width="2.5"/>
        <circle cx="16" cy="16" r="8" stroke="#ed5a4f" stroke-width="2.5"/>
        <circle cx="16" cy="16" r="3" fill="#ed5a4f"/>
        <path d="M16 4 L16 1" stroke="#ed5a4f" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </span>
    <span>SpotsNow</span>
  </a>

  <div class="sn-search">
    <input id="searchInput" class="sn-search__input" type="text" placeholder="Search shows here..." autocomplete="off" />
    <button class="sn-search__btn" aria-label="Search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
  </div>

  <div style="flex:1"></div>

  <nav class="sn-nav__right">
    <a class="sn-nav__link" href="#">Last Minute Spots</a>
    <a class="sn-nav__link" href="#">Media plans</a>
    <a class="sn-nav__link" href="#" style="position:relative;">
      Inbox
      <span class="sn-nav__badge" style="top: -8px; right: -10px;">1</span>
    </a>
    <button class="sn-nav__icon" aria-label="Cart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="sn-nav__badge">1</span>
    </button>
    <!-- Clay-style credit pill mounts here -->
    <div data-credit-pill></div>
    <button class="sn-nav__campaign">
      Google Pixel
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
  </nav>
</header>

<!-- ── Page ──────────────────────────────────────── -->
<main class="page">
  <div class="page__head">
    <div>
      <div class="page__crumb" id="pageCrumb">Marketplace</div>
      <h1 class="page__title">Find your next host-read partner.</h1>
      <p class="page__sub">Search across every brand, show, and industry on SpotsNow. Open a profile to see audience, performance and pricing.</p>
    </div>
    <span class="page__hint">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
      Each profile uses 1 credit
    </span>
  </div>

  <div class="sn-tabs" role="tablist">
    <button class="sn-tab is-active" data-tab="brand" role="tab">Brands <span class="sn-tab__count" id="countBrand">0</span></button>
    <button class="sn-tab" data-tab="show" role="tab">Shows <span class="sn-tab__count" id="countShow">0</span></button>
    <button class="sn-tab" data-tab="industry" role="tab">Industries <span class="sn-tab__count" id="countIndustry">0</span></button>
  </div>

  <div class="sn-filters" id="chipRow"></div>

  <div class="sn-summary">
    <span>Showing <b id="resultCount">0</b> <span id="resultTab">brands</span><span id="resultMatch"></span></span>
  </div>

  <div class="sn-grid" id="resultsGrid"></div>
</main>

<button class="sn-fab" aria-label="Support">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="#11151c"><path d="M12 2 L13.5 8.5 L20 8.5 L14.5 13 L16 19.5 L12 15.5 L8 19.5 L9.5 13 L4 8.5 L10.5 8.5 Z"/></svg>
</button>

<script src="/data.js"></script>
<script src="/credits.js"></script>
<script>
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => Array.from(document.querySelectorAll(s));

  const TABS = window.MARKETPLACE_LABELS;
  const CHIPS = {
    brand:    ["DTC", "Health", "SaaS", "Fintech", "App", "Food"],
    show:     ["Comedy", "Health", "True Crime", "Sport", "Business", "Society"],
    industry: ["Health", "DTC", "SaaS", "App", "Beauty", "Travel"],
  };
  const PAGE_CRUMBS = { brand: "Brands", show: "Shows", industry: "Industries" };

  let activeTab = "brand";
  let activeChip = null;
  let searchQuery = "";

  function renderTabCounts() {
    $("#countBrand").textContent = window.MARKETPLACE_DATA.brand.length;
    $("#countShow").textContent = window.MARKETPLACE_DATA.show.length;
    $("#countIndustry").textContent = window.MARKETPLACE_DATA.industry.length;
  }

  function renderChips() {
    const wrap = $("#chipRow");
    wrap.innerHTML = "";
    const all = document.createElement("button");
    all.className = "sn-filter" + (activeChip == null ? " is-active" : "");
    all.textContent = "All";
    all.addEventListener("click", () => { activeChip = null; refresh(); });
    wrap.appendChild(all);
    CHIPS[activeTab].forEach((c) => {
      const el = document.createElement("button");
      el.className = "sn-filter" + (activeChip === c ? " is-active" : "");
      el.textContent = c;
      el.addEventListener("click", () => { activeChip = c; refresh(); });
      wrap.appendChild(el);
    });
  }

  function filtered() {
    const items = window.MARKETPLACE_DATA[activeTab];
    const q = searchQuery.trim().toLowerCase();
    return items.filter((it) => {
      const okQ = !q || it.title.toLowerCase().includes(q) || it.cats.join(" ").toLowerCase().includes(q) || it.desc.toLowerCase().includes(q);
      const okC = !activeChip || it.cats.includes(activeChip);
      return okQ && okC;
    });
  }

  function renderResults() {
    const items = filtered();
    const grid = $("#resultsGrid");
    grid.innerHTML = "";
    $("#resultCount").textContent = items.length;
    $("#resultTab").textContent = TABS[activeTab].plural;
    const matchParts = [];
    if (searchQuery.trim()) matchParts.push(`matching "${searchQuery.trim()}"`);
    if (activeChip) matchParts.push(`tagged ${activeChip}`);
    $("#resultMatch").textContent = matchParts.length ? " " + matchParts.join(" · ") : "";

    if (!items.length) {
      grid.innerHTML = `<div class="sn-empty"><h3 class="sn-empty__title">No results</h3><p>Try a different keyword or category.</p></div>`;
      return;
    }
    const labels = TABS[activeTab].metricLabels;
    items.forEach((item) => {
      const v = Object.values(item.metrics);
      const card = document.createElement("a");
      card.className = "sn-card";
      card.href = "#";
      card.dataset.id = item.id;
      const crumb = activeTab === "brand" ? item.cats.join(", ") :
                    activeTab === "show"  ? item.cats.join(", ") :
                                            "Industry · " + item.cats.join(", ");
      const subline = activeTab === "brand"
          ? `Website: <b>${item.title.toLowerCase().replace(/[^a-z0-9]+/g, "")}.com</b>`
          : (activeTab === "show" ? "Network · SpotsNow" : "");
      card.innerHTML = `
        <div class="sn-card__top">
          <img class="sn-card__thumb" src="${item.img}" alt="" />
          <div class="sn-card__head">
            <div class="sn-card__crumb">${crumb}</div>
            <h3 class="sn-card__title">${item.title}</h3>
            ${subline ? `<div class="sn-card__site">${subline}</div>` : ""}
          </div>
        </div>
        <p class="sn-card__desc">${item.desc}</p>
        <div class="sn-card__metrics">
          <div class="sn-card__metric"><span class="sn-card__metric-label">${labels[0]}</span><span class="sn-card__metric-value">${v[0]}</span></div>
          <div class="sn-card__metric"><span class="sn-card__metric-label">${labels[1]}</span><span class="sn-card__metric-value">${v[1]}</span></div>
          <div class="sn-card__metric"><span class="sn-card__metric-label">${labels[2]}</span><span class="sn-card__metric-value">${v[2]}</span></div>
        </div>
        <div class="sn-card__foot">
          <span class="sn-card__cta">View profile <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>
          <span class="sn-card__cost">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
            1 credit
          </span>
        </div>`;
      card.addEventListener("click", (e) => {
        e.preventDefault();
        const ok = SpotsNowCredits.consume("profile-open");
        if (!ok) return;
        SpotsNowCredits.showToast(`Loading ${item.title}…`);
      });
      grid.appendChild(card);
    });
  }

  function refresh() {
    renderChips();
    renderResults();
    $$(".sn-tab").forEach(b => b.classList.toggle("is-active", b.dataset.tab === activeTab));
    $("#pageCrumb").textContent = "Marketplace · " + PAGE_CRUMBS[activeTab];
  }

  function init() {
    SpotsNowCredits.mount();
    renderTabCounts();
    refresh();

    $$(".sn-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (btn.dataset.tab === activeTab) return;
        activeTab = btn.dataset.tab; activeChip = null;
        refresh();
      });
    });
    let t;
    $("#searchInput").addEventListener("input", (e) => {
      clearTimeout(t);
      const v = e.target.value;
      t = setTimeout(() => { searchQuery = v; renderResults(); }, 200);
    });
  }
  init();
</script>
</body>
</html>
